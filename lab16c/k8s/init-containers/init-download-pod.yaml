# Lab 16 — init downloads a file into a shared emptyDir; main container reads it.
apiVersion: v1
kind: Pod
metadata:
  name: lab16-init-download
  labels:
    app.kubernetes.io/name: lab16-init-demo
spec:
  initContainers:
    - name: init-download
      image: busybox:1.36
      command:
        - sh
        - -c
        - wget -q -O /work-dir/index.html https://example.com && ls -la /work-dir
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: main-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo "--- /data/index.html (first 500 bytes) ---" && head -c 500 /data/index.html && echo && sleep 3600
      volumeMounts:
        - name: workdir
          mountPath: /data
  volumes:
    - name: workdir
      emptyDir: {}
