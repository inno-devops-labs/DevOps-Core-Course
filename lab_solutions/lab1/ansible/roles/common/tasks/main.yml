- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [common, packages]

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present
  tags: [common, packages]

- name: Set timezone
  timezone:
    name: "{{ timezone }}"
  notify: restart cron
  tags: [common, timezone]

- name: Ensure /opt directory exists
  file:
    path: /opt
    state: directory
    mode: '0755'
  tags: [common]
