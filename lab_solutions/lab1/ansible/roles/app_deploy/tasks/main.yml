- name: Login to Docker Hub
  community.docker.docker_login:
    registry_url: https://index.docker.io/v1/
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: false
  tags: [deploy, docker, login]

- name: Pull Docker image from Docker Hub
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag }}"
    source: pull
    force_source: yes
  register: image_pull
  tags: [deploy, docker, pull]

- name: Display pull status
  debug:
    msg: "Pulled {{ docker_image }}:{{ docker_image_tag }}"
  when: image_pull.changed
  tags: [deploy, debug]

- name: Check if container is already running
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: container_info
  tags: [deploy, docker, check]

- name: Stop and remove existing container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  when: container_info.container is defined
  tags: [deploy, docker, cleanup]

- name: Run new container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    ports:
      - "{{ app_port }}:{{ app_port }}"
    network_mode: "{{ app_network_mode }}"
  register: container_run
  tags: [deploy, docker, run]

- name: Wait for container to be ready
  wait_for:
    port: "{{ app_port }}"
    timeout: 60
    delay: 5
  tags: [deploy, health]

- name: Verify health endpoint (if exists) or just check container is running
  uri:
    url: "http://localhost:{{ app_port }}{{ app_health_endpoint }}"
    return_content: yes
    status_code: 200
    timeout: 10
  register: health_response
  retries: 10
  delay: 5
  until: health_response.status == 200
  ignore_errors: yes
  tags: [deploy, health]

- name: Display container status
  debug:
    msg: 
      - "Container {{ app_container_name }} is running"
      - "Image: {{ docker_image }}:{{ docker_image_tag }}"
      - "Port: {{ app_port }}"
      - "URL: http://{{ ansible_default_ipv4.address }}:{{ app_port }}"
  tags: [deploy, debug]

- name: Show container logs
  command: docker logs --tail 20 {{ app_container_name }}
  register: container_logs
  tags: [deploy, debug]

- name: Display logs
  debug:
    msg: "{{ container_logs.stdout_lines }}"
  tags: [deploy, debug]
