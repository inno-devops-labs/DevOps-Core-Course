- name: Deploy application to web server
  hosts: webservers
  become: yes
  vars_files:
    - ../group_vars/all.yml

  roles:
    - app_deploy

  post_tasks:
    - name: Show deployment summary
      debug:
        msg:
          - "Deployment complete"
          - "Container: {{ app_container_name }}"
          - "Image: {{ docker_image }}:{{ docker_image_tag }}"
          - "Port: {{ app_port }}"
          - "URL: http://{{ ansible_default_ipv4.address }}:{{ app_port }}"
      tags: [deploy, debug]
