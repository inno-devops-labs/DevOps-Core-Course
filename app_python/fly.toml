app = "devops-info-service"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[checks]
  [checks.health]
    type = "http"
    port = 5001
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
