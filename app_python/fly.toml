app = "ellilin-devops-info-lab17"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "fly"
  HOST = "0.0.0.0"
  PORT = "8000"
  VISITS_FILE = "/data/visits"
  CONFIG_FILE = "/config/config.json"

[[mounts]]
  source = "devops_info_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
