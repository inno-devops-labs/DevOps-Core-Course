services:
  devops-info-service:
    build:
      context: .
    image: devops-info-service:lab12
    container_name: devops-info-service-lab12
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      VISITS_FILE: /data/visits
      APP_CONFIG_PATH: /config/config.json
      APP_NAME: devops-info-service
      APP_ENV: local
      LOG_LEVEL: INFO
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
      - ./config:/config:ro
