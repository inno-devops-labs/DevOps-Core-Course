services:
  devops-info:
    build: .
    image: devops-info-service:lab12
    container_name: devops-info-lab12
    user: "0:0"
    ports:
      - "5000:5000"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      VISITS_FILE_PATH: "/data/visits"
    volumes:
      - ./data:/data
    restart: unless-stopped
