version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vladimirzhidkov/devops-info-service:latest
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      VISITS_FILE: "/data/visits"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
