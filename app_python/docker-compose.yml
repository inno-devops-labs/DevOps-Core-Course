services:
  devops-info-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-info-service:lab12
    container_name: devops-info-service-lab12
    ports:
      - "5005:5000"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      LOG_LEVEL: "INFO"
      VISITS_FILE_PATH: "/data/visits"
    volumes:
      - ./data:/data
    restart: unless-stopped
