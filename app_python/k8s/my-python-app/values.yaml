# Default values for my-python-app
replicaCount: 3

image:
  repository: versceana/devops-info-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 3

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Secrets configuration (use --set or external secrets in production)
secrets:
  username: "change_me"
  password: "change_me"

environment: "production"
logLevel: "INFO"
counterFile: "/data/visits"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

statefulset:
  updateStrategy:
    type: RollingUpdate
    partition: 0
