apiVersion: v1
kind: Pod
metadata:
  name: init-download-demo
  namespace: default
spec:
  initContainers:
    - name: init-download
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          'wget -O /work-dir/index.html https://www.example.com && echo "Downloaded successfully"',
        ]
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: main-app
      image: busybox:1.36
      command: ["sh", "-c", 'echo "Waiting..."; sleep 3600']
      volumeMounts:
        - name: workdir
          mountPath: /data
  volumes:
    - name: workdir
      emptyDir: {}
