apiVersion: v1
kind: Service

metadata:
  name: {{ include "devops-info-service.fullname" . }}-headless

spec:
  clusterIP: None

  selector:
    {{- include "devops-info-service.selectorLabels" . | nindent 4 }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
