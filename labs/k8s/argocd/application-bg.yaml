apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-bg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TheVex/DevOps-Core-Course.git
    targetRevision: lab14
    path: labs/k8s/simple-app-chart
    helm:
      valueFiles:
        - values-bg.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bg-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true