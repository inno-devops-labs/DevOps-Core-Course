replicaCount: 1

environment: dev
logLevel: debug



resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

service:
  type: NodePort

livenessProbe:
  path: /health
  port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  path: /health
  port: 8080
  initialDelaySeconds: 3
  periodSeconds: 5

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

statefulset:
  enabled: true
  serviceName: ""