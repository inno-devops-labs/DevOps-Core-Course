{{- if .Values.statefulset.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ default (printf "%s-headless" (include "myapp.fullname" .)) .Values.statefulset.serviceName }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "myapp.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- end }}
