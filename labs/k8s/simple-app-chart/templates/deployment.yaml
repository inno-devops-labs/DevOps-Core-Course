apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simple-app.fullname" . }}
  labels:
    app: {{ .Values.image.repository | replace "/" "-" | trunc 63 | trimSuffix "-" }}
    {{- include "simple-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.image.repository | replace "/" "-" | trunc 63 | trimSuffix "-" }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    rollingUpdate:
      maxSurge: {{ .Values.updateStrategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      annotations:
        # vault.hashicorp.com/agent-inject: "true"
        # vault.hashicorp.com/role: "myapp-role"
        # vault.hashicorp.com/agent-inject-secret-config: "secret/data/myapp/config"
      labels:
        app: {{ .Values.image.repository | replace "/" "-" | trunc 63 | trimSuffix "-" }}
        {{- include "simple-app.selectorLabels" . | nindent 8 }}
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "simple-app.fullname" . }}-file
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "simple-app.fullname" . }}-data
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
          name: http
        volumeMounts:
          - name: config-volume
            mountPath: /config
          - name: data-volume
            mountPath: /data
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        envFrom:
          - secretRef:
              name: {{ include "simple-app.fullname" . }}-secret


