apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "simple-app.fullname" . }}
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "simple-app.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "simple-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "simple-app.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: init-download
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Downloading file..."
              wget -O /work-dir/index.html https://example.com
              echo "Done: $(cat /work-dir/index.html | head -c 100)..."
          volumeMounts:
            - name: shared-data
              mountPath: /work-dir
        - name: wait-for-headless
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for headless service to be resolvable..."
              until nslookup {{ include "simple-app.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local; do
                echo "Not yet, sleeping..."
                sleep 2
              done
              echo "Headless service is ready!"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "simple-app.fullname" . }}-secret
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared-data
              mountPath: /shared 
      volumes:
        - name: shared-data
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.persistence.size | default "100Mi" }}