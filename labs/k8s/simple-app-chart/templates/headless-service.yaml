apiVersion: v1
kind: Service
metadata:
  name: {{ include "simple-app.fullname" . }}-headless
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "simple-app.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}