# Grafana Data Sources Provisioning
# This file automatically configures Loki as a data source

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60
    version: 1
