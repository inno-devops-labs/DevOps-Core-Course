app = "devops-info-service"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.flyio"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[mounts]
  source = "app_data"
  destination = "/data"
