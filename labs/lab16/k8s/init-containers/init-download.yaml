apiVersion: v1
kind: Pod
metadata:
  name: init-download-demo
  namespace: default
spec:
  initContainers:
    - name: init-download
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Init container started"
          echo "<html><body><h1>Downloaded by init container</h1></body></html>" > /work-dir/index.html
          echo "Init container completed"
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: main
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Main container started"
          sleep 3600
      volumeMounts:
        - name: workdir
          mountPath: /data
  volumes:
    - name: workdir
      emptyDir: {}
