---
# 1. Блок работы с пакетами и системой
- name: System and Packages Configuration
  become: true
  tags:
    - packages
    - common
  block:
    - name: Update apt cache and install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Set system timezone
      community.general.timezone:
        name: "{{ common_system_timezone }}"

  # Если установка/обновление упадет, выполнится эта таска
  rescue:
    - name: Fix missing packages
      ansible.builtin.apt:
        update_cache: true

  # Эта таска выполнится в любом случае (успех или провал)
  always:
    - name: Log package installation completion
      ansible.builtin.copy:
        content: "Packages setup completed"
        dest: /tmp/common_packages.log
        mode: "0644"

# 2. Блок работы с пользователями (по заданию)
- name: User Management
  become: true
  tags:
    - users
    - common
  block:
    - name: Create deployment user
      ansible.builtin.user:
        name: "{{ common_deploy_user }}"
        state: present
        shell: /bin/bash

  always:
    - name: Log user creation completion
      ansible.builtin.copy:
        content: "Users setup completed"
        dest: /tmp/common_users.log
        mode: "0644"
