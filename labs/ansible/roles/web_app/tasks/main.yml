- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  tags:
    - app_deploy
    - compose
  block:

    - name: Check if container exists and is managed by Compose
      community.docker.docker_container_info:
        name: "{{ app_name }}"
      register: web_app_container_info
      ignore_errors: true

    - name: Remove old container if it exists
      community.docker.docker_container:
        name: "{{ app_name }}"
        state: absent
      when:
        - web_app_container_info.exists
        - web_app_container_info.container is defined
        - web_app_container_info.container.Config is defined
        - web_app_container_info.container.Config.Labels is defined
        - "'com.docker.compose.project' not in web_app_container_info.container.Config.Labels"

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: '0755'

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: '0644'
      register: web_app_compose_file

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: missing
        recreate: auto
        remove_orphans: true
      register: web_app_compose_result

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: "Docker Compose deployment failed. Check logs on target."
