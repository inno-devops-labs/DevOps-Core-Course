- name: Wipe web application
  block:
    - name: Check if project directory exists
      stat:
        path: "{{ compose_project_dir }}"
      register: project_dir_stat
      
    - name: Stop and remove containers (docker compose down)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
        remove_volumes: yes  
        remove_orphans: yes
      when: project_dir_stat.stat.exists
      ignore_errors: yes
      register: compose_down

    - name: Remove docker-compose.yml file
      file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      ignore_errors: yes

    - name: Remove application directory
      file:
        path: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: yes

    - name: Optionally remove Docker image (to free disk space)
      community.docker.docker_image:
        name: "{{ docker_image }}:{{ docker_tag | default('latest') }}"
        state: absent
      when: web_app_wipe_remove_image | default(false) | bool
      ignore_errors: yes

    - name: Log wipe completion
      debug:
        msg: "Application {{ app_name }} wiped successfully"

  when: web_app_wipe | bool
  tags:
    - web_app_wipe