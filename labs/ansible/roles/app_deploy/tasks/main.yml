- name: Log in to Docker Hub
  docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: false

- name: Pull the application image
  docker_image:
    name: "{{ docker_image }}"
    source: pull
    force_source: yes
  register: pull_result
  notify: restart app container

- name: Stop existing container (if running)
  docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  ignore_errors: yes

- name: Remove old container (if exists)
  docker_container:
    name: "{{ app_container_name }}"
    state: absent
  ignore_errors: yes

- name: Run new container
  docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    ports:
      - "{{ app_port }}:8000"
    env: "{{ app_env }}"
    
  register: run_result

- name: Wait for application port to be open
  wait_for:
    port: "{{ app_port }}"
    host: "localhost"
    delay: 5
    timeout: 30

- name: Verify health endpoint
  uri:
    url: "http://{{ ansible_default_ipv4.address }}:{{ app_port }}/health"
    method: GET
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 5
  delay: 5
