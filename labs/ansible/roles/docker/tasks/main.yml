- name: Docker installation
  become: true
  tags:
    - docker
    - docker_install
  block:
    - name: Remove conflicting packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - podman-docker
          - containerd
          - runc
        state: absent
      register: docker_remove_result

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      register: docker_gpg_result

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: true
      register: docker_repo_result

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
      register: docker_install_result
      notify: restart docker

  rescue:
    - name: Wait and retry apt update (GPG key may need time)
      ansible.builtin.wait_for:
        timeout: 10
      delegate_to: localhost

    - name: Retry apt update
      ansible.builtin.apt:
        update_cache: true
      when: docker_gpg_result.failed or docker_repo_result.failed

    - name: Fail if installation still fails
      ansible.builtin.fail:
        msg: "Docker installation failed after retry"
      when: docker_install_result is failed

  always:
    - name: Ensure Docker service is enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: docker_install_result is success
      changed_when: false


- name: Docker configuration
  become: true
  tags:
    - docker
    - docker_config
  block:
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    - name: Install Python Docker module
      ansible.builtin.apt:
        name: python3-docker
        state: present
