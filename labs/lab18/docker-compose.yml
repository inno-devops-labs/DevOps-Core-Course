version: "3.9"

services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs-node
    ports:
      - "4001:4001"   # swarm — peer-to-peer communication
      - "8080:8080"   # HTTP gateway — read content via /ipfs/<CID>
      - "5001:5001"   # RPC API and Web UI
    volumes:
      - ipfs_data:/data/ipfs
      - ./staging:/export   # local files placed here can be added to IPFS
    restart: unless-stopped

volumes:
  ipfs_data:
