{{- if .Values.helmSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-info.helmSecretName" . }}
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.helmSecret.username | quote }}
  password: {{ .Values.helmSecret.password | quote }}
{{- end }}
