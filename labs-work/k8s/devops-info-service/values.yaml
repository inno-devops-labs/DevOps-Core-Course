replicaCount: 3

image:
  repository: mashfeii/devops-info-service
  tag: "latest"
  pullPolicy: Never

containerPort: 5173

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5173"

service:
  type: NodePort
  port: 80
  targetPort: 5173

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: 5173
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5173
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3

nameOverride: ""
fullnameOverride: ""
