replicaCount: 2

image:
  repository: mashfeii/devops-info-service
  tag: "latest"
  pullPolicy: Never

containerPort: 5173

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5173"
  - name: DATA_DIR
    value: "/data"

environment: "dev"
logLevel: "INFO"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

dataDir: "/data"

secrets:
  username: "admin"
  password: "devops-secret-password"

service:
  type: NodePort
  port: 80
  targetPort: 5173

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: 5173
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5173
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3

nameOverride: ""
fullnameOverride: ""

vault:
  enabled: false
  role: "devops-info-service"
  secretPath: "secret/data/devops-info-service/config"
  agentInjectTemplate: |
    {{- with secret "secret/data/devops-info-service/config" -}}
    USERNAME={{ .Data.data.username }}
    PASSWORD={{ .Data.data.password }}
    {{- end -}}

rollout:
  enabled: false
  strategy: canary
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
  analysis:
    enabled: false
    successCondition: "result == 'healthy'"
    interval: 10s
    count: 3
    failureLimit: 1
