{{- if and .Values.rollout.enabled .Values.rollout.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "devops-info-service.fullname" . }}-health
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
spec:
  args:
    - name: service-name
  metrics:
    - name: health-check
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      successCondition: {{ .Values.rollout.analysis.successCondition | quote }}
      provider:
        web:
          url: "http://{{ `{{args.service-name}}` }}/health"
          jsonPath: "{$.status}"
{{- end }}
