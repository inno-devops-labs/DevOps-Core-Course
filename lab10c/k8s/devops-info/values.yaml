replicaCount: 3

nameOverride: ""
fullnameOverride: ""

image:
  repository: tsixphoenix/devops-info-python
  tag: "lab9"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

env:
  HOST: "0.0.0.0"
  PORT: "5000"
  RELEASE_ID: "v2"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"

livenessProbe:
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

hooks:
  image: busybox:1.36
  preInstall:
    enabled: true
    weight: -5
    message: "pre-install check passed"
  postInstall:
    enabled: true
    weight: 5
    message: "post-install smoke test passed"
