global:
  scrape_interval: 15s

scrape_configs:

  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Scrape the Python application
  - job_name: "app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app-python:8000"]

  # Scrape Loki metrics
  - job_name: "loki"
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  # Scrape Grafana metrics
  - job_name: "grafana"
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
