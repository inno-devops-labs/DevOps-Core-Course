server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: docker

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      - source_labels: ['__meta_docker_container_label_app']
        target_label: 'app'

      - source_labels: ['__meta_docker_container_label_logging']
        target_label: 'logging'

      - target_label: 'job'
        replacement: 'docker'

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
    pipeline_stages:
      - json:
          expressions:
              level: level
              msg: message
              method: method
              path: path
              status: status
              client_ip: client_ip