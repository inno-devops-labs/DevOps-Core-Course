server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets: ['localhost']
        labels:
          job: 'dockerlogs'
          __path__: /var/lib/docker/containers/*/*.log
    
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            level: level
      
      - regex:
          expression: .*/containers/(?P<container_id>[0-9a-f]{64})/.*\.log
          source: filename
      
      # Map container IDs to friendly names
      - template:
          source: container_name
          template: '{{ if eq .container_id "a4c12c1f1971a59c2e710f7d4d726c76a622dcfe406a3639c7e031ccc330d2d9" }}devops-python{{ else if eq .container_id "b15d9b9583c2" }}another-container{{ else }}unknown{{ end }}'
      
      - labels:
          container_id:
          container: container_name
          stream:
          level:
      
      - output:
          source: log
