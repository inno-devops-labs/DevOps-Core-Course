server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Only collect logs from containers explicitly opted-in via label.
      - source_labels: ["__meta_docker_container_label_logging"]
        regex: promtail
        action: keep

      # Expose container name as a label (without leading '/')
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
        replacement: "$1"

      # Pass-through the app label from docker compose labels
      - source_labels: ["__meta_docker_container_label_app"]
        target_label: app

      - target_label: job
        replacement: docker

