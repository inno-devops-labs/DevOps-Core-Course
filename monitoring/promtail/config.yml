# Promtail 3.0 - Docker discovery, send to Loki, extract container name
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: fake

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Ensure job label is always set (Loki requires at least one label per stream)
      - target_label: job
        replacement: docker
        action: replace
      # Only scrape containers with label logging=promtail
      - source_labels: ['__meta_docker_container_label_logging']
        regex: 'promtail'
        action: keep
      # Extract container name (remove leading slash)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
        replacement: '$1'
      # Copy app label from container for easier queries
      - source_labels: ['__meta_docker_container_label_app']
        regex: '(.+)'
        target_label: app
