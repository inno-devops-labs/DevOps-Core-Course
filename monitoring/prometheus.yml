global:
    scrape_interval: 15s
    evaluation_interval: 15s

scrape_configs:
    - job_name: "devops-app"
      static_configs:
          - targets: ["app:5000"]
      metrics_path: "/metrics"

    - job_name: "grafana"
      static_configs:
          - targets: ["grafana:3000"]
      metrics_path: "/metrics"
