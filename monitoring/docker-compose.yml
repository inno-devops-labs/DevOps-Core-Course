services:
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    labels:
      logging: "promtail"
      app: "loki"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    ports:
      - "${PROMTAIL_PORT:-9080}:9080"
    labels:
      logging: "promtail"
      app: "promtail"
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail-data:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - logging
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/promtail", "-config.file=/etc/promtail/config.yml", "-check-syntax"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "${GF_AUTH_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "${GF_AUTH_ANONYMOUS_ORG_ROLE:-Admin}"
      GF_SECURITY_ALLOW_EMBEDDING: "${GF_SECURITY_ALLOW_EMBEDDING:-false}"
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-change-me-now}"
    labels:
      logging: "promtail"
      app: "grafana"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - logging
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  app-python:
    build:
      context: ../app_python
    image: "${PYTHON_APP_IMAGE:-devops-info-service:lab07}"
    container_name: devops-python
    restart: unless-stopped
    ports:
      - "8000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DEBUG: "false"
      LOG_LEVEL: "INFO"
    labels:
      logging: "promtail"
      app: "devops-python"
    networks:
      - logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  app-go:
    build:
      context: ../app_go
    image: "${BONUS_APP_IMAGE:-devops-info-service-go:lab07}"
    container_name: devops-go
    restart: unless-stopped
    ports:
      - "8001:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DEBUG: "false"
    labels:
      logging: "promtail"
      app: "devops-go"
    networks:
      - logging
    healthcheck:
      test: ["CMD", "/app/devops-info-service", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

networks:
  logging:
    name: lab07-logging

volumes:
  loki-data:
  promtail-data:
  grafana-data:
