version: "3.8"

services:
    loki:
        image: grafana/loki:3.0.0
        container_name: loki
        ports:
            - "3100:3100"
        command: -config.file=/etc/loki/config.yml
        volumes:
            - ./loki/config.yml:/etc/loki/config.yml:ro
            - loki-data:/loki
        networks:
            - monitoring
        restart: unless-stopped

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1G
                reservations:
                    cpus: "0.5"
                    memory: 512M

    promtail:
        image: grafana/promtail:3.0.0
        container_name: promtail
        command: -config.file=/etc/promtail/config.yml
        volumes:
            - ./promtail/config.yml:/etc/promtail/config.yml:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
        networks:
            - monitoring
        depends_on:
            - loki
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512M
                reservations:
                    cpus: "0.25"
                    memory: 256M

    grafana:
        image: grafana/grafana:12.3.1
        container_name: grafana
        ports:
            - "3000:3000"
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=false
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
        volumes:
            - grafana-data:/var/lib/grafana
        networks:
            - monitoring
        depends_on:
            - loki
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1G
                reservations:
                    cpus: "0.5"
                    memory: 512M

    app:
        build:
            context: ..
            dockerfile: Dockerfile
        container_name: devops-app
        ports:
            - "5000:5000"
        networks:
            - monitoring
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'python3 -c ''import http.client; conn = http.client.HTTPConnection("localhost", 5000); conn.request("GET", "/health"); res = conn.getresponse(); exit(0) if res.status == 200 else exit(1)''',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512M
                reservations:
                    cpus: "0.25"
                    memory: 256M

    prometheus:
        image: prom/prometheus:v2.55.0
        container_name: prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        networks:
            - monitoring
        restart: unless-stopped
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
            - "--storage.tsdb.retention.size=10GB"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 2G
                reservations:
                    cpus: "0.5"
                    memory: 512M

networks:
    monitoring:
        driver: bridge

volumes:
    loki-data:
    grafana-data:
    prometheus-data:
