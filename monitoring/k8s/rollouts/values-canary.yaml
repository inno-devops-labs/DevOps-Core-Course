replicaCount: 4

image:
  repository: hiksol/devops-info-service
  pullPolicy: IfNotPresent
  tag: "latest"

config:
  appName: devops-info-service
  environment: canary
  logLevel: INFO

persistence:
  mountPath: /data
  visitsFile: /data/visits

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
