apiVersion: apps/v1
kind: Deployment
metadata:
  name: wait-for-service-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wait-for-service-demo
  template:
    metadata:
      labels:
        app: wait-for-service-demo
    spec:
      initContainers:
        - name: wait-for-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://devops-info-service.default.svc.cluster.local/health >/dev/null 2>&1; do
                echo "Waiting for devops-info-service..."
                sleep 2
              done
              echo "Service is ready"
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
