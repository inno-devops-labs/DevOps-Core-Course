apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-download-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: init-download-demo
  template:
    metadata:
      labels:
        app: init-download-demo
    spec:
      initContainers:
        - name: init-download
          image: busybox:1.36
          command:
            - sh
            - -c
            - wget -O /work-dir/index.html https://example.com
          volumeMounts:
            - name: workdir
              mountPath: /work-dir

      containers:
        - name: main-app
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: workdir
              mountPath: /usr/share/nginx/html

      volumes:
        - name: workdir
          emptyDir: {}
