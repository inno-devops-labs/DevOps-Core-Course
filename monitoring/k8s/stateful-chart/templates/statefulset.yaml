apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devops-info
  labels:
    app: devops-info
spec:
  serviceName: devops-info-headless
  replicas: {{ .Values.replicaCount }}
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 1
  
  updateStrategy:
    type: OnDelete
  
  selector:
    matchLabels:
      app: devops-info

  template:
    metadata:
      labels:
        version: v4
        app: devops-info
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: devops-info
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5000
              name: http

          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5000"
            - name: DATA_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: VISITS_FILE
              value: {{ .Values.persistence.visitsFile | quote }}

          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
