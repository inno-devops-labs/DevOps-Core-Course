---
- name: Deploy Python application
  hosts: webservers
  become: true
  gather_facts: true
  vars_files:
    - ../vars/app_python.yml

  roles:
    - role: web_app
      tags:
        - web_app
        - app_deploy

- name: Deploy bonus application
  hosts: webservers
  become: true
  gather_facts: true
  vars_files:
    - ../vars/app_bonus.yml

  roles:
    - role: web_app
      tags:
        - web_app
        - app_deploy
