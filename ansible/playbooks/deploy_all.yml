---
- name: Deploy All Applications
  hosts: webservers
  become: yes

  tasks:
    - name: Deploy Python App
      include_role:
        name: web_app
      vars:
        app_name: devops-python
        docker_image: "{{ dockerhub_username | default('ellilin') }}/devops-info-service"
        docker_tag: latest
        app_port: 5000
        app_internal_port: 5000
        compose_project_dir: "/opt/devops-python"

    - name: Deploy Bonus App
      include_role:
        name: web_app
      vars:
        app_name: devops-go
        docker_image: "{{ dockerhub_username | default('ellilin') }}/devops-info-service-go"
        docker_tag: latest
        app_port: 5001
        app_internal_port: 8080
        compose_project_dir: "/opt/devops-go"
