---
- name: Deploy All Applications
  hosts: webservers
  become: true

  tasks:
    - name: Deploy Python App
      ansible.builtin.include_role:
        name: web_app
      vars:
        web_app_name: devops-python
        web_app_docker_image: merkulovlr05/devops-info
        web_app_docker_tag: latest
        web_app_port: 8000
        web_app_internal_port: 8000
        web_app_compose_dir: "/opt/devops-python"

    - name: Deploy Go App
      ansible.builtin.include_role:
        name: web_app
      vars:
        web_app_name: devops-go
        web_app_docker_image: merkulovlr05/devops-info-go
        web_app_docker_tag: latest
        web_app_port: 8001
        web_app_internal_port: 8080
        web_app_compose_dir: "/opt/devops-go"
