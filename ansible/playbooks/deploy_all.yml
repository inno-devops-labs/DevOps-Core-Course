---
- name: Deploy all applications
  hosts: all
  become: true

  tasks:
    - name: Deploy Python app via reusable web_app role
      ansible.builtin.include_role:
        name: web_app
      vars:
        web_app_name: devops-python
        web_app_docker_image: brainpumpkin/devops-info-service
        web_app_docker_tag: latest
        web_app_port: 8000
        web_app_internal_port: 8000
        web_app_compose_project_dir: "/opt/devops-python"

    - name: Deploy Bonus app via reusable web_app role
      ansible.builtin.include_role:
        name: web_app
      vars:
        web_app_name: devops-go
        web_app_docker_image: brainpumpkin/devops-info-service-go
        web_app_docker_tag: latest
        web_app_port: 8001
        web_app_internal_port: 8080
        web_app_compose_project_dir: "/opt/devops-go"
