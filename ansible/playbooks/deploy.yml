---
- name: Deploy application
  hosts: webservers
  become: yes
  vars:
    dockerhub_username: nadiaa02
    dockerhub_password: ${{ secrets.DOCKERHUB_TOKEN }}
    app_name: lab02-python-app
    docker_image: nadiaa02/lab02-python-app
    docker_image_tag: latest
    app_port: 5000
    app_container_name: devops-app

  roles:
    - web_app
