---
- name: Deploy web application
  hosts: webservers
  become: yes
  gather_facts: yes

  roles:
    - role: web_app
      tags:
        - app_deploy
        - web_app

  post_tasks:
    - name: Display deployment summary
      debug:
        msg: |
          ==============================================
          Deployment Summary
          ==============================================
          Application: {{ app_name }}
          Image: {{ docker_image }}:{{ docker_tag }}
          Port: {{ app_port }}
          Health Check: http://{{ ansible_host }}:{{ app_port }}/health
          ==============================================
      tags:
        - always
