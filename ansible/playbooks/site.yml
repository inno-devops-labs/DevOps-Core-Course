- name: Full site setup
  hosts: webservers
  become: yes

  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: common
      tags:
        - common
    - role: docker
      tags:
        - docker
    - role: web_app
      tags:
        - app_deploy
        - compose
        - web_app_wipe
