---
- name: Wipe web application
  when: web_app_wipe | bool
  tags:
      - web_app_wipe
  block:
      - name: Check if project directory exists
        ansible.builtin.stat:
            path: "{{ web_app_compose_project_dir }}"
        register: web_app_project_dir

      - name: Stop and remove container directly
        community.docker.docker_container:
            name: "{{ web_app_app_container_name }}"
            state: absent
        failed_when: false

      - name: Remove docker-compose.yml file
        ansible.builtin.file:
            path: "{{ web_app_compose_project_dir }}/docker-compose.yml"
            state: absent

      - name: Remove application directory
        ansible.builtin.file:
            path: "{{ web_app_compose_project_dir }}"
            state: absent

      # - name: Remove Docker images
      #   community.docker.docker_image:
      #     name: "{{ web_app_docker_image }}:{{ web_app_docker_image_tag | default('latest') }}"
      #     state: absent

      - name: Log wipe completion
        ansible.builtin.debug:
            msg: "Application {{ web_app_app_name | default('devops-info-python') }} wiped successfully"
