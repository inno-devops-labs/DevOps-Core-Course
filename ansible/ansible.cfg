[defaults]
# Static inventory (default). For dynamic Yandex Cloud inventory use:
#   inventory = inventory/yandex.yml
#   or: ansible-playbook -i inventory/yandex.yml playbooks/provision.yml
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
remote_user = ubuntu
retry_files_enabled = False
vault_password_file = .vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
