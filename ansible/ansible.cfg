[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
remote_user = ubuntu
retry_files_enabled = False
vault_password_file = .vault_pass

# Dynamic inventory (use with: ansible-inventory -i inventory/yandex_cloud.py --graph)
# To switch to dynamic inventory, change inventory line to:
# inventory = inventory/yandex_cloud.py

[privilege_escalation]
become = True
become_method = sudo
become_user = root
