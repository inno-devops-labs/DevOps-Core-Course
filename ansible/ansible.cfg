# When run from a world-writable dir (e.g. /mnt/c/... on WSL), Ansible ignores this file.
# Then pass explicitly: -i inventory/hosts.ini and ANSIBLE_ROLES_PATH=roles
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
remote_user = ubuntu
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_user = root
