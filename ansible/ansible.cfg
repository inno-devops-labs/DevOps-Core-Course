[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
remote_user = ubuntu
retry_files_enabled = False

# Optional: use a vault password file (uncomment and create .vault_pass, but DO NOT commit it)
# vault_password_file = .vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
