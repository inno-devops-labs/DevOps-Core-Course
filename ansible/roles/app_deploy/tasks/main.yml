---
# 1. Авторизация в Docker Hub, чтобы иметь возможность скачивать приватные (или любые) образы
- name: Log into Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  # Это действие нужно выполнить один раз для сессии

# 2. Скачивание последней версии образа
- name: Pull the latest Docker image
  community.docker.docker_image:
    name: "{{ dockerhub_username }}/devops-info-python"
    source: pull
    tag: latest

# 3. Остановка и удаление старого контейнера, если он существует (для обновления)
- name: Remove old container if exists
  community.docker.docker_container:
    name: "{{ app_name }}"
    state: absent

# 4. Запуск нового контейнера
- name: Run application container
  community.docker.docker_container:
    name: "{{ app_name }}"
    image: "{{ dockerhub_username }}/devops-info-python:latest"
    state: started
    restart_policy: always
    published_ports:
      - "{{ app_port }}:5000"
    # Передаем переменные окружения внутрь контейнера, если нужно
    env:
      DEBUG: "false"

# 5. Ожидание, пока приложение начнет отвечать (Healthcheck)
- name: Wait for application to be ready
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    delay: 5
    timeout: 30