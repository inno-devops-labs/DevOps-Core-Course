---
# Variables app_name, docker_image, docker_image_tag must come from group_vars (e.g. vaulted all.yml)
- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
    registry: https://index.docker.io/v1/
  no_log: true

- name: Pull Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag | default('latest') }}"
    source: pull

- name: Stop existing container
  ansible.builtin.command: docker stop "{{ app_container_name }}"
  register: stop_result
  ignore_errors: true
  changed_when: stop_result.rc == 0

- name: Remove old container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag | default('latest') }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    ports:
      - "{{ app_port }}:{{ app_internal_port }}"
    env: "{{ app_env | default({}) }}"
  notify: restart app container

- name: Wait for application to be ready
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    host: "127.0.0.1"
    delay: 2
    timeout: "{{ app_wait_timeout }}"

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
    status_code: 200
    timeout: 5
  register: health_check
  changed_when: false
