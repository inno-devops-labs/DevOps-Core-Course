---
- name: Validate deployment variables
  ansible.builtin.assert:
    that:
      - docker_image | length > 0
      - docker_image_tag | length > 0
      - app_container_name | length > 0
      - app_port | int > 0
      - host_port | int > 0
    fail_msg: "Required deployment variables are missing or invalid."

- name: Log in to Docker Hub (if credentials are provided)
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
    reauthorize: true
  no_log: true
  when:
    - dockerhub_username | length > 0
    - dockerhub_password | length > 0

- name: Pull application image
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag }}"
    source: pull
  register: pulled_image

- name: Gather current container info
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: app_container_info

- name: Stop current container before redeploy
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  when:
    - app_container_info.exists
    - pulled_image.changed

- name: Remove old container before redeploy
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  when:
    - app_container_info.exists
    - pulled_image.changed

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    published_ports:
      - "{{ host_port }}:{{ app_port }}"
    env: "{{ app_env }}"
    recreate: "{{ pulled_image.changed }}"
  notify: restart app container

- name: Wait for application port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ host_port }}"
    delay: 2
    timeout: "{{ app_start_timeout }}"

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ host_port }}/health"
    method: GET
    status_code: 200
    return_content: true
  register: healthcheck_result
  retries: "{{ app_health_retries }}"
  delay: "{{ app_health_delay }}"
  until: healthcheck_result.status == 200
