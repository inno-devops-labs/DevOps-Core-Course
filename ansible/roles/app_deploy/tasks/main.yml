---
# Application deployment role - Deploy containerized application

- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
    registry_url: https://index.docker.io/v1/
  no_log: true
  tags:
    - app
    - deploy

- name: Pull Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    tag: "{{ docker_image_tag }}"
    source: pull
    force_source: yes
  tags:
    - app
    - deploy

- name: Stop and remove existing container (if exists)
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  ignore_errors: yes
  tags:
    - app
    - deploy

- name: Run new container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    ports:
      - "{{ app_port }}:{{ app_port }}"
    env: "{{ app_environment_vars | default({}) }}"
  tags:
    - app
    - deploy
  notify: restart application

- name: Wait for application port to be available
  wait_for:
    port: "{{ app_port }}"
    delay: 5
    timeout: 60
    state: started
  tags:
    - app
    - deploy
    - verify

- name: Verify health endpoint
  uri:
    url: "http://localhost:{{ app_port }}/health"
    method: GET
    status_code: 200
    timeout: 10
  register: health_check
  retries: 3
  delay: 5
  until: health_check.status == 200
  tags:
    - app
    - deploy
    - verify

- name: Display health check result
  debug:
    msg: "Application is healthy: {{ health_check.json }}"
  tags:
    - app
    - deploy
    - verify