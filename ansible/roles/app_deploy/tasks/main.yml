---

- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: false

- name: Pull Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag }}"
    source: pull

- name: Stop existing container if running
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  ignore_errors: true
  register: stop_result

- name: Remove old container if exists
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    ports:
      - "{{ app_port }}:5000"
    env: "{{ app_env }}"
    detach: true

- name: Wait for application to be ready
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ app_port }}"
    delay: 2
    timeout: "{{ app_wait_timeout }}"
    state: started

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
    method: GET
    status_code: 200
    timeout: 5
  register: health_check
  failed_when: health_check.status != 200

- name: Report deployment success
  ansible.builtin.debug:
    msg: "Application {{ app_container_name }} is running and healthy at http://{{ ansible_host }}:{{ app_port }}{{ app_health_path }}"
