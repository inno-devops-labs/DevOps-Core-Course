---
- name: Ensure app working directory exists
  ansible.builtin.file:
    path: "{{ app_workdir }}"
    state: directory
    mode: "0755"

- name: Copy application source file
  ansible.builtin.copy:
    src: app.py
    dest: "{{ app_workdir }}/app.py"
    mode: "0644"
  notify: restart app container

- name: Log in to Docker Hub when credentials are provided
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: true
  when:
    - dockerhub_username is defined
    - dockerhub_password is defined
    - dockerhub_username | length > 0
    - dockerhub_password | length > 0
    - dockerhub_username != "egortorshin"
    - dockerhub_password != "Tujhrf2005"

- name: Pull Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    tag: "{{ docker_image_tag }}"
    source: pull

- name: Collect existing container state
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: app_container_info

- name: Stop existing container when running
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  when:
    - app_container_info.exists
    - app_container_info.container.State.Running | default(false)

- name: Remove old container when present
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  when: app_container_info.exists

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    command:
      - python3
      - /app/app.py
    state: started
    restart_policy: "{{ app_restart_policy }}"
    recreate: true
    ports:
      - "{{ app_port }}:{{ app_internal_port }}"
    env: "{{ app_environment | combine({'APP_PORT': app_internal_port | string}) }}"
    volumes:
      - "{{ app_workdir }}/app.py:/app/app.py:ro"

- name: Wait for application port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ app_port }}"
    delay: 2
    timeout: 60

- name: Verify application health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_healthcheck_path }}"
    method: GET
    status_code: 200
    return_content: true
  register: app_healthcheck_result
  retries: "{{ app_healthcheck_retries }}"
  delay: "{{ app_healthcheck_delay }}"
  until: app_healthcheck_result.status == 200
