 ---
 - name: Log in to Docker Hub
   community.docker.docker_login:
     username: "{{ dockerhub_username }}"
     password: "{{ dockerhub_password }}"
   no_log: true

 - name: Pull application image
   community.docker.docker_image:
     name: "{{ docker_image }}:{{ docker_image_tag }}"
     source: pull

 - name: Run application container
   community.docker.docker_container:
     name: "{{ app_container_name }}"
     image: "{{ docker_image }}:{{ docker_image_tag }}"
     state: started
     restart_policy: "{{ app_restart_policy }}"
     published_ports:
       - "{{ app_port }}:{{ app_port }}"
     env: "{{ app_environment }}"
     recreate: true
   notify: restart app container

 - name: Wait for application port to be open
   ansible.builtin.wait_for:
     host: "{{ inventory_hostname }}"
     port: "{{ app_port }}"
     delay: 5
     timeout: 60

 - name: Check health endpoint
   ansible.builtin.uri:
     url: "http://{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{ app_port }}/health"
     method: GET
     status_code: 200
   register: health_result

