---
- name: Ensure Docker Hub credentials are set (in group_vars/all.yml via Vault)
  ansible.builtin.assert:
    that:
      - dockerhub_username is defined
      - dockerhub_password is defined
    fail_msg: >
      Define dockerhub_username and dockerhub_password in group_vars/all.yml.
      From ansible/: ansible-vault edit group_vars/all.yml
      Add both variables (see group_vars/all.yml.example). Run the playbook from the ansible/ directory.

- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
    registry: https://index.docker.io/v1/
  no_log: true

- name: Pull Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag }}"
    source: pull

- name: Stop existing container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: stopped
  ignore_errors: yes

- name: Remove old container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    ports:
      - "{{ app_port }}:{{ app_container_port }}"
    env: "{{ app_env }}"

- name: Wait for application port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    delay: 2
    timeout: 30

- name: Check health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    return_content: yes
  register: health_result
  changed_when: false
