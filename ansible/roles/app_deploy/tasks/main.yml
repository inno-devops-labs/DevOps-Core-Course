---
- name: Validate required Docker Hub credentials
  ansible.builtin.assert:
    that:
      - dockerhub_username is defined
      - dockerhub_username | length > 0
      - dockerhub_password is defined
      - dockerhub_password | length > 0
    fail_msg: >-
      dockerhub_username/dockerhub_password are not set.
      Create encrypted group_vars/all.yml with ansible-vault.

- name: Read current container information
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: app_container_info
  failed_when: false
  changed_when: false

- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: true

- name: Pull application image
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag }}"
    source: pull
  register: app_image_pull
  notify: restart application container

- name: Stop existing container when redeploy is required
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  when:
    - app_container_info.exists | default(false)
    - app_container_info.container.State.Running | default(false)
    - app_image_pull.changed or
      (app_container_info.container.Config.Image | default('') != docker_image ~ ':' ~ docker_image_tag)

- name: Remove old container when redeploy is required
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  when:
    - app_container_info.exists | default(false)
    - app_image_pull.changed or
      (app_container_info.container.Config.Image | default('') != docker_image ~ ':' ~ docker_image_tag)

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    published_ports:
      - "{{ app_port }}:{{ app_container_port }}"
    env: "{{ app_env }}"

- name: Wait for application port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ app_port }}"
    delay: 2
    timeout: "{{ app_wait_timeout }}"

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_healthcheck_path }}"
    method: GET
    status_code: 200
  register: app_health_result
  retries: 10
  delay: 3
  until: app_health_result.status == 200
