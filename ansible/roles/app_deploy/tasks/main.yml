---
# Deploy application container from Docker Hub using vaulted credentials.
- name: Validate required deployment variables
  ansible.builtin.assert:
    that:
      - dockerhub_username | length > 0
      - dockerhub_password | length > 0
      - docker_image | length > 0
      - docker_image_tag | length > 0
    fail_msg: >-
      Missing required app deployment variables. Store Docker Hub credentials
      and app settings in group_vars/all.yml (encrypted with Ansible Vault).

- name: Log in to Docker Hub
  community.docker.docker_login:
    registry_url: "{{ docker_registry_url }}"
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: true

- name: Pull application image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    tag: "{{ docker_image_tag }}"
    source: pull
  notify: Restart application container

- name: Get existing container info
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: app_container_info

- name: Stop existing container if running
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  when: app_container_info.exists

- name: Remove old container if exists
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  when: app_container_info.exists

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    published_ports:
      - "{{ app_port }}:{{ app_container_port }}"
    env: "{{ app_environment }}"

- name: Wait for application port to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ app_port | int }}"
    timeout: 60

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_healthcheck_path }}"
    method: GET
    status_code: 200
  register: app_healthcheck_result
  retries: "{{ app_healthcheck_retries }}"
  delay: "{{ app_healthcheck_delay }}"
  until: app_healthcheck_result.status == 200
