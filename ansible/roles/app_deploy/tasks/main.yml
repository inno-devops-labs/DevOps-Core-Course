---
###- name: Log in to Docker Hub
###  community.docker.docker_login:
  ###  username: "{{ dockerhub_username }}"
   ### password: "{{ dockerhub_password }}"
  ###no_log: true

- name: Pull application image
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag }}"
    source: pull

- name: Ensure old container is absent
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  ignore_errors: true

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    published_ports:
      - "{{ app_port }}:{{ app_port }}"
    env: "{{ app_env }}"
    restart_policy: "{{ docker_restart_policy }}"
    state: started

- name: Wait for application port to become open
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ app_port }}"
    delay: 3
    timeout: 60

- name: Check health endpoint
  ansible.builtin.uri:
    url: "http://{{ ansible_host | default(inventory_hostname) }}:{{ app_port }}/health"
    method: GET
    status_code: 200
  register: health_result
  failed_when: health_result.status != 200
