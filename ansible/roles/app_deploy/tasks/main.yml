---
- name: Log in to Docker Hub
  docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  become: yes

- name: Pull Docker image
  docker_image:
    name: "{{ docker_image }}"
    tag: "{{ docker_image_tag }}"
    source: pull
    force_source: yes
  become: yes
  register: pull_result
  notify: restart app container

- name: Check if container is running
  docker_container_info:
    name: "{{ app_container_name }}"
  become: yes
  register: container_info

- name: Stop existing container if running
  docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  become: yes
  when: container_info.exists and container_info.container.State.Running

- name: Remove old container if exists
  docker_container:
    name: "{{ app_container_name }}"
    state: absent
  become: yes
  when: container_info.exists

- name: Run new container
  docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ docker_restart_policy }}"
    ports:
      - "{{ app_port }}:{{ app_port }}"
    env: "{{ app_environment_vars }}"
  become: yes
  register: run_result

- name: Wait for application to be ready on port {{ app_port }}
  wait_for:
    port: "{{ app_port }}"
    host: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
    delay: 5
    timeout: 30
    state: started
  become: no

- name: Verify health endpoint
  uri:
    url: "http://{{ ansible_default_ipv4.address | default('127.0.0.1') }}:{{ app_port }}/health"
    method: GET
    status_code: 200
    timeout: 10
  register: health_check
  until: health_check.status == 200
  retries: 5
  delay: 3
  ignore_errors: yes
  become: no

- name: Display health check result
  debug:
    msg: "Health check {{ 'succeeded' if health_check.status == 200 else 'failed' }} with status {{ health_check.status }}"
  when: health_check is defined
