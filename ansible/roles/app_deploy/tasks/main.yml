---
- name: Validate Docker Hub credentials are provided
  ansible.builtin.assert:
    that:
      - dockerhub_username is defined
      - dockerhub_password is defined
      - dockerhub_username | length > 0
      - dockerhub_password | length > 0
    fail_msg: dockerhub_username and dockerhub_password must be provided via Vault.
  when: dockerhub_login_enabled | bool

- name: Login to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
    reauthorize: true
  no_log: true
  when: dockerhub_login_enabled | bool

- name: Pull application image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    source: pull
  register: pulled_image

- name: Get current container state
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: container_info

- name: Stop existing application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  when:
    - container_info.exists
    - pulled_image.changed

- name: Remove existing application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  when:
    - container_info.exists
    - pulled_image.changed

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    pull: never
    ports:
      - "{{ app_port }}:5000"
    env: "{{ app_environment }}"

- name: Wait for application port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ app_port }}"
    delay: "{{ app_wait_delay }}"
    timeout: "{{ app_wait_timeout }}"

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "{{ app_healthcheck_url }}"
    method: GET
    status_code: "{{ app_healthcheck_status_code }}"
    return_content: true
  register: app_health_result
  retries: 5
  delay: 2
  until: app_health_result.status == app_healthcheck_status_code
