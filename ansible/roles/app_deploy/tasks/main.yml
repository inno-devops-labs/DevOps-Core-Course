---
- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
    registry: https://index.docker.io/v1/
  no_log: true

- name: Pull Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag | default('latest') }}"
    source: pull

- name: Stop existing container if running
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  ignore_errors: true

- name: Remove old container if exists
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  ignore_errors: true

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag | default('latest') }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    ports:
      - "{{ app_port }}:{{ app_port }}"
    env: "{{ app_env }}"
  notify: restart app container

- name: Wait for application port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    host: 127.0.0.1
    delay: 2
    timeout: 30
  delegate_to: "{{ inventory_hostname }}"
  run_once: true

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ app_port }}/health"
    return_content: yes
    status_code: 200
  register: health_check
  failed_when: false
  changed_when: false

- name: Report health check result
  ansible.builtin.debug:
    msg: "Health check {{ 'OK' if health_check.status == 200 else 'failed' }}: {{ health_check.json | default(health_check) }}"
  when: health_check is defined
