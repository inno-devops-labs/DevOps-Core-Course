---
- name: Login to Docker Hub (optional, no logs)
  community.docker.docker_login:
    registry_url: "https://index.docker.io/v1/"
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: true
  when: dockerhub_login_enabled | default(false) | bool

- name: Pull application image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    tag: "{{ docker_image_tag }}"
    source: pull
  register: image_pull

- name: Run application container (idempotent)
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy | default('unless-stopped') }}"
    published_ports:
      - "{{ app_port }}:{{ app_port }}"
    env: "{{ app_env | default({}) }}"
    recreate: false
    pull: false

- name: Recreate container if image updated
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy | default('unless-stopped') }}"
    published_ports:
      - "{{ app_port }}:{{ app_port }}"
    env: "{{ app_env | default({}) }}"
    recreate: true
  when: image_pull.changed

- name: Wait for app port to become available
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ app_port }}"
    delay: 1
    timeout: "{{ app_startup_wait_seconds | default(30) }}"

- name: Health check
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path | default('/health') }}"
    status_code: "{{ app_health_expected_status | default(200) }}"
    return_content: true
  register: health_result

- name: Show health response (for logs)
  ansible.builtin.debug:
    msg:
      - "Health status: {{ health_result.status }}"
      - "Health body: {{ health_result.content | default('') }}"
