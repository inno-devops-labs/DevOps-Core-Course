---
- name: Pull Docker image
  docker_image:
    name: "{{ app_image }}"
    source: pull
    force_source: yes
  timeout: "{{ docker_pull_timeout }}"
  tags: deploy

- name: Stop existing container if running
  docker_container:
    name: "{{ app_container_name }}"
    state: absent
  ignore_errors: yes
  tags: deploy

- name: Deploy application container
  docker_container:
    name: "{{ app_container_name }}"
    image: "{{ app_image }}"
    state: started
    restart_policy: always
    ports:
      - "{{ app_port_host }}:{{ app_port }}"
    env:
      FLASK_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:{{ app_port }}/health"]
      interval: "{{ app_healthcheck_interval }}s"
      timeout: "{{ app_healthcheck_timeout }}s"
      retries: "{{ app_healthcheck_retries }}"
      start_period: 10s
  tags: deploy
  register: container_result

- name: Wait for application to be ready
  uri:
    url: "http://localhost:{{ app_port }}/health"
    method: GET
    status_code: 200
  retries: 5
  delay: 5
  register: app_health
  tags: deploy

- name: Display deployment status
  debug:
    msg: "Application deployed successfully on port {{ app_port_host }}"
  tags: deploy
