---
- name: Validate deployment variables
  assert:
    that:
      - dockerhub_username | length > 0
      - dockerhub_password | length > 0
      - docker_image | length > 0
      - docker_image_tag | length > 0
      - app_container_name | length > 0
      - app_host_port | int > 0
      - app_container_port | int > 0
    fail_msg: >-
      Missing required deployment variables. Set dockerhub_username, dockerhub_password,
      docker_image, docker_image_tag, app_container_name, app_host_port,
      and app_container_port in ansible/group_vars/all.yml (vault).

- name: Log in to Docker Hub
  docker_login:
    registry_url: https://index.docker.io/v1/
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: true

- name: Pull Docker image
  docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag }}"
    source: pull
    force_source: true

- name: Stop existing container (if running)
  docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  failed_when: false
  register: stop_result

- name: Remove old container (if exists)
  docker_container:
    name: "{{ app_container_name }}"
    state: absent
  failed_when: false

- name: Run new container
  docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    recreate: true
    ports:
      - "{{ app_host_port }}:{{ app_container_port }}"
    env: "{{ app_environment }}"
    restart_policy: "{{ app_restart_policy }}"
  notify: Verify deployment

- name: Wait for application port to be ready
  wait_for:
    host: localhost
    port: "{{ app_host_port }}"
    delay: "{{ health_check_delay }}"
    timeout: "{{ health_check_timeout }}"
    state: started
  retries: "{{ health_check_retries }}"
  delay: 2
  register: port_check
  until: port_check is succeeded

- name: Verify health endpoint
  uri:
    url: "http://localhost:{{ app_host_port }}/health"
    method: GET
    status_code: 200
    timeout: 5
  register: health_result
  until: health_result.status == 200
  retries: 5
  delay: 2
  ignore_errors: true