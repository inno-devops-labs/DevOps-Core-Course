---
- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: true

- name: Pull application Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    tag: "{{ docker_image_tag }}"
    source: pull

- name: Stop existing application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  ignore_errors: yes

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    ports:
      - "{{ app_port }}:{{ app_port }}"
  notify: restart app container

- name: Wait for application port to be available
  wait_for:
    port: "{{ app_port }}"
    host: localhost
    delay: 5
    timeout: 60

- name: Verify application health endpoint
  uri:
    url: "http://localhost:{{ app_port }}/health"
    return_content: yes
    status_code: 200
  register: health_result

- name: Display health check result
  debug:
    var: health_result.json
