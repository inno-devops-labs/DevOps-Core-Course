---
# App deploy role — deploy containerized Python app
# Uses Docker Hub credentials from Ansible Vault

- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: "{{ app_deploy_no_log }}"
  tags:
    - deploy

- name: Pull Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ docker_image_tag }}"
    source: pull
    force_source: true
  notify: restart app
  tags:
    - deploy

- name: Inspect existing container
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: app_container_info
  tags:
    - deploy

- name: Stop existing container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  when:
    - app_container_info.exists | default(false)
    - app_container_info.container.State.Running | default(false)
  tags:
    - deploy

- name: Remove old container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  tags:
    - deploy

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    ports:
      - "{{ app_port }}:{{ app_container_port }}"
    env: "{{ app_env_vars }}"
  tags:
    - deploy

- name: Wait for application to be ready
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    host: "0.0.0.0"
    delay: 5
    timeout: 60
  tags:
    - deploy
    - verify

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    return_content: yes
    status_code: 200
  register: health_check
  tags:
    - deploy
    - verify

- name: Display health check result
  ansible.builtin.debug:
    var: health_check.json
  tags:
    - deploy
    - verify
