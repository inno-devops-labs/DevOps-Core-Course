---
app_name: devops-info-service
dockerhub_username: hikariatama
dockerhub_login_enabled: true
docker_image_repository: "{{ dockerhub_username }}/devops-info-service-python"
docker_image_tag: latest
docker_image: "{{ docker_image_repository }}:{{ docker_image_tag }}"
app_port: 5000
app_container_name: "{{ app_name }}"
app_restart_policy: unless-stopped
app_environment: {}
app_wait_delay: 2
app_wait_timeout: 60
app_healthcheck_url: "http://127.0.0.1:{{ app_port }}/health"
app_healthcheck_status_code: 200
