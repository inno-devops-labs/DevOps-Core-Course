---
# Application container name
app_container_name: "{{ app_name | default('devops-app') }}"

# Host port to expose (maps to container port)
app_port: 5000

# Container internal port (app listens on this)
app_internal_port: 5000

# Restart policy for the container
app_restart_policy: unless-stopped

# Optional environment variables for the container
app_env: {}

# Health check path (relative to app root)
app_health_path: /health

# Seconds to wait for app to become ready
app_wait_timeout: 30
