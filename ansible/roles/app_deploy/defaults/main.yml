---
# Base application name (used for image and container).
app_name: "devops-app"

# Exposed application port inside the container.
app_port: 5000

# Name of the container to run.
app_container_name: "{{ app_name }}"

# Restart policy for the container.
app_restart_policy: "unless-stopped"

# Optional environment variables for the container.
app_env: {}

# Healthcheck path inside the application.
app_healthcheck_path: "/health"

# Docker image name and tag. Username comes from vaulted variable.
docker_image: "{{ dockerhub_username }}/{{ app_name }}"
docker_image_tag: "latest"

