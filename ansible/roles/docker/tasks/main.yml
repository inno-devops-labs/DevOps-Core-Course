---
# Docker installation block
- name: Install Docker engine
  block:
    - name: Install dependencies for Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | lower |
          replace('x86_64', 'amd64') |
          replace('aarch64', 'arm64') }}]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      notify: restart docker

    - name: Update apt cache after adding Docker repo
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
      notify: restart docker

  rescue:
    - name: Wait before retrying after GPG/network failure
      ansible.builtin.pause:
        seconds: 10

    - name: Retry apt update after failure
      ansible.builtin.apt:
        update_cache: yes
      changed_when: false

    - name: Retry Docker packages installation
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

  always:
    - name: Ensure Docker service is enabled and started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes
      ignore_errors: true

  become: true
  tags:
    - docker_install
    - docker

# Docker configuration block
- name: Configure Docker environment
  block:
    - name: Add remote user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Install python3-docker for Ansible Docker modules
      ansible.builtin.apt:
        name: python3-docker
        state: present

  become: true
  tags:
    - docker_config
    - docker
