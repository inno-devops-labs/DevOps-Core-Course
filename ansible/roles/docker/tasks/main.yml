---
# Role: docker
# Tags:
# - docker (entire role)
# - docker_install
# - docker_config

- name: Install Docker
  become: true
  tags:
    - docker
    - docker_install

  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repo
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true

  rescue:
    - name: Wait before retry
      ansible.builtin.pause:
        seconds: 10

    - name: Retry apt update
      ansible.builtin.apt:
        update_cache: true

  always:
    - name: Ensure Docker is enabled
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

- name: Configure Docker
  become: true
  tags:
    - docker
    - docker_config
  block:
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
