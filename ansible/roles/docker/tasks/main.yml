# New version (lab06)
---
- name: Docker | Install
  block:
    - name: Ensure apt keyrings dir exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key (ASCII)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      register: docker_key_download

    - name: Dearmor Docker GPG key to keyring (only when key changed)
      ansible.builtin.command: >
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
      when: docker_key_download.changed

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "{{ docker_apt_repo }}"
        state: present
        filename: docker

    - name: Update apt cache after adding Docker repo
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
      notify: restart docker

    - name: Install python Docker SDK for Ansible modules
      ansible.builtin.apt:
        name: python3-docker
        state: present

  rescue:
    - name: Wait 10 seconds before retry
      ansible.builtin.pause:
        seconds: 10

    - name: Retry apt cache update
      ansible.builtin.apt:
        update_cache: true

    - name: Retry Docker packages install
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

  always:
    - name: Ensure docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags:
    - docker_install

- name: Docker | Config
  block:
    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"
      when: (docker_users | default([])) | length > 0

  become: true
  tags:
    - docker_config
