---
- name: Docker installation
  block:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker.gpg
        mode: '0644'
        
    - name: Install Docker GPG key
      ansible.builtin.command: "gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg"
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

  rescue:

    - name: Wait before retrying
      pause:
        seconds: 10

    - name: Retry apt update
      apt:
        update_cache: yes

  always:

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

  become: true
  tags:
    - docker
    - docker_install


- name: Docker configuration
  block:

    - name: Add devops user to docker group
      user:
        name: devops
        groups: docker
        append: yes

    - name: Create Docker config directory
      file:
        path: /etc/docker
        state: directory
        mode: '0755'

  always:

    - name: Verify Docker service enabled
      service:
        name: docker
        enabled: yes

  become: true
  tags:
    - docker
    - docker_config