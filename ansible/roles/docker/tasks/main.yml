---
- name: Install Docker
  block:
    - name: Install Docker prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
      notify: restart docker

  rescue:
    - name: Wait before retry
      pause:
        seconds: 10

    - name: Retry apt update
      apt:
        update_cache: yes

    - name: Retry Docker installation
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

  always:
    - name: Ensure Docker service is enabled
      service:
        name: docker
        state: started
        enabled: yes

  become: true
  tags:
    - docker_install

- name: Configure Docker
  block:
    - name: Add user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes

    - name: Install python3-docker
      apt:
        name: python3-docker
        state: present

  become: true
  tags:
    - docker_config
