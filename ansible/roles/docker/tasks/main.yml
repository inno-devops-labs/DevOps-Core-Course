---
- name: Install and configure Docker
  block:
    - name: Install dependencies for Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create directory for Docker key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: yes
      notify: restart docker

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      notify: restart docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      notify: restart docker

  rescue:
    - name: Retry apt update after Docker GPG failure
      ansible.builtin.shell: |
        sleep 10
        apt-get update --fix-missing
      register: docker_apt_retry
      changed_when: docker_apt_retry.rc == 0
      failed_when: false

  always:
    - name: Ensure Docker service is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

  become: true
  tags:
    - docker
    - docker_install

- name: Configure Docker users and Python dependencies
  block:
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_group_user }}"
        groups: docker
        append: yes

    - name: Install python3-docker for Ansible docker modules
      ansible.builtin.apt:
        name: python3-docker
        state: present

  become: true
  tags:
    - docker
    - docker_config
