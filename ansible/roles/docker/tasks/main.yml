---
# Role: docker
# Tags:
# - docker (entire role)
# - docker_install
# - docker_config

- name: Install Docker
  block:

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - gnupg
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repo
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

  rescue:

    - name: Wait before retry
      pause:
        seconds: 10

    - name: Retry apt update
      apt:
        update_cache: yes

  always:

    - name: Ensure Docker is enabled
      service:
        name: docker
        enabled: yes
        state: started

  become: true
  tags:
    - docker
    - docker_install


- name: Configure Docker
  block:

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

  become: true
  tags:
    - docker
    - docker_config