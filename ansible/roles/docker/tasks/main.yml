---
# Docker role: split into install vs config blocks (separate tags).
- name: Docker | Installation
  become: true
  tags:
    - docker
    - docker_install
  block:
    - name: Install dependencies for apt over HTTPS
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: "https://download.docker.com/linux/ubuntu/gpg"
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      notify: Restart Docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true
      notify: Restart Docker

  rescue:
    # Retry once on network/GPG flakiness.
    - name: Wait before retry (network/gpg flakiness)
      ansible.builtin.wait_for:
        timeout: 10

    - name: Retry Add Docker GPG key
      ansible.builtin.apt_key:
        url: "https://download.docker.com/linux/ubuntu/gpg"
        state: present

    - name: Retry apt update
      ansible.builtin.apt:
        update_cache: true

  always:
    # Ensure Docker daemon is usable even after partial failures.
    - name: Ensure Docker service is enabled and running (always)
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

- name: Docker | Configuration
  become: true
  tags:
    - docker
    - docker_config
  block:
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    - name: Install python docker SDK for Ansible modules
      ansible.builtin.apt:
        name: python3-docker
        state: present
