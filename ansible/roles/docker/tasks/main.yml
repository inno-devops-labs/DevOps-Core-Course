---
# Docker installation block with error handling and retry logic
- name: Install Docker
  become: true
  tags:
    - docker_install
    - docker
  block:
    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose
        state: present

  rescue:
    - name: Wait and retry on GPG key failure
      ansible.builtin.wait_for:
        timeout: 10

    - name: Retry Docker repository add
      ansible.builtin.apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Update apt cache retry
      ansible.builtin.apt:
        update_cache: true

    - name: Retry Docker package installation
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose
        state: present

# Docker configuration block
- name: Configure Docker
  become: true
  tags:
    - docker_config
    - docker
  block:
    - name: Check Docker service running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: "{{ docker_group }}"
        append: true

    - name: Install python3-docker package
      ansible.builtin.apt:
        name: "{{ python3_docker_package }}"
        state: present

  always:
    - name: Ensure Docker service is enabled
      ansible.builtin.service:
        name: docker
        enabled: true
