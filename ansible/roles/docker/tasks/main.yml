---
# Docker role: Installation and configuration
# Tags: docker, docker_install, docker_config

- name: Docker installation block
  become: true
  tags:
    - docker_install
    - docker
  block:
    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Check if Docker GPG key exists
      ansible.builtin.stat:
        path: /etc/apt/keyrings/docker.gpg
      register: docker_gpg_key_stat

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present
      when: not docker_gpg_key_stat.stat.exists

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_facts.architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
          signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu {{ ansible_facts.lsb.codename }} stable
        state: present
        filename: docker
        update_cache: true
      notify: Restart docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
      notify: Restart docker

    - name: Install python3-docker for Ansible docker modules
      ansible.builtin.apt:
        name: python3-docker
        state: present

    - name: Install docker-compose Python package
      ansible.builtin.pip:
        name: docker-compose
        state: present

  rescue:
    - name: Wait before retry on GPG key failure
      ansible.builtin.wait_for:
        timeout: 10
      when: docker_gpg_key_stat is not defined or not docker_gpg_key_stat.stat.exists

    - name: Retry Docker GPG key addition
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present
      retries: 2
      delay: 5

  always:
    - name: Ensure Docker service is enabled
      ansible.builtin.service:
        name: docker
        enabled: true

- name: Docker configuration block
  become: true
  tags:
    - docker_config
    - docker
  block:
    - name: Ensure Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

  rescue:
    - name: Log Docker configuration failure
      ansible.builtin.debug:
        msg: "Docker configuration failed, check Docker service status"
