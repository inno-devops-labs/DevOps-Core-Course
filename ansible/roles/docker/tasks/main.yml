---
- name: Install Docker
  become: true
  tags:
    - docker
    - docker_install
  block:
    - name: Install prerequisite packages for Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker official GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
      notify: Restart docker

  rescue:
    - name: Wait before retrying GPG key (network timeout handling)
      ansible.builtin.pause:
        seconds: 10

    - name: Retry apt update on GPG key failure
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: true

    - name: Retry adding Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Retry installing Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
      notify: Restart docker

  always:
    - name: Ensure Docker service is enabled
      ansible.builtin.service:
        name: docker
        enabled: true
      failed_when: false

- name: Configure Docker
  become: true
  tags:
    - docker
    - docker_config
  block:
    - name: Ensure Docker service is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    - name: Install python3-docker for Ansible Docker modules
      ansible.builtin.apt:
        name: python3-docker
        state: present

  always:
    - name: Log Docker configuration completion
      ansible.builtin.copy:
        content: "Docker configured at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/docker_role_completion.log
        mode: '0644'
