- name: Install Docker
  block:

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

  rescue:

    - name: Wait before retry
      pause:
        seconds: 10

    - name: Retry apt update
      apt:
        update_cache: yes

  always:

    - name: Ensure Docker service is enabled and started
      service:
        name: docker
        state: started
        enabled: true

  become: true
  tags:
    - docker_install
    - docker

- name: Configure Docker
  block:

    - name: Add deploy user to docker group
      user:
        name: deploy
        groups: docker
        append: yes

  always:

    - name: Log docker configuration completion
      copy:
        content: "Docker configuration completed\n"
        dest: /tmp/docker_config.log

  become: true
  tags:
    - docker_config
    - docker