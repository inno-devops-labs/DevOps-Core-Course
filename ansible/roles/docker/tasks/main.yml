---
- name: Docker | Install
  block:
    - name: Include docker install tasks
      ansible.builtin.import_tasks: ../docker_install/main.yml
  rescue:
    - name: Docker | Retry apt update after failure
      ansible.builtin.command: apt-get update --fix-missing
      changed_when: false
  always:
    - name: Docker | Mark install block done
      ansible.builtin.file:
        path: /tmp/docker_install_done
        state: touch
  become: true
  tags:
    - docker
    - docker_install

- name: Docker | Config
  block:
    - name: Include docker config tasks
      ansible.builtin.import_tasks: ../docker_config/main.yml
  always:
    - name: Docker | Mark config block done
      ansible.builtin.file:
        path: /tmp/docker_config_done
        state: touch
  become: true
  tags:
    - docker
    - docker_config