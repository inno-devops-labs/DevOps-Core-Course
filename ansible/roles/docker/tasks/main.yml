---
# Role: docker — installation and configuration
# Tags: docker, docker_install, docker_config

- name: Install Docker
  block:
    - name: Install prerequisites for Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Choose Docker apt repo release (fallback if unsupported)
      ansible.builtin.set_fact:
        docker_apt_release_effective: >-
          {{
            (
              docker_apt_release | default(ansible_facts['distribution_release'] | default(ansible_distribution_release))
            ) if (
              (docker_apt_release | default(ansible_facts['distribution_release'] | default(ansible_distribution_release))) in ['jammy', 'noble']
            ) else 'noble'
          }}

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key (keyring)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ (ansible_facts['architecture'] | default(ansible_architecture) == 'x86_64') | ternary('amd64', ((ansible_facts['architecture'] | default(ansible_architecture)) == 'aarch64') | ternary('arm64', (ansible_facts['architecture'] | default(ansible_architecture)))) }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ docker_apt_release_effective }} stable"
        state: present
        filename: docker
      notify: restart docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: "{{ docker_install_state }}"
        update_cache: yes
      notify: restart docker

  rescue:
    - name: Wait before retry (GPG key / network timeout)
      ansible.builtin.pause:
        seconds: 10
        prompt: "Retrying Docker GPG/repo setup..."

    - name: Retry apt update
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

  always:
    - name: Ensure Docker service is enabled and started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

  become: true
  tags:
    - docker
    - docker_install

- name: Configure Docker
  block:
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_group_user }}"
        groups: docker
        append: yes

    - name: Install python3-docker for Ansible docker modules
      ansible.builtin.apt:
        name: python3-docker
        state: present

  always:
    - name: Ensure Docker service is enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

  become: true
  tags:
    - docker
    - docker_config
