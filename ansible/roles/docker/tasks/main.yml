---
- name: Install Docker
  block:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false
      when: "'docker-ce' not in ansible_facts.packages and 'docker.io' not in ansible_facts.packages"

    - name: Get system architecture
      command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Add Docker official repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      when: "'docker-ce' not in ansible_facts.packages and 'docker.io' not in ansible_facts.packages"

    - name: Install Docker CE packages
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
      notify: restart docker
      when: "'docker-ce' not in ansible_facts.packages and 'docker.io' not in ansible_facts.packages"

  rescue:
    - name: Wait before retrying after GPG/network failure
      ansible.builtin.pause:
        seconds: 10

    - name: Retry apt update after failure
      apt:
        update_cache: yes
        force_apt_get: yes

    - name: Retry Docker CE install
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
      notify: restart docker

  always:
    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

  become: true
  tags:
    - docker
    - docker_install

- name: Configure Docker
  block:
    - name: Add user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes
      when: docker_user != "root"

    - name: Install python3-docker library
      apt:
        name: python3-docker
        state: present

  become: true
  tags:
    - docker
    - docker_config
