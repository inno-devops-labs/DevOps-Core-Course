---
# docker role: installation and runtime configuration

- name: Docker installation
  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - python3-docker
        state: present
        update_cache: true
      notify: restart docker

  rescue:
    - name: Retry apt cache update after Docker key/repo failure
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: Wait before retrying Docker key setup
      ansible.builtin.wait_for:
        timeout: 10

    - name: Retry adding Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

  always:
    - name: Ensure docker service is enabled and started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

  become: true
  tags:
    - docker_install

- name: Docker runtime configuration
  block:
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

  become: true
  tags:
    - docker_config
