---
- name: Docker | install block
  become: true
  tags: [docker, docker_install]
  block:
    - name: Ensure apt cache is updated
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repo
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
  rescue:
    - name: Wait before retry (rescue)
      ansible.builtin.pause:
        seconds: 10

    - name: Retry apt cache update (rescue)
      ansible.builtin.apt:
        update_cache: true

    - name: Retry Docker GPG key download (rescue)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
  always:
    - name: Ensure docker service enabled and started (always)
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

- name: Docker | config block
  become: true
  tags: [docker, docker_config]
  block:
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
