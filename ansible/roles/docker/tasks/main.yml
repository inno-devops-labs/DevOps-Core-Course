---
- name: Docker installation block
  become: true
  tags:
    - docker_install
    - docker
  block:
    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true
  rescue:
    - name: "Rescue: Retry apt update after GPG key failure"
      ansible.builtin.command: apt-get update --fix-missing
      become: true
  always:
    - name: "Always: Ensure Docker service is enabled and started"
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Docker configuration block
  become: true
  tags:
    - docker_config
    - docker
  block:
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    - name: Install python3-docker
      ansible.builtin.pip:
        name: docker
        state: present
      notify: restart docker
