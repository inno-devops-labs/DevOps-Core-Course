---
# Docker role: install and configure Docker. Blocks for install vs config, rescue for GPG/network failures.
# Tags: docker, docker_install, docker_config

- name: Install Docker
  block:
    - name: Add Docker GPG key to APT
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
      notify: restart docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
      notify: restart docker

    - name: Install python3-docker for Ansible docker modules
      ansible.builtin.apt:
        name: python3-docker
        state: present

  rescue:
    - name: Wait before retry after GPG/key failure
      ansible.builtin.pause:
        seconds: 10
        prompt: "Retrying after 10s..."

    - name: Retry apt update
      ansible.builtin.apt:
        update_cache: yes
        update_cache_retries: 3

    - name: Retry Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Retry Docker repository and packages
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
      notify: restart docker

    - name: Retry install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
      notify: restart docker

  always:
    - name: Ensure Docker service is enabled and started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

  become: true
  tags:
    - docker
    - docker_install

- name: Configure Docker
  block:
    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop: "{{ docker_group_users }}"
      when: item is defined and item | length > 0

  become: true
  tags:
    - docker
    - docker_config
