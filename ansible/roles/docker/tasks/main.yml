---
# roles/docker/tasks/main.yml

- name: Install prerequisites for Docker
  ansible.builtin.apt:
    name: "{{ docker_prerequisites }}"
    state: present
    update_cache:  yes
  when: ansible_facts['os_family'] == "Debian"
  tags: 
    - docker
    - packages

- name: Create directory for keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == "Debian"
  tags:
    - docker

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_gpg_key }}"
    dest: "{{ docker_apt_keyring_path }}"
    mode: '0644'
  notify: Update apt cache
  when: ansible_facts['os_family'] == "Debian"
  tags:
    - docker
    - security

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_apt_arch }} signed-by={{ docker_apt_keyring_path }}] https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }} {{ docker_apt_release_channel }}"
    filename: docker
    state: present
    update_cache: false
  when: ansible_facts['os_family'] == "Debian"
  notify: Update apt cache
  tags:
    - docker
    - repo

- name: Update apt cache after adding docker repo
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 0
  when: ansible_facts['os_family'] == "Debian"
  tags: 
    - docker
    - packages

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present 
  when: ansible_facts['os_family'] == "Debian"
  notify: Restart Docker
  tags: 
    - docker
    - packages

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"
  tags:
    - docker
    - service

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
  when: docker_user is defined
  notify: Restart Docker
  tags:
    - docker
    - users

- name: Install python3-docker for Ansible modules
  ansible.builtin.apt:
    name: python3-docker
    state: present
  when: ansible_facts['os_family'] == "Debian"
  tags:
    - docker
    - packages