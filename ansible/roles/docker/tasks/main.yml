---
- name: Docker role tasks
  block:
    - name: Docker installation tasks
      block:
        - name: Remove old Docker packages (if any)
          apt:
            name:
              - docker
              - docker-engine
              - docker.io
              - containerd
              - runc
            state: absent

        - name: Install required system packages
          apt:
            name:
              - apt-transport-https
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present

        - name: Add Docker GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker repository
          apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present

        - name: Install Docker packages
          apt:
            name: "{{ docker_packages }}"
            update_cache: yes
            state: present

      rescue:
        - name: Handle Docker GPG key failure
          wait_for:
            timeout: 10

        - name: Retry adding Docker GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

      always:
        - name: Ensure Docker service is enabled
          service:
            name: docker
            enabled: yes

      become: yes
      notify: restart docker
      tags:
        - docker_install

    - name: Docker configuration tasks
      block:
        - name: Ensure Docker is running and enabled
          service:
            name: docker
            state: started
            enabled: yes

        - name: Add user to docker group
          user:
            name: "{{ docker_user }}"
            groups: docker
            append: yes

        - name: Install Python Docker module
          pip:
            name: docker
            state: present

      become: yes
      notify: restart docker
      tags:
        - docker_config

  tags:
    - docker
