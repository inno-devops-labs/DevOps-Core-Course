---
- name: Docker role tasks
  tags:
    - docker
  block:
    - name: Docker installation tasks
      become: true
      notify: restart docker
      tags:
        - docker_install
      block:
        - name: Remove old Docker packages (if any)
          ansible.builtin.apt:
            name:
              - docker
              - docker-engine
              - docker.io
              - containerd
              - runc
            state: absent

        - name: Install required system packages
          ansible.builtin.apt:
            name:
              - apt-transport-https
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present

        - name: Add Docker GPG key
          ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker repository
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present

        - name: Install Docker packages
          ansible.builtin.apt:
            name: "{{ docker_packages }}"
            update_cache: true
            state: present

      rescue:
        - name: Handle Docker GPG key failure
          ansible.builtin.wait_for:
            timeout: 10

        - name: Retry adding Docker GPG key
          ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

      always:
        - name: Ensure Docker service is enabled
          ansible.builtin.service:
            name: docker
            enabled: true

    - name: Docker configuration tasks
      become: true
      notify: restart docker
      tags:
        - docker_config
      block:
        - name: Ensure Docker is running and enabled
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true

        - name: Add user to docker group
          ansible.builtin.user:
            name: "{{ docker_user }}"
            groups: docker
            append: true

        - name: Install Python Docker module
          ansible.builtin.pip:
            name: docker
            state: present
