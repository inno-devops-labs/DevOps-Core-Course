---
- name: Install Docker engine
  block:
    - name: Install prerequisites for Docker repository
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ ansible_facts['architecture'] | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
      notify: restart docker

  rescue:
    - name: Wait before retrying Docker setup
      pause:
        seconds: 10

    - name: Retry apt update after GPG failure
      apt:
        update_cache: yes

    - name: Retry Docker packages installation
      apt:
        name: "{{ docker_packages }}"
        state: present
      notify: restart docker

  always:
    - name: Ensure Docker service is enabled and started
      service:
        name: docker
        state: started
        enabled: yes
      ignore_errors: yes

  become: true
  tags:
    - docker_install

- name: Configure Docker environment
  block:
    - name: Add user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes

    - name: Install python3-docker for Ansible docker modules
      apt:
        name: python3-docker
        state: present

  become: true
  tags:
    - docker_config
