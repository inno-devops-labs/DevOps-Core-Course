---
docker_apt_prerequisites:
  - ca-certificates
  - curl
  - gnupg
docker_keyring_dir: /etc/apt/keyrings
docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
docker_arch: "{{ docker_arch_map.get(ansible_architecture, ansible_architecture) }}"
docker_apt_repo: "deb [arch={{ docker_arch }} signed-by={{ docker_keyring_path }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

docker_service_name: docker
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_python_packages:
  - python3-docker
docker_users:
  - "{{ ansible_user | default('ubuntu') }}"
