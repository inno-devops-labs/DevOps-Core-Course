---
# User to add to docker group (so they can run docker without sudo)
docker_group_users:
  - "{{ ansible_user_id }}"

# Docker keyring path (for repository signing)
docker_apt_keyring: /etc/apt/keyrings/docker.asc

# Docker package list
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
