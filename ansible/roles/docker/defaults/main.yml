---
# roles/docker/defaults/main.yml

docker_user: "{{ ansible_user }}"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_prerequisites:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

# Backward compatibility (legacy typo)
docker_prerequiresites: "{{ docker_prerequisites }}"

docker_edition: "ce"
docker_apt_arch: "amd64"
docker_apt_release_channel: "stable"
docker_apt_gpg_key: "https://download.docker.com/linux/ubuntu/gpg"
docker_apt_keyring_path: "/etc/apt/keyrings/docker.asc"
docker_apt_repository: >-
  deb [arch={{ docker_apt_arch }} signed-by={{ docker_apt_keyring_path }}]
  https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
  {{ ansible_facts['distribution_release'] }}
  {{ docker_apt_release_channel }}

docker_service_state: started
docker_service_enabled: true

# Backward compatibility
docker_service_status: "{{ docker_service_state }}"
docker_service_enable: "{{ docker_service_enabled }}"
