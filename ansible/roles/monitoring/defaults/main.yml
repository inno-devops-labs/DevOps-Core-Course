---
# Monitoring stack versions
loki_version: "3.0.0"
promtail_version: "3.0.0"
grafana_version: "12.3.1"
prometheus_version: "3.9.0"

# Ports
loki_port: 3100
promtail_port: 9080
grafana_port: 3000
app_python_port: 8000
prometheus_port: 9090

# Data retention
loki_retention_period: "168h"
prometheus_retention_days: 15
prometheus_retention_size: "10GB"
prometheus_scrape_interval: "15s"

# Scrape targets
prometheus_targets:
  - job: "prometheus"
    targets: ["localhost:9090"]
  - job: "loki"
    targets: ["loki:3100"]
  - job: "grafana"
    targets: ["grafana:3000"]
  - job: "app"
    targets: ["app-python:8000"]
    path: "/metrics"

# Resource limits
loki_memory_limit: "1G"
loki_cpu_limit: "1.0"
grafana_memory_limit: "512M"
grafana_cpu_limit: "0.5"
promtail_memory_limit: "512M"
promtail_cpu_limit: "0.5"
prometheus_memory_limit: "1G"
prometheus_cpu_limit: "1.0"
app_memory_limit: "256M"
app_cpu_limit: "0.5"

# Schema version
loki_schema_version: "v13"

# Monitoring directory
monitoring_dir: "/opt/monitoring"

# Grafana admin
grafana_admin_user: "admin"
grafana_admin_password: "admin123"
