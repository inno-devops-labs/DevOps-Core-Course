---
# Service versions
monitoring_loki_version: "3.0.0"
monitoring_promtail_version: "3.0.0"
monitoring_grafana_version: "12.3.1"

# Ports
monitoring_loki_port: 3100
monitoring_grafana_port: 3000
monitoring_promtail_port: 9080

# Loki schema
monitoring_loki_schema_version: "v13"

# Retention (7 days)
monitoring_retention_period: "168h"

# Resource limits
monitoring_loki_memory_limit: "1G"
monitoring_loki_cpu_limit: "1.0"
monitoring_promtail_memory_limit: "512M"
monitoring_promtail_cpu_limit: "0.5"
monitoring_grafana_memory_limit: "1G"
monitoring_grafana_cpu_limit: "1.0"
monitoring_app_memory_limit: "256M"
monitoring_app_cpu_limit: "0.5"

# Grafana credentials
monitoring_grafana_admin_user: admin
monitoring_grafana_admin_password: admin

# Application image
monitoring_app_image: "elinanotelina/devops-info-service"
monitoring_app_tag: "latest"
monitoring_app_port: 8000
monitoring_app_internal_port: 5000

# Deploy directory on remote host
monitoring_compose_dir: /opt/monitoring
