---
# monitoring role defaults — all values parameterisable via vars files or extra-vars

# ── Service versions ──────────────────────────────────────────────────────────
monitoring_loki_version: "3.0.0"
monitoring_promtail_version: "3.0.0"
monitoring_grafana_version: "12.3.1"
monitoring_prometheus_version: "v3.9.0"

# ── Ports ─────────────────────────────────────────────────────────────────────
monitoring_loki_port: 3100
monitoring_promtail_port: 9080
monitoring_grafana_port: 3001
monitoring_prometheus_port: 9090
monitoring_app_port: 8000
monitoring_app_internal_port: 8080

# ── Paths ─────────────────────────────────────────────────────────────────────
monitoring_project_dir: /opt/monitoring

# ── Loki settings ─────────────────────────────────────────────────────────────
monitoring_loki_retention: "168h"
monitoring_loki_schema_version: "v13"
monitoring_loki_schema_from: "2024-01-01"

# ── Prometheus settings ───────────────────────────────────────────────────────
monitoring_prometheus_retention_days: 15
monitoring_prometheus_retention_size: "10GB"
monitoring_prometheus_scrape_interval: "15s"
monitoring_prometheus_targets:
  - job: "prometheus"
    targets: ["localhost:9090"]
  - job: "loki"
    targets: ["loki:3100"]
    path: "/metrics"
  - job: "grafana"
    targets: ["grafana:3000"]
    path: "/metrics"
  - job: "app"
    targets: ["app-python:8080"]
    path: "/metrics"

# ── Grafana credentials (override via Vault or extra-vars) ────────────────────
monitoring_grafana_admin_user: admin
monitoring_grafana_admin_password: "changeme"
monitoring_grafana_default_datasource: "Loki"

# ── Monitoring app image ──────────────────────────────────────────────────────
monitoring_app_image: "112005/devops-lab3-python:latest"

# ── Resource limits ───────────────────────────────────────────────────────────
monitoring_loki_cpu_limit: "1.0"
monitoring_loki_memory_limit: "1G"
monitoring_promtail_cpu_limit: "0.5"
monitoring_promtail_memory_limit: "256M"
monitoring_grafana_cpu_limit: "0.5"
monitoring_grafana_memory_limit: "512M"
monitoring_prometheus_cpu_limit: "1.0"
monitoring_prometheus_memory_limit: "1G"
monitoring_app_cpu_limit: "0.5"
monitoring_app_memory_limit: "256M"

# ── Grafana dashboard provisioning ────────────────────────────────────────────
monitoring_dashboards:
  - src: grafana-app-dashboard.json
    dest: grafana-app-dashboard.json
  - src: grafana-logs-dashboard.json
    dest: grafana-logs-dashboard.json
