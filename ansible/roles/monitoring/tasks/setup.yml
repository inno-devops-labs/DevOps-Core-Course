---
- name: Validate Grafana admin password baseline
  ansible.builtin.assert:
    that:
      - monitoring_grafana_admin_password | length >= 12
      - monitoring_grafana_admin_password != "ChangeMe_Lab07_Replace"
    fail_msg: >-
      Set monitoring_grafana_admin_password to a strong secret
      (recommended via ansible-vault in group_vars/all.yml).

- name: Ensure monitoring directory structure exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ monitoring_project_dir }}"
    - "{{ monitoring_project_dir }}/loki"
    - "{{ monitoring_project_dir }}/promtail"
    - "{{ monitoring_project_dir }}/grafana"
    - "{{ monitoring_project_dir }}/grafana/provisioning"
    - "{{ monitoring_project_dir }}/grafana/provisioning/datasources"
    - "{{ monitoring_project_dir }}/grafana/provisioning/dashboards"
    - "{{ monitoring_project_dir }}/grafana/dashboards"

- name: Render monitoring docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_project_dir }}/docker-compose.yml"
    mode: "0644"

- name: Render Loki config
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ monitoring_project_dir }}/loki/config.yml"
    mode: "0644"

- name: Render Promtail config
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "{{ monitoring_project_dir }}/promtail/config.yml"
    mode: "0644"

- name: Render Grafana datasource provisioning
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: "{{ monitoring_project_dir }}/grafana/provisioning/datasources/loki.yml"
    mode: "0644"

- name: Render Grafana dashboard provider
  ansible.builtin.template:
    src: dashboard-provider.yml.j2
    dest: "{{ monitoring_project_dir }}/grafana/provisioning/dashboards/dashboard-provider.yml"
    mode: "0644"

- name: Render Grafana dashboard
  ansible.builtin.template:
    src: lab07-logs-dashboard.json.j2
    dest: "{{ monitoring_project_dir }}/grafana/dashboards/lab07-logs-dashboard.json"
    mode: "0644"

- name: Render monitoring environment file
  ansible.builtin.copy:
    dest: "{{ monitoring_project_dir }}/.env"
    mode: "0600"
    content: |
      GRAFANA_ADMIN_USER={{ monitoring_grafana_admin_user }}
      GRAFANA_ADMIN_PASSWORD={{ monitoring_grafana_admin_password }}
