---
- name: Pull monitoring Docker images
  ansible.builtin.command:
    cmd: "docker pull {{ item }}"
  loop:
    - "grafana/loki:{{ monitoring_loki_version }}"
    - "grafana/promtail:{{ monitoring_promtail_version }}"
    - "grafana/grafana:{{ monitoring_grafana_version }}"
    - "prom/prometheus:v{{ monitoring_prometheus_version }}"
    - "{{ monitoring_app_image }}:{{ monitoring_app_tag }}"
  register: monitoring_pull_result
  changed_when: "'Downloaded newer image' in item"

- name: Deploy monitoring stack with docker compose
  ansible.builtin.command:
    cmd: docker compose -f {{ monitoring_compose_dir }}/docker-compose.yml up -d
  register: monitoring_compose_result
  changed_when: monitoring_compose_result.rc == 0

- name: Wait for Loki to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_loki_port }}/ready"
    method: GET
    status_code: 200
  register: loki_health
  retries: 12
  delay: 5
  until: loki_health.status == 200

- name: Wait for Prometheus to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_prometheus_port }}/-/healthy"
    method: GET
    status_code: 200
  register: prometheus_health
  retries: 12
  delay: 5
  until: prometheus_health.status == 200

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_grafana_port }}/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  retries: 12
  delay: 5
  until: grafana_health.status == 200

- name: Display deployment status
  ansible.builtin.debug:
    msg: "Monitoring stack deployed — Loki, Prometheus, Grafana, and app are running"
