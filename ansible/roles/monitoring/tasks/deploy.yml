---
# Deployment tasks for monitoring stack

- name: Deploy monitoring stack with Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ monitoring_dir }}"
  register: monitoring_deploy
  changed_when: "'Creating' in monitoring_deploy.stdout or 'Starting' in monitoring_deploy.stdout or 'Recreating' in monitoring_deploy.stdout"

- name: Wait for Loki to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ loki_port }}/ready"
    status_code: 200
  register: loki_ready
  until: loki_ready.status == 200
  retries: 30
  delay: 2

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    status_code: 200
  register: grafana_ready
  until: grafana_ready.status == 200
  retries: 30
  delay: 2

- name: Display deployment status
  ansible.builtin.debug:
    msg: |
      Monitoring stack deployed successfully!
      - Loki: http://localhost:{{ loki_port }}
      - Grafana: http://localhost:{{ grafana_port }}
      - Grafana credentials: admin / {{ grafana_admin_password }}