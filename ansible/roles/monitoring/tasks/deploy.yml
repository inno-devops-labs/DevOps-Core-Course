---
- name: Pull Docker images for monitoring stack
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
    force_source: false
  loop:
    - "grafana/loki:{{ loki_version }}"
    - "grafana/promtail:{{ promtail_version }}"
    - "grafana/grafana:{{ grafana_version }}"
  become: true
  tags:
    - monitoring_deploy

- name: Deploy monitoring stack with Docker Compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present
    pull: missing
    remove_orphans: true
  become: true
  register: compose_result
  tags:
    - monitoring_deploy

- name: Show Docker Compose deployment result
  ansible.builtin.debug:
    var: compose_result
  tags:
    - monitoring_deploy

- name: Wait for Loki to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ loki_port }}/ready"
    status_code: 200
  register: loki_ready
  until: loki_ready.status == 200
  retries: 15
  delay: 10
  tags:
    - monitoring_deploy

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    status_code: 200
  register: grafana_ready
  until: grafana_ready.status == 200
  retries: 15
  delay: 10
  tags:
    - monitoring_deploy

- name: Configure Loki data source in Grafana
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/datasources"
    method: POST
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "Loki"
      type: "loki"
      url: "http://loki:{{ loki_port }}"
      access: "proxy"
      isDefault: true
      jsonData:
        maxLines: 1000
    status_code: [200, 409]  # 409 = already exists, that is fine
  register: datasource_result
  tags:
    - monitoring_deploy

- name: Show data source provisioning result
  ansible.builtin.debug:
    msg: >-
      Loki data source status:
      {{ 'already existed' if datasource_result.status == 409 else 'created successfully' }}
  tags:
    - monitoring_deploy
