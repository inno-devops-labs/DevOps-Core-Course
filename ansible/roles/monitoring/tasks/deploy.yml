---
- name: Deploy monitoring stack with Docker Compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_base_dir }}"
    project_name: "{{ monitoring_compose_project_name }}"
    state: present
    build: never
  register: monitoring_compose

- name: Wait for Loki to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_loki_port }}/ready"
    method: GET
    status_code: [200, -1]
    validate_certs: false
    return_content: false
  register: loki_ready
  retries: 30
  delay: 2
  failed_when: false
  until: loki_ready.status == 200

- name: Wait for Grafana to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_grafana_port }}/api/health"
    method: GET
    status_code: [200, -1]
    validate_certs: false
  register: grafana_ready
  retries: 30
  delay: 2
  failed_when: false
  until: grafana_ready.status == 200

