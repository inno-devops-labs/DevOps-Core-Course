---
- name: Deploy monitoring stack
  tags:
    - monitoring
    - compose
  block:
    - name: Validate Docker Hub credentials are provided
      ansible.builtin.assert:
        that:
          - dockerhub_username is defined
          - dockerhub_password is defined
          - dockerhub_username | length > 0
          - dockerhub_password | length > 0
        fail_msg: dockerhub_username and dockerhub_password must be provided when Docker Hub login is enabled.
      when: dockerhub_login_enabled | bool

    - name: Login to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        reauthorize: true
      no_log: true
      when: dockerhub_login_enabled | bool

    - name: Ensure monitoring directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/loki"
        - "{{ monitoring_dir }}/promtail"
        - "{{ monitoring_dir }}/prometheus"
        - "{{ monitoring_dir }}/grafana"
        - "{{ monitoring_dir }}/grafana/dashboards"
        - "{{ monitoring_dir }}/grafana/provisioning"
        - "{{ monitoring_dir }}/grafana/provisioning/dashboards"
        - "{{ monitoring_dir }}/grafana/provisioning/datasources"

    - name: Render monitoring compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ monitoring_compose_file_path }}"
        mode: "0644"

    - name: Render Prometheus configuration
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        mode: "0644"

    - name: Render Grafana datasources configuration
      ansible.builtin.template:
        src: grafana-datasources.yml.j2
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/datasources.yml"
        mode: "0644"

    - name: Copy Loki configuration
      ansible.builtin.copy:
        src: loki-config.yml
        dest: "{{ monitoring_dir }}/loki/config.yml"
        mode: "0644"

    - name: Copy Promtail configuration
      ansible.builtin.copy:
        src: promtail-config.yml
        dest: "{{ monitoring_dir }}/promtail/config.yml"
        mode: "0644"

    - name: Copy Grafana dashboard provider
      ansible.builtin.copy:
        src: dashboard-provider.yml
        dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/dashboard.yml"
        mode: "0644"

    - name: Copy Grafana dashboards
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ monitoring_dir }}/grafana/dashboards/{{ item.dest }}"
        mode: "0644"
      loop:
        - src: logging-overview.json
          dest: logging-overview.json
        - src: metrics-overview.json
          dest: metrics-overview.json

    - name: Deploy monitoring compose project
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: present
        pull: always
        recreate: auto
        remove_orphans: true

    - name: Wait for Grafana port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ grafana_host_port }}"
        delay: "{{ monitoring_wait_delay }}"
        timeout: "{{ monitoring_wait_timeout }}"

    - name: Wait for Prometheus port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ prometheus_port }}"
        delay: "{{ monitoring_wait_delay }}"
        timeout: "{{ monitoring_wait_timeout }}"

    - name: Verify Python metrics endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitoring_python_port }}/metrics"
        method: GET
        status_code: 200
        return_content: true
      register: monitoring_python_metrics_result
      retries: 10
      delay: 3
      until:
        - monitoring_python_metrics_result.status == 200
        - "'http_requests_total' in monitoring_python_metrics_result.content"

    - name: Verify Prometheus health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/-/healthy"
        method: GET
        status_code: 200
      register: monitoring_prometheus_health_result
      retries: 10
      delay: 3
      until: monitoring_prometheus_health_result.status == 200

    - name: Verify Prometheus query endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/query?query=up"
        method: GET
        status_code: 200
        return_content: true
      register: monitoring_prometheus_query_result
      retries: 10
      delay: 3
      until:
        - monitoring_prometheus_query_result.status == 200
        - monitoring_prometheus_query_result.json.status == "success"

    - name: Verify Grafana health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_host_port }}/api/health"
        method: GET
        status_code: 200
      register: monitoring_grafana_health_result
      retries: 10
      delay: 3
      until: monitoring_grafana_health_result.status == 200
  rescue:
    - name: Report monitoring deployment failure
      ansible.builtin.debug:
        msg: Docker Compose deployment failed for the monitoring stack.
