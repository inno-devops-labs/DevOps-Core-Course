---
- name: Setup monitoring directories
  tags:
    - monitoring_setup
  block:
    - name: Create monitoring directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ monitoring_compose_dir }}"
        - "{{ monitoring_compose_dir }}/loki"
        - "{{ monitoring_compose_dir }}/promtail"
        - "{{ monitoring_compose_dir }}/prometheus"
        - "{{ monitoring_compose_dir }}/grafana/provisioning/datasources"
        - "{{ monitoring_compose_dir }}/grafana/provisioning/dashboards"
        - "{{ monitoring_compose_dir }}/grafana/dashboards"

    - name: Template Loki configuration
      ansible.builtin.template:
        src: loki-config.yml.j2
        dest: "{{ monitoring_compose_dir }}/loki/config.yml"
        mode: "0644"

    - name: Template Promtail configuration
      ansible.builtin.template:
        src: promtail-config.yml.j2
        dest: "{{ monitoring_compose_dir }}/promtail/config.yml"
        mode: "0644"

    - name: Template Prometheus configuration
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ monitoring_compose_dir }}/prometheus/prometheus.yml"
        mode: "0644"

    - name: Template Grafana datasources provisioning
      ansible.builtin.template:
        src: datasources.yml.j2
        dest: "{{ monitoring_compose_dir }}/grafana/provisioning/datasources/datasources.yml"
        mode: "0644"

    - name: Template Grafana dashboards provisioning
      ansible.builtin.template:
        src: dashboards-provisioning.yml.j2
        dest: "{{ monitoring_compose_dir }}/grafana/provisioning/dashboards/dashboards.yml"
        mode: "0644"

    - name: Copy Grafana dashboard JSON files
      ansible.builtin.copy:
        src: dashboards/
        dest: "{{ monitoring_compose_dir }}/grafana/dashboards/"
        mode: "0644"

    - name: Template Docker Compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ monitoring_compose_dir }}/docker-compose.yml"
        mode: "0644"

- name: Deploy monitoring stack
  tags:
    - monitoring_deploy
  block:
    - name: Pull monitoring images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ monitoring_compose_dir }}"
      register: monitoring_pull_result
      changed_when: "'Pull complete' in monitoring_pull_result.stdout"

    - name: Deploy monitoring with docker compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ monitoring_compose_dir }}"
      register: monitoring_deploy_result
      changed_when: monitoring_deploy_result.rc == 0

    - name: Wait for Loki to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_loki_port }}/ready"
        method: GET
        status_code: 200
      register: monitoring_loki_ready
      retries: 10
      delay: 5
      until: monitoring_loki_ready.status == 200

    - name: Wait for Prometheus to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_prometheus_port }}/-/healthy"
        method: GET
        status_code: 200
      register: monitoring_prometheus_ready
      retries: 10
      delay: 5
      until: monitoring_prometheus_ready.status == 200

    - name: Wait for Grafana to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_grafana_port }}/api/health"
        method: GET
        status_code: 200
      register: monitoring_grafana_ready
      retries: 10
      delay: 5
      until: monitoring_grafana_ready.status == 200

- name: Validate monitoring stack
  tags:
    - monitoring_validate
  block:
    - name: Verify Prometheus targets
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_prometheus_port }}/api/v1/targets"
        method: GET
        status_code: 200
      register: monitoring_targets

    - name: Print monitoring status
      ansible.builtin.debug:
        msg: >-
          Monitoring stack deployed successfully.
          Prometheus: http://localhost:{{ monitoring_prometheus_port }},
          Grafana: http://localhost:{{ monitoring_grafana_port }},
          Loki: http://localhost:{{ monitoring_loki_port }}
