---
# Registry/auth settings (Vault values may override these defaults).
docker_registry_url: https://index.docker.io/v1/
dockerhub_username: ""
dockerhub_password: ""

# Application image settings.
app_name: devops-app
docker_image: "cilc/devops_lab02"
docker_tag: "{{ docker_image_tag | default('cilc') }}"

# Runtime settings.
app_port: 8000
app_internal_port: "{{ app_container_port | default(8080) }}"
app_restart_policy: unless-stopped
app_environment: {}

# Compose settings.
compose_project_dir: "/opt/{{ app_name }}"
docker_compose_version: "3.8"
web_app_compose_file: docker-compose.yml
web_app_compose_pull_policy: missing

# Wipe logic control.
# Wipe only:
# ansible-playbook playbooks/deploy.yml -e "web_app_wipe=true" --tags web_app_wipe
# Clean reinstall:
# ansible-playbook playbooks/deploy.yml -e "web_app_wipe=true"
web_app_wipe: false

# Health check settings.
app_healthcheck_path: /health
app_healthcheck_retries: 10
app_healthcheck_delay: 3
