---
# Application configuration
app_name: devops-core-app-python
docker_image: "s1mphonia/devops-core-app-python"
docker_image_tag: "latest"

app_port: 5000
app_container_name: "{{ app_name }}"
app_restart_policy: unless-stopped

# Optional environment variables passed into container
app_env: {}

# Docker Compose
app_internal_port: 8000
compose_project_dir: "/opt/{{ app_name }}"

# Wipe Logic Control
web_app_wipe: false
