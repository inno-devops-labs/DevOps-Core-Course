---
app_name: devops-info-service
app_container_name: devops-info-python
app_image: "akakii98/devops-info-python:latest"

app_host: "0.0.0.0"
app_port: 5000
app_published_port: 5000

app_restart_policy: unless-stopped
app_env_file_path: /opt/devops-info/.env
app_workdir: /opt/devops-info

# Health check
app_healthcheck_url: "http://127.0.0.1:{{ app_published_port }}/health"
app_healthcheck_retries: 15
app_healthcheck_delay: 2

web_app_wipe: false
