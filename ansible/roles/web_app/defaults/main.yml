---
web_app_name: myapp

# Image settings
web_app_docker_image: "{{ (dockerhub_username | default('nonamecorn')) ~ '/' ~ web_app_name }}"
web_app_docker_tag: latest

# Runtime ports
web_app_port: 5000
web_app_internal_port: 5000

# Docker Compose settings
web_app_compose_project_dir: "/opt/{{ web_app_name }}"
web_app_restart_policy: unless-stopped
web_app_env:
  PORT: "{{ web_app_internal_port }}"
web_app_healthcheck_url: "http://127.0.0.1:{{ web_app_port }}/health"

# Security/logging behavior
web_app_deploy_no_log: true

# Wipe logic (double-gated with var + tag)
web_app_wipe: false
web_app_wipe_remove_images: false
