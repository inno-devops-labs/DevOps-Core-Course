---
app_name: myapp

# Image settings
docker_image: "{{ dockerhub_username | default('nonamecorn') }}/{{ app_name }}"
docker_tag: "{{ docker_image_tag | default('latest') }}"

# Runtime ports
app_port: 5000
app_internal_port: 5000

# Docker Compose settings
compose_project_dir: "/opt/{{ app_name }}"
docker_compose_version: "3.8"
app_restart_policy: unless-stopped
app_env:
  PORT: "{{ app_internal_port }}"
app_healthcheck_url: "http://127.0.0.1:{{ app_port }}/health"

# Security/logging behavior
app_deploy_no_log: true

# Wipe logic (double-gated with var + tag)
web_app_wipe: false
web_app_wipe_remove_images: false
