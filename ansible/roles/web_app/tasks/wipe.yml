---
- name: Remove deployed web application
  tags:
    - web_app_wipe
  when: web_app_wipe | bool
  become: true
  block:
    - name: Check if compose project directory exists
      ansible.builtin.stat:
        path: "{{ web_app_compose_project_dir }}"
      register: web_app_compose_dir

    - name: Stop and remove Compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ web_app_compose_project_dir }}"
        state: absent
      when: web_app_compose_dir.stat.isdir | default(false)
      failed_when: false

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        state: absent
      when: web_app_compose_dir.stat.exists | default(false)

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: absent
      when: web_app_compose_dir.stat.exists | default(false)

    - name: Confirm application wipe
      ansible.builtin.debug:
        msg: "Application {{ web_app_name }} removed from {{ web_app_compose_project_dir }}"
