---
- name: Check whether docker-compose.yml exists
  ansible.builtin.stat:
    path: "{{ compose_project_dir }}/docker-compose.yml"
  register: web_app_compose_file
  tags:
    - web_app_wipe

- name: Wipe web application deployment
  block:
    - name: Stop and remove compose services
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      when: web_app_compose_file.stat.exists
      become: true

    - name: Optionally remove application image
      community.docker.docker_image:
        name: "{{ docker_image }}:{{ docker_tag }}"
        state: absent
        force_absent: true
      when: web_app_remove_image | bool
      become: true

    - name: Remove legacy container with the same name
      community.docker.docker_container:
        name: "{{ app_name }}"
        state: absent
        force_kill: true
      become: true

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      become: true

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent
      become: true

    - name: Confirm wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"
  when: web_app_wipe | bool
  tags:
    - web_app_wipe
