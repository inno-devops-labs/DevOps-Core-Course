---
- name: Wipe web application (Compose + leftovers)
  when: web_app_wipe | bool
  tags: [web_app_wipe]
  block:

    # 0) remove standalone container (if created not by compose)
    - name: Remove old container by name if exists
      community.docker.docker_container:
        name: "{{ web_app_container_name }}"
        state: absent
        force_kill: true
      failed_when: false

    # 1) find containers exposing the same host port (just in case)
    - name: Gather running containers info
      community.docker.docker_host_info:
        containers: true
      register: web_app_docker_info
      changed_when: false
      failed_when: false

    - name: Compute containers publishing the app port
      ansible.builtin.set_fact:
        web_app_port_containers: >-
          {{
            (web_app_docker_info.containers | default([]))
            | selectattr('Ports', 'defined')
            | selectattr('Ports', 'ne', none)
            | selectattr('Ports', 'length', '>', 0)
            | selectattr(
                'Ports',
                'select',
                'match',
                ('^' ~ (web_app_app_port | string) ~ '/')
              )
            | map(attribute='Id')
            | list
          }}
      changed_when: false

    - name: Remove containers publishing the app port
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        force_kill: true
      loop: "{{ web_app_port_containers }}"
      when: web_app_port_containers | length > 0
      failed_when: false

    # 2) remove compose stack if it exists
    - name: Stop and remove compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ web_app_compose_project_dir }}"
        state: absent
        remove_orphans: true
      failed_when: false

    # 3) remove leftover default network (optional)
    - name: Remove compose default network if exists
      community.docker.docker_network:
        name: "{{ app_name }}_default"
        state: absent
      failed_when: false

    - name: Remove docker-compose.yml
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"
