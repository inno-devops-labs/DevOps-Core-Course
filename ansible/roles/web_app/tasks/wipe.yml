---
# Wipe tasks for web_app deployment cleanup
# Only runs when web_app_wipe=true AND web_app_wipe tag is specified

- name: Wipe web application
  when: web_app_wipe | bool
  tags:
    - web_app_wipe
  block:
    - name: Stop and remove Docker Compose containers
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"
