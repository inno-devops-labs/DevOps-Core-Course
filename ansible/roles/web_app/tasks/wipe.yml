---
# Wipe web application
- name: Wipe web application
  when: web_app_wipe | bool
  tags:
    - web_app_wipe
  block:
    - name: Stop and remove containers via docker compose
      ansible.builtin.command: docker compose down --remove-orphans
      args:
        chdir: "{{ web_app_compose_project_dir }}"
      register: web_app_down_result
      changed_when: web_app_down_result.rc == 0
      failed_when: false

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: absent

    - name: Remove Docker image
      ansible.builtin.command: "docker rmi {{ docker_image }}:{{ docker_image_tag }}"
      register: web_app_rmi_result
      changed_when: web_app_rmi_result.rc == 0
      failed_when: false

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ web_app_name }} wiped successfully"
