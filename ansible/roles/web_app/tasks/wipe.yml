---
- name: Wipe web application
  # Safety mechanism: requires explicit variable web_app_wipe=true.
  when: web_app_wipe | bool
  tags:
    - web_app_wipe
  block:
    - name: Check if docker-compose.yml exists
      ansible.builtin.stat:
        path: "{{ compose_project_dir }}/docker-compose.yml"
      register: web_app_compose_file

    - name: Stop and remove containers (compose down)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      when: web_app_compose_file.stat.exists

    - name: Remove docker-compose.yml
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"
