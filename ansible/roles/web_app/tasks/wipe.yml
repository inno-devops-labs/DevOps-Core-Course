---
# Wipe logic: stops and removes the deployed application
# Controlled by variable (web_app_wipe) AND tag (web_app_wipe) — double safety gate
# This task file is included from main.yml but only runs when BOTH conditions are true:
#   1. Tag --tags web_app_wipe is explicitly passed
#   2. Variable web_app_wipe is set to true

- name: Wipe web application
  block:
    - name: Stop and remove containers via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: true

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      ignore_errors: true

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: true

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully from {{ compose_project_dir }}"

  when: web_app_wipe | bool
  become: true
  tags:
    - web_app_wipe
