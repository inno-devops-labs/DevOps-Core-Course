---
- name: Wipe web application (double-gated)
  block:
    - name: Check if compose project dir exists
      ansible.builtin.stat:
        path: "{{ compose_project_dir }}"
      register: compose_dir

    - name: Remove legacy container from Lab 5 (if exists)
      community.docker.docker_container:
        name: "{{ app_name }}"
        state: absent
      ignore_errors: true

    - name: Compose down (ignore if not present)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      when: compose_dir.stat.exists and compose_dir.stat.isdir
      ignore_errors: true

    - name: Remove compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.copy:
        dest: /tmp/web_app_wipe_done.txt
        content: "Wipe done at {{ ansible_facts['date_time']['iso8601'] }}\n"
      changed_when: false

  when: web_app_wipe | default(false) | bool
  tags: [web_app_wipe]
