---
# Wipe logic: remove app containers, compose file, and app directory.
# Runs only when web_app_wipe is true AND tag web_app_wipe is used (double safety).
- name: Wipe web application
  block:
    - name: Check if compose project directory exists
      ansible.builtin.stat:
        path: "{{ compose_project_dir }}"
      register: compose_dir_stat

    - name: Stop and remove containers
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      when: compose_dir_stat.stat is defined and compose_dir_stat.stat.isdir
      ignore_errors: true
      register: wipe_compose

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      ignore_errors: true

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: true

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"

  when: web_app_wipe | default(false) | bool
  tags:
    - web_app_wipe
