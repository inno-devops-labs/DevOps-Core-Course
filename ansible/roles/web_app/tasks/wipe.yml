---
- name: Wipe web application (double-gated by var + tag)
  block:

    - name: Check if compose project dir exists
      stat:
        path: "{{ compose_project_dir }}"
      register: compose_dir

    - name: Stop and remove containers
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      when: compose_dir.stat.exists and compose_dir.stat.isdir
      ignore_errors: true

    - name: Remove docker-compose file (if any)
      file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      ignore_errors: true

    - name: Remove application directory (or file if mistakenly created)
      file:
        path: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: true

    - name: Log wipe completion
      debug:
        msg: "Application {{ app_name }} wiped successfully"

  when: web_app_wipe | bool
  tags:
    - web_app_wipe
