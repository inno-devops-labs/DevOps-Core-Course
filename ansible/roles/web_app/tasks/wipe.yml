---
# Wipe tasks - only run when web_app_wipe=true AND --tags web_app_wipe
# Double-gating: variable check (when) + tag requirement
# This prevents accidental wipe during normal deployments

- name: Wipe web application
  when: web_app_wipe | bool
  tags:
    - web_app_wipe
  block:
    - name: Stop and remove containers with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
        remove_orphans: true
      failed_when: false
      # failed_when: false because the directory may not exist yet (already wiped)

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} has been wiped from {{ inventory_hostname }}"
