---
- name: Wipe web application
  block:
    - name: Stop and remove containers with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
        remove_orphans: yes
        remove_volumes: yes
      ignore_errors: yes
      register: compose_down

    - name: Remove docker-compose.yml file
      file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      ignore_errors: yes

    - name: Remove application directory
      file:
        path: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: yes

    - name: Optionally remove Docker images
      docker_image:
        name: "{{ docker_image }}"
        tag: "{{ docker_tag }}"
        state: absent
      when: web_app_remove_images | default(false) | bool
      ignore_errors: yes

    - name: Log wipe completion
      debug:
        msg:
          - "Application {{ app_name }} wiped successfully"

  when: web_app_wipe | default(false) | bool
  tags:
    - web_app_wipe
