---
- name: Check compose project dir exists
  ansible.builtin.stat:
    path: "{{ compose_project_dir }}"
  register: projdir
  tags:
    - web_app_wipe

- name: Wipe web application
  block:
    - name: Stop and remove containers (docker compose down)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      when: projdir.stat.exists and projdir.stat.isdir
      ignore_errors: true

    - name: Remove docker-compose.yml
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.copy:
        dest: /tmp/web_app_wipe_done.log
        content: "Wiped {{ app_name }} on {{ inventory_hostname }} at {{ ansible_facts['date_time']['iso8601'] }}\n"
        mode: "0644"

  when: web_app_wipe | bool
  tags:
    - web_app_wipe