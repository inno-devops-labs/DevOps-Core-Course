---
# Wipe tasks: remove application (containers, compose file, directory).
# Controlled by: web_app_wipe variable AND web_app_wipe tag.
# Default: does NOT run (web_app_wipe: false).

- name: Wipe web application
  when: web_app_wipe | default(false) | bool
  tags:
    - web_app_wipe
  block:
    - name: Stop and remove containers (Docker Compose down)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
        remove_volumes: true
      failed_when: false

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      failed_when: false

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"
