---
- name: Wipe web application
  block:
    - name: Stop and remove containers
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
        remove_volumes: yes
      ignore_errors: yes
      register: compose_down

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      ignore_errors: yes

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: yes

    - name: Remove Docker images (optional)
      community.docker.docker_image:
        name: "{{ docker_image }}:{{ docker_tag }}"
        state: absent
      ignore_errors: yes
      when: web_app_wipe_images | default(false) | bool

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"

    - name: Create wipe log
      ansible.builtin.copy:
        content: "Application {{ app_name }} wiped at {{ ansible_date_time.iso8601 }}"
        dest: "/tmp/{{ app_name }}_wipe_{{ ansible_date_time.epoch }}.log"
        mode: '0644'

  when: web_app_wipe | default(false) | bool
  tags:
    - web_app_wipe