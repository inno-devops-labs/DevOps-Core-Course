---
- name: Wipe web application (Compose + leftovers)
  block:

    - name: Remove old container by name if exists
      community.docker.docker_container:
        name: "{{ app_container_name }}"
        state: absent
        force_kill: true
      ignore_errors: true

    - name: Find containers publishing app_port
      ansible.builtin.shell: |
        docker ps -q --filter "publish={{ app_port }}"
      register: port_containers
      changed_when: false
      failed_when: false

    - name: Remove containers publishing app_port (wipe)
      community.docker.docker_container:
        container_default_behavior: compatibility
        name: "{{ item }}"
        state: absent
        force_kill: true
      loop: "{{ port_containers.stdout_lines }}"
      when: port_containers.stdout_lines | length > 0
      ignore_errors: true

    # 1) remove conflicting standalone container (created earlier not by compose)
    - name: Remove old container by name if exists
      community.docker.docker_container:
        name: "{{ app_container_name }}"
        state: absent
        force_kill: true
      ignore_errors: true

    # 2) remove compose stack if it exists
    - name: Stop and remove compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
        remove_orphans: true
      ignore_errors: true

    # 3) remove leftover network with the default compose name (optional but helps)
    - name: Remove compose default network if exists
      community.docker.docker_network:
        name: "{{ app_name }}_default"
        state: absent
      ignore_errors: true

    - name: Remove docker-compose.yml
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"

  when: web_app_wipe | bool
  tags:
    - web_app_wipe
