---
- name: Wipe web application
  when: web_app_wipe | bool
  become: true
  tags:
    - web_app_wipe
  block:
    - name: Stop and remove containers via docker compose
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: "{{ compose_project_dir }}"
      register: web_app_wipe_down
      changed_when: "'Removed' in web_app_wipe_down.stderr or 'Stopped' in web_app_wipe_down.stderr"
      failed_when: false

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Remove Docker image
      ansible.builtin.command:
        cmd: "docker rmi {{ docker_image }}:{{ docker_tag }}"
      register: web_app_wipe_rmi
      changed_when: web_app_wipe_rmi.rc == 0
      failed_when: false

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully from {{ compose_project_dir }}"
