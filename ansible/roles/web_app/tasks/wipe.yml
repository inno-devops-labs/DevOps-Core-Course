---
# Wipe logic: controlled by web_app_wipe variable + web_app_wipe tag
# Only runs when both -e "web_app_wipe=true" AND --tags web_app_wipe (or full deploy with wipe)
- name: Wipe web application
  block:
    - name: Stop and remove containers
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: true

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      ignore_errors: true

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"

  when: web_app_wipe | default(false) | bool
  tags:
    - web_app_wipe
