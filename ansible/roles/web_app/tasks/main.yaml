---
# Wipe logic runs first (when explicitly requested)
- name: Include wipe tasks
  include_tasks: wipe.yml
  when: web_app_wipe | default(false) | bool
  tags:
    - web_app_wipe

# Deployment tasks
- name: Deploy application with Docker Compose
  block:
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: '0644'
      register: compose_file

    - name: Deploy with docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
        recreate: auto
      register: deploy_result

    - name: Show deployment status
      ansible.builtin.debug:
        msg:
          - "Application {{ app_name }} deployed successfully"
          - "Access at: http://{{ ansible_default_ipv4.address }}:{{ app_port }}"

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: "Deployment failed for {{ app_name }}. Check logs for details."

    - name: Log deployment failure
      ansible.builtin.copy:
        content: "Deployment failed at {{ ansible_date_time.iso8601 }}"
        dest: "/tmp/{{ app_name }}_deploy_failed.log"
        mode: '0644'

  become: true
  tags:
    - app_deploy
    - compose
    - web_app