---
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  become: true
  tags:
    - app_deploy
    - compose
  block:
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"
      register: web_app_compose_template

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      no_log: true
      failed_when: false

    - name: Pull latest image
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ compose_project_dir }}"
      register: web_app_pull_result
      changed_when: "'Pull complete' in web_app_pull_result.stdout or 'Downloaded' in web_app_pull_result.stderr"

    - name: Deploy with docker compose
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ compose_project_dir }}"
      register: web_app_compose_result
      changed_when: >
        'Started' in web_app_compose_result.stderr
        or 'Created' in web_app_compose_result.stderr
        or web_app_compose_template.changed

    - name: Wait for application to be ready
      ansible.builtin.wait_for:
        port: "{{ app_port }}"
        host: 127.0.0.1
        delay: 5
        timeout: 30

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        return_content: true
        status_code: 200
      register: web_app_health_check
      retries: 3
      delay: 5

    - name: Display health check result
      ansible.builtin.debug:
        var: web_app_health_check.json

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: "Deployment of {{ app_name }} failed. Check logs for details."

    - name: Show docker compose logs
      ansible.builtin.command:
        cmd: docker compose logs --tail=50
        chdir: "{{ compose_project_dir }}"
      register: web_app_compose_logs
      changed_when: false
      failed_when: false

    - name: Display compose logs
      ansible.builtin.debug:
        var: web_app_compose_logs.stdout_lines
      when: web_app_compose_logs is defined
