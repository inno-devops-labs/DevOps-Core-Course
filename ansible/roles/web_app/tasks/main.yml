---
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags: [web_app_wipe]

- name: Deploy web application with Docker Compose
  become: true
  tags: [ app_deploy, compose ]
  block:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Render docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy via Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        pull: "always"
        state: present
        recreate: auto

  rescue:
    - name: Log deployment failure
      ansible.builtin.copy:
        dest: "/tmp/ansible-web-app-deploy.failed"
        content: "web_app deploy failed on {{ inventory_hostname }}\n"
        mode: "0644"
      changed_when: false

    - name: Fail the play explicitly
      ansible.builtin.fail:
        msg: "web_app deployment failed, see /tmp/ansible-web-app-deploy.failed"
