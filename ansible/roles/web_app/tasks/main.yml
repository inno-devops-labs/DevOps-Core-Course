---
# Wipe logic runs first (when explicitly requested)
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

# Deploy application with Docker Compose
- name: Deploy application with Docker Compose
  tags:
    - app_deploy
    - compose
  block:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      no_log: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ web_app_compose_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ web_app_compose_dir }}/docker-compose.yml"
        mode: "0644"
      register: web_app_compose_template

    - name: Pull latest Docker image
      ansible.builtin.command:
        cmd: "docker compose pull"
        chdir: "{{ web_app_compose_dir }}"
      register: web_app_pull_result
      changed_when: "'Pull complete' in web_app_pull_result.stdout"

    - name: Deploy with docker compose
      ansible.builtin.command:
        cmd: "docker compose up -d --force-recreate"
        chdir: "{{ web_app_compose_dir }}"
      register: web_app_deploy_result
      changed_when: web_app_deploy_result.rc == 0

    - name: Wait for application to be ready
      ansible.builtin.wait_for:
        port: "{{ web_app_port }}"
        delay: 5
        timeout: 30

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ web_app_port }}/health"
        method: GET
        return_content: true
        status_code: 200
      register: web_app_health_check
      retries: 5
      delay: 5
      until: web_app_health_check.status == 200

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: >-
          Deployment of {{ web_app_name }} failed.
          Check Docker logs with: docker compose -f {{ web_app_compose_dir }}/docker-compose.yml logs
