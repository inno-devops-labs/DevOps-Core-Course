---
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  tags:
    - app_deploy
    - compose
  block:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
        recreate: auto
      register: web_app_compose_result

    - name: Wait for application to be ready
      ansible.builtin.wait_for:
        port: "{{ web_app_port }}"
        host: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
        delay: 5
        timeout: 30
        state: started
      become: false

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_default_ipv4.address | default('127.0.0.1') }}:{{ web_app_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      register: web_app_health_check
      until: web_app_health_check.status == 200
      retries: 5
      delay: 3
      ignore_errors: true
      become: false

  rescue:
    - name: Log deployment failure
      ansible.builtin.debug:
        msg: "Deployment failed, check logs in /opt/{{ app_name }}/docker-compose.log"

  always:
    - name: Display health check result
      ansible.builtin.debug:
        msg: "Health check {{ 'succeeded' if web_app_health_check.status == 200 else 'failed' }} with status {{ web_app_health_check.status }}"
      when: web_app_health_check is defined
