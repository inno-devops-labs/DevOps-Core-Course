---
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  block:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: '0755'

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        registry_url: https://index.docker.io/v1/
      no_log: true

    - name: Pull latest Docker image
      community.docker.docker_image:
        name: "{{ docker_image }}:{{ docker_image_tag }}"
        source: pull
        force_source: yes

    - name: Stop existing docker-compose services
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: yes

    - name: Deploy with docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
        remove_orphans: true
      register: compose_output

    - name: Wait for application to start
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ app_port }}"
        delay: 5
        timeout: 60
        state: started

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 10
      delay: 5
      until: health_check.status == 200

    - name: Display deployment status
      ansible.builtin.debug:
        msg: "Application {{ app_name }} deployed successfully on port {{ app_port }}"

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: "Deployment failed. Check logs with: docker-compose -f {{ compose_project_dir }}/docker-compose.yml logs"

    - name: Display compose output on failure
      ansible.builtin.debug:
        var: compose_output

  become: true
  tags:
    - app_deploy
    - compose
