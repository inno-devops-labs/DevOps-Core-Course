---
# web_app role: deploys a containerised web application using Docker Compose
# Depends on: docker role (declared in meta/main.yml)

# --- Wipe logic (runs first so clean-reinstall works: wipe → deploy) ---
# Only executes when BOTH conditions are true:
#   1. Tag --tags web_app_wipe is explicitly passed on the command line
#   2. Variable web_app_wipe is set to true (-e "web_app_wipe=true")
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

# --- Deployment block ---
- name: Deploy application with Docker Compose
  block:
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: "Deployment of {{ app_name }} failed. Check docker-compose.yml at {{ compose_project_dir }}"

  become: true
  tags:
    - app_deploy
    - compose

# --- Verification ---
- name: Wait for application port to be ready
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ app_port }}"
    timeout: 30
    state: started
  tags:
    - app_deploy
    - compose

- name: Verify application health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    method: GET
    status_code: 200
    timeout: 10
  register: health_result
  retries: 3
  delay: 5
  until: health_result.status == 200
  tags:
    - app_deploy
    - compose

- name: Show health check response
  ansible.builtin.debug:
    msg: "App {{ app_name }} is healthy: {{ health_result.json }}"
  tags:
    - app_deploy
    - compose
