---
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  when: web_app_wipe | default(false)
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  tags:
    - app_deploy
    - compose
  block:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Deploy with docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ web_app_compose_project_dir }}"
        state: present
        pull: always
        remove_orphans: true

  rescue:
    - name: Log failure
      ansible.builtin.debug:
        msg: "Deployment failed for {{ web_app_name }}"

  always:
    - name: Check container status
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --filter
          - "name={{ web_app_name }}"
          - --format
          - "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
      register: web_app_container_status
      changed_when: false

    - name: Show container status
      ansible.builtin.debug:
        var: web_app_container_status.stdout_lines
