---
# 1. Проверка на необходимость очистки (Wipe Logic)
- name: Check for wipe request
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

# 2. Авторизация в Docker Hub (нужна, если образ в приватном репо или для избежания Rate Limit)
- name: Log into Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  tags:
    - web_app
    - docker_login

# 3. Основной блок деплоя через Compose
- name: Deploy Web Application with Docker Compose
  tags:
    - app_deploy
    - compose
    - web_app
  block:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Render Docker Compose template
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ web_app_compose_project_dir }}"
        state: present
        pull: always
      register: web_app_compose_output

    - name: Wait for application to be ready (Healthcheck)
      ansible.builtin.wait_for:
        port: "{{ web_app_app_port }}"
        delay: 5
        timeout: 30
