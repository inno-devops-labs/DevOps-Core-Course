---
# Web app role: deploy with Docker Compose. Wipe logic runs first when requested.
# Tags: app_deploy, compose, web_app_wipe

- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  block:
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        build: never

  rescue:
    - name: Log deployment failure
      ansible.builtin.debug:
        msg: "Deployment failed for {{ app_name }}"

  tags:
    - app_deploy
    - compose

- name: Wait for application port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    delay: 2
    timeout: 30
  tags:
    - app_deploy

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    return_content: yes
    status_code: 200
  register: health_check
  failed_when: health_check.status != 200
  tags:
    - app_deploy
