---
# Wipe logic executes first, but only performs cleanup when web_app_wipe=true.
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Validate required Docker Hub credentials
  ansible.builtin.assert:
    that:
      - dockerhub_username is defined
      - dockerhub_username | length > 0
      - dockerhub_password is defined
      - dockerhub_password | length > 0
    fail_msg: >-
      dockerhub_username/dockerhub_password are not set.
      Create encrypted group_vars/all.yml with ansible-vault.
  tags:
    - app_deploy
    - compose

- name: Deploy application with Docker Compose
  block:
    - name: Ensure compose project directory exists
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"
      become: true

    - name: Render docker-compose configuration
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"
      become: true

    - name: Inspect existing container with target name
      community.docker.docker_container_info:
        name: "{{ app_name }}"
      register: web_app_existing_container
      failed_when: false
      changed_when: false
      become: true

    - name: Remove conflicting non-compose container
      community.docker.docker_container:
        name: "{{ app_name }}"
        state: absent
        force_kill: true
      when:
        - web_app_existing_container.exists | default(false)
        - >-
          (web_app_existing_container.container.Config.Labels['com.docker.compose.project'] | default(''))
          != (compose_project_dir | basename)
      become: true

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      no_log: true

    - name: Start or update application via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        pull: "{{ web_app_compose_pull_policy }}"
        recreate: "{{ web_app_compose_recreate }}"
        state: present
      register: web_app_compose_result
      become: true

    - name: Wait for application port to become available
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ app_port }}"
        delay: 2
        timeout: "{{ app_wait_timeout }}"

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}{{ app_healthcheck_path }}"
        method: GET
        status_code: 200
      register: app_health_result
      retries: 10
      delay: 3
      until: app_health_result.status == 200
  rescue:
    - name: Report deployment failure context
      ansible.builtin.debug:
        msg: >-
          Docker Compose deployment failed for {{ app_name }} in
          {{ compose_project_dir }}. Check docker compose logs on the target host.

    - name: Stop play when compose deployment failed
      ansible.builtin.fail:
        msg: "Deployment failed for {{ docker_image }}:{{ docker_tag }}. Verify image/tag exists in Docker Hub."
  tags:
    - app_deploy
    - compose
