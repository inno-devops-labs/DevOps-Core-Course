- name: Include wipe tasks when requested
  tags:
    - web_app_wipe
  ansible.builtin.include_tasks: wipe.yml
  when: web_app_wipe | bool

- name: Deploy web application with Docker Compose
  tags:
    - app_deploy
    - compose
  become: true
  block:
    - name: Login to Docker registry
      community.docker.docker_login:
        username: "{{ web_app_dockerhub_username }}"
        password: "{{ web_app_dockerhub_password }}"
      no_log: true
      when:
        - web_app_dockerhub_username is defined
        - web_app_dockerhub_username | length > 0
        - web_app_dockerhub_password is defined
        - web_app_dockerhub_password | length > 0

    - name: Ensure compose project directory exists
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose definition
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy stack with docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ web_app_compose_project_dir }}"
        project_name: "{{ web_app_name }}"
        pull: "{{ web_app_docker_compose_pull }}"
        state: present

    - name: Wait for application port
      ansible.builtin.wait_for:
        port: "{{ web_app_port }}"
        delay: 5
        timeout: 45

    - name: Perform HTTP health check
      ansible.builtin.uri:
        url: "http://localhost:{{ web_app_port }}{{ web_app_healthcheck_endpoint }}"
        status_code: 200
  rescue:
    - name: Report deployment failure
      ansible.builtin.debug:
        msg: "Deployment failed for {{ web_app_name }}; inspect compose logs."
