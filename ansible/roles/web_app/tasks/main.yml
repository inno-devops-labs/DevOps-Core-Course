---
# 1) wipe logic (double-gated: tag + variable)
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

# 2) deploy with docker compose
- name: Deploy web application with Docker Compose
  block:
    - name: Login to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        registry_url: "https://index.docker.io/v1/"
        reauthorize: true
      no_log: "{{ not (debug_docker_login | default(false)) }}"
      tags: [app_deploy]

    - name: Ensure compose project directory exists
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"
      tags: [compose, app_deploy]

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"
      tags: [compose, app_deploy]

    - name: Deploy via Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        pull: always
        state: present
        recreate: auto
      register: compose_up
      tags: [compose, app_deploy]

    - name: Give app time to start
      ansible.builtin.pause:
        seconds: 5
      when: compose_up.changed
      tags: [app_deploy]

    - name: Health check
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200
      tags: [app_deploy]

  rescue:
    - name: Show compose services on failure
      ansible.builtin.command: docker compose -f "{{ compose_project_dir }}/docker-compose.yml" ps
      register: compose_ps
      changed_when: false
      failed_when: false
      tags: [compose, app_deploy]

    - name: Debug compose output
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
      tags: [compose, app_deploy]

    - name: Fail deployment explicitly
      ansible.builtin.fail:
        msg: "Deployment failed. See docker compose ps output above."
      tags: [app_deploy]

  always:
    - name: Log deploy completion marker
      ansible.builtin.copy:
        dest: "/tmp/web_app_deploy_done"
        content: "web_app deploy completed on {{ ansible_date_time.iso8601 }}\n"
        mode: "0644"
      changed_when: false
      tags: [app_deploy]

  tags:
    - web_app