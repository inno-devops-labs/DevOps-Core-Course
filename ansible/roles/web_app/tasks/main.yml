---
# Web application deployment role - Deploy with Docker Compose

# Wipe logic runs first (when explicitly requested)
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

# Deployment tasks follow
- name: Deploy application with Docker Compose
  become: true
  tags:
    - app_deploy
    - compose
  block:
    - name: Check if application is already running
      ansible.builtin.command: docker ps --filter "name={{ web_app_name }}" --format "{{ '{{' }}.Names{{ '}}' }}"
      register: web_app_running_containers
      changed_when: false
      failed_when: false

    - name: Display current container status
      ansible.builtin.debug:
        msg: "Container {{ web_app_name }} is {{ 'running' if web_app_name in web_app_running_containers.stdout else 'not running' }}"

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: directory
        mode: '0755'

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        mode: '0644'
      register: web_app_compose_template

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        registry_url: https://index.docker.io/v1/
      no_log: true

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ web_app_compose_project_dir }}"
        state: present
        pull: always
        recreate: auto
      register: web_app_compose_result

    - name: Display deployment result
      ansible.builtin.debug:
        msg: >-
          Deployment {{ 'changed' if web_app_compose_result.changed else 'unchanged' }} -
          containers are {{ 'up to date' if not web_app_compose_result.changed else 'updated' }}

    - name: Wait for application port to be available (on target VM)
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ web_app_port }}"
        delay: 5
        timeout: 60
        state: started
      delegate_to: "{{ inventory_hostname }}"

    - name: Verify health endpoint (from target VM)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ web_app_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      register: web_app_health_check
      retries: 3
      delay: 5
      until: web_app_health_check.status == 200
      delegate_to: "{{ inventory_hostname }}"

    - name: Display health check result
      ansible.builtin.debug:
        msg: "Application is healthy: {{ web_app_health_check.json }}"

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: "Deployment failed. Check logs with: docker compose -f {{ web_app_compose_project_dir }}/docker-compose.yml logs"

    - name: Display container status
      ansible.builtin.command: docker ps -a
      register: web_app_container_status
      changed_when: false

    - name: Show container status
      ansible.builtin.debug:
        var: web_app_container_status.stdout_lines
