---
# Wipe logic runs first (when explicitly requested)
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  block:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy application stack with Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: true
      register: web_app_compose_result

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: "Deployment failed for {{ app_name }}: {{ web_app_compose_result | default('unknown error') }}"

  tags:
    - app_deploy
    - compose

