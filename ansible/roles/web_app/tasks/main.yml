---
- name: Web app | Wipe if requested
  ansible.builtin.import_tasks: wipe.yml
  when: web_app_wipe | bool
  tags:
    - web_app
    - web_app_wipe

- name: Web app | Ensure project directory exists
  ansible.builtin.file:
    path: "{{ compose_project_dir }}"
    state: directory
    mode: "0755"
  tags:
    - web_app
    - web_app_deploy

- name: Web app | Remove legacy container (from Lab05) if exists
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
    force_kill: true
  ignore_errors: true
  tags:
    - web_app
    - web_app_deploy

- name: Web app | Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ compose_file }}"
    mode: "0644"
  tags:
    - web_app
    - web_app_deploy

- name: Web app | Deploy via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ compose_project_dir }}"
    state: present
  notify: Restart web app
  tags:
    - web_app
    - web_app_deploy

- name: Web app | Wait for port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ app_port }}"
    delay: 2
    timeout: 60
  tags:
    - web_app
    - web_app_deploy

- name: Web app | Verify health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
    method: GET
    status_code: 200
    return_content: true
  tags:
    - web_app
    - web_app_deploy