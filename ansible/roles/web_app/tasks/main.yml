---
- name: Include wipe tasks
  include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  block:
    - name: Create application directory
      file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose file
      template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Remove old standalone container if exists
      command: docker rm -f {{ app_name }}
      ignore_errors: yes
      changed_when: false

    - name: Pull and start containers with docker compose
      command: docker compose -f {{ compose_project_dir }}/docker-compose.yml up -d --pull always --force-recreate
      register: compose_result
      changed_when: "'Started' in compose_result.stderr or 'Created' in compose_result.stderr"

    - name: Wait for application port
      wait_for:
        port: "{{ app_port }}"
        host: localhost
        delay: 5
        timeout: 60

    - name: Verify application health
      uri:
        url: "http://localhost:{{ app_port }}/health"
        return_content: yes
        status_code: 200
      register: health_result
      ignore_errors: yes

    - name: Display health check result
      debug:
        var: health_result.json
      when: health_result is defined and health_result.json is defined

  rescue:
    - name: Log deployment failure
      debug:
        msg: "Deployment of {{ app_name }} failed. Check logs with: docker compose -f {{ compose_project_dir }}/docker-compose.yml logs"

  become: true
  tags:
    - app_deploy
    - compose
