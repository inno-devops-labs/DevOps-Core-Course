---
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  become: true
  tags:
    - app_deploy
    - compose
  block:
    - name: Ensure Docker Hub credentials are set
      ansible.builtin.assert:
        that:
          - dockerhub_username is defined
          - dockerhub_password is defined
        fail_msg: >
          Define dockerhub_username and dockerhub_password in group_vars/all.yml.

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        registry: https://index.docker.io/v1/
      no_log: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Remove existing container with same name
      community.docker.docker_container:
        name: "{{ app_name }}"
        state: absent
      failed_when: false

    - name: Free host port if occupied by another container (e.g. devops-app when deploying devops-python)
      ansible.builtin.shell: |
        cid=$(docker ps -q --filter "publish={{ app_port }}")
        [ -n "$cid" ] && docker rm -f $cid || true
      changed_when: false
      failed_when: false

    - name: Pull Docker image
      ansible.builtin.command:
        cmd: "docker compose pull"
        chdir: "{{ compose_project_dir }}"
      changed_when: false

    - name: Deploy with docker compose
      ansible.builtin.command:
        cmd: "docker compose up -d --force-recreate"
        chdir: "{{ compose_project_dir }}"
      changed_when: true

    - name: Wait for application port
      ansible.builtin.wait_for:
        port: "{{ app_port }}"
        delay: 3
        timeout: 30

    - name: Pause for application to start listening
      ansible.builtin.pause:
        seconds: 5

    - name: Check health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        return_content: true
        timeout: 15
      register: health_result
      changed_when: false

  rescue:
    - name: Log deployment failure
      ansible.builtin.debug:
        msg: "Deployment of {{ app_name }} failed. Check logs with: docker compose -f {{ compose_project_dir }}/docker-compose.yml logs"

    - name: Fail after logging
      ansible.builtin.fail:
        msg: "Deployment failed for {{ app_name }}"
