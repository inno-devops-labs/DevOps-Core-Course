---
# web_app role — deploy application using Docker Compose
# Supports both deployment and wipe (clean removal) workflows

# Wipe logic runs first (when explicitly requested)
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

# Deployment tasks — deploy application with Docker Compose
- name: Deploy application with Docker Compose
  block:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      no_log: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"
      register: compose_template

    - name: Pull latest Docker image
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ compose_project_dir }}"
      register: docker_pull
      changed_when: "'Pull complete' in docker_pull.stdout or 'Downloaded' in docker_pull.stdout"

    - name: Deploy with Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ compose_project_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Creating' in compose_up.stderr or compose_template.changed"

    - name: Wait for application to be ready
      ansible.builtin.wait_for:
        port: "{{ app_port }}"
        host: "0.0.0.0"
        delay: 5
        timeout: 60

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/health"
        return_content: yes
        status_code: 200
      register: health_check

    - name: Display health check result
      ansible.builtin.debug:
        var: health_check.json

  rescue:
    - name: Display deployment failure
      ansible.builtin.debug:
        msg: "Deployment of {{ app_name }} failed. Check logs with: docker compose -f {{ compose_project_dir }}/docker-compose.yml logs"

    - name: Fail with error message
      ansible.builtin.fail:
        msg: "Application deployment failed for {{ app_name }}"

  become: true
  tags:
    - app_deploy
    - compose
