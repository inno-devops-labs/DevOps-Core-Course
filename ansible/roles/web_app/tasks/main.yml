---
# Wipe logic runs FIRST so clean reinstall works: wipe old → deploy new
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

# Main deployment block - grouped for error handling
- name: Deploy application with Docker Compose
  become: true
  tags:
    - app_deploy
    - compose
  block:
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose.yml to server
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
        # pull: always ensures we always get the latest image tag

    - name: Wait for application to be ready
      ansible.builtin.wait_for:
        port: "{{ app_port }}"
        host: localhost
        delay: 3
        timeout: 30

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
      register: web_app_health_check

    - name: Print health check result
      ansible.builtin.debug:
        msg: "App {{ app_name }} is healthy. Status: {{ web_app_health_check.status }}"

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: "Deployment of {{ app_name }} failed. Check docker-compose.yml at {{ compose_project_dir }}"
