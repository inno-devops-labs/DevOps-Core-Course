---
# Web application deployment tasks

# Wipe logic (runs first when explicitly requested)
- name: Include wipe tasks
  include_tasks: wipe.yml
  tags:
    - web_app_wipe

# Deployment tasks follow
- name: Deploy application with Docker Compose
  block:
    - name: Create app directory
      file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: '0755'

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        registry_url: https://index.docker.io/v1/
      no_log: true

    - name: Template docker-compose file
      template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Deploy with docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always

    - name: Wait for application
      wait_for:
        port: "{{ app_port }}"
        host: localhost
        delay: 5
        timeout: "{{ app_health_check_timeout }}"

    - name: Verify health
      uri:
        url: "http://localhost:{{ app_port }}/"
        status_code: 200
        timeout: 10
      register: health_check
      retries: 3
      delay: 5
      until: health_check.status == 200

  rescue:
    - name: Log deployment failure
      debug:
        msg: "Deployment failed for {{ app_name }}"

  become: true
  tags:
    - app_deploy
    - compose
