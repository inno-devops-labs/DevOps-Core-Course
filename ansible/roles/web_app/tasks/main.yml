---
- name: Include wipe tasks
  include_tasks: wipe.yml
  tags:
    - web_app_wipe

- name: Deploy application with Docker Compose
  block:
    - name: Create application directory
      file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: '0755'

    - name: Template docker-compose.yml
      template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
        recreate: auto
      register: compose_result

    - name: Wait for application to be ready
      wait_for:
        port: "{{ app_port }}"
        host: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
        delay: 5
        timeout: 30
        state: started
      become: no

    - name: Verify health endpoint
      uri:
        url: "http://{{ ansible_default_ipv4.address | default('127.0.0.1') }}:{{ app_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      register: health_check
      until: health_check.status == 200
      retries: 5
      delay: 3
      ignore_errors: yes
      become: no

  rescue:
    - name: Log deployment failure
      debug:
        msg: "Deployment failed, check logs in /opt/{{ app_name }}/docker-compose.log"

  always:
    - name: Display health check result
      debug:
        msg: "Health check {{ 'succeeded' if health_check.status == 200 else 'failed' }} with status {{ health_check.status }}"
      when: health_check is defined

  tags:
    - app_deploy
    - compose
