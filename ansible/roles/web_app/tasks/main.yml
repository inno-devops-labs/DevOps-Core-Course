---
# wipe
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe


# Optional compatibility layer 
- name: Web app | Normalize variables (compat)
  ansible.builtin.set_fact:
    app_name: "{{ app_name | default(app_container_name) }}"
    docker_tag: "{{ docker_tag | default(docker_image_tag | default('latest')) }}"
    app_internal_port: "{{ app_internal_port | default(app_port) }}"
    compose_project_dir: "{{ compose_project_dir | default('/opt/' ~ (app_name | default(app_container_name))) }}"
    app_health_path: "{{ app_health_path | default('/health') }}"
  tags:
    - app_deploy
    - compose

- name: Web app | Deploy with Docker Compose v2
  block:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Login to Docker Hub (optional)
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      no_log: true
      when:
        - dockerhub_username is defined
        - dockerhub_password is defined

    - name: Deploy application with Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
      register: compose_result

    - name: Wait for application port
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ app_port }}"
        timeout: "{{ app_wait_timeout | default(60) }}"

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
        method: GET
        status_code: 200
        return_content: true
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

  rescue:
    - name: Web app | Log deployment failure
      ansible.builtin.debug:
        msg:
          - "Deployment failed for {{ app_name }}"
          - "compose_project_dir={{ compose_project_dir }}"
          - "docker_image={{ docker_image }}:{{ docker_tag }}"
          - "compose_result={{ compose_result | default({}) }}"

  always:
    - name: Web app | Log completion
      ansible.builtin.copy:
        dest: /tmp/web_app_deploy_done.log
        content: "web_app deploy finished on {{ inventory_hostname }} at {{ ansible_facts['date_time']['iso8601'] }}\n"
        mode: "0644"

  tags:
    - app_deploy
    - compose