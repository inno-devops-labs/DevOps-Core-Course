---
# web_app role: deploy application using Docker Compose
#
# Role dependency chain enforced via meta/main.yml:
#   web_app → docker → (system already provisioned by common)
#
# Tags:
#   web_app_wipe  - wipe task group (requires -e "web_app_wipe=true" too)
#   app_deploy    - create directory + template + compose up
#   compose       - same as app_deploy (alias for selective runs)

# ── 0. Wipe phase (runs only when explicitly requested) ───────────────────────
# Must come FIRST so a clean-reinstall (wipe → deploy) works in one run.
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

# ── 1. Docker Hub login (optional, skipped if credentials not configured) ────
- name: Log in to Docker Hub
  community.docker.docker_login:
    registry_url: "{{ docker_registry_url | default('https://index.docker.io/v1/') }}"
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: true
  changed_when: false
  when: dockerhub_username is defined and dockerhub_password is defined
  become: true
  tags:
    - app_deploy
    - compose

# ── 2. Deploy phase ──────────────────────────────────────────────────────────
- name: Deploy {{ app_name }} with Docker Compose
  block:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        owner: "{{ docker_user }}"
        group: "{{ docker_user }}"
        mode: "0755"

    - name: Template docker-compose.yml for {{ app_name }}
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        owner: "{{ docker_user }}"
        group: "{{ docker_user }}"
        mode: "0644"

    - name: Deploy {{ app_name }} via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
      register: compose_result

    - name: Wait for {{ app_name }} port {{ app_port }} to be reachable
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        timeout: 60
        delay: 3

    - name: Verify {{ app_name }} health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        method: GET
        status_code: 200
        return_content: true
      register: app_health
      retries: 6
      delay: 5
      until: app_health.status == 200

  rescue:
    - name: Log deployment failure for {{ app_name }}
      ansible.builtin.debug:
        msg: >
          Deployment of {{ app_name }} failed.
          Check {{ compose_project_dir }}/docker-compose.yml
          and run: docker compose -f {{ compose_project_dir }}/docker-compose.yml logs

  become: true
  tags:
    - app_deploy
    - compose
