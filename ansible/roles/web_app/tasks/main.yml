---
# Web application deployment using Docker Compose
# Tags: app_deploy, compose, web_app

# Wipe logic runs first (when explicitly requested)
# This enables clean reinstallation: wipe old -> deploy new
- name: Include wipe tasks
  ansible.builtin.include_tasks: wipe.yml
  tags:
    - web_app_wipe

# Deployment tasks
- name: Deploy application with Docker Compose
  become: true
  tags:
    - app_deploy
    - compose
    - web_app
  block:
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ web_app_compose_project_dir }}"
        state: directory
        mode: "0755"

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      no_log: true

    - name: Pull Docker image
      community.docker.docker_image:
        name: "{{ docker_image }}:{{ web_app_docker_tag }}"
        source: pull

    - name: Check if old container exists (not managed by compose)
      ansible.builtin.command: docker inspect --format '{{ "{{" }}.Config.Labels.com_docker_compose_project{{ "}}" }}' {{ web_app_app_name }}
      register: web_app_old_container_check
      failed_when: false
      changed_when: false

    - name: Remove old container if exists and not managed by compose
      ansible.builtin.command: docker rm -f {{ web_app_app_name }}
      when:
        - web_app_old_container_check.rc == 0
        - web_app_old_container_check.stdout == ""
      changed_when: true

    - name: Template docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ web_app_compose_project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy with docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ web_app_compose_project_dir }}"
        state: present
        pull: always

    - name: Wait for application to be ready
      ansible.builtin.wait_for:
        port: "{{ web_app_app_port }}"
        host: "0.0.0.0"
        delay: 5
        timeout: 60

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ web_app_app_port }}/health"
        method: GET
        status_code: 200
      register: web_app_health_check
      retries: 3
      delay: 5
      until: web_app_health_check.status == 200

  rescue:
    - name: Handle deployment failure
      ansible.builtin.debug:
        msg: "Deployment failed for {{ web_app_app_name }}. Check logs for details."
