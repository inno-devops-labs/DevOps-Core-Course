---
# Refactored with blocks and tags (Lab 6 Task 1)

- name: Install common packages
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Fix apt cache on failure
      ansible.builtin.command: apt-get update --fix-missing
      changed_when: true

    - name: Retry package installation
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  always:
    - name: Log package installation completion
      ansible.builtin.copy:
        content: "Package installation completed at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/ansible_common_packages.log
        mode: "0644"

  become: true
  tags:
    - packages

- name: Configure system
  block:
    - name: Set timezone
      community.general.timezone:
        name: "{{ common_timezone }}"

  become: true
  tags:
    - users
