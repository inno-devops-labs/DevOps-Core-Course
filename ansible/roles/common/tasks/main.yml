---
- name: Common | Packages
  block:
    - name: Include packages tasks
      ansible.builtin.import_tasks: ../packages/main.yml
  rescue:
    - name: Common | Retry apt update after failure
      ansible.builtin.command: apt-get update --fix-missing
      changed_when: false
  always:
    - name: Common | Mark packages block done
      ansible.builtin.file:
        path: /tmp/common_packages_done
        state: touch
  become: true
  tags:
    - common
    - packages

- name: Common | Users
  block:
    - name: Include users tasks
      ansible.builtin.import_tasks: ../users/main.yml
  always:
    - name: Common | Mark users block done
      ansible.builtin.file:
        path: /tmp/common_users_done
        state: touch
  become: true
  tags:
    - common
    - users