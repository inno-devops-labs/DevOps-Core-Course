---
- name: Install common packages
  become: true
  tags:
    - packages
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Fix apt cache and retry
      ansible.builtin.apt:
        update_cache: true

    - name: Retry package installation
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  always:
    - name: Log completion
      ansible.builtin.file:
        path: /tmp/common_role_complete
        state: touch
        mode: "0644"

- name: Create application user
  become: true
  tags:
    - users
  block:
    - name: Ensure app user exists
      ansible.builtin.user:
        name: "{{ app_user | default('appuser') }}"
        shell: /bin/bash
        create_home: true
