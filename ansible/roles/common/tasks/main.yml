---
# Role: common
# Tags strategy:
# - common: entire role
# - packages: package installation
# - users: user management

- name: Install required packages
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
      register: apt_update_result

    - name: Install base packages
      apt:
        name:
          - curl
          - git
          - vim
        state: present

  rescue:
    - name: Retry apt update with fix-missing
      command: apt-get update --fix-missing
      changed_when: true

  always:
    - name: Log package block completion
      copy:
        content: "Packages block executed at {{ ansible_date_time.iso8601 }}"
        dest: /tmp/common_packages.log

  become: true
  when: ansible_os_family == "Debian"
  tags:
    - packages
    - common

- name: Manage system users
  block:
    - name: Create deploy user
      user:
        name: deploy
        groups: sudo
        append: yes
        state: present

  always:
    - name: Log users block completion
      copy:
        content: "Users block executed at {{ ansible_date_time.iso8601 }}"
        dest: /tmp/common_users.log

  become: true
  tags:
    - users
    - common
