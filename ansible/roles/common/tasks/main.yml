---
- name: Manage common packages
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Fix apt cache issues
      ansible.builtin.command: apt-get update --fix-missing
      register: apt_fix_result
      changed_when: "'0 upgraded' not in apt_fix_result.stdout | default('')"
      failed_when: false

  always:
    - name: Log common package management completion
      ansible.builtin.copy:
        dest: /tmp/common_packages.log
        content: "Common package management completed at {{ ansible_date_time.iso8601 }} on {{ inventory_hostname }}\n"
        mode: "0644"

  become: true
  tags:
    - common
    - packages

- name: Manage common users
  block:
    - name: Ensure common users exist
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups | default(omit) }}"
        shell: "{{ item.shell | default(omit) }}"
        state: present
      loop: "{{ common_users }}"
      when: common_users is defined and common_users | length > 0

  become: true
  tags:
    - common
    - users

- name: Get current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_timezone
  changed_when: false
  when: common_timezone is defined and common_timezone | length > 0
  tags:
    - common

- name: Set timezone
  ansible.builtin.command: timedatectl set-timezone "{{ common_timezone }}"
  when:
    - common_timezone is defined
    - common_timezone | length > 0
    - current_timezone is defined
    - current_timezone.stdout != common_timezone
  tags:
    - common
