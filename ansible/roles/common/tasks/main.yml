---
#roles/common/tasks/main.yml

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600 # Dont update cache if it is younger then 1 hour
  when: ansible_facts['os_family'] == "Debian"
  tags: 
    - packages
    - common 

- name: Install essential package
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present 
  when: ansible_facts['os_family'] == "Debian"
  notify:
    - Check installed packages
  tags:
    - packages
    - common

- name: Set time zone
  ansible.builtin.timezone:
    name: "{{ common_timezone }}"
  when:
    - common_configure_timezone | bool
    - ansible_facts['os_family'] == "Debian"
  tags:
    - config 
    - common 
