---
# Common role — basic system provisioning
# Installs essential packages, updates apt cache, sets timezone

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - common
    - packages

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags:
    - common
    - packages

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  tags:
    - common
    - timezone
