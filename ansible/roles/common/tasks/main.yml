---
- name: Install packages
  become: true
  tags:
    - packages
    - common

  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
  rescue:
    - name: Fix missing package sources on failure
      ansible.builtin.apt:
        update_cache: true
        fix_broken: true
        cache_valid_time: 0
      when: ansible_failed_task.name == "Update apt cache"
      changed_when: true
      register: common_apt_fix

    - name: Retry package installation
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
  always:
    - name: Log common role completion
      ansible.builtin.copy:
        content: "Common role completed at {{ ansible_date_time.iso8601 }}"
        dest: /tmp/common_role_complete.log
        mode: "0644"
- name: Create user
  become: true
  tags:
    - users
    - common
  block:
    - name: Create user
      ansible.builtin.user:
        name: "{{ user_name }}"
        state: present
        shell: /bin/bash
        createhome: true
