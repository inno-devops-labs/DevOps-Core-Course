---
- name: Install common packages
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Fix and retry apt update on failure
      apt:
        update_cache: yes
        fix_missing: yes

    - name: Retry installing common packages
      apt:
        name: "{{ common_packages }}"
        state: present

  always:
    - name: Log package installation completion
      ansible.builtin.copy:
        content: "Common packages installation completed at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/common_packages_done.log
        mode: "0644"

  become: true
  tags:
    - packages
    - common
