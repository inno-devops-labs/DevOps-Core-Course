---
# Package installation block with error handling
- name: Install common packages
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Fix apt cache and retry
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Retry package installation
      apt:
        name: "{{ common_packages }}"
        state: present

  always:
    - name: Log package installation completion
      debug:
        msg: "Package installation completed for common role"

  become: true
  tags:
    - packages
    - common