---
- name: Install system packages
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade apt packages
      ansible.builtin.apt:
        upgrade: safe

    - name: Install common packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - net-tools
          - software-properties-common
        state: present

  rescue:
    - name: Fix apt cache and retry
      ansible.builtin.command: apt-get update --fix-missing
      changed_when: true

    - name: Retry package installation
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - net-tools
          - software-properties-common
        state: present
        update_cache: yes

  always:
    - name: Log package installation completion
      ansible.builtin.copy:
        content: "Package installation completed at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/common_packages_complete.log
        mode: '0644'

  become: true
  tags:
    - packages

- name: Configure users and system
  block:
    - name: Ensure deploy user exists
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        state: present
        shell: /bin/bash

    - name: Configure timezone
      community.general.timezone:
        name: UTC

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
      when: inventory_hostname is defined

  become: true
  tags:
    - users
