---
# Package installation with error handling
- name: Install system packages
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Fix apt cache and retry
      ansible.builtin.command:
        cmd: apt-get update --fix-missing

    - name: Retry package installation
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  always:
    - name: Log package installation completion
      ansible.builtin.copy:
        content: "Package installation completed at {{ ansible_date_time.iso8601 }}"
        dest: /tmp/ansible_common_packages.log
        mode: "0644"

  become: true
  tags:
    - packages
    - common

# User and system configuration
- name: Configure users and system
  block:
    - name: Set timezone
      community.general.timezone:
        name: "{{ common_timezone }}"

    - name: Ensure deploy group exists
      ansible.builtin.group:
        name: deploy
        state: present

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user | default('deploy') }}"
        group: deploy
        shell: /bin/bash
        create_home: yes
        state: present

  always:
    - name: Log user configuration completion
      ansible.builtin.copy:
        content: "User configuration completed at {{ ansible_date_time.iso8601 }}"
        dest: /tmp/ansible_common_users.log
        mode: "0644"

  become: true
  tags:
    - users
    - common
