---
# Common role — basic system provisioning
# Refactored with blocks for error handling and tags for selective execution

# Block 1: Package installation with error handling
- name: Install system packages
  become: true
  tags:
    - common
    - packages
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Fix apt cache on failure
      ansible.builtin.command: apt-get update --fix-missing # noqa: command-instead-of-module
      changed_when: true

    - name: Retry package installation after fix
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
        update_cache: true

  always:
    - name: Log package installation completion
      ansible.builtin.copy:
        content: "Package installation completed at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/common_packages_done.log
        mode: "0644"

# Block 2: User management
- name: Manage users
  become: true
  tags:
    - common
    - users
  block:
    - name: Ensure application user exists
      ansible.builtin.user:
        name: "{{ app_user | default('appuser') }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Add user to docker group (if docker installed)
      ansible.builtin.user:
        name: "{{ app_user | default('appuser') }}"
        groups: docker
        append: true
      failed_when: false

  always:
    - name: Log user setup completion
      ansible.builtin.copy:
        content: "User setup completed at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/common_users_done.log
        mode: "0644"

# Block 3: System configuration
- name: Configure system settings
  become: true
  tags:
    - common
    - timezone
  block:
    - name: Set timezone
      community.general.timezone:
        name: "{{ common_timezone }}"
