---
- name: Manage system packages
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name: "{{ common_packages }}"
        state: present

    - name: Set system timezone
      community.general.timezone:
        name: "{{ common_timezone }}"

  rescue:
    - name: Handle apt cache update failure
      ansible.builtin.command: apt-get update --fix-missing
      changed_when: true

    - name: Retry installing common packages after fix
      apt:
        name: "{{ common_packages }}"
        state: present
        update_cache: yes

  always:
    - name: Log package installation completion
      ansible.builtin.copy:
        content: "Common packages installed at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/common_role_completion.log
        mode: '0644'

  become: true
  tags:
    - common
    - packages
