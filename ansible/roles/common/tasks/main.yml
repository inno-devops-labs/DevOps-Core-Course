---
- name: Common | Packages (apt update + install)
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present

  rescue:
    - name: Fix apt cache on failure
      ansible.builtin.command: apt-get update --fix-missing
      changed_when: false

    - name: Retry apt cache update after fix
      ansible.builtin.apt:
        update_cache: yes

  always:
    - name: Log common packages block completion
      ansible.builtin.copy:
        dest: /tmp/ansible-common-packages.done
        content: "common packages block finished on {{ inventory_hostname }}\n"
        mode: "0644"

  become: true
  tags: [packages]

- name: Common | Users management
  block:
    - name: Create application user
      ansible.builtin.user:
        name: "{{ common_app_user }}"
        shell: /bin/bash
        create_home: true

  always:
    - name: Log common users block completion
      ansible.builtin.copy:
        dest: /tmp/ansible-common-users.done
        content: "common users block finished on {{ inventory_hostname }}\n"
        mode: "0644"

  become: true
  tags: [users]