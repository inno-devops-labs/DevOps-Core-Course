---
# Essential packages present on most servers
common_packages:
  - ca-certificates
  - curl
  - git
  - vim
  - htop
  - unzip
  - jq
  - python3-pip
  - apt-transport-https
  - gnupg
  - lsb-release

common_timezone: "Europe/Moscow"
common_set_timezone: true

# Optional user management (Lab 6)
# Example:
common_users:
  - name: devops
    groups: sudo
# common_users: []
