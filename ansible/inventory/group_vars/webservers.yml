---
# Docker Hub credentials from Vault
docker_hub_username: "{{ vault_docker_hub_username | default(lookup('env', 'DOCKER_HUB_USERNAME'), true) }}"
docker_hub_password: "{{ vault_docker_hub_password | default(lookup('env', 'DOCKER_HUB_PASSWORD'), true) }}"

# Application Configuration (with env var overrides)
app_name: "{{ lookup('env', 'APP_NAME') | default('devops-app', true) }}"
docker_image: "{{ lookup('env', 'DOCKER_IMAGE') | default(lookup('env', 'APP_IMAGE') | default('j0cos/devops-info-service', true), true) }}"
docker_tag: "{{ lookup('env', 'DOCKER_TAG') | default('latest', true) }}"
app_port: "{{ lookup('env', 'APP_PORT') | default('8000', true) }}"
app_internal_port: "{{ lookup('env', 'APP_INTERNAL_PORT') | default('5000', true) }}"
compose_project_dir: "/opt/{{ app_name }}"

# Secrets from Vault
app_secret_key: "{{ vault_app_secret_key | default(lookup('env', 'APP_SECRET_KEY'), true) }}"
app_environment:
  FLASK_ENV: production
  APP_SECRET_KEY: "{{ app_secret_key }}"

# System variables
system_timezone: UTC
docker_service_state: started
docker_service_enabled: yes
