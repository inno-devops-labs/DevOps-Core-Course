---
# Java app deployment variables
# Used by playbooks/deploy_java.yml

# Application identity
web_app_name: devops-java
web_app_docker_image: "112005/devops-lab3-java"
web_app_docker_tag: latest

# Port mapping: host:8001 -> container:8080 (Spring Boot)
web_app_port: 8001
web_app_internal_port: 8080

# Docker Compose project directory
web_app_project_dir: "/opt/{{ web_app_name }}"

# Restart policy
web_app_restart_policy: unless-stopped
