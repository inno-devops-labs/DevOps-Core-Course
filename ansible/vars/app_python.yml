---
# Python application variables

web_app_name: devops-python
web_app_docker_image: "{{ dockerhub_username }}/python_app"
web_app_docker_tag: latest
web_app_port: 8000
web_app_internal_port: 8000
web_app_compose_project_dir: "/opt/{{ web_app_name }}"

# Application-specific environment variables
web_app_environment_vars:
  APP_NAME: "DevOps Python Service"
  APP_VERSION: "1.0.0"