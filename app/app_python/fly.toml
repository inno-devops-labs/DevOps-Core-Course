app = "devops-info-sevan-lab17"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "flyio"
  HOST = "0.0.0.0"
  PORT = "8080"
  VISITS_FILE_PATH = "/data/visits"

[mounts]
  source = "devops_info_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
