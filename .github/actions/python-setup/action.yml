name: Python uv Setup
description: Set up Python + uv, cache dependencies, and install project deps

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.14"
  uv-version:
    description: uv version to install
    required: false
    default: "0.9.30"
  working-directory:
    description: Project directory containing pyproject.toml
    required: false
    default: "app_python"
  lockfile-path:
    description: Path to uv.lock for cache key invalidation
    required: false
    default: "app_python/uv.lock"
  install-args:
    description: Extra arguments passed to uv sync
    required: false
    default: "--frozen"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      shell: bash
      run: python -m pip install --upgrade "uv==${{ inputs.uv-version }}"

    - name: Cache uv dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/uv
          ${{ inputs.working-directory }}/.venv
        key: ${{ runner.os }}-py${{ inputs.python-version }}-uv${{ inputs.uv-version }}-${{ hashFiles(inputs.lockfile-path) }}
        restore-keys: |
          ${{ runner.os }}-py${{ inputs.python-version }}-uv${{ inputs.uv-version }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync ${{ inputs.install-args }}
