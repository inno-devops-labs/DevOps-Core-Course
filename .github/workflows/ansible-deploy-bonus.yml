# Ansible: deploy bonus app on push to bonus-related paths.
name: Ansible Deploy Bonus

on:
  push:
    paths:
      - "ansible/vars/app_bonus.yml"
      - "ansible/playbooks/deploy_bonus.yml"
      - "ansible/roles/web_app/**"
      - ".github/workflows/ansible-deploy-bonus.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible ansible-lint && ansible-galaxy collection install -r ansible/requirements.yml
      - run: cd ansible && ansible-lint playbooks/deploy_bonus.yml playbooks/deploy_all.yml

  deploy_bonus:
    name: Deploy Bonus Application
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible && ansible-galaxy collection install -r ansible/requirements.yml
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy bonus app
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          cd ansible
          echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass
          chmod 600 /tmp/vault_pass
          ansible-playbook playbooks/deploy_bonus.yml -i inventory/hosts.ini --vault-password-file /tmp/vault_pass
          rm -f /tmp/vault_pass
      - name: Verify bonus app
        run: |
          sleep 10
          curl -f --connect-timeout 10 "http://${{ secrets.VM_HOST }}:8001" || exit 1
          curl -f --connect-timeout 10 "http://${{ secrets.VM_HOST }}:8001/health" || exit 1
