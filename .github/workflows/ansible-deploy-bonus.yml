name: Ansible Deploy Bonus (Go) App

on:
  push:
    branches: [main, master, lab6]
    paths:
      - 'ansible/.ansible-lint'
      - 'ansible/vars/app_bonus.yml'
      - 'ansible/playbooks/deploy_bonus.yml'
      - 'ansible/roles/web_app/**'
      - '.github/workflows/ansible-deploy-bonus.yml'
  pull_request:
    branches: [main, master, lab6]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-deploy-bonus.yml'

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ansible ansible-lint

      - name: Create vault password file for lint
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_pass

      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint playbooks/deploy_bonus.yml

  deploy:
    name: Deploy Bonus (Go) Application
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Create vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_pass

      - name: Deploy Bonus App with Ansible
        run: |
          cd ansible
          ansible-playbook playbooks/deploy_bonus.yml \
            -i inventory/hosts.ini \
            --vault-password-file /tmp/vault_pass

      - name: Cleanup vault password
        if: always()
        run: rm -f /tmp/vault_pass

      - name: Verify Bonus App Deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.VM_HOST }}:8001 || exit 1
          curl -f http://${{ secrets.VM_HOST }}:8001/health || exit 1
