name: Go CI (Lab03 Bonus)

on:
  push:
    branches: [lab03, main, master]
    paths:
      - "lab3c/app_go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches: [lab03, main, master]
    paths:
      - "lab3c/app_go/**"
      - ".github/workflows/go-ci.yml"

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: lab3c/app_go
          args: --timeout=5m

      - name: Run tests
        working-directory: lab3c/app_go
        run: go test ./...

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set version (CalVer)
        run: echo "VERSION=$(date +%Y.%m.%d)" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./lab3c/app_go
          file: ./lab3c/app_go/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-info-go:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-info-go:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
