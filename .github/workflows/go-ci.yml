name: go-ci

on:
  push:
    paths:
      - "app_go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "app_go/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops-info-go

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app_go/go.mod
          cache: true
          cache-dependency-path: app_go/go.mod

      - name: Format check
        run: |
          cd app_go
          test -z "$(gofmt -l .)"

      - name: Vet
        run: |
          cd app_go
          go vet ./...

      - name: Tests + coverage
        run: |
          cd app_go
          go test -coverprofile=coverage.out ./...

      - name: Upload coverage (Codecov)
        uses: codecov/codecov-action@v4
        with:
          files: app_go/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version (CalVer)
        run: |
          echo "VERSION=$(date -u +%Y.%m.%d)" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-stage)
        uses: docker/build-push-action@v6
        with:
          context: ./app_go
          file: ./app_go/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ env.SHORT_SHA }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max