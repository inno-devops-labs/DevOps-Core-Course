name: Go CI/CD

on:
  push:
    branches: [main, lab03]
    paths:
      - 'app_go/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
    branches: [main, lab03]
    paths:
      - 'app_go/**'
      - '.github/workflows/go-ci.yml'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install dependencies
        run: go mod download
        working-directory: ./app_go
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: ./app_go
      - name: Run tests
        run: go test -v ./...
        working-directory: ./app_go
      - name: Test coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
        working-directory: ./app_go

      - name: Check Go coverage threshold
        run: |
          go tool cover -func=app_go/coverage.out | awk '/total:/ {print $3}' | grep -q '^[7-9][0-9]\.[0-9]%\|100.00%' || (echo 'Coverage below 70%' && exit 1)
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Snyk scan
        uses: snyk/actions/setup@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=app_go/go.mod

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lab03'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract CalVer
        id: calver
        run: echo "CALVER=$(date +'%Y.%m')" >> $GITHUB_ENV
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app_go
          file: ./app_go/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-info-service-go:${{ env.CALVER }},${{ secrets.DOCKERHUB_USERNAME }}/devops-info-service-go:latest
