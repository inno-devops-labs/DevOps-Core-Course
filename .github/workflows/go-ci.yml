name: Go CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "labs/lab3/app_go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "labs/lab3/app_go/**"
      - ".github/workflows/go-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPO: devops-info-go

jobs:
  test:
    name: Lint + Tests (with coverage)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: labs/lab3/app_go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Format check (gofmt)
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: |
          go vet ./...

      - name: Tests
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

  docker:
    name: Docker build & push (versioned)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

    defaults:
      run:
        working-directory: labs/lab3/app_go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version (CalVer)
        run: |
          echo "VERSION=$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./labs/lab3//app_go
          file: ./labs/lab3//app_go/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go
