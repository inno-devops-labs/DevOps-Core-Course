name: Python CI + Docker

on:
  push:
    branches: ["lab03", "master", "main"]
    paths:
      - "app_python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "app_python/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            app_python/requirements.txt
            app_python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Snyk scan (dependencies)
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=app_python/requirements.txt --package-manager=pip --skip-unresolved


      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 .

      - name: Run tests
        run: |
          pytest -q

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [test-and-lint]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version (CalVer)
        id: version
        run: |
          VERSION=$(date -u +'%Y.%m.%d')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app_python
          file: ./app_python/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app_python:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/app_python:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
