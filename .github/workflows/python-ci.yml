name: Python CI

on:
  push:
    branches: [ "master", "lab3" ]
    paths:
      - "app_python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "app_python/**"

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r app_python/requirements.txt -r app_python/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff app_python

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml
        working-directory: app_python

      - name: Snyk security scan
        uses: snyk/actions/python@master
        working-directory: app_python
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: app_python/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (CalVer)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: elinanotelina/devops-info-service
          tags: |
            type=raw,value={{date 'YYYY.MM'}}
            type=raw,value={{date 'YYYY.MM'}}.${{ github.run_number }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app_python
          push: true
          tags: ${{ steps.meta.outputs.tags }}
