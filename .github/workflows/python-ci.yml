name: Python app - Test & Docker Push

on: 
  push:
  pull_request:
    types: [opened]

defaults:
  run:
    working-directory:
      ./app_python

env:
  DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{matrix.python-version}}
        uses: actions/setup-python@v4
        with:
          python-version: ${{matrix.python-version}}
          cache: 'pip'

      - name: Cache virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: ./app_python/venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('./app_python/requirements.txt') }}

      - name: Create virtual environment and install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

      - name: Run flake8
        run: venv/bin/flake8 ./app.py ./tests/test_app.py

      - name: Run tests
        run: venv/bin/pytest

      - name: Run Snyk
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=./app_python/requirements.txt
        continue-on-error: false

  docker-build-push:
    runs-on: ubuntu-latest
    needs: code-quality-and-testing
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Docker tags
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{env.DOCKER_HUB_USERNAME}}/${{env.IMAGE_NAME}}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Log in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app_python
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
