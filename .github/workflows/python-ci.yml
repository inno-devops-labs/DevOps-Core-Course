name: Python CI

on:
  push:
    branches: [master, lab03]
    paths:
      - 'app_python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'app_python/**'
      - '.github/workflows/python-ci.yml'

# Cancel in-progress runs on same branch
concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: aezuraa/devops-info-service
  PYTHON_VERSION: '3.12'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: app_python/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8 linter
        run: flake8 app.py --max-line-length=120

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: app_python/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate CalVer version
        id: version
        run: |
          echo "calver=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: app_python
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:python
            ${{ env.DOCKER_IMAGE }}:python-${{ steps.version.outputs.calver }}
            ${{ env.DOCKER_IMAGE }}:python-${{ steps.version.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r app_python/requirements.txt

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk to check for vulnerabilities
        run: snyk test --file=app_python/requirements.txt --severity-threshold=high --package-manager=pip
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
