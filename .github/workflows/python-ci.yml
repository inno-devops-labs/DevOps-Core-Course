name: Python CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'app_python/**'
      - '.github/workflows/python-ci.yml'
      - 'requirements*.txt'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app_python/**'
  workflow_dispatch:  # Allow manual triggers
  schedule:
    # Run weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository_owner }}/devops-info-service
  PYTHON_VERSION: '3.13'
  DOCKER_BUILDKIT: 1

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: 'app_python/requirements.txt'
    
    - name: Install dependencies
      working-directory: ./app_python
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx
        
    - name: Run unit tests with coverage
      working-directory: ./app_python
      run: |
        echo "Running tests with coverage..."
        python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./app_python/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          app_python/coverage.xml
          app_python/htmlcov/
        retention-days: 7
        
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=calver,pattern={{date "YYYY.MM.DD"}}-{{sha}},scheme=calendar
        labels: |
          maintainer=${{ github.actor }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          org.opencontainers.image.revision=${{ github.sha }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./app_python
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        
    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        
    - name: Scan image for vulnerabilities with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
  security-scan:
    name: Security Scan (Snyk)
    runs-on: ubuntu-latest
    needs: lint-and-test
    continue-on-error: true  # Don't fail the whole workflow on security warnings
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      working-directory: ./app_python
      run: |
        pip install -r requirements.txt
        
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/python@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        
    - name: Run safety check
      working-directory: ./app_python
      run: |
        pip install safety
        safety check -r requirements.txt --ignore=70605  # Ignore known false positives
        
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-and-push, security-scan]
    if: always()
    
    steps:
    - name: Check workflow status
      run: |
        echo "Lint and Test: ${{ needs.lint-and-test.result }}"
        echo "Build and Push: ${{ needs.build-and-push.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        
    - name: Send Slack notification on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#devops-alerts'
        username: 'GitHub Actions Bot'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}