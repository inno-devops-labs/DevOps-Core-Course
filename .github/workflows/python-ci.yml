name: Python CI/CD Pipeline

on:
  push:
    branches:
      - main
      - lab03
    paths:
      - 'app_python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches:
      - main
      - lab03
    paths:
      - 'app_python/**'
      - '.github/workflows/python-ci.yml'

env:
  PYTHON_VERSION: '3.13'
  DOCKER_IMAGE: devops-info-service
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  code-quality:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./app_python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter (ruff)
        working-directory: ./app_python
        run: |
          pip install ruff==0.6.9
          ruff check app.py tests/

      - name: Run unit tests
        working-directory: ./app_python
        run: |
          pytest tests/ -v --tb=short

      - name: Run tests with coverage
        working-directory: ./app_python
        run: |
          pytest tests/ --cov=app --cov-report=xml --cov-report=term

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lab03')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate version tags (CalVer)
        id: meta
        run: |
          VERSION=$(date +%Y.%m.%d)
          BUILD_NUMBER=${{ github.run_number }}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_with_build=$VERSION.$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tags=${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:$VERSION,${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:$VERSION.$BUILD_NUMBER,${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app_python
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scanning (Snyk)
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./app_python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk security scan
        working-directory: ./app_python
        run: |
          snyk test --severity-threshold=high --token=${{ secrets.SNYK_TOKEN }} || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
