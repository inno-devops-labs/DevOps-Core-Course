name: Python CI (Lab03)

on:
  push:
    branches: [lab3, main, master]
    paths:
      - "lab3c/app_python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [lab3, main, master]
    paths:
      - "lab3c/app_python/**"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            lab3c/app_python/requirements.txt
            lab3c/app_python/requirements-dev.txt

      - name: Install dependencies
        working-directory: lab3c/app_python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: lab3c/app_python
        run: ruff check .

      - name: Run tests with coverage
        working-directory: lab3c/app_python
        run: pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: lab3c/app_python/coverage.xml
          token: ${{ env.CODECOV_TOKEN }}

      - name: Snyk scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          command: test
          args: --file=lab3c/app_python/requirements.txt

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set version (CalVer)
        run: echo "VERSION=$(date +%Y.%m.%d)" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./lab3c/app_python
          file: ./lab3c/app_python/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-info-python:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-info-python:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
