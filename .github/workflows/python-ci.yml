name: python-app

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python set up
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        id: pip-cache
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~\.cache\pip
            ~\AppData\Local\pip\Cache\http
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
        
      - name: Install dependencies
        run: pip install -r labs/app_python/requirements.txt

      - name: Linter
        run: flake8 --max-complexity 10 labs/app_python/app.py

      - name: Snyk scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: labs/app_python --file=labs/app_python/requirements.txt --severity-threshold=high --skip-unresolved


      - name: Launch app and test
        run:
          python labs/app_python/app.py &
          sleep 3
          && cd labs/app_python && pytest
  docker:
    runs-on: ubuntu-latest
    needs: test  
    steps:
      - uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Generate version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "image_tag=sha-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push Docker image
        run: |
          docker build -f labs/app_python/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/simple-app:${{ steps.version.outputs.image_tag }} \
            labs/app_python
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ steps.version.outputs.is_release }}" == "true" ]]; then
            docker tag ${{ secrets.DOCKER_USERNAME }}/simple-app:${{ steps.version.outputs.image_tag }} \
                     ${{ secrets.DOCKER_USERNAME }}/simple-app:latest
            docker push ${{ secrets.DOCKER_USERNAME }}/simple-app:latest
          fi
          docker push ${{ secrets.DOCKER_USERNAME }}/simple-app:${{ steps.version.outputs.image_tag }}
          
          echo "   - ${{ secrets.DOCKER_USERNAME }}/simple-app:${{ steps.version.outputs.image_tag }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ steps.version.outputs.is_release }}" == "true" ]]; then
            echo "   - ${{ secrets.DOCKER_USERNAME }}/simple-app:latest"
          fi
   