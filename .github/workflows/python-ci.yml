name: python-app

on: push

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python set up
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r labs/app_python/requirements.txt
      - name: Linter
        run: flake8 --max-complexity 10 labs/app_python/app.py
      - name: Launch app and test
        run:
          python labs/app_python/app.py &
          sleep 3
          && cd labs/app_python && pytest
  docker:
    runs-on: ubuntu-latest
    needs: test  
    steps:
      - uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Build and push
        run: |
          cd labs/app_python && docker build -t ${{ secrets.DOCKER_USERNAME }}/simple-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/simple-app:latest    
   