name: Python CI/CD Pipeline

on:
  push:
    paths:
      - 'app_python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'app_python/**'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/devops-info-service-ci-generated
  PYTHON_VERSION: '3.13'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'app_python/requirements*.txt'
    
    - name: Install dependencies
      run: |
        cd app_python
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest pytest-cov flake8; fi
    
    - name: Lint with flake8
      run: |
        cd app_python
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        cd app_python
        pytest tests/ -v --cov=./ --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./app_python/coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    # Запускаем только на пуш в main/lab03, не на каждый PR
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Generate version tag (CalVer)
      id: version
      run: |
        # Calendar Versioning: YYYY.MM.DD-RUN_NUMBER
        echo "VERSION=$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "DATE_TAG=$(date +'%Y.%m')" >> $GITHUB_OUTPUT
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./app_python
        file: ./app_python/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/fastapi-app:latest
          ${{ secrets.DOCKER_USERNAME }}/fastapi-app:${{ steps.version.outputs.VERSION }}
          ${{ secrets.DOCKER_USERNAME }}/fastapi-app:${{ steps.version.outputs.DATE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max