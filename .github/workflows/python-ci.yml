name: Python CI + Docker Build + Snyk

on:
  push:
    paths:
      - 'app_python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'app_python/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: sfedbro/app_python

    steps:
      # --------------------
      # Checkout code
      # --------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------
      # Cache pip dependencies
      # --------------------
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # --------------------
      # Python setup
      # --------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --------------------
      # Install dependencies
      # --------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app_python/requirements.txt
          pip install pytest flake8 httpx

      # --------------------
      # Lint
      # --------------------
      - name: Run flake8
        run: flake8 app_python

      # --------------------
      # Run tests
      # --------------------
      - name: Run pytest
        run: pytest -v app_python

      # --------------------
      # Snyk security scan
      # --------------------
      - name: Snyk test
        uses: snyk/actions/python@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=app_python/requirements.txt --skip-unresolved

      # --------------------
      # Docker login
      # --------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------
      # Set CalVer tag
      # --------------------
      - name: Set version (CalVer)
        id: version
        run: echo "VERSION=$(date +'%Y.%m')" >> $GITHUB_OUTPUT

      # --------------------
      # Build & push Docker image
      # --------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: app_python
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
