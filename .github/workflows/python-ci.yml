name: python-ci

on:
  push:
    branches: [ "master" ]
    paths:
      - "app_python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "app_python/**"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PY_APP_DIR: app_python
  DOCKER_IMAGE_PYTHON: gghost1/devops-lab-app-python

jobs:
  test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PY_APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            app_python/requirements.txt
            app_python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Pytest + coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app_python/coverage.xml
          fail_ci_if_error: false

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk scan (deps)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements.txt --severity-threshold=high

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [ "test-lint" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tags
        shell: bash
        run: |
          echo "VERSION=$(date -u +%Y.%m.%d)" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          SAFE_REF="$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g')"
          echo "SAFE_REF=$SAFE_REF" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (PR same repo)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push snapshot (PR same repo)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/build-push-action@v6
        with:
          context: ./app_python
          file: ./app_python/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_PYTHON }}:snapshot-${{ env.SAFE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build snapshot (PR fork)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: docker/build-push-action@v6
        with:
          context: ./app_python
          file: ./app_python/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_IMAGE_PYTHON }}:snapshot-${{ env.SAFE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub (push)
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (push)
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: ./app_python
          file: ./app_python/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_PYTHON }}:${{ env.VERSION }}
            ${{ env.DOCKER_IMAGE_PYTHON }}:sha-${{ env.SHORT_SHA }}
            ${{ env.DOCKER_IMAGE_PYTHON }}:${{ env.SAFE_REF }}
            ${{ env.DOCKER_IMAGE_PYTHON }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max