name: python-app

on: push

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python set up
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r labs/app_python/requirements.txt
      - name: Linter
        run: flake8 --max-complexity 10 labs/app_python/app.py
      - name: Launch app and test
        run:
          python labs/app_python/app.py &
          sleep 3
          && cd labs/app_python && pytest
  docker:
    runs-on: ubuntu-latest
    needs: test  
    steps:
      - uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Generate version tag
        id: version
        run: |
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "image_tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker build -f labs/app_python/Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/simple-app:${{ steps.version.outputs.image_tag }} \
          labs/app_python
          
          docker tag ${{ secrets.DOCKER_USERNAME }}/simple-app:${{ steps.version.outputs.image_tag }} \
                   ${{ secrets.DOCKER_USERNAME }}/simple-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/simple-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/simple-app:${{ steps.version.outputs.image_tag }}

   