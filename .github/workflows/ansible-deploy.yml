name: Ansible Deployment

on:
  push:
    branches:
      - master
      - main
      - lab06
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"
  pull_request:
    branches:
      - master
      - main
      - lab06
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          ansible-galaxy collection install community.docker

      - name: Create vault password file for lint
        working-directory: ansible
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          echo "$ANSIBLE_VAULT_PASSWORD" > .vault_pass
          chmod 600 .vault_pass

      - name: Run ansible-lint
        working-directory: ansible
        run: |
          ansible-lint playbooks/*.yml

      - name: Remove vault password file
        if: always()
        working-directory: ansible
        run: rm -f .vault_pass

  deploy:
    name: Deploy Application
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Create CI inventory
        working-directory: ansible
        run: |
          cat > inventory/ci_hosts.ini << EOF
          [webservers]
          ci-target ansible_host=${{ secrets.VM_HOST }} ansible_user=${{ secrets.VM_USER }} ansible_ssh_private_key_file=~/.ssh/id_rsa

          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Deploy with Ansible
        working-directory: ansible
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass
          ansible-playbook playbooks/deploy.yml \
            -i inventory/ci_hosts.ini \
            --vault-password-file /tmp/vault_pass
          rm -f /tmp/vault_pass

      - name: Verify deployment
        run: |
          sleep 10
          curl -f "http://${{ secrets.VM_HOST }}:5000/" || exit 1
          curl -f "http://${{ secrets.VM_HOST }}:5000/health" || exit 1
