name: Ansible CI/CD

on:
  push:
    branches: [lab6, master]
    paths:
      - 'ansible/**'
      - '!ansible/docs/**'
      - '.github/workflows/ansible-deploy.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Ansible syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ansible ansible-lint

      - name: Create vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass

      - name: Syntax check playbooks
        run: |
          cd ansible
          ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault_pass ansible-playbook --syntax-check playbooks/*.yml || true

      - name: Run ansible-lint
        run: |
          cd ansible
          ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault_pass ansible-lint playbooks/*.yml roles/ || true

      - name: Cleanup vault password
        if: always()
        run: |
          rm -f /tmp/vault_pass

  deploy:
    name: Deploy application
    needs: lint
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip3 install --user ansible docker

      - name: Deploy
        run: |
          cd ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass
          ansible-playbook playbooks/deploy.yml -i inventory/hosts.ini --vault-password-file /tmp/vault_pass --tags "app_deploy" -e "ansible_become_pass=${{ secrets.BECOME_PASSWORD }}"
          rm /tmp/vault_pass

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://127.0.0.1:5050 || exit 1
          curl -f http://127.0.0.1:5050/health || exit 1
