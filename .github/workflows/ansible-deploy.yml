name: Ansible Deployment

on:
  push:
    branches: [main, master]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"

  pull_request:
    branches: [main, master]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"

jobs:

  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          ansible-galaxy collection install community.docker

      - name: Write vault password from GitHub Secret (required to decrypt group_vars/all.yml)
        working-directory: ansible
        shell: bash
        run: |
          if [ -z "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" ]; then
            echo "ERROR: GitHub Secret ANSIBLE_VAULT_PASSWORD is not set, but group_vars/all.yml is encrypted with Ansible Vault."
            exit 1
          fi
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Run ansible-lint
        working-directory: ansible
        run: |
          ansible-lint playbooks/*.yml


  deploy:
    name: Deploy Application
    needs: lint
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Validate required deployment secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          missing=()
          for var in SSH_PRIVATE_KEY VM_HOST VM_USER ANSIBLE_VAULT_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Write vault password from GitHub Secret
        working-directory: ansible
        shell: bash
        run: |
          if [ -z "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" ]; then
            echo "ERROR: GitHub Secret ANSIBLE_VAULT_PASSWORD is not set."
            exit 1
          fi
          printf '%s\n' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ansible_deploy
          chmod 600 ~/.ssh/ansible_deploy
          if [ -n "${{ secrets.KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts
          fi

      - name: Generate CI inventory
        working-directory: ansible/inventory
        run: |
          cat <<EOF > ci_hosts.ini
          [webservers]
          ci ansible_host=${{ secrets.VM_HOST }} ansible_user=${{ secrets.VM_USER }} ansible_ssh_private_key_file=~/.ssh/ansible_deploy
          EOF

      - name: Deploy with Ansible
        working-directory: ansible
        run: |
          ansible-playbook playbooks/deploy.yml \
            -i inventory/ci_hosts.ini \
            --tags app_deploy

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.VM_HOST }}:8000
          curl -f http://${{ secrets.VM_HOST }}:8000/health
