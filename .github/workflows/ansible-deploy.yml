name: Ansible Deployment

on:
  push:
    branches: [ main, master, lab6 ]
    paths:
      - 'ansible/**'
      - '!ansible/docs/**'            # don’t run when only docs change
      - '.github/workflows/ansible-deploy.yml'
  pull_request:
    branches: [ main, master, lab6 ]
    paths:
      - 'ansible/**'

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ansible ansible-lint

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install community.general

      - name: Run ansible-lint
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          cd ansible
          if [ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]; then
            echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass
            chmod 600 /tmp/vault_pass
            export ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault_pass
          fi
          ansible-lint playbooks/*.yml
          rm -f /tmp/vault_pass

  deploy:
    name: Deploy Application
    needs: lint
    runs-on: ubuntu-latest    # switch to "self-hosted" for a local runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install community.general

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Ansible
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          cd ansible
          echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass
          chmod 600 /tmp/vault_pass
          export ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault_pass
          ansible-playbook playbooks/deploy.yml \
            -i inventory/hosts.ini \
            --vault-password-file /tmp/vault_pass \
            --tags "app_deploy" && true
          rm /tmp/vault_pass

      - name: Verify Deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.VM_HOST }}:8000 || exit 1
          curl -f http://${{ secrets.VM_HOST }}:8000/health || exit 1
