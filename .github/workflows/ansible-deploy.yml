name: Ansible CI/CD

# ──────────────────────────────────────────────────────────────
# TRIGGER CONDITIONS (Task 4, Lab 6)
#
# This workflow runs when:
#   • Code pushed to master/lab* branches that touches Ansible files
#   • A PR is opened/updated against those branches with Ansible changes
#   • Manually via Actions → "Run workflow"
#
# Path filters prevent unnecessary runs:
#   Changing README.md won't trigger Ansible deployment.
#   Changing ansible/ code will.
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - master
      - "lab*"
    paths:
      - "labs/ansible/**"                             # any Ansible change
      - "!labs/ansible/docs/**"                       # EXCEPT documentation
      - ".github/workflows/ansible-deploy.yml"        # or the workflow itself
  pull_request:
    branches:
      - master
      - "lab*"
    paths:
      - "labs/ansible/**"
      - "!labs/ansible/docs/**"
      - ".github/workflows/ansible-deploy.yml"
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI.
    # Useful for on-demand deployments without a code push.

# Cancel any in-progress run on the same branch when a new commit arrives.
# Prevents two deployments racing against each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────
  # ansible-lint checks playbooks and roles for best-practice
  # violations BEFORE anything is deployed.  Fast feedback loop.
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible and ansible-lint
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install -r labs/ansible/requirements.yml
          # ansible-lint ships its own set of rules and also runs
          # ansible-syntax-check internally, so a single command
          # catches both YAML formatting issues and logic errors.

      - name: Run ansible-lint on all playbooks
        working-directory: labs/ansible
        run: |
          ansible-lint playbooks/*.yaml
          # Exit code 0 = no violations → job passes
          # Exit code non-zero = violations found → job fails, deploy blocked

  # ── Job 2: Deploy ───────────────────────────────────────────
  # Runs only after lint passes (needs: lint).
  # Uses a GitHub-hosted runner + SSH to reach the target VM.
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: lint          # blocked if lint fails — no broken code reaches prod
    # Only deploy on push to master/lab* (not on PRs — PRs only lint)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible and community.docker collection
        run: |
          pip install ansible
          ansible-galaxy collection install -r labs/ansible/requirements.yml
          # requirements.yml pins community.docker >= 3.0.0 which provides
          # docker_compose_v2, docker_login, docker_image modules.

      - name: Set up SSH key for target VM
        # The private key is stored as a GitHub Secret.
        # Secrets are encrypted at rest and masked in logs.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/yandex_cloud
          chmod 600 ~/.ssh/yandex_cloud
          # Add the VM to known_hosts to prevent "host key verification failed".
          # ssh-keyscan fetches the public key without needing user confirmation.
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Write Ansible Vault password file
        # The vault password decrypts secrets (dockerhub_password, etc.)
        # stored encrypted in group_vars/all.yml.
        # We write it to a temp file that is deleted in the always step.
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass
          chmod 600 /tmp/vault_pass

      - name: Update inventory with target VM
        # Inject the actual VM host from GitHub Secrets into the inventory
        # so the workflow doesn't depend on a hardcoded IP in the repo.
        run: |
          sed -i "s/ansible_host=[^ ]*/ansible_host=${{ secrets.VM_HOST }}/" \
            labs/ansible/inventory/hosts.ini

      - name: Run provision playbook (idempotent — skips if already done)
        working-directory: labs/ansible
        run: |
          ansible-playbook playbooks/provision.yaml \
            --vault-password-file /tmp/vault_pass \
            --private-key ~/.ssh/yandex_cloud
          # provision.yaml is idempotent: running it again on an already-
          # provisioned VM shows only "ok" tasks, no "changed".

      - name: Run deploy playbook
        working-directory: labs/ansible
        run: |
          ansible-playbook playbooks/deploy.yaml \
            --vault-password-file /tmp/vault_pass \
            --private-key ~/.ssh/yandex_cloud \
            --tags app_deploy
          # --tags app_deploy skips the wipe block (web_app_wipe defaults to false).

      - name: Verify deployment (smoke test)
        # Wait up to 30 s for the app to respond, then check the health endpoint.
        # `|| exit 1` makes curl failures fail the step explicitly.
        run: |
          sleep 10
          curl -f --retry 5 --retry-delay 5 \
            "http://${{ secrets.VM_HOST }}:8080" || exit 1
          curl -f --retry 5 --retry-delay 5 \
            "http://${{ secrets.VM_HOST }}:8080/health" || exit 1
          echo "✓ Application is up and healthy"

      - name: Clean up vault password file
        # always: runs even if a previous step failed.
        # Ensures the password file is never left on the runner.
        if: always()
        run: rm -f /tmp/vault_pass
