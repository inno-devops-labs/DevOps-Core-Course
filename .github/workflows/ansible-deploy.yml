name: Ansible Deploy (Python App)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ansible/vars/app_python.yml'
      - 'ansible/playbooks/deploy.yml'
      - 'ansible/playbooks/deploy_python.yml'
      - 'ansible/playbooks/provision.yml'
      - 'ansible/roles/common/**'
      - 'ansible/roles/docker/**'
      - 'ansible/roles/web_app/**'
      - 'ansible/group_vars/**'
      - 'ansible/inventory/**'
      - 'ansible/requirements.yml'
      - '.github/workflows/ansible-deploy.yml'
      - '!ansible/docs/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-deploy.yml'
      - '!ansible/docs/**'

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint playbooks/*.yml

  deploy:
    name: Deploy Python Application
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with Ansible
        run: |
          cd ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass
          ansible-playbook playbooks/deploy_python.yml \
            -i inventory/hosts.ini \
            --vault-password-file /tmp/vault_pass
          rm -f /tmp/vault_pass

      - name: Verify deployment
        run: |
          sleep 10
          curl -f "http://${{ secrets.VM_HOST }}:8000" >/dev/null
          curl -f "http://${{ secrets.VM_HOST }}:8000/health" >/dev/null
