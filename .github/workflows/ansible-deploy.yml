name: Ansible Deployment

on:
  push:
    branches: [master]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"
  pull_request:
    branches: [master]
    paths:
      - "ansible/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible + ansible-lint
        run: |
          pip install ansible ansible-lint

      # Required for lint/syntax-check because group_vars/all.yml is Vault-encrypted.
      - name: Create vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass
          chmod 600 /tmp/vault_pass

      - name: Lint
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: /tmp/vault_pass
        run: |
          cd ansible
          ansible-lint playbooks/*.yml

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install community.docker

      # SSH setup for connecting to the target VM.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Ansible
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          cd ansible
          echo "$VAULT_PASS" > /tmp/vault_pass
          ansible-playbook playbooks/deploy.yml \
            -e "ansible_host=${{ secrets.VM_HOST }}" \
            --vault-password-file /tmp/vault_pass
          rm /tmp/vault_pass

      # Health checks with timeouts.
      - name: Verify Deployment
        run: |
          sleep 10
          curl -f --max-time 15 http://${{ secrets.VM_HOST }}:5000/health
          curl -f --max-time 15 http://${{ secrets.VM_HOST }}:5000/
