name: Ansible Deployment

on:
  push:
    branches: [main, master]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"

  pull_request:
    branches: [main, master]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"

jobs:

  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          ansible-galaxy collection install community.docker

      - name: Create dummy vault password (required by ansible.cfg)
        working-directory: ansible
        run: |
          echo "dummy" > .vault_pass

      - name: Run ansible-lint
        working-directory: ansible
        run: |
          ansible-lint playbooks/*.yml


  deploy:
    name: Deploy Application
    needs: lint
    runs-on: ubuntu-latest

    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Create vault password file
        working-directory: ansible
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ansible_deploy
          chmod 600 ~/.ssh/ansible_deploy
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Generate CI inventory
        working-directory: ansible/inventory
        run: |
          cat <<EOF > ci_hosts.ini
          [webservers]
          ci ansible_host=${{ secrets.VM_HOST }} ansible_user=${{ secrets.VM_USER }} ansible_ssh_private_key_file=~/.ssh/ansible_deploy
          EOF

      - name: Deploy with Ansible
        working-directory: ansible
        run: |
          ansible-playbook playbooks/deploy.yml \
            -i inventory/ci_hosts.ini \
            --tags app_deploy

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.VM_HOST }}:8000
          curl -f http://${{ secrets.VM_HOST }}:8000/health