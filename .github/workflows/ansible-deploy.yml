# Ansible: lint on PR, deploy on push to ansible/ or workflow file.
name: Ansible Deployment

on:
  push:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint playbooks/*.yml

  deploy:
    name: Deploy Application
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and collections
        run: |
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy with Ansible
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          cd ansible
          echo "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault_pass
          chmod 600 /tmp/vault_pass
          # Override inventory key path: CI writes key to ~/.ssh/id_rsa (runner home), not /home/olesia/.ssh/id_rsa
          ansible-playbook playbooks/deploy.yml \
            -i inventory/hosts.ini \
            --vault-password-file /tmp/vault_pass \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/id_rsa"
          rm -f /tmp/vault_pass

      - name: Verify deployment
        run: |
          sleep 10
          # App listens on port 5000 (set in vault app_port); use VM_APP_PORT secret if you use a different port
          curl -f --connect-timeout 10 "http://${{ secrets.VM_HOST }}:5000" || exit 1
          curl -f --connect-timeout 10 "http://${{ secrets.VM_HOST }}:5000/health" || exit 1
