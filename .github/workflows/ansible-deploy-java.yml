name: Ansible Deployment - Java App

on:
  push:
    branches: [ main, master, lab06 ]
    paths:
      - 'ansible/vars/app_java.yml'
      - 'ansible/playbooks/deploy_java.yml'
      - 'ansible/roles/web_app/**'
      - '.github/workflows/ansible-deploy-java.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ansible/vars/app_java.yml'
      - 'ansible/playbooks/deploy_java.yml'
      - 'ansible/roles/web_app/**'

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and lint
        run: |
          pip install ansible ansible-lint

      - name: Install required collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write vault password file
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$VAULT_PASS" > ansible/.vault_pass
          chmod 600 ansible/.vault_pass

      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint playbooks/provision.yml playbooks/deploy.yml playbooks/deploy_java.yml

  deploy:
    name: Deploy Java Application
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible and dependencies
        run: |
          if ! command -v ansible-playbook &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ansible
          fi

      - name: Install required collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml
      
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Ansible
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          cd ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass
          ansible-playbook playbooks/deploy_java.yml \
            --vault-password-file /tmp/vault_pass
          rm /tmp/vault_pass

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://localhost:8001 || exit 1
