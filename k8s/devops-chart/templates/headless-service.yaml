apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-chart.fullname" . }}-headless
spec:
  clusterIP: None
  selector:
    {{- include "devops-chart.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http