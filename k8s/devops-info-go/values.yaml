replicaCount: 2

nameOverride: ""
fullnameOverride: ""

commonLabels:
  app.kubernetes.io/component: web
  app.kubernetes.io/part-of: lab10

image:
  # Default bonus image matches the Lab 9 local-kind workflow.
  # On a clean machine, build it from app_go/ and load it into kind before install:
  #   docker build -t devops-info-go:lab02 app_go
  #   kind load docker-image devops-info-go:lab02 --name devops-lab9
  # For registry-backed clusters, override image.repository and image.tag.
  repository: devops-info-go
  tag: lab02
  pullPolicy: IfNotPresent

config:
  host: 0.0.0.0
  port: 8080
  debug: false

containerPort: 8080
revisionHistoryLimit: 5
minReadySeconds: 5
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 80
  targetPort: http

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  path: /health
  port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  path: /health
  port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
