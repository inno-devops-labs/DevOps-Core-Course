nameOverride: devops-info
fullnameOverride: ""

partOf: devops-lab10

replicaCount: 2
revisionHistoryLimit: 5
minReadySeconds: 5
progressDeadlineSeconds: 60
terminationGracePeriodSeconds: 30

image:
  repository: devops-info-service
  tag: lab09
  pullPolicy: IfNotPresent

containerPort: 5000

service:
  type: ClusterIP
  port: 80
  targetPort: http

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

probes:
  startup:
    enabled: true
    httpGet:
      path: /health
      port: http
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    enabled: true
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

env:
  HOST: "0.0.0.0"
  PORT: "5000"
  LOG_LEVEL: "INFO"
  SERVICE_NAME: "devops-info-alt"
  SERVICE_VERSION: "1.1.0"
  SERVICE_DESCRIPTION: "Secondary Helm deployment of the DevOps info service"
  SERVICE_VARIANT: "secondary"
