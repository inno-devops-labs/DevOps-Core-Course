replicaCount: 2

nameOverride: ""
fullnameOverride: ""

image:
  repository: hashicorp/http-echo
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5678
  nodePort: 30081

resources:
  requests:
    cpu: "50m"
    memory: "32Mi"
  limits:
    cpu: "100m"
    memory: "64Mi"

echoText: "Hello from devops-echo-service"
