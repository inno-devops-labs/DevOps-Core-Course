{{- if .Values.statefulset.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "info-service.fullname" . }}
  labels:
    {{- include "info-service.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "info-service.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "info-service.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.statefulset.updateStrategy.type }}
  template:
    metadata:
      labels:
        {{- include "info-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.initContainers.enabled }}
      {{- $waitService := default (printf "%s-headless" (include "info-service.fullname" .)) .Values.initContainers.waitForService }}
      initContainers:
      - name: init-download
        image: busybox:1.36
        command:
          - sh
          - -c
          - wget -O /work-dir/index.html {{ .Values.initContainers.downloadUrl | quote }} && echo "Download complete"
        volumeMounts:
        - name: workdir
          mountPath: /work-dir
      - name: wait-for-service
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nslookup {{ $waitService }}; do
              echo "Waiting for {{ $waitService }}..."
              sleep 2
            done
      {{- end }}
      containers:
      - name: {{ include "info-service.name" . }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - secretRef:
            name: {{ include "info-service.fullname" . }}-secret
        - configMapRef:
            name: {{ include "info-service.fullname" . }}-env
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: data
          mountPath: /data
        {{- if .Values.initContainers.enabled }}
        - name: workdir
          mountPath: /init-data
        {{- end }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
      volumes:
      - name: config-volume
        configMap:
          name: {{ include "info-service.fullname" . }}-config
      {{- if .Values.initContainers.enabled }}
      - name: workdir
        emptyDir: {}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
{{- end }}
