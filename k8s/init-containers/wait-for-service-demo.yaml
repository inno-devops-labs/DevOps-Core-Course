apiVersion: apps/v1
kind: Deployment
metadata:
  name: wait-target
  namespace: init-demo
  labels:
    app: wait-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wait-target
  template:
    metadata:
      labels:
        app: wait-target
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: wait-target
  namespace: init-demo
spec:
  selector:
    app: wait-target
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wait-client
  namespace: init-demo
  labels:
    app: wait-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wait-client
  template:
    metadata:
      labels:
        app: wait-client
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nslookup wait-target.init-demo.svc.cluster.local;
              do echo "waiting for wait-target"; sleep 2; done;
              echo "service ready"
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
