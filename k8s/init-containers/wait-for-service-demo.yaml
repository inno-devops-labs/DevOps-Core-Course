apiVersion: apps/v1
kind: Deployment
metadata:
  name: wait-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wait-backend
  template:
    metadata:
      labels:
        app: wait-backend
    spec:
      containers:
        - name: backend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: wait-backend
  namespace: default
spec:
  selector:
    app: wait-backend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-wait-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: init-wait-demo
  template:
    metadata:
      labels:
        app: init-wait-demo
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://wait-backend.default.svc.cluster.local >/dev/null; do
                echo "waiting for wait-backend..."
                sleep 2
              done
              echo "wait-backend is reachable"
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Main app started after dependency became reachable"
              sleep 3600
