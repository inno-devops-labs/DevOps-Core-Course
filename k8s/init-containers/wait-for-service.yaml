apiVersion: v1
kind: Pod
metadata:
  name: wait-pod
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - until nslookup myservice; do echo waiting for myservice; sleep 2; done
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: myservice
spec:
  ports:
    - port: 80
      targetPort: 8080
