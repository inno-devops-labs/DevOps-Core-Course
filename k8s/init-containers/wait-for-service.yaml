# Lab 16, Task 3 — "Wait-for-service" init container pattern.
#
# Apply with:
#   kubectl apply -f k8s/init-containers/wait-for-service.yaml
#
# The init container blocks the main container until DNS for
# `devops-info-service` resolves. To see it work end-to-end:
#
#   1. kubectl delete service devops-info-service   # break dependency
#   2. kubectl apply -f k8s/init-containers/wait-for-service.yaml
#      kubectl get pods -w                          # Status: Init:0/1
#   3. helm upgrade --install ... (or kubectl apply for the service)
#      The pod proceeds to Running as soon as nslookup succeeds.
apiVersion: v1
kind: Pod
metadata:
  name: wait-for-service-demo
  labels:
    app: wait-for-service-demo
    lab: "16"
spec:
  restartPolicy: OnFailure
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Waiting for service devops-info-service ..."
          until nslookup devops-info-service-devops-info-service.default.svc.cluster.local; do
            echo "service not ready, retry in 2s"
            sleep 2
          done
          echo "service is reachable, starting main container"
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "main container starting"
          wget -qO- http://devops-info-service-devops-info-service.default.svc.cluster.local/health || true
          # keep pod alive so we can inspect logs
          sleep 600
