apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  labels:
    app: init-demo
spec:
  initContainers:
    # Init container 1: download a file
    - name: init-download
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Downloading example page..."
          wget -O /work-dir/index.html https://example.com
          echo "Download complete. File size: $(wc -c < /work-dir/index.html) bytes"
      volumeMounts:
        - name: workdir
          mountPath: /work-dir

    # Init container 2: wait for kubernetes service to be available
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Waiting for kubernetes service..."
          until nslookup kubernetes.default.svc.cluster.local; do
            echo "Service not ready, retrying in 2s..."
            sleep 2
          done
          echo "Service is ready!"
      volumeMounts:
        - name: workdir
          mountPath: /work-dir

  containers:
    - name: main-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Main container started!"
          echo "Downloaded file content (first 100 chars):"
          head -c 100 /data/index.html
          echo ""
          echo "Sleeping..."
          sleep 3600
      volumeMounts:
        - name: workdir
          mountPath: /data

  volumes:
    - name: workdir
      emptyDir: {}
