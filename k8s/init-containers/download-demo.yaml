apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-download-demo
  namespace: init-demo
  labels:
    app: init-download-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: init-download-demo
  template:
    metadata:
      labels:
        app: init-download-demo
    spec:
      initContainers:
        - name: init-download
          image: busybox:1.36
          command:
            - sh
            - -c
            - wget -qO /work-dir/index.html https://example.com && echo "download complete"
          volumeMounts:
            - name: workdir
              mountPath: /work-dir
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
          volumeMounts:
            - name: workdir
              mountPath: /data
      volumes:
        - name: workdir
          emptyDir: {}
