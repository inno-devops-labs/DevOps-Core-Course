apiVersion: v1
kind: Pod
metadata:
  name: init-download-demo
  namespace: default
  labels:
    app: init-download-demo
spec:
  initContainers:
    - name: init-download
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          wget -O /work-dir/index.html http://example.com
          ls -l /work-dir
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Main container started"
          sleep 3600
      volumeMounts:
        - name: workdir
          mountPath: /data
  volumes:
    - name: workdir
      emptyDir: {}
