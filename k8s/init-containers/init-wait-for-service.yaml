apiVersion: v1
kind: Pod
metadata:
  name: init-wait-demo
  namespace: default
  labels:
    app: init-wait-demo
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - "until nslookup myservice.default.svc.cluster.local; do echo waiting for myservice; sleep 2; done"
  containers:
    - name: main-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "echo dependency ready && sleep 3600"
---
apiVersion: v1
kind: Service
metadata:
  name: myservice
  namespace: default
spec:
  selector:
    app: myservice-backend
  ports:
    - port: 80
      targetPort: 80
