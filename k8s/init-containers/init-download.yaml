apiVersion: v1
kind: Pod
metadata:
  name: init-download-demo
  namespace: lab16
  labels:
    app: init-download-demo
spec:
  initContainers:
    - name: init-download
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          wget -q -O /work-dir/index.html https://kubernetes.io/ && \
          echo "downloaded $(wc -c < /work-dir/index.html) bytes"
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: workdir
          mountPath: /usr/share/nginx/html
  volumes:
    - name: workdir
      emptyDir: {}
