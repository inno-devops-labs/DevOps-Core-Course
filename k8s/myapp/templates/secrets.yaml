apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myapp.fullname" . }}-secret
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.secret.username | default "placeholder-user" }}
  password: {{ .Values.secret.password | default "placeholder-pass" }}