apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "myapp.fullname" . }}
spec:
  serviceName: {{ include "myapp.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "myapp.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "myapp.name" . }}

    spec:
      initContainers:
        - name: init-download
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              wget -O /work-dir/index.html https://example.com
          volumeMounts:
            - name: workdir
              mountPath: /work-dir

        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nslookup kubernetes.default.svc.cluster.local; do
                echo waiting for kubernetes service
                sleep 2
              done
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          envFrom:
            - configMapRef:
                name: {{ include "myapp.fullname" . }}-env

          volumeMounts:
            - name: config-volume
              mountPath: /config

            - name: data
              mountPath: /data

            - name: workdir
              mountPath: /data/init

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 3

      volumes:
        - name: workdir
          emptyDir: {}

        - name: config-volume
          configMap:
            name: {{ include "myapp.fullname" . }}-config

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{ .Values.persistence.size }}