# Bonus second app: nginx static site — different image and config from the Python service
apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-html
  labels:
    app: app2-nginx
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head><meta charset="utf-8"><title>App 2</title></head>
    <body><h1>Second application (Lab 9 bonus)</h1><p>nginx + ConfigMap</p></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-nginx
  labels:
    app: app2-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2-nginx
  template:
    metadata:
      labels:
        app: app2-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: html
          configMap:
            name: app2-html
---
apiVersion: v1
kind: Service
metadata:
  name: app2-service
  labels:
    app: app2-nginx
spec:
  type: ClusterIP
  selector:
    app: app2-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
