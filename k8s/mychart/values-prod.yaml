# PROD Environment Configuration
# Purpose: Production environment with high availability
# Characteristics: Multiple replicas, strict resource limits, comprehensive health checks

replicaCount: 3

image:
  repository: myapp
  tag: "1.0"      
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

env: production
logLevel: warn

# Pod Disruption Budget for high availability
podDisruptionBudget:
  minAvailable: 2