# DEV Environment Configuration
# Purpose: Development and testing environment
# Characteristics: Lower replica count, relaxed resource limits, faster probes

replicaCount: 1

image:
  repository: daniil20xx/myapp
  tag: "latest"  
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 2

env: development
logLevel: debug