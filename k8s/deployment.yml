apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-python-app
  labels:
    app: devops-python-app
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-python-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devops-python-app
        version: v1.0.0
    spec:
      containers:
      - name: devops-python-app
        image: 4hellboy4/devops-info-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        securityContext:
          allowPrivilegeEscalation: false