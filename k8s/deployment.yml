apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-info
  labels:
    app: devops-info
    app.kubernetes.io/name: devops-info-service
    app.kubernetes.io/part-of: devops-core-course
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-info
  template:
    metadata:
      labels:
        app: devops-info
        app.kubernetes.io/name: devops-info-service
    spec:
      containers:
        - name: app
          image: j0cos/devops-info-service:lab02
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5000"
            - name: DEBUG
              value: "false"
            - name: RELEASE_VERSION
              value: "v1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
