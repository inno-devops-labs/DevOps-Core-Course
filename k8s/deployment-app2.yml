apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-info-service-v2
  labels:
    app: devops-info-service-v2
    version: "2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-info-service-v2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devops-info-service-v2
        version: "2.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: devops-info-service-v2
          image: plaffyyy9/devops-info-service:lab9
          ports:
            - containerPort: 5001
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5001"
            - name: DEBUG
              value: "false"
            - name: APP_INSTANCE
              value: "v2"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: devops-info-service-v2
  labels:
    app: devops-info-service-v2
spec:
  type: ClusterIP
  selector:
    app: devops-info-service-v2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5001
