apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-info-v2
  labels:
    app: devops-info-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-info-v2
  template:
    metadata:
      labels:
        app: devops-info-v2
    spec:
      containers:
        - name: devops-info-v2
          image: merkulovlr05/devops-info:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: APP_VARIANT
              value: "v2"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devops-info-v2
spec:
  type: ClusterIP
  selector:
    app: devops-info-v2
  ports:
    - port: 80
      targetPort: 5000
