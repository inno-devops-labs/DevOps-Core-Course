apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-info-service-v2
  labels:
    app: devops-info-service-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-info-service-v2
  template:
    metadata:
      labels:
        app: devops-info-service-v2
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: devops-info-service-v2
          image: devops-info-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
