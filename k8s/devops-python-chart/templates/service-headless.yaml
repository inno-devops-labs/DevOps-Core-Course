{{- if .Values.statefulset.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-python-chart.fullname" . }}-headless
  labels:
    {{- include "devops-python-chart.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "devops-python-chart.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
{{- end }}
