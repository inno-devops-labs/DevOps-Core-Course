replicaCount: 2

image:
  repository: gpshfrd/devops-info-python
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10

env:
  APP_ENV: "development"
  LOG_LEVEL: "debug"

secrets:
  username: "app-user"
  password: "changeme123"
  apiKey: "dev-api-key-123"
