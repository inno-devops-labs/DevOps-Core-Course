fullnameOverride: devops-info-python

replicaCount: 3

image:
  tag: "python"
  pullPolicy: IfNotPresent

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "8080"
  - name: DEBUG
    value: "False"
  - name: VISITS_FILE
    value: "/data/visits"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

persistence:
  enabled: true
  size: 100Mi
  storageClass: standard

vault:
  enabled: false

secrets:
  DB_USERNAME: "admin"
  DB_PASSWORD: "S3cur3P@ssw0rd"

rollout:
  enabled: false

statefulset:
  enabled: true
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
