replicaCount: 5

app:
  environment: canary

persistence:
  enabled: false

rollout:
  enabled: true
  strategy: canary
  canary:
    maxSurge: 1
    maxUnavailable: 0

analysis:
  enabled: true
  metricName: health-check
  interval: 10s
  count: 3
  failureLimit: 1
  timeoutSeconds: 5
  jsonPath: "{$.status}"
  successCondition: "result == 'healthy'"

service:
  type: ClusterIP

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
