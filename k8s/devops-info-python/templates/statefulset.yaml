{{- include "devops-info-python.validateValues" . -}}
{{- if and (not .Values.rollout.enabled) .Values.statefulset.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  serviceName: {{ printf "%s-headless" (include "common.fullname" .) }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ .Values.statefulset.podManagementPolicy }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.statefulset.updateStrategy.type }}
    {{- if eq .Values.statefulset.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      partition: {{ .Values.statefulset.updateStrategy.rollingUpdate.partition }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "common.labels" . | nindent 8 }}
      {{- $hasSecretChecksum := and .Values.secret.create (not .Values.secret.existingSecret) }}
      {{- $hasVaultAnnotations := .Values.vault.enabled }}
      annotations:
        checksum/config-file: {{ include "devops-info-python.renderedConfigFile" . | sha256sum }}
        checksum/config-env: {{ dict "appName" .Values.app.name "environment" .Values.app.environment "appMessage" (printf "Lab 12 release %s in %s" .Release.Name .Values.app.environment) "host" .Values.config.host "port" .Values.config.port "logLevel" .Values.config.logLevel "configFilePath" (include "devops-info-python.configFilePath" .) "visitsFilePath" (include "devops-info-python.visitsFilePath" .) "featureFlags" .Values.featureFlags | toJson | sha256sum }}
        {{- if $hasSecretChecksum }}
        checksum/secret: {{ printf "%s:%s:%s" (include "devops-info-python.secretName" .) .Values.secret.username .Values.secret.password | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $hasVaultAnnotations }}
        {{- include "devops-info-python.vaultAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "devops-info-python.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "common.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "devops-info-python.envConfigMapName" . }}
          env:
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-info-python.secretName" . }}
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-info-python.secretName" . }}
                  key: password
          volumeMounts:
            - name: config-volume
              mountPath: {{ .Values.app.configMountPath }}
              readOnly: true
            - name: data-volume
              mountPath: {{ .Values.app.dataMountPath }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- include "common.httpProbe" .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- include "common.httpProbe" .Values.readinessProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "devops-info-python.configMapName" . }}
  volumeClaimTemplates:
    - metadata:
        name: data-volume
        labels:
          {{- include "common.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
{{- end }}
