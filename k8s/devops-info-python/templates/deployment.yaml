{{- if and (not .Values.rollout.enabled) (not .Values.statefulset.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.vault }}
        {{- if .enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .role | quote }}
        vault.hashicorp.com/agent-inject-secret-config: {{ .secretPath | quote }}
        {{- if .template }}
        vault.hashicorp.com/agent-inject-template-config: |
          {{- .template | nindent 10 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "common.fullname" . }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        {{- if .Values.initContainers.download.enabled }}
        - name: init-download
          image: {{ .Values.initContainers.download.image | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[init-download] fetching {{ .Values.initContainers.download.url }}"
              wget -O {{ .Values.initContainers.download.targetPath }} {{ .Values.initContainers.download.url }}
              echo "[init-download] saved:"
              ls -la {{ .Values.initContainers.download.mountPath }}
          volumeMounts:
            - name: work-dir
              mountPath: {{ .Values.initContainers.download.mountPath }}
        {{- end }}
        {{- if .Values.initContainers.wait.enabled }}
        - name: init-wait
          image: {{ .Values.initContainers.wait.image | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              SVC="{{ .Values.initContainers.wait.service }}"
              END=$(( $(date +%s) + {{ .Values.initContainers.wait.timeoutSeconds }} ))
              echo "[init-wait] waiting for $SVC"
              until nslookup "$SVC" >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$END" ]; then
                  echo "[init-wait] timeout waiting for $SVC"
                  exit 1
                fi
                echo "[init-wait] $SVC not resolvable yet, retrying..."
                sleep 2
              done
              echo "[init-wait] $SVC resolved, proceeding"
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- if .Values.env }}
          env:
            {{- include "common.envVars" . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "common.fullname" . }}-secret
            - configMapRef:
                name: {{ include "common.fullname" . }}-env
          volumeMounts:
            - name: config-volume
              mountPath: /config
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: /data
            {{- end }}
            {{- if and .Values.initContainers.enabled .Values.initContainers.download.enabled }}
            - name: work-dir
              mountPath: {{ .Values.initContainers.mainMountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "common.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "common.fullname" . }}-data
        {{- end }}
        {{- if and .Values.initContainers.enabled .Values.initContainers.download.enabled }}
        - name: work-dir
          emptyDir: {}
        {{- end }}
{{- end }}
