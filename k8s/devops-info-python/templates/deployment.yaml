apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    app: {{ include "common.legacyAppLabel" . }}
    component: api
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ include "common.legacyAppLabel" . }}
  template:
    metadata:
      labels:
        app: {{ include "common.legacyAppLabel" . }}
        component: api
        {{- include "common.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config-file: {{ include (print $.Template.BasePath "/configmap-file.yaml") . | sha256sum }}
        checksum/config-env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-config: {{ .Values.vault.secretPathConfig | quote }}
        {{- if .Values.vault.bonusTemplate.enabled }}
        vault.hashicorp.com/agent-inject-secret-app.env: {{ .Values.vault.secretPathConfig | quote }}
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{ "{{" }}- with secret {{ .Values.vault.secretPathConfig | quote }} -{{ "}}" }}
          USERNAME={{ "{{" }} .Data.data.username {{ "}}" }}
          PASSWORD={{ "{{" }} .Data.data.password {{ "}}" }}
          {{ "{{" }}- end -{{ "}}" }}

          {{ "{{" }}- with secret {{ .Values.vault.secretPathExtra | quote }} -{{ "}}" }}
          API_KEY={{ "{{" }} .Data.data.api_key {{ "}}" }}
          {{ "{{" }}- end -{{ "}}" }}
        {{- if .Values.vault.bonusTemplate.injectCommand }}
        vault.hashicorp.com/agent-inject-command: {{ .Values.vault.bonusTemplate.injectCommand | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "common.fullname" .) }}
      {{- end }}
      containers:
        - name: {{ include "common.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: http
          {{- if or .Values.config.env.enabled .Values.secrets.enabled }}
          envFrom:
            {{- if .Values.config.env.enabled }}
            - configMapRef:
                name: {{ include "common.fullname" . }}-env
            {{- end }}
            {{- if .Values.secrets.enabled }}
            - secretRef:
                name: {{ include "common.fullname" . }}-credentials
            {{- end }}
          {{- end }}
          env:
            {{- include "devops-info-python.envVars" . | nindent 12 }}
            {{- toYaml .Values.env | nindent 12 }}
          volumeMounts:
            {{- if .Values.config.file.enabled }}
            - name: config-volume
              mountPath: {{ .Values.config.file.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        {{- if .Values.config.file.enabled }}
        - name: config-volume
          configMap:
            name: {{ include "common.fullname" . }}-config
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "common.fullname" . }}-data
        {{- end }}
