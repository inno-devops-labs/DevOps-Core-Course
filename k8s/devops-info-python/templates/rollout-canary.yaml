{{- if .Values.rollout.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    app: {{ include "common.legacyAppLabel" . }}
    component: api
    strategy: canary
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "common.legacyAppLabel" . }}
  template:
    metadata:
      labels:
        app: {{ include "common.legacyAppLabel" . }}
        component: api
        {{- include "common.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config-file: {{ include (print $.Template.BasePath "/configmap-file.yaml") . | sha256sum }}
        checksum/config-env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-config: {{ .Values.vault.secretPathConfig | quote }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "common.fullname" .) }}
      {{- end }}
      containers:
        - name: {{ include "common.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: http
          {{- if or .Values.config.env.enabled .Values.secrets.enabled }}
          envFrom:
            {{- if .Values.config.env.enabled }}
            - configMapRef:
                name: {{ include "common.fullname" . }}-env
            {{- end }}
            {{- if .Values.secrets.enabled }}
            - secretRef:
                name: {{ include "common.fullname" . }}-credentials
            {{- end }}
          {{- end }}
          env:
            {{- include "devops-info-python.envVars" . | nindent 12 }}
            {{- toYaml .Values.env | nindent 12 }}
          volumeMounts:
            {{- if .Values.config.file.enabled }}
            - name: config-volume
              mountPath: {{ .Values.config.file.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        {{- if .Values.config.file.enabled }}
        - name: config-volume
          configMap:
            name: {{ include "common.fullname" . }}-file
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "common.fullname" . }}
        {{- end }}
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 40
        - pause:
            duration: {{ .Values.rollout.canary.pauseDuration | quote }}
        - setWeight: 60
        - pause:
            duration: {{ .Values.rollout.canary.pauseDuration | quote }}
        - setWeight: 80
        - pause:
            duration: {{ .Values.rollout.canary.pauseDuration | quote }}
        - setWeight: 100
      canaryService: {{ include "common.fullname" . }}-canary
      stableService: {{ include "common.fullname" . }}
      maxSurge: "25%"
      maxUnavailable: 0
{{- end }}
