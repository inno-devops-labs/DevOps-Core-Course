apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.fullname" . }}-post-install
  labels:
    app: {{ include "common.legacyAppLabel" . }}
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: {{ include "common.legacyAppLabel" . }}
        {{- include "common.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-job
          image: {{ .Values.hooks.postInstall.image | quote }}
          command:
            - sh
            - -c
            - |
              svc='{{ include "common.serviceName" . }}'
              echo "post-install: service=${svc}"
              sleep 5
              echo "post-install: ok"
