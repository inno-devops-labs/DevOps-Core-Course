{{- if .Values.statefulset.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}-headless
  labels:
    app: {{ include "common.legacyAppLabel" . }}
    component: headless
    {{- include "common.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ include "common.legacyAppLabel" . }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- end }}
