replicaCount: 3

image:
  repository: aezuraa/devops-info-service
  tag: "python"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

containerPort: 8080

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "8080"
  - name: DEBUG
    value: "False"

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3

secrets:
  DB_USERNAME: "placeholder"
  DB_PASSWORD: "placeholder"

vault:
  enabled: true
  role: "devops-info"
  secretPath: "secret/data/devops-info/config"
  template: |
    {{- with secret "secret/data/devops-info/config" -}}
    DB_USERNAME={{ .Data.data.username }}
    DB_PASSWORD={{ .Data.data.password }}
    API_KEY={{ .Data.data.api_key }}
    {{- end -}}

config:
  environment: "dev"
  logLevel: "INFO"
  appName: "devops-info-python"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

rollout:
  enabled: false
  strategy: canary
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause: { duration: 30s }
      - setWeight: 60
      - pause: { duration: 30s }
      - setWeight: 80
      - pause: { duration: 30s }
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: 0
    scaleDownDelaySeconds: 30
  analysis:
    enabled: false
    interval: 10s
    count: 3
    failureLimit: 1

statefulset:
  enabled: false
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    # partition: 0  # uncomment to freeze pods with ordinal < N

# Lab 16 — init containers demo (download + wait-for-service patterns).
# Gated so existing scenarios (rollout / statefulset / plain deployment) are unaffected.
initContainers:
  enabled: false
  download:
    enabled: true
    image: busybox:1.36
    url: "https://example.com"
    targetPath: "/work-dir/index.html"
    mountPath: "/work-dir"
  wait:
    enabled: true
    image: busybox:1.36
    # Service to wait for (FQDN or short name resolvable from the pod).
    service: "monitoring-grafana.monitoring.svc.cluster.local"
    timeoutSeconds: 120
  # Mount path inside the main container where downloaded artifacts appear.
  mainMountPath: "/work-dir"

# Lab 16 — ServiceMonitor CRD for Prometheus Operator scraping.
# `release` label must match the kube-prometheus-stack Helm release name
# (default selector: `release: monitoring`).
serviceMonitor:
  enabled: false
  release: monitoring
  endpoint:
    port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
