# Production environment values
# Usage: helm install prod-release k8s/devops-info-chart -f k8s/devops-info-chart/values-prod.yaml

replicaCount: 5

image:
  tag: "lab02"

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"

service:
  type: LoadBalancer
  port: 80
  targetPort: 5000
  # nodePort is omitted for LoadBalancer — auto-assigned by the cloud provider

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3
