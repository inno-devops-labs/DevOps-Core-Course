# Default values for devops-info-chart.
# Override these values using:
#   helm install myrelease k8s/devops-info-chart -f k8s/devops-info-chart/values-dev.yaml

# Number of pod replicas
replicaCount: 3

image:
  repository: vladimirzhidkov/devops-info-service
  tag: "lab02"
  pullPolicy: IfNotPresent

# Optional name overrides (leave empty to use defaults)
nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

serviceMonitor:
  enabled: false
  labels:
    release: monitoring
  interval: 30s
  path: /metrics

initContainers:
  enabled: false
  download:
    enabled: true
    image: busybox:1.36
    url: "http://example.com"
    outputFile: "index.html"
  waitForService:
    enabled: true
    image: busybox:1.36
    host: "kubernetes.default.svc.cluster.local"
  sharedVolume:
    name: init-workdir
    initMountPath: /work-dir
    appMountPath: /init-data

# Environment variables passed into the container
env:
  - name: PORT
    value: "5000"

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Liveness probe — determines whether the container is alive
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Readiness probe — determines whether the container is ready to accept traffic
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# Rolling update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Service account used for Vault Kubernetes authentication
serviceAccount:
  name: "default"

# Application secrets — store placeholder values here; never commit real secrets.
# Override during deploy: helm upgrade ... --set secrets.password=real-value
# Or use an external secret manager (Vault, AWS Secrets Manager, etc.)
secrets:
  username: "app-user"
  password: "changeme"
  apiKey: "placeholder-api-key"

# HashiCorp Vault Agent Injector integration
vault:
  enabled: false
  role: "devops-info-role"
  secretPath: "myapp/config"

# Named-template environment variables (bonus — DRY pattern)
appEnv: "production"
logLevel: "info"

# Persistent storage for the visits counter
persistence:
  enabled: true
  size: 100Mi
  storageClass: ""       # empty string = use cluster default
  visitsFile: "/data/visits"

# StatefulSet mode - use for workloads that need stable pod identities and
# separate persistent storage per replica.
statefulset:
  enabled: false
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate   # RollingUpdate | OnDelete
    rollingUpdate:
      partition: 0

# Argo Rollouts — progressive delivery (replaces Deployment when enabled)
rollout:
  enabled: false
  strategy: canary   # canary | blueGreen
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: null
  analysis:
    enabled: false
