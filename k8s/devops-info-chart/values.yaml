replicaCount: 3

nameOverride: ""
fullnameOverride: ""

image:
  repository: alsstarikova/devops-info-service
  tag: "lab09"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30080

container:
  name: devops-info-service
  port: 5000
  workingDir: /home/app
  command:
    - python
    - -m
    - uvicorn
  args:
    - app:app
    - --host
    - 0.0.0.0
    - --port
    - "5000"

env:
  - name: PORT
    value: "5000"
  - name: PYTHONPATH
    value: "/home/app"
  - name: VISITS_FILE
    value: "/data/visits"

appConfig:
  name: "devops-info-service"
  environment: "dev"
  logLevel: "INFO"
  defaultTimezone: "UTC"
  features:
    visitsCounter: true
    metricsEnabled: true

configMaps:
  enabled: true

persistence:
  enabled: true
  nameOverride: ""
  size: 100Mi
  accessMode: ReadWriteOnce
  storageClass: ""
  mountPath: /data

secrets:
  enabled: true
  nameOverride: ""
  data:
    username: "change-me"
    password: "change-me"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

securityContext:
  allowPrivilegeEscalation: false

deployment:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

hooks:
  image: busybox:1.36
  preInstall:
    weight: -5
    command:
      - sh
      - -c
      - echo Pre-install check && sleep 5 && echo Pre-install completed
  postInstall:
    weight: 5
    command:
      - sh
      - -c
      - echo Post-install smoke test && sleep 5 && echo Post-install completed

serviceAccount:
  create: true
  nameOverride: ""

vault:
  enabled: false
  role: "devops-info-role"
  agentInjectSecretPath: "secret/data/myapp/config"
