{{- if .Values.configMaps.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info.configFileConfigMapName" . }}
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
data:
  config.json: |-
    {{- tpl (.Files.Get "files/config.json") . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info.configEnvConfigMapName" . }}
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.appConfig.name | quote }}
  APP_ENV: {{ .Values.appConfig.environment | quote }}
  LOG_LEVEL: {{ .Values.appConfig.logLevel | quote }}
  FEATURE_VISITS_COUNTER: {{ .Values.appConfig.features.visitsCounter | quote }}
  FEATURE_METRICS_ENABLED: {{ .Values.appConfig.features.metricsEnabled | quote }}
{{- end }}
