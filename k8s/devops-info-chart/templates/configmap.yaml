{{/*
ConfigMap that mounts config.json as a file inside the pod.
Mounted at /config/config.json.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-chart.fullname" . }}-config
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  config.json: |-
{{ .Files.Get "files/config.json" | indent 4 }}
