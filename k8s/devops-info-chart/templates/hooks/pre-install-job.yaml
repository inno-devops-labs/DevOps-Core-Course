apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "common.fullname" . }}-pre-install"
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    # This job runs BEFORE all chart resources are installed
    "helm.sh/hook": pre-install
    # Lower weight runs first; -5 means this runs before other pre-install hooks
    "helm.sh/hook-weight": "-5"
    # Delete this job once it has succeeded to keep the cluster clean
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "common.fullname" . }}-pre-install"
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
        helm.sh/hook: pre-install
    spec:
      restartPolicy: Never
      containers:
        - name: pre-install-job
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "=== Pre-install hook started ==="
              echo "Release: {{ .Release.Name }}"
              echo "Namespace: {{ .Release.Namespace }}"
              echo "Running environment validation..."
              sleep 5
              echo "Checking required configuration..."
              echo "  Image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              echo "  Replicas: {{ .Values.replicaCount }}"
              echo "  Service type: {{ .Values.service.type }}"
              echo "Validation completed successfully."
              echo "=== Pre-install hook finished ==="
