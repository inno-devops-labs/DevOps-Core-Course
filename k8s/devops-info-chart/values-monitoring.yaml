# Lab 16 monitoring override.
# Enables init containers and Prometheus Operator ServiceMonitor.
serviceMonitor:
  enabled: true
  labels:
    release: monitoring
  interval: 30s
  path: /metrics

initContainers:
  enabled: true
  download:
    enabled: true
    image: busybox:1.36
    url: "http://example.com"
    outputFile: "index.html"
  waitForService:
    enabled: true
    image: busybox:1.36
    host: "kubernetes.default.svc.cluster.local"
  sharedVolume:
    name: init-workdir
    initMountPath: /work-dir
    appMountPath: /init-data
