apiVersion: v1
kind: Pod
metadata:
  name: init-wait-demo
  namespace: default
spec:
  restartPolicy: Never
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - until nslookup wait-backend.default.svc.cluster.local; do echo waiting; sleep 2; done
  containers:
    - name: main-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo service ready && sleep 3600
