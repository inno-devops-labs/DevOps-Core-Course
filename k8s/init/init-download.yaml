apiVersion: v1
kind: Pod
metadata:
  name: init-download-demo
spec:
  initContainers:
  - name: downloader
    image: busybox:1.36
    command: ['sh', '-c', 'wget -O /work-dir/index.html https://example.com']
    volumeMounts:
    - name: workdir
      mountPath: /work-dir
  containers:
  - name: main
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Main container: waiting 300s"; sleep 300']
    volumeMounts:
    - name: workdir
      mountPath: /data
  volumes:
  - name: workdir
    emptyDir: {}
