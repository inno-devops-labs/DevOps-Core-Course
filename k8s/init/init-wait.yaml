apiVersion: v1
kind: Pod
metadata:
  name: init-wait-demo
spec:
  initContainers:
  - name: waiter
    image: busybox:1.36
    command: ['sh', '-c', 'until nslookup kubernetes.default.svc.cluster.local; do echo waiting; sleep 2; done']
  containers:
  - name: main
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Service is ready"; sleep 300']
