apiVersion: v1
kind: Pod
metadata:
  name: wait-backend
  namespace: default
  labels:
    app: wait-backend
spec:
  containers:
    - name: backend
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
---
apiVersion: v1
kind: Service
metadata:
  name: wait-backend
  namespace: default
spec:
  selector:
    app: wait-backend
  ports:
    - port: 80
      targetPort: 80
