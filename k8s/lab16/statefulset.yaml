apiVersion: v1
kind: Service
metadata:
  name: lab16-stateful-web
  labels:
    app.kubernetes.io/name: lab16-stateful-web
    app.kubernetes.io/part-of: devops-core-course
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: lab16-stateful-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lab16-stateful-web
  labels:
    app.kubernetes.io/name: lab16-stateful-web
    app.kubernetes.io/part-of: devops-core-course
spec:
  serviceName: lab16-stateful-web
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lab16-stateful-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab16-stateful-web
        app.kubernetes.io/part-of: devops-core-course
    spec:
      containers:
        - name: app
          image: devops-info-service:lab16
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5000"
            - name: SERVICE_NAME
              value: "lab16-stateful-web"
            - name: VISITS_FILE
              value: "/data/visits"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
