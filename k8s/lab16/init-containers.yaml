apiVersion: v1
kind: Pod
metadata:
  name: lab16-init-download
  labels:
    app.kubernetes.io/name: lab16-init-download
    app.kubernetes.io/part-of: devops-core-course
spec:
  restartPolicy: Always
  initContainers:
    - name: init-download
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - wget -O /work-dir/index.html http://lab16-dependency.default.svc.cluster.local:8080/index.html && ls -l /work-dir/index.html
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: main-app
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - while true; do echo "Downloaded file is available:"; head -n 3 /data/index.html; sleep 3600; done
      volumeMounts:
        - name: workdir
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
  volumes:
    - name: workdir
      emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab16-dependency
  labels:
    app.kubernetes.io/name: lab16-dependency
    app.kubernetes.io/part-of: devops-core-course
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab16-dependency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab16-dependency
        app.kubernetes.io/part-of: devops-core-course
    spec:
      containers:
        - name: dependency
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /www; echo "<html><body>lab16 dependency ready</body></html>" > /www/index.html; httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lab16-dependency
  labels:
    app.kubernetes.io/name: lab16-dependency
    app.kubernetes.io/part-of: devops-core-course
spec:
  selector:
    app.kubernetes.io/name: lab16-dependency
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: lab16-wait-for-service
  labels:
    app.kubernetes.io/name: lab16-wait-for-service
    app.kubernetes.io/part-of: devops-core-course
spec:
  restartPolicy: Always
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - until nslookup lab16-dependency.default.svc.cluster.local; do echo waiting for lab16-dependency; sleep 2; done
  containers:
    - name: main-app
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - while true; do echo dependency is ready; sleep 3600; done
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
