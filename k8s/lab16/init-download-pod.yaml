apiVersion: v1
kind: Pod
metadata:
  name: init-download-demo
  namespace: default
  labels:
    app: init-download-demo
spec:
  restartPolicy: Never
  initContainers:
    - name: init-download
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          wget -O /work-dir/index.html https://example.com
          ls -lah /work-dir
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Main container started. Showing downloaded file:";
          head -n 20 /data/index.html;
          sleep 3600
      volumeMounts:
        - name: workdir
          mountPath: /data
  volumes:
    - name: workdir
      emptyDir: {}
