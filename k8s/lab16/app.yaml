apiVersion: v1
kind: Service
metadata:
  name: lab16-dependency
  namespace: lab16
  labels:
    app.kubernetes.io/name: lab16-dependency
    app.kubernetes.io/part-of: devops-core-course
spec:
  ports:
    - name: dns-proof
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-info-service
  namespace: lab16
  labels:
    app.kubernetes.io/name: devops-info-service
    app.kubernetes.io/instance: lab16
    app.kubernetes.io/part-of: devops-core-course
    monitoring: enabled
spec:
  selector:
    app.kubernetes.io/name: devops-info-service
    app.kubernetes.io/instance: lab16
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: devops-info-service-headless
  namespace: lab16
  labels:
    app.kubernetes.io/name: devops-info-service
    app.kubernetes.io/instance: lab16
    app.kubernetes.io/part-of: devops-core-course
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: devops-info-service
    app.kubernetes.io/instance: lab16
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devops-info-service
  namespace: lab16
  labels:
    app.kubernetes.io/name: devops-info-service
    app.kubernetes.io/instance: lab16
    app.kubernetes.io/part-of: devops-core-course
spec:
  serviceName: devops-info-service-headless
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-info-service
      app.kubernetes.io/instance: lab16
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-info-service
        app.kubernetes.io/instance: lab16
        app.kubernetes.io/part-of: devops-core-course
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nslookup lab16-dependency.lab16.svc.cluster.local; do
                echo "waiting for lab16-dependency"
                sleep 2
              done
              echo "dependency DNS is ready"
        - name: init-download
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              wget -O /work-dir/index.html http://example.com
              test -s /work-dir/index.html
              echo "downloaded $(wc -c < /work-dir/index.html) bytes"
          volumeMounts:
            - name: init-data
              mountPath: /work-dir
      containers:
        - name: app
          image: devops-info-service-go:lab16
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: INIT_FILE_PATH
              value: /data/index.html
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: init-data
              mountPath: /data
      volumes:
        - name: init-data
          emptyDir: {}
