apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-info-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - env: dev
            namespace: dev
            valuesFile: values-dev.yaml
            releaseName: devops-info-dev
            autoSync: true
          - env: prod
            namespace: prod
            valuesFile: values-prod.yaml
            releaseName: devops-info-prod
            autoSync: false
  template:
    metadata:
      name: "devops-info-{{ .env }}"
      labels:
        app.kubernetes.io/part-of: devops-info
    spec:
      project: default
      source:
        repoURL: https://github.com/Linktur/DevOps-Core-Course.git
        targetRevision: lab13
        path: k8s/devops-info-service
        helm:
          releaseName: "{{ .releaseName }}"
          valueFiles:
            - "{{ .valuesFile }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    {{- end }}
