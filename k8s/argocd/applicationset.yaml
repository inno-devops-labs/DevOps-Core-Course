apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-info-service-environments
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - environment: dev
            namespace: dev
            releaseName: devops-info-dev
            valuesFile: values-dev.yaml
            autoSync: true
          - environment: prod
            namespace: prod
            releaseName: devops-info-prod
            valuesFile: values-prod.yaml
            autoSync: false
  template:
    metadata:
      name: 'devops-info-service-{{ .environment }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/egraPA006/DevOps-Core-Course.git
        targetRevision: lab14
        path: k8s/devops-info-service
        helm:
          releaseName: '{{ .releaseName }}'
          valueFiles:
            - '{{ .valuesFile }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    {{- end }}
