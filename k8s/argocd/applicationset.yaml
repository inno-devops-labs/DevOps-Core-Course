apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-info-service
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - appName: devops-info-service-dev
            namespace: dev
            valuesFile: values-dev.yaml
            autoSync: "true"
          - appName: devops-info-service-prod
            namespace: prod
            valuesFile: values-prod.yaml
            autoSync: "false"
  template:
    metadata:
      name: "{{ .appName }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/hikariatama/DevOps-Core-Course.git
        targetRevision: lab14
        path: k8s/devops-info-service
        helm:
          releaseName: "{{ .appName }}"
          valueFiles:
            - values.yaml
            - "{{ .valuesFile }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    {{- end }}
