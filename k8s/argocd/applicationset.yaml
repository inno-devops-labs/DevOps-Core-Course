apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: my-python-app-set
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: dev
            namespace: dev
            valuesFile: values-dev.yaml
            autoSync: "true"
          - env: prod
            namespace: prod
            valuesFile: values-prod.yaml
            autoSync: "false"
  template:
    metadata:
      name: my-python-app-{{ .env }}
    spec:
      project: default
      source:
        repoURL: https://github.com/danielambda/DevOps-Core-Course.git
        targetRevision: lab13
        path: k8s
        helm:
          releaseName: my-python-app-{{ .env }}
          valueFiles:
            - "{{ .valuesFile }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    {{- end }}

