apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CacucoH/DevOps-Core-Course
    targetRevision: lab13
    path: k8s/devops-info-service
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: service.type
          value: NodePort
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true