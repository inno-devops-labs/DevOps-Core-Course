repoURL: https://github.com/Darriyano/DevOps-Core-Course.git
targetRevision: lab13
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: <YOUR_GITHUB_REPO_URL>
    targetRevision: <YOUR_GIT_BRANCH>
    path: k8s/python-app
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
