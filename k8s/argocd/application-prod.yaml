apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rash1d1/DevOps-Core-Course.git
    targetRevision: lab12
    path: k8s/devops-info
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: lab02
        - name: service.type
          value: NodePort
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
