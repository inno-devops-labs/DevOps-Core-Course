# Production: manual sync only — changes require explicit sync (Task 3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Leropsis/DevOps-Core-Course-v.git
    targetRevision: d8a14695fcc4f23c3eb84518c7049c1a851b0b79
    path: k8s/devops-python
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
