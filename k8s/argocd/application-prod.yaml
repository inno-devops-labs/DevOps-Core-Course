apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-info-service-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devops-core-course
    app.kubernetes.io/component: gitops
    app.kubernetes.io/environment: prod
spec:
  project: default
  source:
    repoURL: https://github.com/Ravwvil/DevOps-Core-Course.git
    targetRevision: lab14
    path: k8s/devops-info-service
    helm:
      releaseName: devops-info-service-prod
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
