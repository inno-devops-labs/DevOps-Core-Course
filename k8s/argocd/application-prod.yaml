apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-info-service-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pavorkmertt/DevOps-Core-Course.git
    targetRevision: lab12
    path: k8s/devops-info-service
    helm:
      releaseName: lab13-prod
      valueFiles:
        - values-prod.yaml
      values: |
        replicaCount: 2
        service:
          type: NodePort
          nodePort: 30091
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
