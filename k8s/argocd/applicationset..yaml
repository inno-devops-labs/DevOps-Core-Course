apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devops-info-service-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - env: dev
            namespace: dev
            valuesFile: values-dev.yml
            autoSync: true
          - env: prod
            namespace: prod
            valuesFile: values-prod.yml
            autoSync: false
  template:
    metadata:
      name: 'devops-info-service-{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/CacucoH/DevOps-Core-Course
        targetRevision: lab13
        path: devops-info-service
        helm:
          valueFiles:
            - values.yml
            - '{{.valuesFile}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}