apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devops-lab14
spec:
  project: default
  source:
    repoURL: https://github.com/ellilin/DevOps.git
    targetRevision: lab14
    path: k8s/python-app
    helm:
      releaseName: python-app
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
