# Argo CD Application — baseline deploy (Task 2): manual sync, default namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Leropsis/DevOps-Core-Course-v.git
    targetRevision: lab13-solution
    path: k8s/devops-python
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
