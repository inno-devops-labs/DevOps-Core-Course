# ArgoCD Application — Task 2 (manual sync).
# If you use a fork, change repoURL and targetRevision to match your Git remote and branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/4hellboy4/DevOps-Core-Course.git
    # Должна существовать на origin (например: git push -u origin lab13).
    targetRevision: lab13
    path: k8s/app-python
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
