apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: info-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TurikRoma/DevOps-Core-Course.git
    targetRevision: lab13
    path: k8s/info-service
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
