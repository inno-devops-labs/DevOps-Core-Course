apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pythonapp-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AidarSarvartdinov/DevOps-Core-Course.git
    targetRevision: lab13
    path: k8s/pythonapp
    helm:
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: service.nodePort
          value: "30082"
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
