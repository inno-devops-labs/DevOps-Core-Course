{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-app.configMapName" . }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
data:
  config.json: |-
{{ .Files.Get "files/config.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-app.configEnvName" . }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.appEnv.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.appEnv.LOG_LEVEL | quote }}
  FEATURE_VISITS_COUNTER: {{ .Values.appEnv.FEATURE_VISITS_COUNTER | quote }}
  FEATURE_CONFIGMAP_MOUNT: {{ .Values.appEnv.FEATURE_CONFIGMAP_MOUNT | quote }}
  FEATURE_CONFIGMAP_ENV: {{ .Values.appEnv.FEATURE_CONFIGMAP_ENV | quote }}
{{- end }}
