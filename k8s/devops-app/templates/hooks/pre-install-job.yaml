apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-app.fullname" . }}-pre-install"
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "devops-app.fullname" . }}-pre-install"
    spec:
      restartPolicy: Never
      containers:
        - name: pre-install-check
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "=== Pre-install validation ==="
              echo "Release: {{ .Release.Name }}"
              echo "Chart: {{ .Chart.Name }}-{{ .Chart.Version }}"
              echo "Checking DNS resolution..."
              nslookup kubernetes.default.svc.cluster.local || true
              echo "Pre-install validation completed successfully"
  backoffLimit: 1
