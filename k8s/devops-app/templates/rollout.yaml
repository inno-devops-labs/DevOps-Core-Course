{{- if .Values.rollouts.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "devops-app.fullname" . }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devops-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  strategy:
    {{- if eq .Values.rollouts.strategy "canary" }}
    canary:
      steps:
        {{- range .Values.rollouts.canary.steps }}
        {{- if hasKey . "setWeight" }}
        - setWeight: {{ .setWeight }}
        {{- else if hasKey . "pauseManual" }}
        - pause: {}
        {{- else if hasKey . "pause" }}
        - pause: { duration: "{{ .pause }}" }
        {{- end }}
        {{- end }}
    {{- else }}
    blueGreen:
      activeService: {{ include "devops-app.fullname" . }}
      previewService: {{ .Values.rollouts.blueGreen.previewService }}
      autoPromotionEnabled: {{ .Values.rollouts.blueGreen.autoPromotionEnabled }}
    {{- end }}
{{- end }}
