{{- if and .Values.rollouts.enabled (eq .Values.rollouts.strategy "blueGreen") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-app.fullname" . }}-preview
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    {{- include "devops-app.selectorLabels" . | nindent 4 }}
  type: ClusterIP
{{- end }}
