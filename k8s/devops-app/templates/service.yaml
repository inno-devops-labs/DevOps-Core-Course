apiVersion: v1
kind: Service
metadata:
  name: {{ if eq .Values.rollout.strategy "blueGreen" }}{{ .Values.rollout.blueGreen.activeService | default (printf "%s-active" (include "devops-app.fullname" .)) }}{{ else }}{{ include "devops-app.fullname" . }}{{ end }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "devops-app.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
{{- if eq .Values.rollout.strategy "blueGreen" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.rollout.blueGreen.previewService | default (printf "%s-preview" (include "devops-app.fullname" .)) }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "devops-app.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- end }}