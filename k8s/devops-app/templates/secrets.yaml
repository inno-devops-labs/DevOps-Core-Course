apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-app.fullname" . }}-credentials
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Изменяем пути, чтобы они соответствовали вашему values.yaml (секция auth)
  DB_USERNAME: {{ .Values.auth.username | quote }}
  DB_PASSWORD: {{ .Values.auth.password | quote }}