# Override values for Lab 16 — Monitoring & Init Containers.
# Usage:
#   helm upgrade --install devops-app ./k8s/devops-app \
#     -f ./k8s/devops-app/values.yaml \
#     -f ./k8s/devops-app/values-monitoring.yaml
#
# Enables:
#   * Two init containers (download pattern + wait-for-service pattern)
#   * A shared emptyDir volume between the init container and the main
#     container (mounted under /data/initfetch in the main container)
#   * A Prometheus Operator ServiceMonitor that scrapes /metrics and
#     is picked up by kube-prometheus-stack's default Prometheus.

replicaCount: 2

# Use ClusterIP to avoid colliding with other lab releases that
# already hold NodePort 30080 (Lab 13's dev/devops-app-dev-service).
# Access the app via `kubectl port-forward` or via the in-cluster
# DNS name — no need for a node port in the monitoring lab.
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  nodePort: null

# Bonus task: expose application metrics to Prometheus.
serviceMonitor:
  enabled: true
  labels:
    # Default `release:` label of kube-prometheus-stack; matches the
    # Prometheus CRD's serviceMonitorSelector out of the box.
    release: monitoring
  port: http
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s

# Init container patterns demonstrated by Task 3.
initContainers:
  # 1) Download-at-startup pattern. Pulls a file over HTTP(S) into a
  #    shared volume so the main container can serve/read it without
  #    bundling it into the image.
  - name: init-download
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        set -eu
        echo "[init-download] fetching index.html ..."
        wget -q -O /work-dir/index.html https://example.com
        echo "[init-download] bytes fetched: $(wc -c < /work-dir/index.html)"
        echo "[init-download] done"
    volumeMounts:
      - name: initfetch
        mountPath: /work-dir

  # 2) Wait-for-service pattern. Blocks pod startup until a Service's
  #    DNS name resolves. The `kubernetes.default` Service is used
  #    here because it is guaranteed to exist in every cluster, which
  #    keeps the demo self-contained. In real use you would wait for
  #    a DB or message broker (e.g. `postgres.default.svc`).
  - name: wait-for-service
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        set -eu
        echo "[wait-for-service] waiting for kubernetes.default ..."
        until nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; do
          echo "[wait-for-service] DNS not ready, sleeping 2s"
          sleep 2
        done
        echo "[wait-for-service] dependency ready"

extraVolumes:
  - name: initfetch
    emptyDir: {}

extraVolumeMounts:
  - name: initfetch
    mountPath: /data/initfetch
    readOnly: true
