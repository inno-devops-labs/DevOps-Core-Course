# Default values for devops-app.

replicaCount: 3
workload:
  type: statefulset
statefulset:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
rollout:
  strategy: canary
  analysis:
    path: /health
  blueGreen:
    activeService: ""
    previewService: ""
    autoPromotionEnabled: false
    autoPromotionSeconds: 30

image:
  repository: ray326sq/devops-info-python
  tag: "lab03"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080
  headless:
    enabled: true
    name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 5

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 3

# Переименовали из secrets в auth, чтобы соответствовать шаблону
auth:
  username: "admin"
  password: "supersecret123"

environment: "dev"

app:
  name: "DevOps-App-K8s"
  logLevel: "DEBUG"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  existingClaim: ""

# Vault Configuration
vault:
  enabled: true
  role: "devops-app-role"
  secretPath: "secret/data/devops-app/config"

# Prometheus Operator: scrape /metrics from the primary Service (port name: http).
# Set prometheusRelease to the Helm release name of kube-prometheus-stack (often "monitoring").
monitoring:
  serviceMonitor:
    enabled: true
    prometheusRelease: monitoring
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

# Init containers: set enabled true after applying k8s/monitoring/init-dependency.yaml
# (wait-for-service probes the init-dependency Service).
initContainers:
  enabled: false
  busyboxImage: busybox:1.36
  wait:
    enabled: true
    service: init-dependency
    namespace: default
    port: 80
    path: /
  download:
    enabled: true
    url: https://raw.githubusercontent.com/prometheus/prometheus/main/LICENSE
    filename: init-downloaded.txt
    mountPath: /init-data