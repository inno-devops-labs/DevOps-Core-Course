replicaCount: 3

image:
  repository: egortorshin/devops-info-service
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

env:
  - name: APP_NAME
    value: "devops-app"
  - name: APP_PORT
    value: "8000"

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

containerPort: 8000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3

configMap:
  APP_ENV: "default"
  LOG_LEVEL: "info"
  FEATURES_VISITS: "true"

persistence:
  enabled: true
  size: 100Mi
  accessMode: ReadWriteOnce
  storageClass: ""
  mountPath: /data

secrets:
  USERNAME: "placeholder-user"
  PASSWORD: "placeholder-pass"
  DATABASE_URL: "postgresql://user:pass@localhost:5432/app"

vault:
  enabled: true
  role: "devops-app"
  secretPath: "secret/data/devops-app/config"
  agentInjectTemplate: |
    {{- with secret "secret/data/devops-app/config" -}}
    DATABASE_URL={{ .Data.data.database_url }}
    API_KEY={{ .Data.data.api_key }}
    {{- end -}}

serviceAccount:
  create: true
  name: "devops-app"

# Init containers run to completion before the main container starts.
# Use for fetching assets, running DB migrations, or waiting for
# dependencies. Declared as a raw list so any valid container spec
# (image, command, env, volumeMounts, ...) can be used.
initContainers: []
  # - name: init-download
  #   image: busybox:1.36
  #   command: ["sh", "-c", "wget -O /work-dir/index.html https://example.com"]
  #   volumeMounts:
  #     - name: workdir
  #       mountPath: /work-dir

# Extra volumes appended to the pod spec (e.g. a shared emptyDir used
# by an init container + the main container). Raw list, merged after
# the chart's built-in volumes (config-volume, data-volume, ...).
extraVolumes: []
  # - name: workdir
  #   emptyDir: {}

# Extra volume mounts appended to the main container. Kept separate
# from extraVolumes so a volume can be mounted by init containers
# only if desired.
extraVolumeMounts: []
  # - name: workdir
  #   mountPath: /usr/share/nginx/html

# Prometheus Operator ServiceMonitor — scrapes the app's /metrics
# endpoint. Requires the `monitoring.coreos.com/v1` CRD from
# kube-prometheus-stack (Lab 16).
serviceMonitor:
  enabled: false
  # Namespace the ServiceMonitor is created in. Empty = release
  # namespace. The operator picks up SMs by label selector across
  # namespaces, so this usually does not need to match Prometheus'.
  namespace: ""
  # kube-prometheus-stack's default Prometheus picks up
  # ServiceMonitors labelled `release: <stack release name>`. Change
  # this if your stack was installed under a different release name.
  labels:
    release: monitoring
  port: http
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  honorLabels: false
  relabelings: []
  metricRelabelings: []

statefulset:
  enabled: false
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  volumeClaimTemplate:
    name: data
    accessModes:
      - ReadWriteOnce
    size: 100Mi
    storageClass: ""
  headlessService:
    port: 80
    targetPort: 8000

rollouts:
  enabled: false
  strategy: canary
  revisionHistoryLimit: 5

  canary:
    maxSurge: "25%"
    maxUnavailable: 0
    stableService: ""
    canaryService: ""
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100

  blueGreen:
    activeService: ""
    previewService: ""
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30

  analysis:
    enabled: false
    web:
      path: /health
      successCondition: ""
      jsonPath: ""
      interval: 10s
      count: 3
      failureLimit: 1
      timeoutSeconds: 5
