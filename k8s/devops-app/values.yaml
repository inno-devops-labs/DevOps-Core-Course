# Default values for devops-app.

replicaCount: 3
rollout:
  strategy: canary
  blueGreen:
    activeService: ""
    previewService: ""
    autoPromotionEnabled: false
    autoPromotionSeconds: 30

image:
  repository: ray326sq/devops-info-python
  tag: "lab03"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 5

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 3

# Переименовали из secrets в auth, чтобы соответствовать шаблону
auth:
  username: "admin"
  password: "supersecret123"

environment: "dev"

app:
  name: "DevOps-App-K8s"
  logLevel: "DEBUG"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  existingClaim: ""

# Vault Configuration
vault:
  enabled: true
  role: "devops-app-role"
  secretPath: "secret/data/devops-app/config"