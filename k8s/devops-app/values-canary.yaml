replicaCount: 5

configMap:
  APP_ENV: "canary-demo"
  LOG_LEVEL: "info"

vault:
  enabled: false

persistence:
  enabled: false

rollouts:
  enabled: true
  strategy: canary
  revisionHistoryLimit: 5

  canary:
    maxSurge: "25%"
    maxUnavailable: 0
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100

  analysis:
    enabled: false
