replicaCount: 1

image:
  tag: latest

service:
  type: ClusterIP
  nodePort: null

rollout:
  enabled: false

statefulset:
  enabled: true
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

app:
  environment: "dev"
  logLevel: "debug"

config:
  env:
    appMode: "dev"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
  mountPath: "/data"

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 5
