# Development Environment Values
# Lightweight configuration for development and testing

replicaCount: 1

image:
  repository: devops-python
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  # Distinct from default/prod and other lab releases on the same cluster (NodePort must be unique).
  nodePort: 30081

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

app:
  environment: dev
  env:
    APP_ENV: dev
    LOG_LEVEL: debug
    FEATURE_VISITS_COUNTER: "true"
    FEATURE_METRICS: "true"
