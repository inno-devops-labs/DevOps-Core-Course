apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-config
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  config.json: |-
{{ tpl (.Files.Get "files/config.json") . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-env
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.configEnv }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
