{{- if and .Values.serviceMonitor.enabled .Values.service.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "devops-python.fullname" . }}
  labels:
    release: {{ .Values.serviceMonitor.releaseLabel | quote }}
    {{- include "devops-python.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "devops-python.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
