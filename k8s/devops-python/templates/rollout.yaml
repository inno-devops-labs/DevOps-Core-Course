{{- if ne .Values.workload.type "statefulset" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-config.txt: {{ .Values.vault.secretPath | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ default (include "common.fullname" .) .Values.serviceAccount.name }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "common.fullname" . }}-config
        {{- if .Values.initContainers.enabled }}
        - name: init-workdir
          emptyDir: {}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "common.fullname" . }}-data
        {{- end }}
      {{- if .Values.persistence.enabled }}
      initContainers:
        - name: volume-permissions
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - mkdir -p /data && chown -R 999:999 /data
          volumeMounts:
            - name: data-volume
              mountPath: /data
        {{- if .Values.initContainers.waitForService.enabled }}
        - name: wait-for-service
          image: {{ .Values.initContainers.waitForService.image }}
          command:
            - sh
            - -c
            - until nslookup {{ .Values.initContainers.waitForService.host }}; do echo waiting for {{ .Values.initContainers.waitForService.host }}; sleep 2; done
        {{- end }}
        {{- if .Values.initContainers.download.enabled }}
        - name: init-download
          image: {{ .Values.initContainers.download.image }}
          command:
            - sh
            - -c
            - wget -O {{ .Values.initContainers.sharedMountPath }}/{{ .Values.initContainers.download.outputFile }} {{ .Values.initContainers.download.url }}
          volumeMounts:
            - name: init-workdir
              mountPath: {{ .Values.initContainers.sharedMountPath }}
        {{- end }}
      {{- else if .Values.initContainers.enabled }}
      initContainers:
        {{- if .Values.initContainers.waitForService.enabled }}
        - name: wait-for-service
          image: {{ .Values.initContainers.waitForService.image }}
          command:
            - sh
            - -c
            - until nslookup {{ .Values.initContainers.waitForService.host }}; do echo waiting for {{ .Values.initContainers.waitForService.host }}; sleep 2; done
        {{- end }}
        {{- if .Values.initContainers.download.enabled }}
        - name: init-download
          image: {{ .Values.initContainers.download.image }}
          command:
            - sh
            - -c
            - wget -O {{ .Values.initContainers.sharedMountPath }}/{{ .Values.initContainers.download.outputFile }} {{ .Values.initContainers.download.url }}
          volumeMounts:
            - name: init-workdir
              mountPath: {{ .Values.initContainers.sharedMountPath }}
        {{- end }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: /data
            {{- end }}
            {{- if .Values.initContainers.enabled }}
            - name: init-workdir
              mountPath: {{ .Values.initContainers.sharedMountPath }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "common.fullname" . }}-env
            - secretRef:
                name: {{ include "common.fullname" . }}-secret
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  strategy:
    {{- if eq .Values.rollout.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ include "common.fullname" . }}
      previewService: {{ include "common.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      {{- if .Values.rollout.blueGreen.autoPromotionSeconds }}
      autoPromotionSeconds: {{ .Values.rollout.blueGreen.autoPromotionSeconds }}
      {{- end }}
      scaleDownDelaySeconds: {{ .Values.rollout.blueGreen.scaleDownDelaySeconds }}
      previewReplicaCount: {{ .Values.rollout.blueGreen.previewReplicaCount }}
    {{- else }}
    canary:
      maxSurge: {{ .Values.rollout.canary.maxSurge | quote }}
      maxUnavailable: {{ .Values.rollout.canary.maxUnavailable }}
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
    {{- end }}
{{- end }}
