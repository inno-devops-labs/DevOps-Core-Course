{{- if .Values.hooks.preInstall.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-python.fullname" . }}-pre-install"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "devops-python.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-install-hook
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      name: "{{ include "devops-python.fullname" . }}-pre-install"
      labels:
        {{- include "devops-python.labels" . | nindent 8 }}
        app.kubernetes.io/component: pre-install-hook
    spec:
      restartPolicy: Never
      containers:
      - name: pre-install
        image: "busybox:latest"
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -e
            echo "=========================================="
            echo "Pre-Install Hook - Pre-flight Validation"
            echo "=========================================="
            echo ""
            echo "[1/3] Hook execution started"
            echo "Release: {{ .Release.Name }}"
            echo "Namespace: {{ .Release.Namespace }}"
            echo "✓ Release metadata verified"
            echo ""
            echo "[2/3] Checking prerequisites"
            echo "Chart: {{ .Chart.Name }} v{{ .Chart.Version }}"
            echo "App Version: {{ .Chart.AppVersion }}"
            echo "✓ Chart validated"
            echo ""
            echo "[3/3] Pre-install checks passed"
            echo "Configuration:"
            echo "  - Replicas: {{ .Values.replicaCount }}"
            echo "  - Image: {{ .Values.image.repository }}:{{ .Values.image.tag }}"
            echo "  - Service: {{ .Values.service.type }}"
            echo "✓ Configuration validated"
            echo ""
            echo "=========================================="
            echo "Pre-install validation completed"
            echo "Ready to proceed with installation"
            echo "=========================================="
{{- end }}
