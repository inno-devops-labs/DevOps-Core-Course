replicaCount: 3

image:
  tag: latest

service:
  type: ClusterIP
  nodePort: null

rollout:
  strategy: blueGreen
  blueGreen:
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30
  analysis:
    enabled: false

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

app:
  environment: "prod"
  logLevel: "warn"

config:
  env:
    appMode: "prod"

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  mountPath: "/data"

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 3
