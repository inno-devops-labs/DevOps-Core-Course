# Production overrides (Task 3)
replicaCount: 5

image:
  tag: "1.0.0"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  # Local clusters may not support external LB, but prod is LoadBalancer-ready.
  type: LoadBalancer

probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 5
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 3

