# Production Environment Values
# Hardened configuration for production deployment

replicaCount: 5

image:
  repository: devops-python
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 5000
  nodePort: null

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 2

app:
  environment: prod
  env:
    APP_ENV: prod
    LOG_LEVEL: info
    FEATURE_VISITS_COUNTER: "true"
    FEATURE_METRICS: "true"
