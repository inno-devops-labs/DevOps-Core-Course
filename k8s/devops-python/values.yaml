# Default values for devops-python.

replicaCount: 3

image:
  repository: jambulancia/devops-info-service
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  enabled: true
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

containerPort: 5000

env:
  HOST: "0.0.0.0"
  PORT: "5000"
  LOG_FORMAT: "json"
  VISITS_DATA_PATH: "/data/visits"

# Lab 12 — ConfigMaps (file + env)
config:
  enabled: true
  injectEnv: true
  environment: dev
  logLevel: INFO
  featureDebug: false

# Lab 12 — persistence for visit counter (RWO: one node only; use 1 replica or RWX storage for multi-node)
# If disabled, set env.VISITS_DATA_PATH to a writable path (e.g. /tmp/visits); the container root FS is read-only.
persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

# Lab 12 bonus — rolling restart when ConfigMap-relevant inputs change
configMapChecksum:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

securityContext:
  pod:
    seccompProfile:
      type: RuntimeDefault
  container:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

probes:
  startup:
    enabled: true
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 20
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Service account (required for Vault Kubernetes auth — Lab 11)
serviceAccount:
  create: true
  name: ""

# Helm-managed Secret — use placeholders; override at install with --set-file or -f
secrets:
  enabled: true
  create: true
  existingSecretName: ""
  stringData:
    username: "changeme-user"
    password: "changeme-pass"

# HashiCorp Vault Agent Injector (Lab 11 Task 3)
# Install Vault: see k8s/SECRETS.md — enable after Vault + auth + role exist.
vault:
  role: devops-python
  secretPath: secret/data/myapp/config
  injector:
    enabled: false
    templateEnabled: false
    extraAnnotations: {}

hooks:
  enabled: true
  preInstall:
    image: busybox:1.36
    command:
      - sh
      - -c
      - "echo pre-install: basic validation && sleep 2 && echo pre-install: ok"
    weight: -5
  postInstall:
    image: busybox:1.36
    command:
      - sh
      - -c
      - "echo post-install: smoke test placeholder && sleep 2 && echo post-install: ok"
    weight: 5

