# Default values for devops-python chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: devops-python
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Liveness and readiness probe configuration
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# Rolling update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Helm lifecycle hooks
hooks:
  preInstall:
    enabled: true
  postInstall:
    enabled: true

# Application secrets configuration
secrets:
  enabled: true
  # Use placeholder values - override with --set during install
  data:
    DATABASE_USER: "admin"
    DATABASE_PASSWORD: "changeme"
    API_KEY: "placeholder-api-key"

# Name overrides
nameOverride: ""
fullnameOverride: ""

# Labels
labels:
  app: devops-python
  version: "1.0"
