apiVersion: v1
kind: Service
metadata:
  name: lab16-wait-backend
  labels:
    app: lab16-wait-backend
spec:
  selector:
    app: lab16-wait-backend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab16-wait-backend
  labels:
    app: lab16-wait-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab16-wait-backend
  template:
    metadata:
      labels:
        app: lab16-wait-backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: lab16-init-wait-demo
  labels:
    app: lab16-init-wait-demo
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          until nslookup lab16-wait-backend.default.svc.cluster.local; do
            echo waiting for lab16-wait-backend...
            sleep 2
          done
  containers:
    - name: main-app
      image: busybox:1.36
      command: ["sh", "-c", "echo main started && sleep 3600"]
