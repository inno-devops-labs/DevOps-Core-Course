apiVersion: v1
kind: Pod
metadata:
  name: init-wait
  namespace: default
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command: ['sh', '-c', 'until nslookup myapp-myapp.default.svc.cluster.local; do echo waiting; sleep 2; done']

  containers:
    - name: main-app
      image: busybox:1.36
      command: ['sh', '-c', 'echo service is ready; sleep 3600']
