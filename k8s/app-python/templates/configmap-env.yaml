apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-python.envConfigMapName" . }}
  labels:
    {{- include "app-python.labels" . | nindent 4 }}
data:
  HOST: {{ .Values.env.host | quote }}
  PORT: {{ .Values.env.port | quote }}
  DEBUG: {{ .Values.env.debug | quote }}
  RELEASE_VERSION: {{ .Values.env.releaseVersion | quote }}
  APP_ENV: {{ .Values.env.appEnv | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}