replicaCount: 3

image:
  repository: polinanime/devops-info-service
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "app-python"
  vault.hashicorp.com/agent-inject-secret-config: "secret/data/myapp/config"
  vault.hashicorp.com/agent-inject-template-config: |
    {{- with secret "secret/data/myapp/config" -}}
    USERNAME={{ .Data.data.username }}
    PASSWORD={{ .Data.data.password }}
    {{- end -}}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: NodePort
  port: 80
  targetPort: 8000

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

secrets:
  serviceName: "devops-info-service"
  apiKey: "changeme"

config:
  environment: "dev"
  logLevel: "INFO"

persistence:
  enabled: true
  size: "100Mi"
  storageClass: ""

nodeSelector: {}
tolerations: []
affinity: {}

rollout:
  enabled: false
  strategy: canary # canary or blueGreen

statefulset:
  enabled: true
  partition: 0

initContainers:
  downloadUrl: "https://example.com"

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
