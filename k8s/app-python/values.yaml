# ReadWriteOnce PVC: only one replica can mount the volume.
replicaCount: 1

environment: dev
logLevel: info
appName: devops-info-service

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

image:
  repository: 4hellboy4/devops-info-service
  tag: "lab12"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30082

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "8000"

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

securityContext:
  allowPrivilegeEscalation: false

secrets:
  username: "placeholder-user"
  password: "placeholder-password"

vault:
  enabled: false
  role: "app-python"
  secretPath: "secret/data/app-python/config"
