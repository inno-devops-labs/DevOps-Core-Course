{{- if and (not .Values.rollout.enabled) .Values.statefulset.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devops-info-service.fullname" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "devops-info-service.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devops-info-service.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.statefulset.updateStrategy.type }}
    {{- if and (eq .Values.statefulset.updateStrategy.type "RollingUpdate") (.Values.statefulset.updateStrategy.rollingUpdate) }}
    rollingUpdate:
      {{- if hasKey .Values.statefulset.updateStrategy.rollingUpdate "partition" }}
      partition: {{ .Values.statefulset.updateStrategy.rollingUpdate.partition }}
      {{- end }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "devops-info-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/component: web
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-{{ .Values.vault.fileName }}: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-{{ .Values.vault.fileName }}: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          {{ .Values.vault.template | nindent 10 }}
          {{`{{- end -}}`}}
        vault.hashicorp.com/agent-inject-command-{{ .Values.vault.fileName }}: {{ .Values.vault.injectCommand | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "devops-info-service.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        {{- if .Values.configMap.file.enabled }}
        - name: config-volume
          configMap:
            name: {{ .Values.configMap.file.name | default (include "devops-info-service.fullname" .) }}-config
        {{- end }}
        {{- if .Values.sharedWorkdir.enabled }}
        - name: workdir
          emptyDir: {}
        {{- end }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        {{- if .Values.initContainers.waitForService.enabled }}
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nslookup {{ .Values.initContainers.waitForService.host }}; do echo "waiting for {{ .Values.initContainers.waitForService.host }}"; sleep {{ .Values.initContainers.waitForService.sleepSeconds }}; done
        {{- end }}
        {{- if .Values.initContainers.download.enabled }}
        - name: init-download
          image: busybox:1.36
          command:
            - sh
            - -c
            - wget -O {{ .Values.initContainers.download.targetFile }} {{ .Values.initContainers.download.url }} && echo "download complete"
          {{- if .Values.sharedWorkdir.enabled }}
          volumeMounts:
            - name: workdir
              mountPath: /work-dir
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name | default (include "devops-info-service.fullname" .) }}-secret
                optional: true
            {{- if .Values.configMap.env.enabled }}
            - configMapRef:
                name: {{ .Values.configMap.env.name | default (include "devops-info-service.fullname" .) }}-env
            {{- end }}
          env:
            {{- include "devops-info-service.envVars" . | nindent 12 }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.configMap.file.enabled }}
            - name: config-volume
              mountPath: {{ .Values.configMap.file.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.sharedWorkdir.enabled }}
            - name: workdir
              mountPath: {{ .Values.sharedWorkdir.mountPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data-volume
        labels:
          {{- include "devops-info-service.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
  {{- end }}
{{- end }}
