{{- include "devops-info-service.persistenceValidation" . }}
{{- if .Values.configMap.file.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.configFileConfigMapName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  {{ .Values.configMap.file.fileName }}: |-
{{ tpl (.Files.Get "files/config.json") . | nindent 4 }}
{{- end }}