apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info-service.fullname" . }}-pre-install"
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "devops-info-service.fullname" . }}-pre-install"
    spec:
      restartPolicy: Never
      containers:
        - name: pre-install-validation
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "=== Pre-install validation ==="
              echo "Release: {{ .Release.Name }}"
              echo "Chart: {{ .Chart.Name }}-{{ .Chart.Version }}"
              echo "Namespace: {{ .Release.Namespace }}"
              echo "Validating deployment parameters..."
              echo "  Replicas: {{ .Values.replicaCount }}"
              echo "  Image: {{ .Values.image.repository }}:{{ .Values.image.tag }}"
              echo "  Service type: {{ .Values.service.type }}"
              echo "Pre-install validation completed successfully!"
  backoffLimit: 1
