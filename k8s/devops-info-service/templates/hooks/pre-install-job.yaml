apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "devops-info-service.fullname" . }}-pre-install
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    {{- if .Values.hooks.deleteAfterSuccess }}
    helm.sh/hook-delete-policy: hook-succeeded
    {{- end }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/hook: pre-install
    spec:
      restartPolicy: Never
      containers:
        - name: pre-install
          image: {{ .Values.hooks.preInstall.image | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "pre-install: release={{ .Release.Name }} ns={{ .Release.Namespace }}"
              echo "pre-install OK"
