apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "devops-info-service.fullname" . }}-post-install
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    {{- if .Values.hooks.deleteAfterSuccess }}
    helm.sh/hook-delete-policy: hook-succeeded
    {{- end }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/hook: post-install
    spec:
      restartPolicy: Never
      containers:
        - name: post-install
          image: {{ .Values.hooks.postInstall.image | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              URL="http://{{ include "devops-info-service.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/health"
              echo "post-install: smoke GET $URL"
              i=0
              while [ "$i" -lt 30 ]; do
                if curl -fsS --connect-timeout 3 --max-time 10 "$URL"; then
                  echo "post-install OK"
                  exit 0
                fi
                i=$((i + 1))
                echo "post-install: retry $i/30"
                sleep 2
              done
              echo "post-install: health check failed" >&2
              exit 1
