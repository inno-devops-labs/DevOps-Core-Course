apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info-service.fullname" . }}-post-install"
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "devops-info-service.fullname" . }}-post-install"
      labels:
        {{- include "devops-info-service.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-smoke-test
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "=== Post-install smoke test ==="
              echo "Waiting for service to be ready..."
              sleep 10
              echo "Verifying service endpoint..."
              wget -qO- --timeout=5 http://{{ include "devops-info-service.fullname" . }}:{{ .Values.service.port }}/health || echo "Service not reachable yet (expected during hook)"
              echo "Post-install checks complete."
