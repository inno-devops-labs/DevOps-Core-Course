{{- if .Values.hooks.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info-service.fullname" . }}-post-install"
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "{{ .Values.hooks.postInstall.weight }}"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: {{ .Values.hooks.postInstall.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "devops-info-service.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-smoke-test
          image: "{{ .Values.hooks.image.repository }}:{{ .Values.hooks.image.tag }}"
          imagePullPolicy: {{ .Values.hooks.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import sys
              import time
              import urllib.request
              url = "http://{{ include "devops-info-service.fullname" . }}:{{ .Values.service.port }}/health"
              print(f"Waiting for service endpoint: {url}")
              last_error = None
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          body = response.read().decode("utf-8", errors="replace")
                      print(body)
                      print("Post-install smoke test completed")
                      sys.exit(0)
                  except Exception as exc:
                      last_error = exc
                      print(f"Attempt {attempt + 1}/30 failed: {exc}")
                      time.sleep(2)
              raise SystemExit(f"Smoke test failed: {last_error}")
{{- end }}
