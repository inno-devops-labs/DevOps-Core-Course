apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info-service.fullname" . }}-post-install"
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "devops-info-service.fullname" . }}-post-install"
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-smoke-test
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "=== Post-install smoke test ==="
              echo "Waiting for service to be ready..."
              sleep 5
              echo "Checking service endpoint..."
              wget -q -O- http://{{ include "devops-info-service.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/health || echo "Service not yet reachable (may still be starting)"
              echo ""
              echo "Post-install smoke test completed!"
  backoffLimit: 1
