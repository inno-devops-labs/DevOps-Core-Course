apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info-service.fullname" . }}-post-install"
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
  annotations:
    # This job runs AFTER all chart resources are installed and ready.
    # Weight 5 ensures it runs after other post-install hooks (lower = earlier).
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    # Delete the job pod after successful completion to keep the namespace clean.
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "devops-info-service.fullname" . }}-post-install"
      labels:
        {{- include "devops-info-service.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-job
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "=== Post-install hook: smoke test ==="
              echo "Release {{ .Release.Name }} installed successfully."
              echo "Replicas requested: {{ .Values.replicaCount }}"
              echo "Service type: {{ .Values.service.type }}"
              echo "Waiting for service to be ready..."
              sleep 5
              echo "Post-install smoke test complete. Deployment is live."
