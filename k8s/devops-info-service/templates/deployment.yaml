{{- if and (not .Values.rollout.enabled) (not .Values.statefulset.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-info-service.fullname" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devops-info-service.selectorLabels" . | nindent 6 }}
  strategy:
{{ toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "devops-info-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/auth-path: {{ .Values.vault.authPath | quote }}
        {{ printf "vault.hashicorp.com/agent-inject-secret-%s" .Values.vault.injectFileName }}: {{ .Values.vault.secretPath | quote }}
        {{ printf "vault.hashicorp.com/agent-inject-template-%s" .Values.vault.injectFileName }}: |
{{ .Values.vault.template | nindent 10 }}
        {{- if .Values.vault.injectCommand }}
        {{ printf "vault.hashicorp.com/agent-inject-command-%s" .Values.vault.injectFileName }}: {{ .Values.vault.injectCommand | quote }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "devops-info-service.serviceAccountName" . }}
      {{- if or .Values.initContainers.download.enabled .Values.initContainers.waitForService.enabled }}
      initContainers:
        {{- if .Values.initContainers.waitForService.enabled }}
        - name: wait-for-service
          image: {{ .Values.initContainers.waitForService.image | quote }}
          command:
            - sh
            - -c
            - until nslookup {{ default (include "devops-info-service.fullname" .) .Values.initContainers.waitForService.serviceName }}; do echo "waiting for service"; sleep {{ .Values.initContainers.waitForService.intervalSeconds }}; done
        {{- end }}
        {{- if .Values.initContainers.download.enabled }}
        - name: init-download
          image: {{ .Values.initContainers.download.image | quote }}
          command:
            - sh
            - -c
            - wget -O {{ .Values.initContainers.download.mountPath }}/{{ .Values.initContainers.download.outputFile }} {{ .Values.initContainers.download.url | quote }} && ls -l {{ .Values.initContainers.download.mountPath }}
          volumeMounts:
            - name: init-data
              mountPath: {{ .Values.initContainers.download.mountPath | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "devops-info-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
{{ include "devops-info-service.commonEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "devops-info-service.envConfigMapName" . }}
          {{- if .Values.secret.enabled }}
            - secretRef:
                name: {{ include "devops-info-service.secretName" . }}
          {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: {{ .Values.config.mountPath | quote }}
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- if .Values.initContainers.download.enabled }}
            - name: init-data
              mountPath: {{ .Values.initContainers.download.mountPath | quote }}
            {{- end }}
          resources:
{{ toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
{{ toYaml (omit .Values.livenessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
{{ toYaml (omit .Values.readinessProbe "enabled") | nindent 12 }}
          {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "devops-info-service.configFileConfigMapName" . }}
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "devops-info-service.pvcName" . }}
        {{- end }}
        {{- if .Values.initContainers.download.enabled }}
        - name: init-data
          emptyDir: {}
        {{- end }}
{{- end }}
