{{- if .Values.credentials.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-info-service.credentialsSecretName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.credentials.username | quote }}
  password: {{ .Values.credentials.password | quote }}
{{- end }}
