{{- if and .Values.rollouts.enabled (eq .Values.rollouts.strategy "blueGreen") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common-lib.fullname" . }}-preview
  labels:
    {{- include "common-lib.labels" . | nindent 4 }}
spec:
  # Preview service should be internal-only to avoid LoadBalancer/NodePort quirks
  # (especially in local clusters like minikube) and to become Healthy immediately.
  type: ClusterIP
  selector:
    {{- include "common-lib.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- end }}

