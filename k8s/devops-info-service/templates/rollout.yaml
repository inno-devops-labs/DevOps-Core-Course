apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "devops-info-service.fullname" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "devops-info-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-info-service.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config-file: {{ .Files.Get "files/config.json" | sha256sum }}
        checksum/config-env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: {{ .Values.vault.authPath | quote }}
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-{{ .Values.vault.injectFileName }}: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-secret-{{ .Values.vault.renderEnvFileName }}: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-{{ .Values.vault.renderEnvFileName }}: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          APP_VAULT_USERNAME={{`{{ .Data.data.username }}`}}
          APP_VAULT_PASSWORD={{`{{ .Data.data.password }}`}}
          APP_VAULT_API_TOKEN={{`{{ .Data.data.api_token }}`}}
          {{`{{- end -}}`}}
        {{- end }}
    spec:
      serviceAccountName: {{ include "devops-info-service.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
      containers:
        - name: {{ include "devops-info-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.containerPort }}
          env:
            {{- include "devops-info-service.commonEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "devops-info-service.configEnvMapName" . }}
            - secretRef:
                name: {{ include "devops-info-service.secretName" . }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- range .Values.containerSecurityContext.capabilities.drop }}
                - {{ . | quote }}
                {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config-file
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
          readinessProbe:
{{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
{{- toYaml .Values.probes.liveness | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config-file
          configMap:
            name: {{ include "devops-info-service.configFileMapName" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "devops-info-service.pvcName" . }}
  strategy:
{{- if eq .Values.rollout.strategy "canary" }}
    canary:
{{- if .Values.rollout.analysis.enabled }}
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: {{ include "devops-info-service.fullname" . }}-health-analysis
        - pause: {}
        - setWeight: 40
        - pause: { duration: 30s }
        - setWeight: 60
        - pause: { duration: 30s }
        - setWeight: 80
        - pause: { duration: 30s }
        - setWeight: 100
{{- else }}
      steps:
{{ toYaml .Values.rollout.canary.steps | nindent 8 }}
{{- end }}
{{- else if eq .Values.rollout.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ include "devops-info-service.fullname" . }}
      previewService: {{ include "devops-info-service.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      {{- if .Values.rollout.blueGreen.autoPromotionSeconds }}
      autoPromotionSeconds: {{ .Values.rollout.blueGreen.autoPromotionSeconds }}
      {{- end }}
{{- else }}
{{- fail (printf "Invalid rollout.strategy %q (use canary or blueGreen)" .Values.rollout.strategy) }}
{{- end }}
