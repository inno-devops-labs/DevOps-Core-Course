{{- if .Values.configMap.env.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.configEnvMapName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.env.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}