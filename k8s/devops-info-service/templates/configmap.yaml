apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.configFileConfigMapName" . }}
  labels:
    {{- include "common-lib.labels" . | nindent 4 }}
data:
  config.json: |-
{{ include "devops-info-service.renderedConfigFile" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.envConfigMapName" . }}
  labels:
    {{- include "common-lib.labels" . | nindent 4 }}
data:
{{ include "devops-info-service.envConfigData" . | nindent 2 }}
