{{- $cfg := (coalesce (.Files.Get "files/config.json") (.Files.Get "config.json")) | toString }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common-lib.fullname" . }}-config-file
  labels:
    {{- include "common-lib.labels" . | nindent 4 }}
data:
  config.json: |
{{ default "{}" $cfg | trim | indent 4 }}
---
{{- if and .Values.configMapEnv (gt (len .Values.configMapEnv) 0) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common-lib.fullname" . }}-env
  labels:
    {{- include "common-lib.labels" . | nindent 4 }}
data:
{{- range $k, $v := .Values.configMapEnv }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
