apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.configMapName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  {{ .Values.config.fileName }}: |-
{{ .Files.Get "files/config.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.envConfigMapName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  APP_CONFIG_PATH: {{ .Values.config.appConfigPath | quote }}
  APP_DISPLAY_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  VISITS_FILE: {{ .Values.config.visitsFile | quote }}
