apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.configMapFileName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  config.json: |-
{{ .Files.Get "files/config.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.configMapEnvName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.env.APP_NAME | quote }}
  APP_ENV: {{ .Values.config.env.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.config.env.LOG_LEVEL | quote }}
