apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.fileConfigMapName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  config.json: |-
{{ include "devops-info-service.configFileContent" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.envConfigMapName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
{{ include "devops-info-service.envConfigData" . | nindent 2 }}
