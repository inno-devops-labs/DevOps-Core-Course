apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.configMapName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  {{ .Values.config.fileName }}: |-
{{ tpl (.Files.Get "files/config.json") . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.envConfigMapName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.env.appEnv | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  APP_NAME: {{ .Values.env.extra.appName | quote }}
  FEATURE_VISITS_COUNTER: {{ ternary "true" "false" .Values.env.extra.featureVisitsCounter | quote }}
