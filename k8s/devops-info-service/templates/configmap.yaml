{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.fileConfigMapName" . }}
  labels:
    {{- include "common-lib.labels" . | nindent 4 }}
data:
  {{ .Values.config.file.fileName }}: |-
{{ tpl (.Files.Get "files/config.json") . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.envConfigMapName" . }}
  labels:
    {{- include "common-lib.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.env.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.config.env.LOG_LEVEL | quote }}
  APP_CONFIG_FILE: {{ printf "%s/%s" .Values.config.file.mountPath .Values.config.file.fileName | quote }}
  VISITS_FILE_PATH: {{ printf "%s/%s" .Values.persistence.mountPath .Values.persistence.fileName | quote }}
{{- end }}
