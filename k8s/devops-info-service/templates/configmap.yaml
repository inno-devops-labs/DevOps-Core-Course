apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.configFileName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  config.json: |-
{{ .Files.Get "files/config.json" | tpl . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info-service.envConfigName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.envConfig.APP_NAME | quote }}
  APP_ENV: {{ .Values.envConfig.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.envConfig.LOG_LEVEL | quote }}
  VISITS_FILE: {{ .Values.envConfig.VISITS_FILE | quote }}
