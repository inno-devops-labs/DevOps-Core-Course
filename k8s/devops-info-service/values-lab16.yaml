image:
  repository: devops-info-service
  tag: "lab16"
  pullPolicy: IfNotPresent

statefulset:
  enabled: true

initContainers:
  download:
    enabled: true
    image: busybox:1.36
    url: "https://example.com"
    outputFile: "index.html"
    mountPath: "/init-data"
  waitForService:
    enabled: true
    image: busybox:1.36
    serviceName: "kubernetes.default.svc.cluster.local"
    intervalSeconds: 2

serviceMonitor:
  enabled: true
  labels:
    release: monitoring
