nameOverride: ""
fullnameOverride: ""

partOf: devops-core-course
component: web

replicaCount: 3
revisionHistoryLimit: 5

image:
  repository: devops-info-service
  tag: lab10-python
  pullPolicy: IfNotPresent

imagePullSecrets: []
podAnnotations: {}
podLabels: {}

containerPort: 5000

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"
  - name: SERVICE_NAME
    value: "devops-info-service"
  - name: SERVICE_VERSION
    value: "1.0.0"
  - name: SERVICE_DESCRIPTION
    value: "DevOps course info service deployed with Helm"
  - name: RELEASE_TRACK
    value: "stable"

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

hooks:
  enabled: true
  deletePolicy: before-hook-creation,hook-succeeded
  ttlSecondsAfterFinished: 30
  backoffLimit: 0
  image:
    repository: busybox
    tag: "1.36.1"
    pullPolicy: IfNotPresent
  preInstall:
    enabled: true
    weight: -5
    message: "Validating release configuration before install"
  postInstall:
    enabled: true
    weight: 5
    message: "Running HTTP smoke test after install"
