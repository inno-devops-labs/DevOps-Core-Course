nameOverride: ""
fullnameOverride: ""
component: api
partOf: devops-core-course

replicaCount: 3

workload:
  type: StatefulSet

image:
  repository: devops-info-service
  tag: "lab15"
  pullPolicy: IfNotPresent

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  enabled: true
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30095

containerPort: 5000

serviceAccount:
  create: true
  name: ""

app:
  environment: "dev"
  logLevel: "info"
  serviceName: "devops-info-service"
  serviceVersion: "1.0.0"
  host: "0.0.0.0"
  port: "5000"

secret:
  enabled: true
  name: ""
  data:
    username: "change-me-user"
    password: "change-me-password"

vault:
  enabled: false
  role: "devops-info-service"
  secretPath: "secret/data/devops-info-service/config"
  fileName: "config"
  mountPath: "/vault/secrets"
  renderedFileName: "app.env"
  injectCommand: ""
  templateKeys:
    username: "username"
    password: "password"

extraEnv: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

revisionHistoryLimit: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

statefulset:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    partition: 0

persistence:
  mountPath: /data
  accessModes:
    - ReadWriteOnce
  size: 100Mi
  storageClass: ""

hooks:
  enabled: true
  image:
    repository: devops-info-service
    tag: "lab09"
    pullPolicy: IfNotPresent
  preInstall:
    deletePolicy:
      - before-hook-creation
      - hook-succeeded
    weight: -5
    command:
      - sh
      - -c
      - echo validating release values for devops-info-service && test -n "{{ .Release.Name }}" && echo pre-install validation completed
  postInstall:
    deletePolicy:
      - before-hook-creation
      - hook-succeeded
    weight: 5
    command:
      - sh
      - -c
      - echo running smoke test metadata for {{ .Release.Name }} && echo post-install validation passed
