replicaCount: 3

image:
  repository: iucapstonead/devops-info-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 3

secret:
  username: "change-me"
  password: "change-me"

appEnv: "production"
logLevel: "info"

vault:
  enabled: false
  role: "devops-info-service"
  secretPath: "secret/data/myapp/config"

nameOverride: ""
fullnameOverride: ""
