nameOverride: ""
fullnameOverride: ""

replicaCount: 3

image:
  repository: egrapa/devops-core-course-lab2
  tag: latest
  pullPolicy: Always

container:
  port: 5000

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30080
  annotations: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podAnnotations: {}
podLabels: {}

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"
  - name: DEBUG
    value: "False"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

secret:
  create: true
  name: ""
  type: Opaque
  data:
    username: "change-me"
    password: "change-me-too"

vault:
  enabled: false
  role: "devops-info-service"
  secretPath: "secret/data/devops-info-service/config"
  authPath: "auth/kubernetes"
  injectFileName: "config.txt"
  template: |
    {{- with secret "secret/data/devops-info-service/config" -}}
    APP_USERNAME={{ .Data.data.username }}
    APP_PASSWORD={{ .Data.data.password }}
    {{- end }}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  enabled: true
  path: /health
  port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  path: /health
  port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

hooks:
  enabled: true
  image:
    repository: egrapa/devops-core-course-lab2
    tag: latest
    pullPolicy: Always
  preInstall:
    weight: -5
    ttlSecondsAfterFinished: 60
  postInstall:
    weight: 5
    ttlSecondsAfterFinished: 60
