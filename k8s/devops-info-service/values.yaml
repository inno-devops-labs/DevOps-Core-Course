# Default values for devops-info-service.

replicaCount: 3

image:
  repository: th1ef/devops-info-service
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

secrets:
  username: "app-user"
  password: "changeme"
  secretKey: "dev-secret-key"

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"

environment: "dev"
logLevel: "INFO"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
  visitsFile: "/data/visits"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3
