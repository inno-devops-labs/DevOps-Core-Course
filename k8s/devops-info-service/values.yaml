# Default values for devops-info-service.
# All values are overridable via -f or --set at install/upgrade time.

replicaCount: 3

image:
  repository: plaffyyy9/devops-info-service
  tag: "lab9"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5001
  nodePort: 30080

env:
  HOST: "0.0.0.0"
  PORT: "5001"
  DEBUG: "false"
  VISITS_FILE: "/data/visits"

app:
  environment: "dev"
  logLevel: "info"

configEnv:
  featureVisits: "true"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

secrets:
  enabled: true
  nameOverride: ""
  data:
    username: "change-me-username"
    password: "change-me-password"

serviceAccount:
  create: true
  annotations: {}
  name: ""

vault:
  enabled: false
  role: "devops-info-role"
  secretPath: "secret/data/myapp/config"
  injectCommand: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

# Rolling update strategy — zero downtime
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

rollout:
  enabled: true
  strategyType: canary
  revisionHistoryLimit: 3
  canary:
    maxSurge: "25%"
    maxUnavailable: 0
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30
    previewServiceName: ""
    previewService:
      enabled: true
      type: ClusterIP
      port: 80
      targetPort: 5001

# Liveness probe — restarts the container if Flask becomes unresponsive
livenessProbe:
  httpGet:
    path: /health
    port: 5001
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

# Readiness probe — removes pod from Service until it passes
readinessProbe:
  httpGet:
    path: /ready
    port: 5001
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
