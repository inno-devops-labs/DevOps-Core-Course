replicaCount: 2

image:
  repository: devops-info-service
  tag: "lab10"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000

env:
  appEnv: "development"
  logLevel: "info"
  extra:
    appName: "devops-info-service"
    featureVisitsCounter: true

config:
  fileName: "config.json"
  mountPath: "/config"

persistence:
  enabled: true
  mountPath: "/data"
  size: "100Mi"
  accessMode: "ReadWriteOnce"
  storageClass: ""

serviceAccount:
  create: true
  name: ""
  automount: true

secret:
  enabled: true
  name: ""
  data:
    username: "change-me"
    password: "change-me"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

revisionHistoryLimit: 3

vault:
  enabled: false
  role: "devops-info-role"
  secretPath: "secret/data/devops-info/config"
  injectFileName: "config"
  injectMountPath: "/vault/secrets"
  agentInjectCommand: ""
  template: |
    {{- with secret "secret/data/devops-info/config" -}}
    APP_USERNAME={{ .Data.data.username }}
    APP_PASSWORD={{ .Data.data.password }}
    API_KEY={{ .Data.data.api_key }}
    {{- end -}}
