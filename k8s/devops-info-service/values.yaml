nameOverride: ""
fullnameOverride: ""

replicaCount: 3

image:
  repository: egrapa/devops-core-course-lab2
  tag: latest
  pullPolicy: Always

container:
  port: 5000

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30080
  annotations: {}

serviceMonitor:
  enabled: false
  labels:
    release: monitoring
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

rollout:
  enabled: true
  strategy: canary
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - analysis:
          templates:
            - templateName: success-rate
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
    analysis:
      enabled: true
      templateName: success-rate
      metricName: webcheck
      path: /health
      jsonPath: "{$.status}"
      successCondition: result == "healthy"
      interval: 10s
      count: 3
      failureLimit: 1
  blueGreen:
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30
    previewService:
      type: ClusterIP
      port: 80
      targetPort: http
      annotations: {}

statefulset:
  enabled: false
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  headlessService:
    annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"
  - name: DEBUG
    value: "False"

config:
  fileMountPath: /config
  fileName: config.json
  appConfigPath: /config/config.json
  appName: devops-info-service
  environment: dev
  logLevel: INFO
  visitsFile: /data/visits

persistence:
  enabled: true
  mountPath: /data
  accessModes:
    - ReadWriteOnce
  size: 100Mi
  storageClass: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

secret:
  create: true
  name: ""
  type: Opaque
  data:
    username: "change-me"
    password: "change-me-too"

vault:
  enabled: false
  role: "devops-info-service"
  secretPath: "secret/data/devops-info-service/config"
  authPath: "auth/kubernetes"
  injectFileName: "config.txt"
  template: |
    {{- with secret "secret/data/devops-info-service/config" -}}
    APP_USERNAME={{ .Data.data.username }}
    APP_PASSWORD={{ .Data.data.password }}
    {{- end }}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  enabled: true
  path: /health
  port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  path: /health
  port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

hooks:
  enabled: true
  image:
    repository: egrapa/devops-core-course-lab2
    tag: latest
    pullPolicy: Always
  preInstall:
    weight: -5
    ttlSecondsAfterFinished: 60
  postInstall:
    weight: 5
    ttlSecondsAfterFinished: 60
