nameOverride: ""
fullnameOverride: ""

partOf: devops-core-course
component: web

replicaCount: 1
revisionHistoryLimit: 5

statefulset:
  enabled: false
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  headlessService:
    publishNotReadyAddresses: false

image:
  repository: devops-info-service
  tag: lab12-python
  pullPolicy: IfNotPresent

imagePullSecrets: []
podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

serviceAccount:
  create: true
  automount: true
  name: ""

containerPort: 5000

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"
  - name: SERVICE_NAME
    value: "devops-info-service"
  - name: SERVICE_VERSION
    value: "1.0.0"
  - name: SERVICE_DESCRIPTION
    value: "DevOps course info service deployed with Helm"
  - name: RELEASE_TRACK
    value: "stable"

config:
  enabled: true
  application:
    name: "devops-info-service"
    environment: "stable"
    description: "DevOps course info service deployed with Helm"
  env:
    APP_ENV: "stable"
    LOG_LEVEL: "INFO"
  settings:
    releaseTrack: "stable"
    featureFlags:
      visitsCounter: true
      configMapDemo: true
      pvcPersistence: true
  file:
    mountPath: "/config"
    fileName: "config.json"

persistence:
  enabled: true
  size: "100Mi"
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  claimName: "data-volume"
  mountPath: "/data"
  fileName: "visits"

secrets:
  enabled: true
  name: ""
  data:
    APP_USERNAME: "change-me"
    APP_PASSWORD: "change-me"

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: null

rollout:
  enabled: false
  strategy: canary
  canary:
    stableServiceSuffix: stable
    canaryServiceSuffix: canary
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    previewServiceSuffix: preview
    autoPromotionEnabled: false
    autoPromotionSeconds: null
    previewReplicaCount: 1
    scaleDownDelaySeconds: 30
    previewService:
      type: ClusterIP
  analysis:
    enabled: false
    stepIndex: 2
    templateSuffix: analysis
    path: /health
    jsonPath: "{$.status}"
    successCondition: result == "healthy"
    interval: 10s
    count: 3
    failureLimit: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

vault:
  enabled: false
  authPath: "auth/kubernetes"
  role: "devops-info-service"
  secretPath: "kvv2/data/devops-info-service/config"
  injectFileName: "app.env"
  secretVolumePath: "/vault/secrets"
  staticSecretRenderInterval: ""
  agentInjectCommand: ""

hooks:
  enabled: true
  deletePolicy: before-hook-creation,hook-succeeded
  ttlSecondsAfterFinished: 30
  backoffLimit: 0
  image:
    repository: busybox
    tag: "1.36.1"
    pullPolicy: IfNotPresent
  preInstall:
    enabled: true
    weight: -5
    message: "Validating Lab 12 release configuration before install"
  postInstall:
    enabled: true
    weight: 5
    message: "Running Lab 12 HTTP smoke test after install"
