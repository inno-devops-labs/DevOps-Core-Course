# Default install mirrors Lab 9 kustomization (Docker Hub image).
nameOverride: ""
fullnameOverride: devops-info-service

podLabels:
  component: api

# Optional annotations on the pod (e.g. Prometheus). Vault injector adds its own when vault.enabled.
podAnnotations: {}

# Lab 12: checksum annotation triggers rolling restart when ConfigMaps change (bonus / hot-reload pattern).
config:
  checksumAnnotation: false
  mountPath: /config/config.json

# Visit counter file path inside the container (must be under the /data volume mount).
visits:
  filePath: /data/visits

# Lab 12: keys injected as environment variables via ConfigMap (non-sensitive).
configMapEnv:
  APP_ENV: "production"
  LOG_LEVEL: "info"

# Lab 12: persistent storage for /data (ReadWriteOnce). Use replicaCount: 1 when enabled.
persistence:
  enabled: false
  size: 100Mi
  storageClass: ""

replicaCount: 3

image:
  repository: mclavrushka/devops-info-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: null

container:
  port: 5000
  portName: http

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"

# Lab 11: Kubernetes Secret (Helm-managed). Override at install: --set secrets.username=... --set secrets.password=...
secrets:
  enabled: true
  username: "placeholder-user"
  password: "placeholder-pass"

# Dedicated ServiceAccount for pods (required for Vault Kubernetes auth role binding).
serviceAccount:
  create: true
  name: ""

# HashiCorp Vault Agent Injector (Lab 11 Task 3). Install Vault with injector, then enable and configure role/policy.
vault:
  enabled: false
  role: devops-info-service
  secretFileName: config
  secretPath: secret/data/devops-info-service/config
  # Bonus: render .env-style file via Vault Agent template (requires files/vault-agent-config.ctmpl).
  bonusAgentTemplate: false

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  preInstall:
    image: busybox:1.36
    weight: "-5"
  postInstall:
    image: busybox:1.36
    weight: "5"

# Lab 14: Argo Rollouts (Progressive Delivery)
rollouts:
  enabled: false
  # canary | blueGreen
  strategy: canary
  blueGreen:
    autoPromotionEnabled: false
