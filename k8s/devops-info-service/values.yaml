# Default values for devops-info-service.

replicaCount: 3

image:
  repository: th1ef/devops-info-service
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080
  previewNodePort: 30081

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

secrets:
  username: "app-user"
  password: "changeme"
  secretKey: "dev-secret-key"

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"

environment: "dev"
logLevel: "INFO"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
  visitsFile: "/data/visits"

statefulset:
  enabled: false
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

rollout:
  enabled: false
  strategy: canary
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: "30s"
      - setWeight: 60
      - pause:
          duration: "30s"
      - setWeight: 80
      - pause:
          duration: "30s"
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: 0

analysis:
  enabled: false

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3

initContainers:
  download:
    enabled: false
    image: busybox:1.36
    url: https://example.com

serviceMonitor:
  enabled: false
  interval: 15s
  path: /metrics
  port: http
  releaseLabel: monitoring
