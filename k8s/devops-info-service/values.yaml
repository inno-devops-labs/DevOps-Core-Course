# Default values for devops-info-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: onemoreslacker/devops-info-service
  pullPolicy: IfNotPresent
  tag: "v0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 2

# Application environment variables
env:
  HOST: "0.0.0.0"
  PORT: "5000"
  DEBUG: "False"

# Environment configuration
environment: "development"
logLevel: "INFO"

# Metrics configuration
metrics:
  enabled: true

# Persistence configuration
persistence:
  enabled: true
  size: 100Mi
  storageClass: ""  # use default storage class

# Rolling update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels:
  project: devops-course
  lab: lab15

podSecurityContext: {}

securityContext: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

# Secrets configuration
secrets:
  enabled: true
  data:
    username: "placeholder-user"
    password: "placeholder-password"

# Vault integration configuration
vault:
  enabled: false
  role: "devops-info-service"
  secretPath: "secret/data/devops-info/config"

# Argo Rollouts configuration
rollout:
  enabled: false
  strategy: canary  # canary or blueGreen

  canary:
    steps:
      - setWeight: 20
      - pause: {}  # manual promotion
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100

  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: 0
    scaleDownDelaySeconds: 30

  analysis:
    enabled: false
    webUrl: ""  # defaults to http://<release-name>.<namespace>.svc/health
    interval: 10s
    count: 3
    failureLimit: 1

# StatefulSet configuration
statefulset:
  enabled: true
  # Update strategy: RollingUpdate or OnDelete
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0  # only pods with ordinal >= partition are updated
