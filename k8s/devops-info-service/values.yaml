replicaCount: 1

image:
  repository: devops-info-service
  tag: "lab12"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

containerPort: 5000

env:
  - name: PORT
    value: "5000"
  - name: VISITS_FILE
    value: "/data/visits"
  - name: APP_CONFIG_PATH
    value: "/config/config.json"

appConfig:
  applicationName: "devops-info-service"
  environment: "development"
  description: "DevOps course info service"
  featureFlags:
    visitsCounter: true
    metricsEndpoint: true
    showRuntimeDetails: true
  settings:
    logLevel: "INFO"

secret:
  enabled: true
  create: true
  existingSecret: ""
  name: ""
  type: Opaque
  envFrom: true
  stringData:
    APP_USERNAME: "change-me"
    APP_PASSWORD: "change-me"

vault:
  enabled: false
  role: "devops-info-service"
  authPath: "kubernetes"
  secretPath: "secret/data/devops-info-service/config"
  injectFileName: "config.env"
  secretMountPath: "/vault/secrets"
  agentPrePopulateOnly: false
  template:
    enabled: true
    format: "env"

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30082

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

minReadySeconds: 5
revisionHistoryLimit: 5

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  enabled: true
  image: busybox:1.36
  preInstall:
    weight: "-5"
    deletePolicy: before-hook-creation,hook-succeeded
  postInstall:
    weight: "5"
    deletePolicy: before-hook-creation,hook-succeeded
    smokeTestPath: /health

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 100Mi
  storageClass: ""
  mountPath: /data
