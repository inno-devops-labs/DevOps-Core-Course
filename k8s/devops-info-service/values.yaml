# Default install mirrors Lab 9 kustomization (Docker Hub image).
nameOverride: ""
fullnameOverride: devops-info-service

podLabels:
  component: api

replicaCount: 3

image:
  repository: mclavrushka/devops-info-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: null

container:
  port: 5000
  portName: http

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  preInstall:
    image: busybox:1.36
    weight: "-5"
  postInstall:
    image: busybox:1.36
    weight: "5"
