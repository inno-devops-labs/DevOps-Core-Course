replicaCount: 3

nameOverride: ""
fullnameOverride: ""

image:
  repository: linktur/devops-lab2
  tag: "v1"
  pullPolicy: IfNotPresent

containerPort: 5000

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: null

podAnnotations: {}
podLabels: {}

app:
  environment: "dev"
  logLevel: "info"

config:
  fileName: "config.json"
  mountPath: "/config"

serviceAccount:
  create: true
  name: ""

secret:
  enabled: true
  create: true
  name: ""
  data:
    username: "change-me"
    password: "change-me"

vault:
  enabled: false
  role: "devops-info-role"
  authPath: "auth/kubernetes"
  secretPath: "secret/data/myapp/config"
  injectFileName: "config"
  injectCommand: ""
  template: |
    {{- with secret "secret/data/myapp/config" -}}
    DATABASE_USERNAME={{ .Data.data.username }}
    DATABASE_PASSWORD={{ .Data.data.password }}
    {{- end }}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

rollout:
  enabled: false
  strategy: canary
  canary:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: null
    scaleDownDelaySeconds: 30
  analysis:
    enabled: false
    interval: 10s
    count: 3
    failureLimit: 1

statefulset:
  enabled: false
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3

persistence:
  enabled: true
  mountPath: "/data"
  fileName: "visits"
  accessMode: ReadWriteOnce
  size: 100Mi
  storageClass: ""

hookJob:
  image: busybox:1.36
  backoffLimit: 0

hooks:
  preInstall:
    enabled: true
    weight: -5
    deletePolicy: hook-succeeded
    command:
      - sh
      - -c
      - echo "Pre-install validation started" && sleep 5 && echo "Pre-install validation passed"
  postInstall:
    enabled: true
    weight: 5
    deletePolicy: hook-succeeded
    command:
      - sh
      - -c
      - echo "Post-install smoke test started" && sleep 5 && echo "Post-install smoke test passed"
