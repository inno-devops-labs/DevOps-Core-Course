nameOverride: ""
fullnameOverride: ""

replicaCount: 3

# Lab 15: use StatefulSet + per-pod PVCs. Set false to use Argo Rollouts (rollout.yaml).
statefulset:
  enabled: true
  podManagementPolicy: OrderedReady
  updateStrategy:
    # RollingUpdate (optional rollingUpdate.partition) or OnDelete (pods pick up new template after manual delete).
    type: RollingUpdate
    rollingUpdate:
      # Pods with ordinal >= partition get the new revision first (0 = update all ordinals).
      partition: 0

image:
  repository: gghost1/devops-lab-app-python
  tag: "latest"
  # Use Always with tag "latest" so pushed images are picked up; pin tag + IfNotPresent in prod (see values-prod.yaml).
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  portName: http
  targetPort: http
  containerPort: 5000
  nodePort: 30080
  # Used only when rollout.strategy is blueGreen (preview Service).
  preview:
    type: ClusterIP
    nodePort: ""

rollout:
  strategy: canary
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause: { duration: 30s }
      - setWeight: 60
      - pause: { duration: 30s }
      - setWeight: 80
      - pause: { duration: 30s }
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
  analysis:
    enabled: false
    interval: 10s
    count: 3
    failureLimit: 1

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# Security contexts based on the Lab 9 manifests.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - "ALL"

env:
  host: "0.0.0.0"
  port: 5000
  serviceName: "devops-info-service"
  serviceVersion: "latest"
  serviceDescription: "DevOps course info service"
  logLevel: "INFO"
  pythondontwritebytecode: "1"
  visitsFile: "/data/visits"

config:
  env:
    appEnv: "dev"
    appName: "devops-info-service"
    featureVisitsCounter: "true"
    logLevel: "INFO"

persistence:
  enabled: true
  size: "100Mi"
  storageClass: ""

probes:
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 3
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

hooks:
  preInstall:
    image: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
    sleepSeconds: 2
  postInstall:
    image: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
    sleepSeconds: 2

secret:
  create: true
  name: ""
  data:
    username: "change-me-user"
    password: "change-me-password"
    apiToken: "change-me-token"

serviceAccount:
  create: true
  name: ""

vault:
  enabled: false
  role: "devops-info-service-role"
  secretPath: "secret/data/devops-info-service/config"
  injectFileName: "config"
  renderEnvFileName: "app.env"
  authPath: "auth/kubernetes"
