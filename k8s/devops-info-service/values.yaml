replicaCount: 5

image:
  repository: nexonm22/devops-info-service
  tag: "lab12"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automount: true

credentialsSecret:
  enabled: true
  nameSuffix: credentials
  stringData:
    username: nexonm22
    password: devops-info-service

vaultInjector:
  enabled: false
  role: devops-info-service
  secretPath: secret/data/devops-info-service/config
  secretFileName: config

appConfig:
  name: devops-info-service
  environment: default
  features:
    visitsEndpoint: true
    metricsEndpoint: true
  settings:
    logLevel: info
    visitsFile: /data/visits

envConfig:
  APP_NAME: devops-info-service
  APP_ENV: default
  LOG_LEVEL: info
  VISITS_FILE: /data/visits

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
  mountPath: /data

podAnnotations: {}

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30080

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
