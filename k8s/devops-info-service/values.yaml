# Default values — override with -f values-dev.yaml / values-prod.yaml or --set

replicaCount: 3

image:
  repository: devops-info-service
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30080
  preview:
    type: ClusterIP
    port: 80
    targetPort: http
    nodePort: null

containerPort: 5000
containerPortName: http

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env:
  PORT: "5000"

# Lab 12 — ConfigMaps
app:
  name: devops-info-service
  environment: dev
  logLevel: info
  featureFlags:
    visitsCounter: "true"
  dataDir: /data
  configPath: /config/config.json

# Lab 12 — Persistent storage for visits counter
persistence:
  enabled: true
  size: 100Mi
  storageClass: ""   # Use cluster default when empty

# Helm-managed Secret (Task 2). Override with --set-file / external tooling; never commit real credentials.
credentialsSecret:
  enabled: true
  # If empty, secret name is "<release>-<chart>-credentials"
  name: ""
  stringData:
    username: changeme-user
    password: changeme-password

serviceAccount:
  create: false
  automountServiceAccountToken: true
  name: ""
  annotations: {}

podAnnotations: {}

# Vault Agent Injector (Task 3). Requires HashiCorp Vault + injector in cluster; use values-vault.yaml or enable here.
vault:
  injector:
    enabled: false
    role: devops-info-service
    secretPath: secret/data/devops-info/config

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  preInstall:
    enabled: true
    image: busybox:1.36
  postInstall:
    enabled: true
    image: busybox:1.36

# Lab 14 — Argo Rollouts
rollout:
  enabled: true
  strategy: canary   # canary | blueGreen
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: null
    scaleDownDelaySeconds: 30

# Lab 15 — StatefulSet mode (replaces Deployment/Rollout when enabled)
statefulset:
  enabled: false
  podManagementPolicy: OrderedReady
  volumeClaimTemplate:
    name: data
    accessMode: ReadWriteOnce
    size: 100Mi
    storageClass: ""
