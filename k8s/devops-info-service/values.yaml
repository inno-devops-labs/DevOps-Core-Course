replicaCount: 3

secret:
  username: "changeme"
  password: "changeme"

appEnv: "production"
logLevel: "INFO"

image:
  repository: devops-info-service
  tag: "latest"
  pullPolicy: Never

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

rollout:
  enabled: false
  strategy: canary
  blueGreen:
    autoPromotionEnabled: false
  analysis:
    enabled: false

statefulset:
  enabled: false
  updateStrategy: RollingUpdate
  partition: 0

serviceMonitor:
  enabled: false
  release: monitoring
