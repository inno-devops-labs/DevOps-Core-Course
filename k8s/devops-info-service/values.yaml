replicaCount: 1

image:
  repository: almax07082005/devops-info-service
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

environment: "production"
logLevel: "INFO"

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "8000"
  - name: APP_BUILD
    value: "lab12-1"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
  visitsFile: "/data/visits"

# Helm-managed Secret (placeholder values only — override at install time).
secrets:
  enabled: true
  stringData:
    username: "lab11-placeholder-user"
    password: "lab11-placeholder-pass"

# Dedicated ServiceAccount is created when create is true or when Vault injection is enabled (K8s auth binding).
serviceAccount:
  create: false
  name: ""

# Vault Agent Injector annotations (requires HashiCorp Vault Helm chart with injector + cluster configuration).
vault:
  enabled: false
  role: devops-info-service
  injectSecret:
    name: config
    path: secret/data/myapp/config
  injectTemplate:
    enabled: true
    name: config
    content: |
      {{- with secret "secret/data/myapp/config" -}}
      USERNAME={{ .Data.data.username }}
      PASSWORD={{ .Data.data.password }}
      API_KEY={{ .Data.data.api_key }}
      {{- end }}
  extraPodAnnotations: {}

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

revisionHistoryLimit: 3

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
