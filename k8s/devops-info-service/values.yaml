nameOverride: ""
fullnameOverride: ""
component: api
partOf: devops-core-course

replicaCount: 3

image:
  repository: devops-info-service
  tag: "lab09"
  pullPolicy: IfNotPresent

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  enabled: true
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

containerPort: 5000

serviceAccount:
  create: true
  name: ""

app:
  environment: "dev"
  logLevel: "info"
  serviceName: "devops-info-service"
  serviceVersion: "1.0.0"
  serviceDescription: "DevOps course info service"
  serviceFramework: "FastAPI"
  host: "0.0.0.0"
  port: "5000"

config:
  mountPath: "/config"
  env:
    APP_ENV: "dev"
    LOG_LEVEL: "info"
    APP_DISPLAY_NAME: "DevOps Info Service"
    FEATURE_VISITS_ENABLED: "true"
    FEATURE_CONFIG_HOT_RELOAD: "true"
    APP_CONFIG_PATH: "/config/config.json"
    VISITS_FILE: "/data/visits"

secret:
  enabled: true
  name: ""
  data:
    username: "change-me-user"
    password: "change-me-password"

vault:
  enabled: false
  role: "devops-info-service"
  secretPath: "secret/data/devops-info-service/config"
  fileName: "config"
  mountPath: "/vault/secrets"
  renderedFileName: "app.env"
  injectCommand: ""
  templateKeys:
    username: "username"
    password: "password"

extraEnv: []

persistence:
  enabled: true
  mountPath: "/data"
  size: "100Mi"
  accessMode: "ReadWriteOnce"
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

revisionHistoryLimit: 10

rollout:
  enabled: false
  strategy: canary
  blueGreen:
    autoPromotionEnabled: false

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

hooks:
  enabled: true
  image:
    repository: devops-info-service
    tag: "latest"
    pullPolicy: IfNotPresent
  preInstall:
    deletePolicy:
      - before-hook-creation
      - hook-succeeded
    weight: -5
    command:
      - sh
      - -c
      - echo validating release values for devops-info-service && test -n "{{ .Release.Name }}" && echo pre-install validation completed
  postInstall:
    deletePolicy:
      - before-hook-creation
      - hook-succeeded
    weight: 5
    command:
      - sh
      - -c
      - echo running smoke test metadata for {{ .Release.Name }} && echo post-install validation passed

serviceMonitor:
  enabled: false
  port: http
  path: /metrics
  interval: 15s
  labels:
    release: monitoring
