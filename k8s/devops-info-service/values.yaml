replicaCount: 3

image:
  repository: devops-info-service
  tag: "lab15"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

containerPort: 5000

env:
  - name: PORT
    value: "5000"
  - name: VISITS_FILE
    value: "/data/visits"

releaseMetadata:
  version: "1.0.0-stateful"
  track: "stateful"
  color: ""

secret:
  enabled: true
  create: true
  existingSecret: ""
  name: ""
  type: Opaque
  envFrom: true
  stringData:
    APP_USERNAME: "change-me"
    APP_PASSWORD: "change-me"

vault:
  enabled: false
  role: "devops-info-service"
  authPath: "kubernetes"
  secretPath: "secret/data/devops-info-service/config"
  injectFileName: "config.env"
  secretMountPath: "/vault/secrets"
  agentPrePopulateOnly: false
  template:
    enabled: true
    format: "env"

service:
  type: ClusterIP
  port: 80
  targetPort: http
  nodePort: null

rollout:
  enabled: false
  strategy: canary
  canary:
    maxSurge: 1
    maxUnavailable: 0
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: null
    scaleDownDelaySeconds: 30

previewService:
  type: ClusterIP
  port: 80
  targetPort: http
  nodePort: null

analysis:
  enabled: true
  interval: 10s
  count: 3
  failureLimit: 1
  successCondition: "result == 'healthy'"
  web:
    path: /health
    jsonPath: "{$.status}"

statefulset:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 100Mi
  storageClass: ""
  mountPath: /data

minReadySeconds: 5
revisionHistoryLimit: 5

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  enabled: true
  image: busybox:1.36
  preInstall:
    weight: "-5"
    deletePolicy: before-hook-creation,hook-succeeded
  postInstall:
    weight: "5"
    deletePolicy: before-hook-creation,hook-succeeded
    smokeTestPath: /health

nodeSelector: {}
tolerations: []
affinity: {}
