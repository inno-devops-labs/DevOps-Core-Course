replicaCount: 1

environment: dev
logLevel: INFO

image:
  repository: devops-info-service
  tag: "k8sfix"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

serviceAccount:
  create: true
  name: ""

rollout:
  enabled: true
  strategy: canary
  revisionHistoryLimit: 3
  canary:
    maxSurge: 1
    maxUnavailable: 0
  blueGreen:
    autoPromotionEnabled: false
    previewReplicaCount: 1
    scaleDownDelaySeconds: 30

vault:
  enabled: true
  role: myapp-role
  secretPath: secret/data/myapp/config

config:
  applicationName: devops-info-service
  features:
    debugEndpoints: true
    showVisitsInRoot: true

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
  mountPath: /data

resources:
  requests:
    cpu: "150m"
    memory: "128Mi"
  limits:
    cpu: "150m"
    memory: "256Mi"

probes:
  startup:
    enabled: true
    path: /health
    port: 5000
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 24

  readiness:
    enabled: true
    path: /health
    port: 5000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

  liveness:
    enabled: true
    path: /health
    port: 5000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

containerSecurityContext:
  capabilities:
    drop:
      - ALL

env:
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: PORT
    value: "5000"

secrets:
  enabled: true
  data:
    APP_USERNAME: "change-me"
    APP_PASSWORD: "change-me"
