replicaCount: 3

image:
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  nodePort: null

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 384Mi

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
