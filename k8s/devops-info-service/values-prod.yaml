replicaCount: 5

image:
  tag: "1.0.0"

env:
  appEnv: "prod"
  logLevel: "info"
  extra:
    appName: "devops-info-service-prod"
    featureVisitsCounter: true

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  type: LoadBalancer

persistence:
  size: "1Gi"
  storageClass: ""

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 3

secret:
  data:
    username: "replace-me-prod-user"
    password: "replace-me-prod-password"

vault:
  enabled: true
