replicaCount: 5

image:
  tag: "1.0.0"

app:
  environment: "prod"
  logLevel: "warn"

persistence:
  size: 1Gi

secret:
  data:
    username: "prod-user"
    password: "set-via-ci-or-vault"

service:
  type: LoadBalancer
  nodePort: null

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 5

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 3
