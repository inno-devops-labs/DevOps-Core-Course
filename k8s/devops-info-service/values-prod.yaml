replicaCount: 1
environment: prod
logLevel: INFO

image:
  tag: "1.0.0"

service:
  type: LoadBalancer
  nodePort: null

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

config:
  features:
    debugEndpoints: false
    showVisitsInRoot: true

probes:
  startup:
    failureThreshold: 24
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 10

secrets:
  enabled: true
  data:
    APP_USERNAME: "prod-user"
    APP_PASSWORD: "prod-password"
