replicaCount: 3
image:
  tag: lab12
config:
  environment: prod
  settings:
    greeting: Hello from the production release
    logLevel: WARNING
service:
  type: LoadBalancer
resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 384Mi
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
hooks:
  postInstall:
    attempts: 45
    delaySeconds: 2
