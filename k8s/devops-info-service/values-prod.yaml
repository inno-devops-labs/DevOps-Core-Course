replicaCount: 3

image:
  repository: egorlazutkin/devops-info-service
  tag: "lab2"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30082

containerPort: 5000

env:
  HOST: "0.0.0.0"
  PORT: "5000"
  DEBUG: "false"
  RELEASE_VERSION: "prod"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "512Mi"

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
