# Production — multiple replicas, tighter resources, LoadBalancer (cloud-ready)

replicaCount: 3

image:
  repository: devops-info-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

app:
  environment: prod
  logLevel: info

service:
  type: LoadBalancer
  port: 80
  targetPort: http
  nodePort: null

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3
