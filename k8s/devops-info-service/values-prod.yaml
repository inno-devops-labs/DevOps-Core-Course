replicaCount: 5

image:
  tag: lab12-python

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"
  - name: SERVICE_NAME
    value: "devops-info-service"
  - name: SERVICE_VERSION
    value: "1.0.0"
  - name: SERVICE_DESCRIPTION
    value: "Production deployment of the Python DevOps Info Service"
  - name: RELEASE_TRACK
    value: "prod"

config:
  application:
    name: "devops-info-service"
    environment: "prod"
    description: "Production deployment of the Python DevOps Info Service"
  env:
    APP_ENV: "prod"
    LOG_LEVEL: "INFO"
  settings:
    releaseTrack: "prod"

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30091

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

rollout:
  enabled: true
  strategy: canary
  analysis:
    enabled: true

probes:
  liveness:
    path: /health
    port: http
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
