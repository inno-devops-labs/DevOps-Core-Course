replicaCount: 1

image:
  tag: "latest"

app:
  environment: "dev"
  logLevel: "debug"

persistence:
  size: 100Mi

secret:
  data:
    username: "dev-user"
    password: "dev-password-placeholder"

service:
  type: NodePort

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 5
