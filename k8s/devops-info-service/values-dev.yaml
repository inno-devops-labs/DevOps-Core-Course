replicaCount: 1

image:
  tag: "lab10"

env:
  appEnv: "dev"
  logLevel: "debug"
  extra:
    appName: "devops-info-service-dev"
    featureVisitsCounter: true

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

service:
  type: NodePort

persistence:
  size: "100Mi"
  storageClass: ""

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 5

secret:
  data:
    username: "replace-me-dev-user"
    password: "replace-me-dev-password"

vault:
  enabled: false
