replicaCount: 1
environment: dev
logLevel: DEBUG

image:
  tag: "dev"

service:
  type: NodePort
  nodePort: 30081

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

config:
  features:
    debugEndpoints: true
    showVisitsInRoot: true

probes:
  startup:
    failureThreshold: 30
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10

secrets:
  enabled: true
  data:
    APP_USERNAME: "dev-user"
    APP_PASSWORD: "dev-password"
