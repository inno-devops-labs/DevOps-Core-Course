replicaCount: 5
environment: dev
logLevel: DEBUG

image:
  tag: "dev_canary_v2"

service:
  type: NodePort
  nodePort: 30091

rollout:
  enabled: true
  strategy: canary
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

config:
  features:
    debugEndpoints: true
    showVisitsInRoot: true

probes:
  startup:
    failureThreshold: 30
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10

secrets:
  enabled: true
  data:
    APP_USERNAME: "dev-user"
    APP_PASSWORD: "dev-password"

vault:
  enabled: true
  role: myapp-role-dev
  secretPath: secret/data/myapp/config
