replicaCount: 1

image:
  repository: egorlazutkin/devops-info-service
  tag: "lab12"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30083

containerPort: 5000

env:
  HOST: "0.0.0.0"
  PORT: "5000"
  DEBUG: "true"
  RELEASE_VERSION: "lab12-dev"

config:
  environment: "dev"
  logLevel: "debug"
  featureVisitsEnabled: true
  featureMetricsEnabled: true

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

readinessProbe:
  path: /health
  initialDelaySeconds: 3
  periodSeconds: 5

livenessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

secret:
  username: "user-dev"
  password: "DevPass12345"