# Development — single replica, relaxed resources, NodePort

replicaCount: 1

image:
  tag: latest
  pullPolicy: IfNotPresent

app:
  environment: dev
  logLevel: debug

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30081

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
