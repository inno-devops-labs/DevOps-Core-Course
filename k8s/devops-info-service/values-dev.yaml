replicaCount: 1

image:
  repository: egorlazutkin/devops-info-service
  tag: "lab2"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30081

containerPort: 5000

env:
  HOST: "0.0.0.0"
  PORT: "5000"
  DEBUG: "true"
  RELEASE_VERSION: "dev"

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

readinessProbe:
  path: /health
  initialDelaySeconds: 3
  periodSeconds: 5

livenessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
