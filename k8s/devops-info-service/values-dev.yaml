replicaCount: 1

app:
  environment: "dev"
  logLevel: "debug"

image:
  tag: "latest"

service:
  type: NodePort
  nodePort: 30090

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 5

secret:
  data:
    username: "dev-user"
    password: "dev-password"
