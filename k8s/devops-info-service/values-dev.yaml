replicaCount: 1

appConfig:
  environment: "dev"
  settings:
    logLevel: "DEBUG"

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30082

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

secret:
  stringData:
    APP_USERNAME: "dev-user"
    APP_PASSWORD: "replace-me-in-dev"

persistence:
  size: 100Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
