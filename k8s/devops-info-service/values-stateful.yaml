replicaCount: 3

environment: stateful
logLevel: INFO

image:
  repository: devops-info-service
  tag: "stateful"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30082

serviceAccount:
  create: true
  name: ""

rollout:
  enabled: false

statefulset:
  enabled: true
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {}

vault:
  enabled: true
  role: myapp-role-stateful
  secretPath: secret/data/myapp/config

config:
  applicationName: devops-info-service
  features:
    debugEndpoints: true
    showVisitsInRoot: true

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 100Mi
  storageClass: standard
  mountPath: /data

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

probes:
  startup:
    enabled: true
    path: /health
    port: 5000
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 24

  readiness:
    enabled: true
    path: /health
    port: 5000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

  liveness:
    enabled: true
    path: /health
    port: 5000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

containerSecurityContext:
  capabilities:
    drop:
      - ALL

env:
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: PORT
    value: "5000"

secrets:
  enabled: true
  data:
    APP_USERNAME: "change-me"
    APP_PASSWORD: "change-me"