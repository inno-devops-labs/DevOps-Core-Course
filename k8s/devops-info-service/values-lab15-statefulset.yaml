# Lab 15: install with
#   helm upgrade --install lab15 . -n default -f values-lab15-statefulset.yaml
fullnameOverride: devops-info-service

statefulset:
  enabled: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

rollouts:
  enabled: false

replicaCount: 2

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
