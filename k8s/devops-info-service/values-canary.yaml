replicaCount: 5

image:
  repository: devops-info-service
  tag: "lab14-v1"
  pullPolicy: IfNotPresent

env:
  appEnv: "canary"
  logLevel: "info"
  extra:
    appName: "devops-info-service"
    featureVisitsCounter: true

persistence:
  enabled: false

rollout:
  enabled: true
  strategy: canary
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause: { duration: 30s }
      - setWeight: 60
      - pause: { duration: 30s }
      - setWeight: 80
      - pause: { duration: 30s }
      - setWeight: 100
