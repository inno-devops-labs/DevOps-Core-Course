replicaCount: 3

image:
  tag: latest

service:
  type: LoadBalancer
  nodePort: null

env:
  - name: PORT
    value: "8000"
  - name: VISITS_FILE
    value: /data/visits

config:
  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    FEATURE_VISITS_ENABLED: "true"
    CONFIG_PATH: /config/config.json

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

secrets:
  data:
    username: prod-user
    password: prod-password

vault:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
