# Production environment overrides
# Usage: helm install myapp-prod k8s/python-app -f k8s/python-app/values-prod.yaml

replicaCount: 5

image:
  tag: "1.0"

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000
  # nodePort not used with LoadBalancer

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "8000"
  - name: DEBUG
    value: "False"

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3
