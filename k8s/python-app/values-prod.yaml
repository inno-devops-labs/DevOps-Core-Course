controller:
  kind: statefulset

replicaCount: 3

image:
  tag: "latest"
  pullPolicy: Never

app:
  version: lab14-prod-v2-v2
  environment: prod
  logLevel: info

service:
  type: LoadBalancer
  port: 80
  targetPort: 5000

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

secrets:
  data:
    APP_USERNAME: "prod-user"
    APP_PASSWORD: "prod-password"

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

configMap:
  file:
    enabled: true
  env:
    enabled: true

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""
  mountPath: /data

rollout:
  enabled: false
  strategy: blueGreen
  blueGreen:
    autoPromotionEnabled: false
    previewService:
      enabled: true
      type: ClusterIP

initContainers:
  enabled: true
  download:
    enabled: true
    image: busybox:1.36
    url: https://example.com
    outputFile: index.html
    mountPath: /work-dir
  waitForService:
    enabled: true
    image: busybox:1.36
    sleepSeconds: 2

extraVolumes:
  initShared:
    enabled: true
    name: init-shared
    mountPath: /init-data
