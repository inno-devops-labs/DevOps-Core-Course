# Development environment overrides.
# Usage: helm install python-app-dev ./k8s/python-app -f k8s/python-app/values-dev.yaml

replicaCount: 1

image:
  tag: "latest"
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30081

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

env:
  - name: ENV
    value: "development"

environment: "development"
logLevel: "DEBUG"
appName: "devops-info-service-dev"

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 5
