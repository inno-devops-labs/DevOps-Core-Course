# Default values for python-app Helm chart.
# Override these values using -f values-dev.yaml or -f values-prod.yaml
# IMPORTANT: Never commit real secrets to Git. Use --set or external secret managers.

# Application secrets — use placeholder values here, override at deploy time
secrets:
  username: "app-user"
  password: "changeme"
  apiKey: "placeholder-api-key"
  dbUrl: "postgresql://app-user:changeme@localhost:5432/appdb"

# Application environment configuration (used in ConfigMap)
environment: "dev"
logLevel: "info"

# Number of pod replicas
# NOTE: Must be 1 when persistence.enabled=true and accessMode=ReadWriteOnce
replicaCount: 1

image:
  repository: newspec/python_app
  tag: "1.0"
  pullPolicy: IfNotPresent

# Optional: override the chart name
nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

# Rolling update strategy (used only when rollout.enabled is false)
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Argo Rollouts: progressive delivery (replaces Deployment when enabled)
rollout:
  enabled: true
  # canary — gradual weights; blueGreen — active + preview Services
  strategy: canary
  blueGreen:
    autoPromotionEnabled: false
    # autoPromotionSeconds: 30  # optional: auto-promote after N seconds when enabled
    scaleDownDelaySeconds: 30
    # previewNodePort: 30081  # optional: set when service.type is NodePort
  # Web health analysis after 20% canary (requires Argo Rollouts analysis controller)
  analysis:
    enabled: false
    interval: 10s
    count: 3
    failureLimit: 1

# Container resource requests and limits
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# Environment variables passed to the container
env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "8000"
  - name: DEBUG
    value: "False"
  # Path where the visits counter file is stored.
  # When StatefulSet is enabled, each pod writes to its own /data/visits
  # on its dedicated PVC — demonstrating per-pod storage isolation.
  - name: VISITS_FILE
    value: "/data/visits"

# Liveness probe configuration — NEVER comment this out
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5

# Readiness probe configuration — NEVER comment this out
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container-level security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Container command override
command:
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

# Container port
containerPort: 8000

# HashiCorp Vault Agent Injector configuration
vault:
  enabled: false
  role: "python-app"
  secretPath: "secret/data/python-app/config"

# Persistent storage configuration for visits counter
# NOTE: ReadWriteOnce requires replicaCount=1 (single node access)
# When statefulset.enabled=true, this PVC is NOT created standalone —
# instead each pod gets its own PVC via volumeClaimTemplates automatically.
persistence:
  enabled: true
  size: 100Mi
  storageClass: ""  # Empty string = use cluster default storage class

# ─────────────────────────────────────────────────────────────────────────────
# StatefulSet configuration
#
# StatefulSets vs Deployments:
#   Deployment  → stateless apps, random pod names, shared or no PVC
#   StatefulSet → stateful apps (DBs, queues), stable pod names (pod-0, pod-1),
#                 per-pod PVC via volumeClaimTemplates, ordered start/stop
#
# When to use StatefulSet:
#   - Databases (MySQL, PostgreSQL, MongoDB)
#   - Message queues (Kafka, RabbitMQ)
#   - Distributed systems (Elasticsearch, Cassandra)
#   - Any app that needs stable network identity or per-instance storage
#
# Headless Service (clusterIP: None):
#   Creates individual DNS A-records for each pod:
#   <pod-name>.<headless-svc>.<namespace>.svc.cluster.local
#   e.g. python-app-0.python-app-headless.default.svc.cluster.local
#
# Update Strategies:
#   RollingUpdate (default) — pods updated in reverse ordinal order (N-1 → 0)
#     partition: N — only pods with ordinal >= N are updated; lower pods keep
#                    the old version (useful for staged / canary rollouts)
#   OnDelete — pods are only updated when manually deleted; gives full control
#              over when each instance is restarted (useful for databases)
# ─────────────────────────────────────────────────────────────────────────────
statefulset:
  enabled: true          # Set false to fall back to Rollout/Deployment
  replicaCount: 3        # Each replica gets its own PVC via volumeClaimTemplates
  updateStrategy:
    type: RollingUpdate  # RollingUpdate | OnDelete
    rollingUpdate:
      partition: 0       # Only pods with ordinal >= partition are updated
                         # Set to 2 to update only pod-2 (staged rollout demo)
