nameOverride: devops-info-python
fullnameOverride: ""

global:
  partOf: devops-lab15

replicaCount: 3

image:
  repository: ellilin/devops-info-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  nodePort: null

container:
  port: 8000

env:
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "false"
  RELEASE_TRACK: stable
  VISITS_FILE: /data/visits
  CONFIG_FILE: /config/config.json

appConfig:
  environment: dev
  logLevel: info
  features:
    visitsCounter: "true"
    configHotReload: "true"

configMount:
  path: /config

persistence:
  enabled: true
  size: 100Mi
  accessMode: ReadWriteOnce
  storageClass: ""
  mountPath: /data

secret:
  create: true
  name: ""
  data:
    APP_USERNAME: "placeholder-user"
    APP_PASSWORD: "placeholder-password"
    APP_API_KEY: "placeholder-api-key"

serviceAccount:
  create: true
  name: ""

vault:
  enabled: false
  role: python-app-role
  authPath: auth/kubernetes
  secretPath: secret/data/python-app/config
  injectFileName: config
  renderedFile: app.env
  agentInjectCommand: 'sh -c "chmod 0440 /vault/secrets/app.env"'

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsGroup: 1000
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

statefulset:
  enabled: true
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

rollout:
  enabled: false
  strategy: canary
  canary:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 20
      - pause: {}
      - analysis:
          templates:
            - templateName: '{{ include "common.fullname" . }}-success-rate'
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: null
    scaleDownDelaySeconds: 30
  analysis:
    enabled: true
    interval: 10s
    count: 3
    failureLimit: 1
    successCondition: result == "healthy"
    web:
      url: ""
      jsonPath: "{$.status}"

revisionHistoryLimit: 5

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 12

hooks:
  enabled: true
  image: busybox:1.36
  preInstall:
    weight: -5
    command:
      - sh
      - -c
      - echo Validating python chart values before install && test -n "$RELEASE_NAMESPACE" && echo Namespace is "$RELEASE_NAMESPACE" && sleep 12 && echo Pre-install validation complete
  postInstall:
    weight: 5
    command:
      - sh
      - -c
      - echo Running post-install smoke test && sleep 12 && echo Python release smoke test placeholder completed
