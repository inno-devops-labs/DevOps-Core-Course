# Default values for python-app.
# All values can be overridden via -f values-*.yaml or --set flags.

replicaCount: 3

workload:
  type: statefulset

image:
  repository: aliyasag/devops-info-service
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

secret:
  username: "placeholder-user"
  password: "placeholder-password"
  secretKey: "placeholder-secret-key"

# Environment variables injected into the container
env:
  - name: ENV
    value: "production"

# ConfigMap environment values
environment: "production"
logLevel: "INFO"
appName: "devops-info-service"

# Persistent storage for visits counter
persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

# Progressive delivery settings
rollout:
  strategy: canary
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
    previewServiceType: ClusterIP

# Liveness probe - restarts the container if it stops responding
livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

# Readiness probe - removes the Pod from load balancing until ready
readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 3
  failureThreshold: 3
