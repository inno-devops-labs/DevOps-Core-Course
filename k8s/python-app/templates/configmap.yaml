apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-config
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  config.json: |-
{{ .Files.Get "files/config.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-env
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.appConfig.environment | quote }}
  LOG_LEVEL: {{ .Values.appConfig.logLevel | quote }}
  FEATURE_VISITS_COUNTER: {{ .Values.appConfig.features.visitsCounter | quote }}
  FEATURE_CONFIG_HOT_RELOAD: {{ .Values.appConfig.features.configHotReload | quote }}
