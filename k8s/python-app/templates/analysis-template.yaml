{{- if and .Values.rollout.enabled .Values.rollout.analysis.enabled (not .Values.statefulset.enabled) }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "common.fullname" . }}-success-rate
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  metrics:
    - name: health-webcheck
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      provider:
        web:
          url: {{ default (printf "http://%s.%s.svc/health" (include "common.fullname" .) .Release.Namespace) .Values.rollout.analysis.web.url | quote }}
          jsonPath: {{ .Values.rollout.analysis.web.jsonPath | quote }}
      successCondition: {{ .Values.rollout.analysis.successCondition | quote }}
{{- end }}
