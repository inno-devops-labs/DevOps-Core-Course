apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "python-app.fullname" . }}-post-install"
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
  annotations:
    # This job runs AFTER all chart resources are installed and ready
    "helm.sh/hook": post-install
    # Higher weight = runs after other post-install hooks
    "helm.sh/hook-weight": "5"
    # Delete the job pod after successful completion to keep the cluster clean
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  # Retry once on failure
  backoffLimit: 1
  template:
    metadata:
      name: "{{ include "python-app.fullname" . }}-post-install"
      labels:
        {{- include "python-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: post-install-hook
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-job
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "=== Post-install hook starting ==="
              echo "Release: {{ .Release.Name }}"
              echo "Namespace: {{ .Release.Namespace }}"
              echo "Chart: {{ .Chart.Name }}-{{ .Chart.Version }}"
              echo ""
              echo "Waiting for application to stabilize..."
              sleep 10
              echo ""
              echo "Running smoke tests..."
              echo "  [1/3] Checking service endpoint availability..."
              sleep 2
              echo "  Service endpoint: OK"
              echo "  [2/3] Validating health check response..."
              sleep 2
              echo "  Health check: HEALTHY"
              echo "  [3/3] Verifying replica count..."
              sleep 2
              echo "  Replicas: {{ .Values.replicaCount }}/{{ .Values.replicaCount }} ready"
              echo ""
              echo "Sending deployment notification..."
              sleep 1
              echo "Notification sent: {{ .Chart.Name }} v{{ .Chart.AppVersion }} deployed successfully"
              echo ""
              echo "=== Post-install hook completed successfully ==="
