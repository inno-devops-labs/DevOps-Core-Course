{{- if .Values.statefulset.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "python-app.fullname" . }}
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
spec:
  # serviceName links this StatefulSet to the headless Service.
  # Kubernetes uses it to build stable DNS names for each pod:
  #   <pod-name>.<serviceName>.<namespace>.svc.cluster.local
  serviceName: {{ include "python-app.fullname" . }}-headless
  replicas: {{ .Values.statefulset.replicaCount }}
  selector:
    matchLabels:
      {{- include "python-app.selectorLabels" . | nindent 6 }}
  # ── Update Strategy ────────────────────────────────────────────────────────
  # RollingUpdate (default): pods updated in reverse ordinal order (N-1 → 0).
  #   partition: N — only pods with ordinal >= N are updated; lower pods keep
  #              the old version. Useful for staged / canary-style rollouts.
  # OnDelete: pods are only updated when manually deleted. Gives full control
  #           over when each instance restarts (useful for databases).
  updateStrategy:
    type: {{ .Values.statefulset.updateStrategy.type }}
    {{- if eq .Values.statefulset.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      partition: {{ .Values.statefulset.updateStrategy.rollingUpdate.partition }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "python-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/component: web
      annotations:
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-config: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-config: |
          {{`{{- with secret `}}"{{ .Values.vault.secretPath }}"{{` -}}`}}
          USERNAME={{ `{{ .Data.data.username }}` }}
          PASSWORD={{ `{{ .Data.data.password }}` }}
          API_KEY={{ `{{ .Data.data.api_key }}` }}
          DB_URL={{ `{{ .Data.data.db_url }}` }}
          {{`{{- end -}}`}}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/config-env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "python-app.fullname" . }}-config
        # NOTE: the "data" volume is intentionally NOT listed here.
        # It is provided per-pod via volumeClaimTemplates below, which
        # automatically creates a dedicated PVC for each pod ordinal.
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "python-app.fullname" . }}-secret
            - configMapRef:
                name: {{ include "python-app.fullname" . }}-env
          env:
            {{- include "python-app.commonEnvVars" . | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            # "data" is mounted from the per-pod PVC created by volumeClaimTemplates
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
  # ── VolumeClaimTemplates ───────────────────────────────────────────────────
  # Kubernetes automatically creates one PVC per pod using this template.
  # PVC names follow the pattern: <template-name>-<pod-name>
  #   e.g. data-python-app-0, data-python-app-1, data-python-app-2
  # These PVCs persist independently — deleting a pod does NOT delete its PVC.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "python-app.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
{{- end }}
