{{- if .Values.statefulset.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "python-app.fullname" . }}
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "python-app.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ .Values.statefulset.podManagementPolicy | default "OrderedReady" }}
  updateStrategy:
    {{- toYaml .Values.statefulset.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "python-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "python-app.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- if .Values.env }}
          env:
            {{- include "python-app.envVars" . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "python-app.fullname" . }}-secret
            - configMapRef:
                name: {{ include "python-app.fullname" . }}-env
          volumeMounts:
            - name: config-volume
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "python-app.fullname" . }}-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "python-app.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.statefulset.accessMode | default "ReadWriteOnce" }}
        resources:
          requests:
            storage: {{ .Values.statefulset.storageSize }}
        {{- if .Values.statefulset.storageClass }}
        storageClassName: {{ .Values.statefulset.storageClass }}
        {{- end }}
{{- end }}
