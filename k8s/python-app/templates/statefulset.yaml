{{- if eq .Values.workload.type "statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "python-app.fullname" . }}
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "python-app.headlessServiceName" . }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "python-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "python-app.labels" . | nindent 8 }}
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-{{ .Values.vault.injectFileName }}: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-{{ .Values.vault.injectFileName }}: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}
          username={{ .Data.data.username }}
          password={{ .Data.data.password }}
          {{- end }}`}}
      {{- end }}
    spec:
      serviceAccountName: {{ include "python-app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        - name: init-download
          image: "{{ .Values.initContainers.download.image.repository }}:{{ .Values.initContainers.download.image.tag }}"
          imagePullPolicy: {{ .Values.initContainers.download.image.pullPolicy }}
          command:
            - sh
            - -c
            - wget -O {{ .Values.initContainers.sharedVolume.mountPath }}/{{ .Values.initContainers.download.destinationFile }} {{ .Values.initContainers.download.url | quote }}
          volumeMounts:
            - name: {{ .Values.initContainers.sharedVolume.name }}
              mountPath: {{ .Values.initContainers.sharedVolume.mountPath }}
        {{- if .Values.initContainers.waitForService.enabled }}
        - name: wait-for-service
          image: "{{ .Values.initContainers.waitForService.image.repository }}:{{ .Values.initContainers.waitForService.image.tag }}"
          imagePullPolicy: {{ .Values.initContainers.waitForService.image.pullPolicy }}
          command:
            - sh
            - -c
            - until nc -z {{ .Values.initContainers.waitForService.host | quote }} {{ .Values.initContainers.waitForService.port }}; do echo "waiting for {{ .Values.initContainers.waitForService.host }}:{{ .Values.initContainers.waitForService.port }}"; sleep {{ .Values.initContainers.waitForService.sleepSeconds }}; done; echo "service is reachable"
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "python-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "python-app.fullname" . }}-env
          {{- if .Values.secrets.enabled }}
            - secretRef:
                name: {{ include "python-app.secretName" . }}
          {{- end }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
            {{- if .Values.initContainers.enabled }}
            - name: {{ .Values.initContainers.sharedVolume.name }}
              mountPath: {{ .Values.initContainers.sharedVolume.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: {{ .Values.persistence.claimName }}
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "python-app.fullname" . }}-config
        {{- if .Values.initContainers.enabled }}
        - name: {{ .Values.initContainers.sharedVolume.name }}
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.persistence.claimName }}
        labels:
          {{- include "python-app.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}
