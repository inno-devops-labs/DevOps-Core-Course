apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "python-app.fullname" . }}-env
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  APP_NAME: {{ .Chart.Name | quote }}
  APP_VERSION: {{ .Chart.AppVersion | quote }}
