replicaCount: 3

image:
  repository: mariablood/python-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30007

headlessService:
  port: 5000

env:
  ENV: dev

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

probes:
  path: /health
  livenessDelay: 10
  readinessDelay: 5

persistence:
  enabled: true
  size: 100Mi
  accessMode: ReadWriteOnce
  storageClass: ""

statefulset:
  podManagementPolicy: OrderedReady

  updateStrategy:
    type: RollingUpdate
    partition: 0