---
# Demo 1: Init container that downloads a file into a shared volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-download-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: init-download-demo
  template:
    metadata:
      labels:
        app: init-download-demo
    spec:
      initContainers:
        - name: init-download
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Init container: writing config to shared volume..."
              echo '{"initialized": true, "message": "Hello from init container", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > /work-dir/config.json
              echo "Done."
          volumeMounts:
            - name: workdir
              mountPath: /work-dir
      containers:
        - name: main-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Main app started. Reading init data:"
              cat /data/config.json
              echo ""
              echo "Sleeping forever..."
              sleep infinity
          volumeMounts:
            - name: workdir
              mountPath: /data
      volumes:
        - name: workdir
          emptyDir: {}
---
# Demo 2: Init container that waits for a service before starting main app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-wait-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: init-wait-demo
  template:
    metadata:
      labels:
        app: init-wait-demo
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for kubernetes service to be available..."
              until nslookup kubernetes.default.svc.cluster.local; do
                echo "Service not ready, retrying in 2s..."
                sleep 2
              done
              echo "Service is ready! Starting main container."
      containers:
        - name: main-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Main app started — dependency was ready!"
              sleep infinity
