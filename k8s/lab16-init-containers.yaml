apiVersion: v1
kind: ConfigMap
metadata:
  name: lab16-content
  labels:
    app.kubernetes.io/name: lab16-content
    app.kubernetes.io/part-of: devops-core-course
data:
  index.html: |
    Lab 16 init container download evidence.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab16-content
  labels:
    app.kubernetes.io/name: lab16-content
    app.kubernetes.io/part-of: devops-core-course
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab16-content
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab16-content
        app.kubernetes.io/part-of: devops-core-course
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: lab16-content
---
apiVersion: v1
kind: Service
metadata:
  name: lab16-content
  labels:
    app.kubernetes.io/name: lab16-content
    app.kubernetes.io/part-of: devops-core-course
spec:
  selector:
    app.kubernetes.io/name: lab16-content
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: lab16-init-download
  labels:
    app.kubernetes.io/name: lab16-init-download
    app.kubernetes.io/part-of: devops-core-course
spec:
  restartPolicy: Never
  initContainers:
    - name: init-download
      image: busybox:1.36
      command:
        - sh
        - -c
        - wget -O /work-dir/index.html "http://${LAB16_CONTENT_SERVICE_HOST}"
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: main-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - cat /data/index.html && sleep 3600
      volumeMounts:
        - name: workdir
          mountPath: /data
  volumes:
    - name: workdir
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: lab16-wait-for-service
  labels:
    app.kubernetes.io/name: lab16-wait-for-service
    app.kubernetes.io/part-of: devops-core-course
spec:
  restartPolicy: Never
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - until nslookup lab16-content.default.svc.cluster.local; do echo "waiting for lab16-content"; sleep 2; done
  containers:
    - name: main-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo "dependency is ready" && sleep 3600
