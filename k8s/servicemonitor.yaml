apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: myapp-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app.kubernetes.io/name: myapp
      app.kubernetes.io/name: mychart
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
