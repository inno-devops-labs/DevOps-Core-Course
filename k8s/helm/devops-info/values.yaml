replicaCount: 3

image:
  repository: merkulovlr05/devops-info
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

env:
  - name: PORT
    value: "5000"
  - name: HOST
    value: "0.0.0.0"

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  requests:
    cpu: "50m"
    memory: "96Mi"
  limits:
    cpu: "200m"
    memory: "192Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

# Placeholder values — override with --set or external secret manager in production
secret:
  username: "app-user"
  password: "changeme"

appEnv: "development"
logLevel: "INFO"

persistence:
  enabled: true
  size: "100Mi"
  storageClass: ""
