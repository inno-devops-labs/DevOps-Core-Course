apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info.fullname" . }}-post-install"
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "devops-info.fullname" . }}-post-install"
    spec:
      restartPolicy: Never
      containers:
        - name: post-install
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Post-install: running smoke test..."
              echo "Release {{ .Release.Name }} deployed successfully."
              echo "Image: {{ .Values.image.repository }}:{{ .Values.image.tag }}"
              echo "Replicas: {{ .Values.replicaCount }}"
              echo "Smoke test passed."
