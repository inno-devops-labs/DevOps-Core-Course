apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "testiks.fullname" . }}-pre-install"
  labels:
    {{- include "testiks.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": {{ if .Values.hooks.deleteAfterSuccess }}hook-succeeded{{ else }}before-hook-creation{{ end }}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
        helm.sh/hook: pre-install
    spec:
      restartPolicy: Never
      containers:
        - name: pre-install
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "pre-install: release={{ .Release.Name }} ns={{ .Release.Namespace }}"
              echo "pre-install OK"
