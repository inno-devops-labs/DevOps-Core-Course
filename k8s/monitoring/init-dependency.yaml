# Minimal dependency for StatefulSet initContainers wait-for-service pattern.
# Apply before enabling initContainers in the Helm chart:
#   kubectl apply -f k8s/monitoring/init-dependency.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-dependency
  labels:
    app: init-dependency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: init-dependency
  template:
    metadata:
      labels:
        app: init-dependency
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: init-dependency
spec:
  selector:
    app: init-dependency
  ports:
    - port: 80
      targetPort: 80
