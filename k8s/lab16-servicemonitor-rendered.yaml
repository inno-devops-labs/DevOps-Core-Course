apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lab16-devops-info-service
  labels:
    helm.sh/chart: devops-info-service-0.1.0
    app.kubernetes.io/name: devops-info-service
    app.kubernetes.io/instance: lab16
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-info-service
      app.kubernetes.io/instance: lab16
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
