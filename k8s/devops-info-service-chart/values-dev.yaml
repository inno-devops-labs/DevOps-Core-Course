# Development environment
replicaCount: 1

image:
  tag: latest

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

service:
  type: NodePort

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5

readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 3

configmap:
  enabled: true
  env:
    APP_ENV: "development"
    LOG_LEVEL: "DEBUG"
    FEATURE_METRICS: "false"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 50Mi
  storageClass: ""