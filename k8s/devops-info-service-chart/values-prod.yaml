replicaCount: 3

image:
  repository: chaleshka/devops-info-service
  pullPolicy: IfNotPresent
  tag: "2026.02.11"

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"
  - name: MARKER
    value: "This is the production environment with update"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 3

secret:
  appUsername: "chal"
  appPassword: "password_for_DevOps"