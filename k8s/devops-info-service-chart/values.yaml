# Default values for devops-info-service

replicaCount: 3

image:
  repository: devops-info-service
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: null

container:
  port: 5000
  portName: http

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5000"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  preInstall:
    enabled: true
    image: busybox:1.36
    weight: -5
  postInstall:
    enabled: true
    image: busybox:1.36
    weight: 5