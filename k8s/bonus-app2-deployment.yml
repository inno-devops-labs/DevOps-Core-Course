apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-info-service-go
  namespace: devops-lab09
  labels:
    app.kubernetes.io/name: devops-info-service-go
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devops-core-course
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-info-service-go
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-info-service-go
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: devops-core-course
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: devops-info-service-go
          image: devops-info-service-go:lab09
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
