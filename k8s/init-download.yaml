# Task 3.1 — Init container: download a file to a shared volume
#
# The init container runs first, downloads index.html from example.com into
# an emptyDir volume, then exits. Only after that does the main nginx container
# start and serve the downloaded page on port 80.
#
# Apply:   kubectl apply -f k8s/init-download.yaml
# Watch:   kubectl get pod init-download -w
# Logs:    kubectl logs init-download -c init-download
# Verify:  kubectl exec init-download -- cat /usr/share/nginx/html/index.html | head -5

apiVersion: v1
kind: Pod
metadata:
  name: init-download
  labels:
    app: init-download
spec:
  restartPolicy: Never
  initContainers:
    - name: init-download
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Downloading index.html from example.com ..."
          wget -O /work-dir/index.html https://example.com
          echo "Download complete. File size: $(wc -c < /work-dir/index.html) bytes"
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: main-app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
          name: http
      volumeMounts:
        - name: workdir
          mountPath: /usr/share/nginx/html
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  volumes:
    - name: workdir
      emptyDir: {}
