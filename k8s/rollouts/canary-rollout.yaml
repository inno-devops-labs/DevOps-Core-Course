apiVersion: v1
kind: Service
metadata:
  name: rollouts-demo
  labels:
    app: rollouts-demo
spec:
  ports:
    - port: 80
      targetPort: 5000
  selector:
    app: rollouts-demo

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-demo-canary
  labels:
    app: rollouts-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rollouts-demo
  template:
    metadata:
      labels:
        app: rollouts-demo
    spec:
      containers:
        - name: devops-app
          image: devops-app:lab12
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: VISITS_FILE
              value: "/tmp/visits"
          volumeMounts:
            - name: visits-storage
              mountPath: /data
              readOnly: false
      volumes:
        - name: visits-storage
          emptyDir: {}
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {} # manual promotion
        - setWeight: 40
        - pause: {duration: 30s}
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}
        - setWeight: 100
