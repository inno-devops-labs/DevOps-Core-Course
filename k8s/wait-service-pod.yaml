apiVersion: v1
kind: Pod
metadata:
  name: wait-service-demo
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - until nslookup kubernetes.default.svc.cluster.local; do echo waiting for service; sleep 2; done

  containers:
    - name: nginx
      image: nginx:stable