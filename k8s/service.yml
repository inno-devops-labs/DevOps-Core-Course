apiVersion: v1
kind: Service
metadata:
    name: devops-app-service
    labels:
        app: devops-app
        version: v1
        environment: production
spec:
    type: NodePort
    selector:
        app: devops-app
    ports:
        - name: http
          port: 80
          targetPort: 8000
          protocol: TCP
          nodePort: 30080
