# Source: devops-info/templates/rollout.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: devops-info-prod-devops-info
  labels:
    helm.sh/chart: devops-info-0.1.0
    app.kubernetes.io/name: devops-info
    app.kubernetes.io/instance: devops-info-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-info
      app.kubernetes.io/instance: devops-info-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-info
        app.kubernetes.io/instance: devops-info-prod
        tier: backend
    spec:
      serviceAccountName: devops-info-prod-devops-info-sa
      containers:
        - name: devops-info-service
          image: "alsstarikova/devops-info-service:lab09"
          imagePullPolicy: IfNotPresent
          workingDir: /home/app
          command:
            - python
            - -m
            - uvicorn
          args:
            - app:app
            - --host
            - 0.0.0.0
            - --port
            - "5000"
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: devops-info-prod-devops-info-config-env
            - secretRef:
                name: devops-info-prod-devops-info-secret
          env:
            - name: PORT
              value: "5000"
            - name: PYTHONPATH
              value: /home/app
            - name: VISITS_FILE
              value: /data/visits
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 3
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            - name: data-volume
              mountPath: /data
      volumes:
        - name: config-volume
          configMap:
            name: devops-info-prod-devops-info-config-file
        - name: data-volume
          persistentVolumeClaim:
            claimName: devops-info-prod-devops-info-data
  strategy:
    blueGreen:
      activeService: devops-info-prod-devops-info
      previewService: devops-info-prod-devops-info-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
