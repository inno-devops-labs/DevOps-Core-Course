# Source: devops-info/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devops-info-sts-devops-info
  labels:
    helm.sh/chart: devops-info-0.1.0
    app.kubernetes.io/name: devops-info
    app.kubernetes.io/instance: devops-info-sts
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: devops-info-sts-devops-info-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-info
      app.kubernetes.io/instance: devops-info-sts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-info
        app.kubernetes.io/instance: devops-info-sts
        tier: backend
    spec:
      serviceAccountName: devops-info-sts-devops-info-sa
      containers:
        - name: devops-info-service
          image: "alsstarikova/devops-info-service:latest"
          imagePullPolicy: IfNotPresent
          workingDir: /home/app
          command:
            - python
            - -m
            - uvicorn
          args:
            - app:app
            - --host
            - 0.0.0.0
            - --port
            - "5000"
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: devops-info-sts-devops-info-config-env
            - secretRef:
                name: devops-info-sts-devops-info-secret
          env:
            - name: PORT
              value: "5000"
            - name: PYTHONPATH
              value: /home/app
            - name: VISITS_FILE
              value: /data/visits
          resources:
            limits:
              cpu: 150m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            - name: data-volume
              mountPath: /data
      volumes:
        - name: config-volume
          configMap:
            name: devops-info-sts-devops-info-config-file
  volumeClaimTemplates:
    - metadata:
        name: data-volume
        labels:
          helm.sh/chart: devops-info-0.1.0
          app.kubernetes.io/name: devops-info
          app.kubernetes.io/instance: devops-info-sts
          app.kubernetes.io/version: "1.0.0"
          app.kubernetes.io/managed-by: Helm
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
