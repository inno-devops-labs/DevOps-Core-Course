apiVersion: v1
kind: Service
metadata:
  name: my-backend
  namespace: default
spec:
  selector:
    app: my-backend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: my-backend-pod
  namespace: default
  labels:
    app: my-backend
spec:
  containers:
    - name: backend
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: init-wait-pod
  namespace: default
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command: ['sh', '-c', 'until nslookup my-backend.default.svc.cluster.local; do echo "Waiting for my-backend..."; sleep 2; done; echo "Service is up!"']
  containers:
    - name: main-app
      image: busybox:1.36
      command: ['sh', '-c', 'echo "Dependency is ready, starting main app"; sleep 3600']
