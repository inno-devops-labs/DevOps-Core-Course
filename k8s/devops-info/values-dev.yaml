replicaCount: 1

image:
  tag: "lab02"

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30081

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

env:
  RELEASE_VERSION: "dev"

configEnv:
  APP_ENV: "dev"
  LOG_LEVEL: "debug"
  FEATURE_VISITS_COUNTER: "true"
  VISITS_FILE: "/data/visits"

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
