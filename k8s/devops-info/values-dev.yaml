replicaCount: 1

service:
  type: NodePort
  nodePort: 30090

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

env:
  APP_ENV: "development"
  LOG_LEVEL: "DEBUG"
  SERVICE_DESCRIPTION: "Development deployment of the DevOps info service"

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 3
