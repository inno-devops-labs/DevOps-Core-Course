replicaCount: 1

workload:
  type: statefulset

image:
  tag: "latest"

appConfig:
  environment: "dev"

configMaps:
  env:
    data:
      APP_ENV: "dev"
      LOG_LEVEL: "DEBUG"
      FEATURE_VISITS: "true"

service:
  type: NodePort
  nodePort: 30080

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 5
