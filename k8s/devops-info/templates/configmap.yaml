apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info.configFileConfigMapName" . }}
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
data:
  config.json: |-
{{ .Files.Get "files/config.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info.configEnvConfigMapName" . }}
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
data:
  {{- range $key := keys .Values.configEnv | sortAlpha }}
  {{ $key }}: {{ index $.Values.configEnv $key | quote }}
  {{- end }}
