apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info.fullname" . }}-config-file
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
data:
  config.json: |-
{{ .Files.Get "files/config.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-info.fullname" . }}-config-env
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.env.appEnv | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_CONFIG_ENVIRONMENT: {{ .Values.config.environment | quote }}
  FEATURE_VISITS_COUNTER: {{ .Values.config.featureVisitsCounter | quote }}
