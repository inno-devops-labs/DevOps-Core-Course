{{- if and .Values.rollout.enabled (not .Values.statefulset.enabled) (eq .Values.rollout.strategy "blueGreen") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ default (printf "%s-preview" (include "common-lib.fullname" .)) .Values.rollout.blueGreen.previewServiceName }}
  labels:
    {{- include "devops-info.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: "preview-service"
spec:
  type: {{ .Values.rollout.blueGreen.previewService.type }}
  selector:
    {{- include "common-lib.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- end }}
