{{- if .Values.statefulset.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-info.headlessServiceName" . }}
  labels:
    {{- include "devops-info.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: "headless-service"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "common-lib.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ default .Values.service.port .Values.headlessService.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- end }}
