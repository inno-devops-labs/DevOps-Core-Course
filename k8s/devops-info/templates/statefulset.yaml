{{- if .Values.statefulset.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "common.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ .Values.statefulset.podManagementPolicy }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  updateStrategy:
    type: {{ .Values.statefulset.updateStrategy.type }}
    {{- if and (eq .Values.statefulset.updateStrategy.type "RollingUpdate") .Values.statefulset.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml .Values.statefulset.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.vault.enabled .Values.podAnnotations .Values.config.enabled }}
      annotations:
        {{- if .Values.config.enabled }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: {{ ternary "true" "false" .Values.vault.agentPrePopulateOnly | quote }}
        vault.hashicorp.com/auth-path: {{ .Values.vault.authPath | quote }}
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        {{ printf "vault.hashicorp.com/agent-inject-secret-%s" .Values.vault.fileName }}: {{ .Values.vault.secretPath | quote }}
        {{ printf "vault.hashicorp.com/agent-inject-template-%s" .Values.vault.fileName }}: |
{{- .Values.vault.template | trim | nindent 10 }}
        {{- if .Values.vault.injectCommand }}
        {{ printf "vault.hashicorp.com/agent-inject-command-%s" .Values.vault.fileName }}: {{ .Values.vault.injectCommand | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "common.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        {{- if .Values.initContainers.waitForService.enabled }}
        - name: {{ .Values.initContainers.waitForService.name }}
          image: {{ .Values.initContainers.waitForService.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            {{- toYaml .Values.initContainers.waitForService.command | nindent 12 }}
          env:
            - name: SERVICE_NAME
              value: {{ .Values.initContainers.waitForService.serviceName | quote }}
            {{- with .Values.initContainers.waitForService.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- end }}
        {{- if .Values.initContainers.download.enabled }}
        - name: {{ .Values.initContainers.download.name }}
          image: {{ .Values.initContainers.download.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            {{- toYaml .Values.initContainers.download.command | nindent 12 }}
          env:
            - name: DOWNLOAD_URL
              value: {{ .Values.initContainers.download.url | quote }}
            - name: FILE_NAME
              value: {{ .Values.initContainers.download.fileName | quote }}
            - name: WORKDIR
              value: {{ .Values.initContainers.workdirMountPath | quote }}
          volumeMounts:
            - name: {{ .Values.initContainers.workdirVolumeName }}
              mountPath: {{ .Values.initContainers.workdirMountPath }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "common.name" . }}
          image: "{{ include "devops-info.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          env:
            {{- include "devops-info.envVars" . | nindent 12 }}
          {{- if or (and .Values.config.enabled .Values.config.env.enabled) (and .Values.secret.enabled .Values.secret.injectAsEnvFrom) }}
          envFrom:
            {{- if and .Values.config.enabled .Values.config.env.enabled }}
            - configMapRef:
                name: {{ include "devops-info.envConfigMapName" . }}
            {{- end }}
            {{- if and .Values.secret.enabled .Values.secret.injectAsEnvFrom }}
            - secretRef:
                name: {{ include "devops-info.secretName" . }}
            {{- end }}
          {{- end }}
          {{- if or (and .Values.config.enabled .Values.config.file.enabled) .Values.persistence.enabled .Values.initContainers.enabled }}
          volumeMounts:
            {{- if and .Values.config.enabled .Values.config.file.enabled }}
            - name: config-volume
              mountPath: {{ .Values.config.file.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.initContainers.enabled }}
            - name: {{ .Values.initContainers.workdirVolumeName }}
              mountPath: {{ .Values.initContainers.workdirMountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- if or (and .Values.config.enabled .Values.config.file.enabled) (and .Values.persistence.enabled .Values.persistence.existingClaim) .Values.initContainers.enabled }}
      volumes:
        {{- if and .Values.config.enabled .Values.config.file.enabled }}
        - name: config-volume
          configMap:
            name: {{ include "devops-info.fileConfigMapName" . }}
        {{- end }}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- if .Values.initContainers.enabled }}
        - name: {{ .Values.initContainers.workdirVolumeName }}
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data-volume
        labels:
          {{- include "common.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}
