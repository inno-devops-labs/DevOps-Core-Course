apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devops-info.fullname" . }}
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "devops-info.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devops-info.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "devops-info.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "devops-info.serviceAccountName" . }}
      {{- end }}
      initContainers:
      - name: init-wait-service
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Init: waiting for monitoring-grafana.monitoring.svc.cluster.local:80"
          until nc -z monitoring-grafana.monitoring.svc.cluster.local 80; do
            echo "Init: service not ready, retry in 2s"
            sleep 2
          done
          echo "Init: service is reachable"
      - name: init-download-file
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Init: downloading bootstrap file"
          wget -q -O /data/bootstrap.html http://monitoring-grafana.monitoring.svc.cluster.local/login || true
          if [ ! -s /data/bootstrap.html ]; then
            echo "fallback-bootstrap" > /data/bootstrap.html
          fi
          ls -lh /data/bootstrap.html
        volumeMounts:
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.containerPort }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- if .Values.secrets.create }}
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "devops-info.secretName" . }}
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "devops-info.secretName" . }}
              key: password
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- if .Values.configmap.enabled }}
        - name: config
          mountPath: /etc/config
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      {{- if .Values.configmap.enabled }}
      - name: config
        configMap:
          name: {{ include "devops-info.fullname" . }}-config
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
