{{- if and .Values.statefulset.enabled .Values.statefulset.headlessService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-info.headlessServiceName" . }}
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: {{ .Values.statefulset.headlessService.publishNotReadyAddresses }}
  selector:
    {{- include "devops-info.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
