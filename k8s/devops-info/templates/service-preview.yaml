{{- if and .Values.rollout.enabled (eq .Values.rollout.strategy "blueGreen") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-info.previewServiceName" . }}
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
spec:
  type: {{ .Values.rollout.blueGreen.previewServiceType }}
  selector:
    {{- include "devops-info.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
