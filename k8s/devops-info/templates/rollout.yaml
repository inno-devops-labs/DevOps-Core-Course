{{- if not .Values.statefulset.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "devops-info.fullname" . }}
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "devops-info.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-info.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- if .Values.vault.enabled }}
        {{- /*
        Preserve existing Vault annotations alongside checksum/config.
        */}}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-{{ .Values.vault.injectFileName }}: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-{{ .Values.vault.injectFileName }}: |
{{ .Values.vault.injectTemplate | nindent 10 }}
        {{- if .Values.vault.injectCommand }}
        vault.hashicorp.com/agent-inject-command-{{ .Values.vault.injectFileName }}: {{ .Values.vault.injectCommand | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "devops-info.serviceAccountName" . }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
{{ include "devops-info.initContainers" . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "devops-info.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- include "devops-info.envVars" . | nindent 12 }}
          envFrom:
            {{- if .Values.secrets.enabled }}
            - secretRef:
                name: {{ default (printf "%s-secret" (include "devops-info.fullname" .)) .Values.secrets.name }}
            {{- end }}
            - configMapRef:
                name: {{ include "devops-info.fullname" . }}-config-env
          volumeMounts:
            - name: config-volume
              mountPath: /config/config.json
              subPath: config.json
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: /data
            {{- end }}
            {{- if .Values.initContainers.enabled }}
            - name: init-workdir
              mountPath: /init-files
              readOnly: true
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "devops-info.fullname" . }}-config-file
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "devops-info.fullname" . }}-data
        {{- end }}
        {{- if .Values.initContainers.enabled }}
        - name: init-workdir
          emptyDir: {}
        {{- end }}
  strategy:
{{- if eq .Values.rollout.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ include "devops-info.fullname" . }}
      previewService: {{ include "devops-info.fullname" . }}-preview
      {{- with .Values.rollout.blueGreen }}
      autoPromotionEnabled: {{ .autoPromotionEnabled }}
      {{- if .scaleDownDelaySeconds }}
      scaleDownDelaySeconds: {{ .scaleDownDelaySeconds }}
      {{- end }}
      {{- end }}
{{- else }}
    canary:
      steps:
{{- include "devops-info.canarySteps" . | nindent 8 }}
{{- end }}
{{- end }}
