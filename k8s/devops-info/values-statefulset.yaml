fullnameOverride: lab15-devops-info

replicaCount: 3

image:
  repository: app_python-devops-info
  tag: latest
  pullPolicy: IfNotPresent

service:
  enabled: true
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30089

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5002"
  - name: CONFIG_PATH
    value: /config/config.json
  - name: VISITS_FILE
    value: /data/visits
  - name: APP_ENV
    value: lab15-statefulset
  - name: APP_REVISION
    value: stateful-final

statefulset:
  enabled: true
  podManagementPolicy: OrderedReady
  headlessService:
    enabled: true
    publishNotReadyAddresses: false
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {}

persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 100Mi
  storageClass: standard
  mountPath: /data

hookJobs:
  enabled: false
