replicaCount: 4

service:
  type: LoadBalancer

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "5002"
  - name: CONFIG_PATH
    value: /config/config.json
  - name: VISITS_FILE
    value: /data/visits
  - name: APP_ENV
    value: helm-prod
  - name: APP_REVISION
    value: prod-v1

config:
  file:
    environment: prod
  env:
    data:
      APP_MODE: production
      LOG_LEVEL: warn
      FEATURE_PROFILE: stable
      FEATURE_RUNTIME_CONFIG: enabled

persistence:
  enabled: false

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3
