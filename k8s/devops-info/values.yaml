replicaCount: 3

nameOverride: ""
fullnameOverride: ""

image:
  repository: devops_lab02
  tag: "cilc"
  pullPolicy: IfNotPresent

container:
  port: 8080
  env:
    - name: HOST
      value: "0.0.0.0"
    - name: PORT
      value: "8080"

deployment:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

podAnnotations: {}
podLabels: {}

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  image: busybox:1.36
  preInstall:
    enabled: true
    weight: -5
    command:
      - sh
      - -c
      - echo "Validating pre-install conditions" && sleep 3 && echo "Pre-install checks completed"
  postInstall:
    enabled: true
    weight: 5
