# Default values for devops-info chart.

replicaCount: 3

image:
  repository: j0cos/devops-info-service
  tag: "lab02"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  HOST: "0.0.0.0"
  PORT: "5000"
  DEBUG: "false"
  RELEASE_VERSION: "v1"

configEnv:
  APP_ENV: "dev"
  LOG_LEVEL: "info"
  FEATURE_VISITS_COUNTER: "true"
  VISITS_FILE: "/data/visits"

secrets:
  create: true
  name: ""
  data:
    APP_USERNAME: "change-me-username"
    APP_PASSWORD: "change-me-password"

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 100Mi
  storageClass: ""

vault:
  enabled: false
  role: "devops-info-role"
  secretPath: "secret/data/myapp/config"
  injectFileName: "config"

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

hooks:
  enabled: true
  image: busybox:1.36
  preInstall:
    weight: -5
    command: "echo pre-install validation start && sleep 8 && echo pre-install validation done"
  postInstall:
    weight: 5
    command: "echo post-install smoke test start && sleep 8 && echo post-install smoke test done"

rollout:
  enabled: true
  strategy: canary
  revisionHistoryLimit: 2
  canary:
    maxSurge: "25%"
    maxUnavailable: 0
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    activeService: ""
    previewService: ""
    previewServiceType: ClusterIP
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30

statefulset:
  enabled: false
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition:
  headlessService:
    enabled: true
    name: ""
    publishNotReadyAddresses: true
