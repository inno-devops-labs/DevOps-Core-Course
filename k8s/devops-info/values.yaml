replicaCount: 3

nameOverride: ""
fullnameOverride: ""

workload:
  # Supported: deployment, rollout, statefulset
  type: statefulset

image:
  repository: devops_lab02
  tag: "cilc"
  pullPolicy: IfNotPresent

container:
  port: 8080
  env:
    - name: HOST
      value: "0.0.0.0"
    - name: PORT
      value: "8080"
    - name: VISITS_FILE
      value: "/data/visits"

appConfig:
  environment: "dev"
  appName: "devops-info-service"
  featureFlags:
    visitsEndpoint: true
    metricsEndpoint: true

configMaps:
  file:
    enabled: true
    mountPath: "/config"
  env:
    enabled: true
    data:
      APP_ENV: "dev"
      LOG_LEVEL: "INFO"
      FEATURE_VISITS: "true"

persistence:
  enabled: true
  size: "100Mi"
  storageClass: ""
  accessMode: ReadWriteOnce
  mountPath: "/data"

deployment:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

rollout:
  strategy: canary
  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: null

statefulset:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: devops-info-sa

secret:
  enabled: true
  name: ""
  data:
    username: "change-me-username"
    password: "change-me-password"

vault:
  enabled: false
  role: "devops-info"
  secretPath: "secret/data/myapp/config"
  secretFileName: "config"

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080
  preview:
    enabled: false
    suffix: preview
    type: ClusterIP

headlessService:
  enabled: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  image: busybox:1.36
  preInstall:
    enabled: true
    weight: -5
    command:
      - sh
      - -c
      - echo "Validating pre-install conditions" && sleep 3 && echo "Pre-install checks completed"
  postInstall:
    enabled: true
    weight: 5
