apiVersion: v1
kind: Service
metadata:
  name: delayed-nginx
  namespace: default
spec:
  selector:
    app: delayed-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: delayed-nginx
  namespace: default
  labels:
    app: delayed-nginx
spec:
  restartPolicy: Never
  initContainers:
    - name: delay-start
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 20
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: init-wait-service-demo
  namespace: default
  labels:
    app: init-wait-service-demo
spec:
  restartPolicy: Never
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - until wget -qO- http://delayed-nginx > /dev/null; do echo "waiting for delayed-nginx HTTP"; sleep 2; done
  containers:
    - name: main-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - wget -qO- http://delayed-nginx && sleep 3600
