apiVersion: v1
kind: Namespace
metadata:
  name: lab16
---
apiVersion: v1
kind: Pod
metadata:
  name: init-download-demo
  namespace: lab16
  labels:
    app: init-download-demo
spec:
  restartPolicy: Always
  initContainers:
    - name: init-download
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -eu
          wget -O /work-dir/index.html https://example.com
          echo "downloaded by init container at $(date -u)" > /work-dir/status.txt
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: main-app
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -eu
          echo "main container can read:"
          ls -l /data
          while true; do sleep 3600; done
      volumeMounts:
        - name: workdir
          mountPath: /data
  volumes:
    - name: workdir
      emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab16-ready-app
  namespace: lab16
  labels:
    app: lab16-ready-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab16-ready-app
  template:
    metadata:
      labels:
        app: lab16-ready-app
    spec:
      containers:
        - name: http
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /www
              echo "lab16 dependency ready" > /www/index.html
              httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: lab16-ready-service
  namespace: lab16
  labels:
    app: lab16-ready-app
spec:
  selector:
    app: lab16-ready-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: wait-for-service-demo
  namespace: lab16
  labels:
    app: wait-for-service-demo
spec:
  restartPolicy: Always
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -eu
          until nslookup lab16-ready-service.lab16.svc.cluster.local; do
            echo "waiting for lab16-ready-service DNS"
            sleep 2
          done
          until wget -q -O /work-dir/dependency.html http://lab16-ready-service.lab16.svc.cluster.local; do
            echo "waiting for lab16-ready-service HTTP"
            sleep 2
          done
          echo "dependency is ready" > /work-dir/status.txt
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: main-app
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -eu
          echo "dependency data available:"
          cat /data/dependency.html
          while true; do sleep 3600; done
      volumeMounts:
        - name: workdir
          mountPath: /data
  volumes:
    - name: workdir
      emptyDir: {}
