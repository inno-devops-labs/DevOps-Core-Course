---
apiVersion: v1
kind: Service
metadata:
  name: lab16-backend
  labels:
    app.kubernetes.io/name: lab16-backend
spec:
  selector:
    app.kubernetes.io/name: lab16-backend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab16-backend
  labels:
    app.kubernetes.io/name: lab16-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab16-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab16-backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: lab16-wait-client
  labels:
    app.kubernetes.io/name: lab16-wait-client
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          until wget -q -O- "http://lab16-backend.default.svc.cluster.local/" >/dev/null 2>&1; do
            echo "waiting for lab16-backend..."
            sleep 2
          done
          echo "backend is reachable"
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "echo main started && sleep 3600"]
