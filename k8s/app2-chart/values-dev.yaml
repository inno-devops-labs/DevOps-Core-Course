# Development environment values for app2-chart
# Usage: helm install dev-app2 k8s/app2-chart -f k8s/app2-chart/values-dev.yaml

replicaCount: 1

image:
  tag: "latest"

resources:
  requests:
    memory: "32Mi"
    cpu: "25m"
  limits:
    memory: "64Mi"
    cpu: "50m"

service:
  type: NodePort
  port: 80
  targetPort: 5678
  nodePort: 30081

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 5
