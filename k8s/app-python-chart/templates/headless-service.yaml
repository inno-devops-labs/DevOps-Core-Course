{{- if .Values.headlessService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-python-chart.headlessServiceName" . }}
  labels:
    {{- include "app-python-chart.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "app-python-chart.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
