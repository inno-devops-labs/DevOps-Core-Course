{{- if and .Values.statefulset.enabled (not .Values.rollout.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "devops-app-py.fullname" . }}
  labels:
    {{- include "devops-app-py.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "devops-app-py.headlessServiceName" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ .Values.statefulset.podManagementPolicy }}
  revisionHistoryLimit: {{ .Values.statefulset.revisionHistoryLimit }}
  updateStrategy:
    type: {{ .Values.statefulset.updateStrategy.type }}
    {{- if eq .Values.statefulset.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      partition: {{ .Values.statefulset.updateStrategy.rollingUpdate.partition }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "devops-app-py.selectorLabels" . | nindent 6 }}
  template:
    {{- include "devops-app-py.podTemplate" . | nindent 4 }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data-volume
        labels:
          {{- include "devops-app-py.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}
