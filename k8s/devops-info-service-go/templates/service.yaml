apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-info-service-go.fullname" . }}
  labels:
    {{- include "devops-info-service-go.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "devops-info-service-go.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.container.portName }}
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | quote }}
