apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "my-python-app.fullname" . }}
  labels:
    {{- include "my-python-app.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "my-python-app.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "my-python-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "my-python-app.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: init-download
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              wget -O /work-dir/index.html https://example.com
              echo "Download completed" > /work-dir/status
          volumeMounts:
            - name: workdir
              mountPath: /work-dir
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for kubernetes service..."
              until nslookup kubernetes.default.svc.cluster.local; do
                echo "Waiting..."; sleep 2
              done
              echo "Service found!"
          volumeMounts:
            - name: workdir
              mountPath: /work-dir
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
          name: http
        env:
        {{- toYaml .Values.env | nindent 8 }}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: workdir
          mountPath: /shared
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
      volumes:
        - name: workdir
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}