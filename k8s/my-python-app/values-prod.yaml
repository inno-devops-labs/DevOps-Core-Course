# Production environment values
# Overrides for production environment

replicaCount: 5

image:
    repository: saddogsec/devops-info-service
    tag: "1.0.0"
    pullPolicy: Always

service:
    type: LoadBalancer
    port: 80
    targetPort: 8000

resources:
    limits:
        cpu: 500m
        memory: 512Mi
    requests:
        cpu: 200m
        memory: 256Mi

livenessProbe:
    httpGet:
        path: /health
        port: 8000
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

readinessProbe:
    httpGet:
        path: /ready
        port: 8000
    initialDelaySeconds: 20
    periodSeconds: 3
    timeoutSeconds: 3
    failureThreshold: 5

# Environment variables for production
env:
    APP_ENV: "production"
    LOG_LEVEL: "info"
    PORT: "8000"

# Labels for production
labels:
    app: devops-app
    version: v1
    environment: production

persistence:
    enabled: false
    size: 1Gi
