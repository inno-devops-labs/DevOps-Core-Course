# Default values for my-python-app
replicaCount: 3

image:
  repository: acecution/devops-info-service
  tag: "metrics"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

# Resource limits (CPU and memory)
resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

# Probes (health checks)
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3

# Environment variables (non-secret)
env:
  - name: PORT
    value: "8000"
  - name: HOST
    value: "0.0.0.0"

# Secrets (use --set or external secret management for real values)
secrets:
  username: placeholder-user
  password: placeholder-password

# Vault integration (annotations will be added via --set or values)
vault:
  enabled: false
  role: "devops-app"
  secretPath: "secret/data/devops-app/config"