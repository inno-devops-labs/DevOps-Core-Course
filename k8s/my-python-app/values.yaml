replicaCount: 3

image:
  repository: acecution/devops-info-service
  tag: metrics
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

environment: "production"
logLevel: "info"
features:
  visits: true

secrets:
  username: placeholder-user
  password: placeholder-password

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3

env:
  - name: PORT
    value: "8000"
  - name: HOST
    value: "0.0.0.0"