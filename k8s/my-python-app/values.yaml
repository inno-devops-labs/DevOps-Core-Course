# Default values for my-python-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
    repository: saddogsec/devops-info-service
    tag: "latest"
    pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
    type: NodePort
    port: 80
    targetPort: 8000
    nodePort: 30080

resources:
    limits:
        cpu: 500m
        memory: 512Mi
    requests:
        cpu: 100m
        memory: 128Mi

livenessProbe:
    httpGet:
        path: /health
        port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

readinessProbe:
    httpGet:
        path: /ready
        port: 8000
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 5

# Environment variables
env:
    APP_ENV: "production"
    LOG_LEVEL: "info"
    PORT: "8000"

# Security context
securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

# Deployment strategy
strategy:
    type: RollingUpdate
    rollingUpdate:
        maxUnavailable: 1
        maxSurge: 1

# Labels
labels:
    app: devops-app
    version: v1
    environment: production
