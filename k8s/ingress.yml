apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-lab09
  namespace: devops-lab09
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - local.example.com
      secretName: local-example-com-tls
  rules:
    - host: local.example.com
      http:
        paths:
          - path: /app1
            pathType: Prefix
            backend:
              service:
                name: devops-info-service
                port:
                  number: 80
          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: devops-info-service-go
                port:
                  number: 80
