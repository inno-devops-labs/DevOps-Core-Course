# Requires an Ingress Controller (minikube: addons enable ingress; kind: see README)
# TLS Secret tls-secret is created by scripts/gen-tls.sh
#
# Plain rewrite-target / with Prefix /app1 sent /app1/health to backend / — use regex + /$2
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  labels:
    app: lab09-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - local.lab09.local
      secretName: tls-secret
  rules:
    - host: local.lab09.local
      http:
        paths:
          - path: /app1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: devops-info-service
                port:
                  number: 80
          - path: /app2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app2-service
                port:
                  number: 80
