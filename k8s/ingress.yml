apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-lab9-ingress
  namespace: devops-lab9
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - local.example.com
      secretName: devops-lab9-tls
  rules:
    - host: local.example.com
      http:
        paths:
          - path: /app1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: devops-info-python
                port:
                  number: 80
          - path: /app2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: devops-info-go
                port:
                  number: 80
