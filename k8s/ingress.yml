apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-info-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - local.devops.lab
      secretName: devops-lab09-tls
  rules:
    - host: local.devops.lab
      http:
        paths:
          - path: /app1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: devops-info-python-service
                port:
                  number: 80
          - path: /app2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: devops-info-go-service
                port:
                  number: 80
