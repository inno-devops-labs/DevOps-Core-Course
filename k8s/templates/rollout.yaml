{{- if eq .Values.workload.kind "rollout" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "my-python-app.fullname" . }}
  labels:
    {{- include "my-python-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "my-python-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "my-python-app.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        {{- if .Values.vault.template.enabled }}
        vault.hashicorp.com/agent-inject-template-config: |
{{ .Files.Get "files/vault-agent-template.txt" | nindent 10 }}
        {{- else }}
        vault.hashicorp.com/agent-inject-secret-config: {{ .Values.vault.secretPath | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.vault.enabled }}
      serviceAccountName: {{ include "my-python-app.serviceAccountName" . }}
      {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "my-python-app.fullname" . }}-config
        {{- if .Values.initContainers.enabled }}
        - name: {{ .Values.initContainers.sharedVolume.name }}
          emptyDir: {}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "my-python-app.fullname" . }}-data
        {{- end }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        {{- if .Values.initContainers.waitForService.enabled }}
        - name: wait-for-service
          image: {{ .Values.initContainers.waitForService.image | quote }}
          command:
            - sh
            - -c
            - |
              until nslookup {{ .Values.initContainers.waitForService.serviceDNS | quote }}; do
                echo "waiting for {{ .Values.initContainers.waitForService.serviceDNS }}";
                sleep {{ .Values.initContainers.waitForService.checkIntervalSeconds }};
              done
        {{- end }}
        {{- if .Values.initContainers.download.enabled }}
        - name: init-download
          image: {{ .Values.initContainers.download.image | quote }}
          command:
            - sh
            - -c
            - >
              wget -O {{ .Values.initContainers.sharedVolume.mountPath }}/{{ .Values.initContainers.download.outputFile }}
              {{ .Values.initContainers.download.url | quote }}
          volumeMounts:
            - name: {{ .Values.initContainers.sharedVolume.name }}
              mountPath: {{ .Values.initContainers.sharedVolume.mountPath }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          env:
            {{- include "my-python-app.containerEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "my-python-app.fullname" . }}-env
          {{- if and .Values.secrets.enabled .Values.secrets.envFrom }}
            - secretRef:
                name: {{ include "my-python-app.fullname" . }}-credentials
          {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: /data
            {{- end }}
            {{- if .Values.initContainers.enabled }}
            - name: {{ .Values.initContainers.sharedVolume.name }}
              mountPath: {{ .Values.initContainers.sharedVolume.mountPath }}
            {{- end }}
  strategy:
    {{- if eq .Values.rollout.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ include "my-python-app.fullname" . }}
      previewService: {{ include "my-python-app.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      {{- if .Values.rollout.blueGreen.autoPromotionSeconds }}
      autoPromotionSeconds: {{ .Values.rollout.blueGreen.autoPromotionSeconds }}
      {{- end }}
    {{- else }}
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 40
        - pause:
            duration: 30s
        - setWeight: 60
        - pause:
            duration: 30s
        - setWeight: 80
        - pause:
            duration: 30s
        - setWeight: 100
    {{- end }}
{{- end }}
