apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ include "python-app.fullname" . }}

  labels:
    {{- include "python-app.labels" . | nindent 4 }}

spec:
  serviceName: {{ include "python-app.headlessServiceName" . }}

  replicas: {{ .Values.replicaCount }}

  podManagementPolicy: {{ .Values.statefulset.podManagementPolicy }}

  updateStrategy:
    type: {{ .Values.statefulset.updateStrategy.type }}

    rollingUpdate:
      partition: {{ .Values.statefulset.updateStrategy.partition }}

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:

      initContainers:

        - name: download-file

          image: busybox

          command:
            - sh
            - -c
            - |
              wget -O /shared/index.html https://example.com

          volumeMounts:
            - name: shared-data
              mountPath: /shared

        - name: wait-for-service

          image: busybox

          command:
            - sh
            - -c
            - |
              until nslookup kubernetes.default.svc.cluster.local; do
                echo waiting for service;
                sleep 2;
              done

      containers:
        - name: python-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          env:
            - name: ENV
              value: "{{ .Values.env.ENV }}"

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}

            initialDelaySeconds: {{ .Values.probes.livenessDelay }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}

            initialDelaySeconds: {{ .Values.probes.readinessDelay }}

          volumeMounts:

            - name: shared-data
              mountPath: /shared

            - name: app-storage
              mountPath: /data

      volumes:
        - name: shared-data
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: app-storage

      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}

        resources:
          requests:
            storage: {{ .Values.persistence.size }}

        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}