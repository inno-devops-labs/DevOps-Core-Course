apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "python-app.fullname" . }}
  labels:
    {{- include "python-app.labels" . | nindent 4 }}

spec:
  serviceName: {{ include "python-app.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}

  podManagementPolicy: {{ .Values.statefulset.podManagementPolicy }}

  updateStrategy:
    type: {{ .Values.statefulset.updateStrategy.type }}
    rollingUpdate:
      partition: {{ .Values.statefulset.updateStrategy.partition }}

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
        - name: python-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          env:
            - name: ENV
              value: "{{ .Values.env.ENV }}"

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.livenessDelay }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readinessDelay }}

          volumeMounts:
            - name: app-storage
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: app-storage

      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}

        resources:
          requests:
            storage: {{ .Values.persistence.size }}

        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}