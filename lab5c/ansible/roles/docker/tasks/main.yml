---
- name: Install APT dependencies for Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure Docker keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  register: docker_repo

- name: Update apt cache after Docker repo changes
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo is changed

- name: Install Docker engine and CLI packages
  ansible.builtin.apt:
    name: "{{ docker_packages + [docker_python_package] }}"
    state: present
  notify: restart docker

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add target user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
