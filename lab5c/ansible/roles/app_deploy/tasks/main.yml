---
- name: Log in to Docker Hub
  community.docker.docker_login:
    registry_url: https://index.docker.io/v1/
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_password }}"
  no_log: true

- name: Pull application image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    tag: "{{ docker_image_tag }}"
    source: pull

- name: Read current container info
  community.docker.docker_container_info:
    name: "{{ app_container_name }}"
  register: current_app_container

- name: Stop existing app container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: stopped
  when:
    - current_app_container.exists | default(false)
    - current_app_container.container.State.Status | default("") == "running"

- name: Remove old app container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    state: absent
  when: current_app_container.exists | default(false)

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ docker_image }}:{{ docker_image_tag }}"
    state: started
    restart_policy: "{{ app_restart_policy }}"
    published_ports:
      - "{{ app_port }}:5000"
    env: "{{ app_env }}"
    recreate: true
  notify: restart app container

- name: Wait for app port to be ready
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ app_port | int }}"
    delay: 2
    timeout: "{{ app_wait_timeout }}"

- name: Verify health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
    method: GET
    status_code: 200
    return_content: true
  register: app_health_result
  retries: 5
  delay: 3
  until: app_health_result.status == 200
