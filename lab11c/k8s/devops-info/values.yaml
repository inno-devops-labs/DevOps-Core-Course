replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

image:
  repository: tsixphoenix/devops-info-python
  tag: "lab9"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

env:
  HOST: "0.0.0.0"
  PORT: "5000"
  RELEASE_ID: "lab11"

# Helm-managed Secret (placeholders only — override at install time)
helmSecret:
  enabled: true
  username: "REPLACE_ME"
  password: "REPLACE_ME"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"

livenessProbe:
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

# Vault Agent Injector (sidecar) — enable after Vault is configured
vault:
  injector:
    enabled: false
  role: "devops-info"
  secretPath: "secret/data/devops-info/config"
  secretFileName: "vault-config"
  serviceAddr: "http://vault.vault.svc:8200"

hooks:
  image: busybox:1.36
  preInstall:
    enabled: false
  postInstall:
    enabled: false
