replicaCount: 3

image:
  repository: app-python
  tag: "latest"
  pullPolicy: Never

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30008

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 3

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

secret:
  username: "placeholder-user"
  password: "placeholder-password"

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

rolloutVersion: "v7"
