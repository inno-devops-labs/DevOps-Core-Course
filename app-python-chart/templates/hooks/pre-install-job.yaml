apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "app-python-chart.fullname" . }}-pre-install"
  labels:
    {{- include "app-python-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      name: "{{ include "app-python-chart.fullname" . }}-pre-install"
      labels:
        {{- include "app-python-chart.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: pre-install-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo "Pre-install validation for {{ include "app-python-chart.fullname" . }}" && echo "Chart values loaded successfully"
