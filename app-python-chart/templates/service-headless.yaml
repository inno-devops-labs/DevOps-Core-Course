apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-python-chart.fullname" . }}-headless
spec:
  clusterIP: None
  selector:
    {{- include "app-python-chart.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
