apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app-python-chart.fullname" . }}
  labels:
    {{- include "app-python-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "app-python-chart.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "app-python-chart.selectorLabels" . | nindent 8 }}
      annotations:
        rollout.argoproj.io/version: {{ .Values.rolloutVersion | quote }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          envFrom:
            - secretRef:
                name: {{ include "app-python-chart.fullname" . }}-secret
            - configMapRef:
                name: {{ include "app-python-chart.fullname" . }}-env

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: config-volume
              mountPath: /config
            - name: data-volume
              mountPath: /data

      volumes:
        - name: config-volume
          configMap:
            name: {{ include "app-python-chart.fullname" . }}-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "app-python-chart.fullname" . }}-data

  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 40
        - pause: { duration: 30s }
        - setWeight: 60
        - pause: { duration: 30s }
        - setWeight: 80
        - pause: { duration: 30s }
        - setWeight: 100
