# RWO PVC (Lab 12) attaches to a single node; use 1 replica while persistence is enabled.
replicaCount: 1

image:
  repository: peplxx/devops-info-service
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

application:
  host: "0.0.0.0"
  port: 5000
  name: "devops-info-service"

environment: dev
logLevel: info

persistence:
  enabled: true
  size: 100Mi
  storageClass: ""

credentials:
  username: changeme-user
  password: changeme-password

serviceAccount:
  create: true
  name: ""

vaultInjector:
  enabled: false
  role: devops-info-service
  secretPath: secret/data/devops-info/config
  useCustomTemplate: false

livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Argo Rollouts (Lab 14). When rollout.enabled is true, templates/rollout.yaml
# renders an argoproj.io/v1alpha1 Rollout and templates/deployment.yaml is
# skipped. rollout.strategy switches between canary and blueGreen.
rollout:
  enabled: false
  strategy: canary  # canary | blueGreen

  canary:
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause: { duration: 30s }
      - setWeight: 60
      - pause: { duration: 30s }
      - setWeight: 80
      - pause: { duration: 30s }
      - setWeight: 100
    analysis:
      enabled: false
      atStep: 0   # 0 = inject analysis right after the first setWeight (before pause)

  blueGreen:
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 30

  analysis:
    enabled: false
    name: success-rate
    interval: 10s
    count: 3
    failureLimit: 1

# Lab 15. When statefulset.enabled is true, templates/statefulset.yaml renders
# and templates/{deployment,rollout,pvc}.yaml are skipped. Each replica gets
# its own PVC via volumeClaimTemplates; the standalone pvc.yaml is bypassed.
statefulset:
  enabled: false
  replicas: 3
  storage:
    size: 100Mi
    storageClass: ""        # "" = cluster default
    accessMode: ReadWriteOnce
  updateStrategy:
    type: RollingUpdate     # RollingUpdate | OnDelete
    rollingUpdate:
      partition: 0          # only pods with ordinal >= partition update
