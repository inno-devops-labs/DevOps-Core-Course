apiVersion: v1
kind: Service
metadata:
  name: lab16-app
  labels:
    app.kubernetes.io/name: lab16-app
spec:
  selector:
    app.kubernetes.io/name: lab16-app
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab16-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab16-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab16-app
    spec:
      containers:
        - name: app
          image: lab16-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
