---
# Docker role: install Docker engine from official repo
# Tags: docker_install, docker_config, docker

- name: Docker installation
  block:
    - name: Install APT dependencies for Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      tags:
        - docker_install
        - docker

    - name: Ensure Docker keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      tags:
        - docker_install
        - docker

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      tags:
        - docker_install
        - docker

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
      register: docker_repo
      tags:
        - docker_install
        - docker

    - name: Update apt cache after Docker repo changes
      ansible.builtin.apt:
        update_cache: true
      when: docker_repo is changed
      tags:
        - docker_install
        - docker

    - name: Install Docker engine and CLI packages
      ansible.builtin.apt:
        name: "{{ docker_packages + [docker_python_package] }}"
        state: present
      notify: restart docker
      tags:
        - docker_install
        - docker

  rescue:
    - name: Wait before retry after GPG/repo failure
      ansible.builtin.pause:
        seconds: 10
        prompt: "Retrying Docker repo setup..."

    - name: Retry apt update
      ansible.builtin.apt:
        update_cache: true

  always:
    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      tags:
        - docker
        - docker_config

- name: Docker configuration
  block:
    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present
      tags:
        - docker_config
        - docker

    - name: Add target user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      tags:
        - docker_config
        - docker

  tags:
    - docker_config
    - docker
