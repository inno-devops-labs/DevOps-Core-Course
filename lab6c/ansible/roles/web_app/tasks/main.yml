---
# web_app role: deploy containerized app with Docker Compose
# Tags: app_deploy, compose, web_app
# Dependency: docker role (installed automatically via meta/main.yml)

# Wipe logic runs first when explicitly requested
- name: Include wipe tasks
  include_tasks: wipe.yml
  tags:
    - web_app_wipe

# Deployment block
- name: Deploy application with Docker Compose
  block:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        registry_url: https://index.docker.io/v1/
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      no_log: true
      tags:
        - app_deploy
        - compose

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: directory
        mode: "0755"
      tags:
        - app_deploy
        - compose

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_project_dir }}/docker-compose.yml"
        mode: "0644"
      tags:
        - app_deploy
        - compose

    - name: Deploy with Docker Compose (up)
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: present
        pull: always
      tags:
        - app_deploy
        - compose

    - name: Wait for app port to be ready
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ app_port | int }}"
        delay: 2
        timeout: "{{ app_wait_timeout }}"
      tags:
        - app_deploy
        - compose

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
        method: GET
        status_code: 200
        return_content: true
      register: app_health_result
      retries: 5
      delay: 3
      until: app_health_result.status == 200
      tags:
        - app_deploy
        - compose

  rescue:
    - name: Log deployment failure
      ansible.builtin.debug:
        msg: "Deployment failed, check logs above"

  tags:
    - app_deploy
    - compose
    - web_app
