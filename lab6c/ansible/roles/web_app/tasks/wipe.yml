---
# Wipe web application: stops containers, removes compose file and app directory
# Runs only when web_app_wipe=true AND tag web_app_wipe specified
# Usage: ansible-playbook deploy.yml -e "web_app_wipe=true" --tags web_app_wipe

- name: Check if app directory exists
  ansible.builtin.stat:
    path: "{{ compose_project_dir }}"
  register: compose_dir_stat

- name: Wipe web application
  block:
    - name: Stop and remove containers with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        state: absent
      when: compose_dir_stat.stat.isdir | default(false)

    - name: Remove docker-compose file
      ansible.builtin.file:
        path: "{{ compose_project_dir }}/docker-compose.yml"
        state: absent
      ignore_errors: true

    - name: Remove application directory
      ansible.builtin.file:
        path: "{{ compose_project_dir }}"
        state: absent
      ignore_errors: true

    - name: Log wipe completion
      ansible.builtin.debug:
        msg: "Application {{ app_name }} wiped successfully"

  when: web_app_wipe | default(false) | bool
  tags:
    - web_app_wipe
