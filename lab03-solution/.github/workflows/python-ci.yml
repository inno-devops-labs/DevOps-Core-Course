name: Python CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - lab03
    paths:
      - 'lab03-solution/app_python/**'
      - '.github/workflows/python-ci.yml'
      - '.github/workflows/python-*'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'lab03-solution/app_python/**'
      - '.github/workflows/python-ci.yml'

env:
  REGISTRY: docker.io
  IMAGE_NAME: devops-info-service
  WORKING_DIR: lab03-solution/app_python

jobs:
  # Job 1: Code Quality & Testing
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            ${{ env.WORKING_DIR }}/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.WORKING_DIR }}/requirements.txt
          pip install -r ${{ env.WORKING_DIR }}/requirements-dev.txt

      - name: Run pylint
        run: |
          pylint ${{ env.WORKING_DIR }}/app.py --fail-under=8.0 || true
        continue-on-error: true

      - name: Run flake8
        run: |
          flake8 ${{ env.WORKING_DIR }}/app.py --max-line-length=120 --count --show-source
        continue-on-error: true

      - name: Format check with black
        run: |
          black --check ${{ env.WORKING_DIR }}/app.py || true
        continue-on-error: true

      - name: Run unit tests
        run: |
          cd ${{ env.WORKING_DIR }}
          pytest tests/ -v --tb=short

      - name: Run tests with coverage
        run: |
          cd ${{ env.WORKING_DIR }}
          pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./${{ env.WORKING_DIR }}/coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Job 2: Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ${{ env.WORKING_DIR }}/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.WORKING_DIR }}/requirements.txt
          pip install -r ${{ env.WORKING_DIR }}/requirements-dev.txt

      - name: Run Bandit security check
        run: |
          bandit -r ${{ env.WORKING_DIR }} -ll -i 2>/dev/null || true
        continue-on-error: true

      - name: Run Snyk vulnerability scan
        uses: snyk/actions/python-3.11@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=${{ env.WORKING_DIR }}/requirements.txt --severity-threshold=high
        continue-on-error: true

  # Job 3: Docker Build & Push
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/lab03')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate version tags
        id: version
        run: |
          # CalVer versioning: YYYY.MM.DD format
          VERSION=$(date +%Y.%m.%d)
          BUILD_NUMBER=${{ github.run_number }}
          GIT_SHA=${{ github.sha }}
          SHORT_SHA=${GIT_SHA:0:7}
          
          # Create multiple tags
          TAGS="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${VERSION}"
          TAGS="${TAGS},${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${VERSION}-${BUILD_NUMBER}"
          TAGS="${TAGS},${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          
          echo "Version: ${VERSION}"
          echo "Build Number: ${BUILD_NUMBER}"
          echo "Git SHA: ${SHORT_SHA}"
          echo "Tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed image digest: ${{ steps.docker_build.outputs.digest }}"

  # Job 4: Run Integration Test
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/lab03')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        run: docker version

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Start container
        run: |
          docker run -d -p 8000:8000 --name test-app \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          
          # Wait for app to be ready
          sleep 3

      - name: Health check
        run: |
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/ || exit 1

      - name: Stop container
        if: always()
        run: docker stop test-app; docker rm test-app || true

summary-status:
  name: CI Status Summary
  runs-on: ubuntu-latest
  needs: [test, security, build-and-push, integration-test]
  if: always()

  steps:
    - name: Check job results
      run: |
        echo "Test Job: ${{ needs.test.result }}"
        echo "Security Job: ${{ needs.security.result }}"
        echo "Build & Push Job: ${{ needs.build-and-push.result }}"
        echo "Integration Test Job: ${{ needs.integration-test.result }}"
        
        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "❌ Test job failed"
          exit 1
        fi
        
        if [[ "${{ needs.security.result }}" != "success" ]] && [[ "${{ needs.security.result }}" != "skipped" ]]; then
          echo "⚠️  Security job found issues"
        fi
        
        echo "✅ Pipeline completed successfully"
