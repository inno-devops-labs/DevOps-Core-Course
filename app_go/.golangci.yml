linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    check-shadowing: false

linters:
  disable-all: true
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 100
  max-same-issues: 50
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - govet
