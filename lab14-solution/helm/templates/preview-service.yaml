{{- if eq .Values.strategy "blueGreen" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab14-rollouts.fullname" . }}-preview
  labels:
    {{- include "lab14-rollouts.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "lab14-rollouts.selectorLabels" . | nindent 4 }}
{{- end }}
