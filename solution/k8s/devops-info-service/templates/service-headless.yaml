{{- if eq .Values.workload.kind "StatefulSet" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-info-service.headlessServiceName" . }}
  labels:
    {{- include "devops-info-service.labels" . | nindent 4 }}
    app.kubernetes.io/role: headless
spec:
  clusterIP: None
  publishNotReadyAddresses: {{ .Values.statefulset.headlessService.publishNotReadyAddresses }}
  selector:
    {{- include "devops-info-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
